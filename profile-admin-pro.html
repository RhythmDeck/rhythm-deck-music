<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Profile | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- TalkJS -->
  <script src="https://unpkg.com/talkjs@0.16.6/dist/talkjs.js"></script>
  <style>
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin-left:8px;}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-card:hover .video-overlay{opacity:1}
    #videoModal, #collabModal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    #videoModal.show, #collabModal.show{opacity:1;visibility:visible}
    #modalVideo{max-width:90%;max-height:90%;border:8px solid #10b981;border-radius:16px}
    #closeModal, #closeCollab{position:absolute;top:20px;right:20px;background:white;color:black;width:60px;height:60px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;font-weight:bold}
    .new-like {animation: heartbeat 0.6s ease-in-out;}
    @keyframes heartbeat {0%,100%{transform:scale(1)} 50%{transform:scale(1.4)}}
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

<header class="bg-black text-white p-4 flex justify-between items-center shadow-lg relative">
  <div class="flex items-center space-x-3">
    <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="w-10 h-10 rounded-full">
    <div>
      <h1 class="text-2xl font-bold tracking-wide">RHYTHM DECK</h1>
      <p class="text-sm text-gray-300">Unleash Your Beat</p>
    </div>
  </div>

  <!-- NEW: Find Collaborators Button - dead center -->
  <button onclick="openCollabDirectory()" class="absolute left-1/2 -translate-x-1/2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition">
    Find Collaborators
  </button>

  <nav class="space-x-6">
    <a href="index.html" class="hover:underline">Home</a>
    <button onclick="logout()" class="bg-white text-black px-4 py-1 rounded hover:bg-gray-300 font-medium">Logout</button>
  </nav>
</header>

<main class="flex-grow">
  <!-- [ALL YOUR EXISTING SECTIONS: banner, go live, upload, videos, danger zone] -->
  <!-- I’m keeping them 100% identical — only adding the new collab stuff -->

  <!-- BANNER -->
  <section class="relative h-[300px] bg-gradient-to-br from-purple-900 to-blue-900 overflow-hidden">
    <img id="bannerPreview" src="" alt="Banner" class="absolute inset-0 w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="absolute inset-0 flex items-center justify-center">
      <p class="text-white text-4xl font-bold opacity-70">Your Banner Image Here</p>
    </div>
    <div class="absolute bottom-4 left-4 w-32 h-32 rounded-full border-8 border-white shadow-2xl overflow-hidden bg-white">
      <img id="logoPreview" src="logo-placeholder.png" alt="User Logo" class="w-full h-full object-cover">
    </div>
    <input type="file" id="bannerInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('bannerInput').click()" class="absolute bottom-4 right-4 bg-green-600 text-white px-5 py-3 rounded-lg hover:bg-green-700 font-bold shadow-lg">
      Upload Banner
    </button>
    <input type="file" id="logoInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('logoInput').click()" class="absolute bottom-4 left-40 bg-green-600 text-white px-5 py-3 rounded-lg hover:bg-green-700 font-bold shadow-lg text-sm">
      Change Logo
    </button>
  </section>

  <!-- MAIN CONTENT -->
  <section class="max-w-6xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-2xl">
    <div class="grid md:grid-cols-4 gap-8">
      <div class="md:col-span-1 space-y-6">
        <!-- Existing artist name + bio -->
        <div class="bg-gray-50 p-5 rounded-xl shadow">
          <h3 class="text-xl font-bold text-gray-800 mb-3">Artist / Band Name</h3>
          <input type="text" id="artistNameInput" class="w-full border border-gray-300 p-3 rounded-lg mb-3" placeholder="Enter your name">
          <button onclick="saveArtistName()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-bold">Save Name</button>
        </div>

        <div class="bg-gray-50 p-5 rounded-xl shadow">
          <label class="block text-sm font-bold text-gray-700 mb-2">Bio</label>
          <textarea id="bioInput" placeholder="Tell your story..." class="w-full border border-gray-300 p-3 rounded-lg h-40 resize-none"></textarea>
          <button onclick="saveBio()" class="mt-3 w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800 font-bold">Save Bio</button>
        </div>

        <!-- NEW: Collaboration Settings -->
        <div class="bg-purple-50 border-2 border-purple-300 p-5 rounded-xl shadow">
          <h3 class="text-xl font-bold text-purple-800 mb-4">Collaboration Settings</h3>
          <label class="flex items-center gap-3 mb-4 cursor-pointer">
            <input type="checkbox" id="openToCollab" class="w-6 h-6 text-purple-600">
            <span class="font-bold">I’m open to collaborations</span>
          </label>

          <p class="text-sm text-gray-600 mb-3">What are you offering?</p>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <label><input type="checkbox" value="Vocals" class="collab-skill"> Vocals</label>
            <label><input type="checkbox" value="Guitar" class="collab-skill"> Guitar / Solos</label>
            <label><input type="checkbox" value="Beats" class="collab-skill"> Beats / Production</label>
            <label><input type="checkbox" value="Mixing" class="collab-skill"> Mixing / Mastering</label>
            <label><input type="checkbox" value="Songwriting" class="collab-skill"> Songwriting</label>
            <label><input type="checkbox" value="Feature" class="collab-skill"> Feature me</label>
          </div>
          <button onclick="saveCollabSettings()" class="mt-4 w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 font-bold">Save Settings</button>
        </div>

        <!-- Public page link (unchanged) -->
        <div class="bg-green-50 p-5 rounded-xl shadow text-center">...</div>
      </div>

      <!-- RIGHT SIDE: Upload + Videos (unchanged) -->
      <div class="md:col-span-3 space-y-8"> ... your existing upload + video list ... </div>
    </div>
  </section>
</main>

<!-- VIDEO MODAL (unchanged) -->
<div id="videoModal"> ... </div>

<!-- NEW: COLLAB DIRECTORY MODAL -->
<div id="collabModal">
  <div id="closeCollab" onclick="document.getElementById('collabModal').classList.remove('show')">X</div>
  <div class="bg-white rounded-2xl shadow-2xl w-11/12 max-w-7xl max-h-[90vh] overflow-y-auto p-8 relative">
    <h2 class="text-4xl font-bold text-center mb-8 bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
      Find Collaborators
    </h2>
    <input type="text" id="searchArtists" placeholder="Search artists, genres, skills..." class="w-full p-4 rounded-xl border-2 border-purple-300 mb-6 text-lg">
    <div id="artistsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </div>
</div>

<footer class="bg-black text-white mt-auto p-6 text-center">
  <p class="text-sm">© 2025 Rhythm Deck Music. All rights reserved.</p>
</footer>

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );

  // REPLACE THESE WITH YOUR OWN FROM TALKJS DASHBOARD
  const TALKJS_APP_ID = "tLZqiXQU";     
  const TALKJS_SECRET_KEY = "sk_test_IEmPfWI8f9gVZUhShLIv8NibfXnXsZI1"; 

  let currentUser = null;
  let publicUrl = '';
  let talkjsReady = false;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { alert('Login required'); window.location.href = 'login.html'; return; }
    currentUser = user;

    // Load profile + collab settings
    const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();

    // Create TalkJS user if not exists
    if (!profile?.talkjs_id) {
      const talkId = 'rd_' + user.id.replace(/-/g, '');
      await supabase.from('profiles').update({ talkjs_id: talkId }).eq('id', user.id);
      profile.talkjs_id = talkId;
    }

    // Load collab toggle + skills
    if (profile?.open_to_collab) document.getElementById('openToCollab').checked = true;
    if (profile?.collab_skills) {
      document.querySelectorAll('.collab-skill').forEach(cb => {
        if (profile.collab_skills.includes(cb.value)) cb.checked = true;
      });
    }

    // Rest of your existing load code (banner, videos, etc.)
    // ... (unchanged from your working version)

    await loadVideos();

    // TalkJS init
    Talk.ready.then(() => {
      talkjsReady = true;
      const me = new Talk.User({
        id: profile.talkjs_id,
        name: profile.name || user.email.split('@')[0],
        email: user.email,
        photoUrl: profile.logo_url ? supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl : '',
        role: 'member'
      });
      window.talkSession = new Talk.Session({
        appId: TALKJS_APP_ID,
        me: me,
        signature: TALKJS_SECRET_KEY // only works server-side in prod, but fine for dev
      });
    });
  });

  // Save collaboration settings
  async function saveCollabSettings() {
    const open = document.getElementById('openToCollab').checked;
    const skills = Array.from(document.querySelectorAll('.collab-skill:checked')).map(cb => cb.value);
    await supabase.from('profiles').update({
      open_to_collab: open,
      collab_skills: skills
    }).eq('id', currentUser.id);
    alert('Collaboration settings saved!');
  }

  // Open directory
  function openCollabDirectory() {
    document.getElementById('collabModal').classList.add('show');
    loadAllArtists();
  }

  async function loadAllArtists() {
    const { data: allProfiles } = await supabase.from('profiles').select('id, name, logo_url, open_to_collab, collab_skills').neq('id', currentUser.id);
    const { data: stats } = await supabase.rpc('get_artist_stats'); // we’ll create this function in a sec

    const grid = document.getElementById('artistsGrid');
    grid.innerHTML = '';

    for (const p of allProfiles) {
      const stat = stats.find(s => s.user_id === p.id) || { hearts: 0, comments: 0, video_count: 0 };
      const logo = p.logo_url ? supabase.storage.from('media').getPublicUrl(p.logo_url).data.publicUrl : 'logo-placeholder.png';

      const skills = p.collab_skills?.length ? p.collab_skills.join(', ') : 'Not specified';

      grid.innerHTML += `
        <div class="bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-6 shadow-lg hover:shadow-2xl transition">
          <img src="${logo}" class="w-24 h-24 rounded-full mx-auto object-cover border-4 border-white shadow">
          <h3 class="text-xl font-bold text-center mt-4">${p.name || 'Artist'}</h3>
          <div class="text-center text-sm text-gray-600 space-y-1 mt-2">
            <div><strong>${stat.video_count}</strong> videos</div>
            <div>♥ ${stat.hearts} • 💬 ${stat.comments}</div>
            ${p.open_to_collab ? '<span class="inline-block bg-green-600 text-white px-3 py-1 rounded-full text-xs mt-2">OPEN TO COLLAB</span>' : ''}
          </div>
          <p class="text-xs text-gray-500 mt-3 text-center">${skills}</p>
          <button onclick="startChat('${p.talkjs_id || "user_"+p.id}')" class="w-full mt-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-3 rounded-lg">
            Message & Call
          </button>
        </div>`;
    }
  }

  // TalkJS 1-on-1 chat + video call
  function startChat(otherUserId) {
    if (!talkjsReady) return alert('Chat loading...');
    const otherUser = new Talk.User({ id: otherUserId });
    const conversation = window.talkSession.getOrCreateConversation(Talk.oneOnOneId(window.talkSession.me, otherUser));
    conversation.setParticipant(window.talkSession.me);
    conversation.setParticipant(otherUser);

    const chatbox = window.talkSession.createChatbox();
    chatbox.select(conversation);
    chatbox.mount(document.getElementById('collabModal').querySelector('.relative')); // mount inside modal
  }

  // Search
  document.getElementById('searchArtists').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    document.querySelectorAll('#artistsGrid > div').forEach(card => {
      const text = card.textContent.toLowerCase();
      card.style.display = text.includes(term) ? '' : 'none';
    });
  });

  // Create this function in Supabase (SQL Editor):
  /*
  create or replace function get_artist_stats()
  returns table (user_id uuid, hearts bigint, comments bigint, video_count bigint) as $$
    select 
      uv.user_id,
      coalesce(sum(likes.count),0) as hearts,
      coalesce(sum(comments.count),0) as comments,
      count(uv.id)::bigint as video_count
    from user_videos uv
    left join (select video_id, count(*) from video_likes group by video_id) likes on likes.video_id = uv.id
    left join (select video_id, count(*) from video_comments group by video_id) comments on comments.video_id = uv.id
    group by uv.user_id
  $$ language sql stable;
  */

  // All your existing functions (loadVideos, renderVideoCard, toggleLike, upload, etc.) go here unchanged
  // ... (copy them from your current working file)

</script>
</body>
</html>
