<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Profile | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.livepeer.studio/player"></script>
  <style>
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin-left:8px;}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-card:hover .video-overlay{opacity:1}
    #videoModal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    #videoModal.show{opacity:1;visibility:visible}
    #modalVideo{max-width:90%;max-height:90%;border:8px solid #10b981;border-radius:16px}
    #closeModal{position:absolute;top:20px;right:20px;background:white;color:black;width:60px;height:60px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;font-weight:bold}
    .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem 1rem;margin-bottom:.5rem}
    .comment-name{font-weight:700;color:#10b981}
    .comment-text{color:#1f2937;margin-left:.5rem;font-weight:500}
    .like-display{display:flex;align-items:center;gap:8px;font-weight:bold;color:#ef4444;opacity:0.8}
    .like-display svg{width:28px;height:28px;stroke:#ef4444;fill:none}
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">
<header class="bg-black text-white p-4 flex justify-between items-center shadow-lg">
  <div class="flex items-center space-x-3">
    <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="w-10 h-10 rounded-full">
    <div><h1 class="text-2xl font-bold tracking-wide">RHYTHM DECK</h1><p class="text-sm text-gray-300">Pro Plan</p></div>
  </div>
  <nav class="space-x-6">
    <a href="index.html" class="hover:underline">Home</a>
    <a href="collaborate.html" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-lg font-bold text-lg">Collaboration Network</a>
    <button onclick="logout()" class="bg-white text-black px-4 py-1 rounded hover:bg-gray-300 font-medium">Logout</button>
  </nav>
</header>
<main class="flex-grow">
  <!-- BANNER -->
  <section class="relative h-[300px] bg-gradient-to-br from-purple-900 to-blue-900 overflow-hidden">
    <img id="bannerPreview" src="" alt="Banner" class="absolute inset-0 w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="absolute inset-0 flex items-center justify-center">
      <p class="text-white text-4xl font-bold opacity-70">Your Banner Image Here</p>
    </div>
    <div class="absolute bottom-4 left-4 w-32 h-32 rounded-full border-8 border-white shadow-2xl overflow-hidden bg-white">
      <img id="logoPreview" src="logo-placeholder.png" alt="User Logo" class="w-full h-full object-cover">
    </div>
    <input type="file" id="bannerInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('bannerInput').click()" class="absolute bottom-4 right-4 bg-green-600 text-white px-5 py-3 rounded-lg hover:bg-green-700 font-bold shadow-lg">Upload Banner</button>
    <input type="file" id="logoInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('logoInput').click()" class="absolute bottom-4 left-40 bg-green-600 text-white px-5 py-3 rounded-lg hover:bg-green-700 font-bold shadow-lg text-sm">Change Logo</button>
  </section>

  <!-- LIVE STREAM SECTION — untouched -->
  <section class="max-w-6xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-2xl">
    <!-- ... your live stream section ... -->
  </section>

  <!-- PROFILE & VIDEOS -->
  <section class="max-w-6xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-2xl">
    <div class="grid md:grid-cols-4 gap-8">
      <div class="md:col-span-1 space-y-6">
        <div class="bg-gray-50 p-5 rounded-xl shadow">
          <h3 class="text-xl font-bold text-gray-800 mb-3">Artist / Band Name</h3>
          <input type="text" id="artistNameInput" class="w-full border border-gray-300 p-3 rounded-lg mb-3" placeholder="Enter your name">
          <button onclick="saveArtistName()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-bold">Save Name</button>
        </div>
        <div class="bg-gray-50 p-5 rounded-xl shadow">
          <label class="block text-sm font-bold text-gray-700 mb-2">Bio</label>
          <textarea id="bioInput" placeholder="Tell your story..." class="w-full border border-gray-300 p-3 rounded-lg h-40 resize-none"></textarea>
          <button onclick="saveBio()" class="mt-3 w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-bold">Save Bio</button>
        </div>
        <div class="bg-green-50 p-5 rounded-xl shadow text-center">
          <p class="text-sm text-gray-600">Your Public Page:</p>
          <p id="publicUrl" class="font-bold text-green-700 text-lg break-all mt-2">Loading...</p>
          <a id="publicLink" target="_blank" class="block mt-2 text-sm text-blue-600 underline">Open in new tab</a>
        </div>
        <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-6 rounded-xl shadow-2xl text-white">
          <h3 class="text-2xl font-bold mb-4">Collaboration Network</h3>
          <p class="text-sm opacity-90 mb-5">Let other Pro artists discover you</p>
          <label class="flex items-center space-x-4 cursor-pointer text-lg">
            <input type="checkbox" id="collaborationOptIn" class="w-7 h-7 rounded accent-white">
            <span>Show my profile to other Pro artists</span>
          </label>
          <button onclick="saveCollaborationOptIn()" class="mt-5 w-full bg-white text-purple-700 font-black py-3 rounded-lg hover:bg-gray-100 transition">
            Save & Join Network
          </button>
        </div>
      </div>
      <div class="md:col-span-3 space-y-8">
        <div class="bg-gray-50 p-6 rounded-xl shadow-lg">
          <h3 class="text-2xl font-bold mb-6 text-gray-800">Upload New Video</h3>
          <div class="grid md:grid-cols-2 gap-6">
            <div><label class="block font-bold mb-3 text-gray-700">Thumbnail Image</label><input type="file" accept="image/*" id="thumbnailInput" class="w-full file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:bg-green-600 file:text-white"></div>
            <div><label class="block font-bold mb-3 text-gray-700">Video File (.mp4)</label><input type="file" accept="video/mp4" id="videoInput" class="w-full file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:bg-green-600 file:text-white"></div>
          </div>
          <button id="uploadVideo" class="mt-6 bg-green-600 text-white px-8 py-4 rounded-lg hover:bg-green-700 font-bold text-lg flex items-center shadow-lg">
            <span>Upload & Publish Video</span>
            <div id="uploadSpinner" class="spinner hidden"></div>
          </button>
        </div>
        <div id="videoList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
    </div>
    <!-- Danger Zone unchanged -->
    <div class="mt-16 p-8 bg-red-50 border-4 border-red-500 rounded-2xl max-w-4xl mx-auto">
      <!-- ... your delete account section ... -->
    </div>
  </section>
</main>
<div id="videoModal"><div id="closeModal" onclick="closeModal()">X</div><video id="modalVideo" controls autoplay class="shadow-2xl"></video></div>
<footer class="bg-black text-white mt-auto p-6 text-center"><p class="text-sm">© 2025 Rhythm Deck Music. All rights reserved.</p></footer>

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );
  let currentUser = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { alert('Login required'); window.location.href = 'login.html'; return; }
    currentUser = user;
    await Promise.all([loadProfileData(), loadVideos(), loadCollaborationStatus()]);
    // ... your other event listeners ...
  });

  // THE ONLY TWO FUNCTIONS THAT WERE BROKEN — NOW FIXED
  async function saveArtistName() {
    const name = document.getElementById('artistNameInput').value.trim();
    if (!name) return alert("Artist name can't be empty!");
    const { error } = await supabase.from('profiles').update({ name }).eq('id', currentUser.id);
    error ? alert("Save failed: " + error.message) : alert("Artist name saved!");
  }

  async function saveBio() {
    const bio = document.getElementById('bioInput').value.trim();
    if (!bio) return alert("Please write something in your bio!");
    const { error } = await supabase.from('profiles').update({ bio }).eq('id', currentUser.id);
    if (error) {
      console.error(error);
      alert("Bio save failed: " + error.message);
    } else {
      alert("Bio saved perfectly!");
    }
  }

  // Everything else stays exactly the same
  async function loadProfileData() {
    const { data: profile } = await supabase.from('profiles').select('name, bio, banner_url, logo_url, subdomain').eq('id', currentUser.id).single();
    if (!profile) return;
    document.getElementById('artistNameInput').value = profile.name || '';
    document.getElementById('bioInput').value = profile.bio || '';
    if (profile.banner_url) {
      const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl + '?t=' + Date.now();
      document.getElementById('bannerPreview').src = url;
      document.getElementById('bannerPreview').classList.remove('hidden');
      document.getElementById('bannerPlaceholder').classList.add('hidden');
    }
    if (profile.logo_url) {
      document.getElementById('logoPreview').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl + '?t=' + Date.now();
    }
    const publicUrl = `https://rhythm-deck-music.onrender.com/public-profile.html?id=${profile.subdomain || 'unknown'}`;
    document.getElementById('publicUrl').textContent = publicUrl;
    document.getElementById('publicLink').href = publicUrl;
  }

  async function loadCollaborationStatus() {
    const { data } = await supabase.from('profiles').select('collaboration_opt_in').eq('id', currentUser.id).single();
    document.getElementById('collaborationOptIn').checked = !!data?.collaboration_opt_in;
  }

  async function saveCollaborationOptIn() {
    const checked = document.getElementById('collaborationOptIn').checked;
    await supabase.from('profiles').update({ collaboration_opt_in: checked }).eq('id', currentUser.id);
    alert(checked ? "You're now in the Collaboration Network!" : "You've left the network");
  }

  // ... rest of your upload functions, video list, etc. — ALL UNCHANGED ...

  async function uploadAndPublish() { /* unchanged */ }
  async function uploadBanner(e) {
    const file = e.target.files[0];
    const path = `banners/${currentUser.id}`;
    await supabase.storage.from('media').upload(path, file, { upsert: true });
    await supabase.from('profiles').update({ banner_url: path }).eq('id', currentUser.id);
    loadProfileData();
  }
  async function uploadLogo(e) {
    const file = e.target.files[0];
    const path = `logos/${currentUser.id}`;
    await supabase.storage.from('media').upload(path, file, { upsert: true });
    await supabase.from('profiles').update({ logo_url: path }).eq('id', currentUser.id);
    loadProfileData();
  }

  // ... rest of your code (loadVideos, deleteVideo, etc.) completely unchanged ...

  function openVideoPopup(url) {
    document.getElementById('modalVideo').src = url;
    document.getElementById('videoModal').classList.add('show');
  }
  function closeModal() {
    document.getElementById('videoModal').classList.remove('show');
    document.getElementById('modalVideo').src = '';
  }
  async function logout() {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
