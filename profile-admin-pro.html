<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Profile | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin-left:8px;}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-card:hover .video-overlay{opacity:1}
    #videoModal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    #videoModal.show{opacity:1;visibility:visible}
    #modalVideo{max-width:90%;max-height:90%;border:8px solid #10b981;border-radius:16px}
    #closeModal{position:absolute;top:20px;right:20px;background:white;color:black;width:60px;height:60px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;font-weight:bold}
    .new-like {animation: heartbeat 0.6s ease-in-out;}
    @keyframes heartbeat {0%,100%{transform:scale(1)} 50%{transform:scale(1.4)}}
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">
<!-- Your full HTML stays exactly the same until <script> -->
<!-- ... (everything you already have: header, banner, upload form, etc.) ... -->

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );

  let currentUser = null;
  let publicUrl = '';

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { alert('Login required'); window.location.href = 'login.html'; return; }
    currentUser = user;

    // ... your profile loading code (unchanged) ...

    await loadVideos();

    // REALTIME: Now includes user_videos so new uploads appear instantly!
    supabase.channel('admin_realtime')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'user_videos', filter: `user_id=eq.${currentUser.id}` }, payload => {
        renderVideoCard(payload.new);  // New video appears instantly!
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'video_likes' }, payload => {
        const videoId = payload.new?.video_id || payload.old?.video_id;
        if (videoId) updateLikeCount(videoId);
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'video_comments' }, payload => {
        addNewComment(payload.new.video_id, payload.new.comment);
      })
      .subscribe();

    // ... rest of your event listeners (unchanged) ...
  });

  async function loadVideos() {
    const { data: videos } = await supabase
      .from('user_videos')
      .select('id, video_url, thumbnail_url, title')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });

    const container = document.getElementById('videoList');
    container.innerHTML = videos?.length ? '' : '<p class="col-span-full text-center text-gray-600 italic py-8">No videos uploaded yet.</p>';

    for (const video of (videos || [])) {
      renderVideoCard(video);
    }
  }

  async function renderVideoCard(video) {
    const videoUrl = supabase.storage.from('media').getPublicUrl(video.video_url).data.publicUrl;
    const thumbUrl = video.thumbnail_url
      ? supabase.storage.from('media').getPublicUrl(video.thumbnail_url).data.publicUrl
      : 'https://via.placeholder.com/400x225/10b981/ffffff?text=No+Thumbnail';

    const { count: likes = 0 } = await supabase.from('video_likes').select('id', { count: 'exact', head: true }).eq('video_id', video.id);

    const cardHTML = `
      <div class="video-card bg-gray-900 rounded-xl overflow-hidden shadow-xl flex flex-col" data-video-id="${video.id}">
        <div class="relative">
          <img src="${thumbUrl}" class="w-full h-48 object-cover" onerror="this.src='https://via.placeholder.com/400x225/10b981/ffffff?text=No+Thumbnail'">
          <div class="video-overlay" onclick="openVideoPopup('${videoUrl}')">
            <svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z"/></svg>
          </div>
        </div>
        <div class="p-4 bg-gray-800 text-white border-b border-gray-700">
          <h4 class="font-bold text-lg truncate">${video.title || 'Untitled Video'}</h4>
        </div>
        <div class="p-4 bg-gray-800 flex items-center justify-between text-white">
          <button onclick="toggleLike('${video.id}', this)" class="flex items-center gap-3 font-bold text-lg hover:scale-105 transition">
            Heart
            <svg class="w-7 h-7 transition-all ${likes > 0 ? 'text-red-500' : 'text-gray-400'}" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
            </svg>
            <span class="like-count text-xl font-bold">${likes}</span>
          </button>
          <button onclick="navigator.clipboard.writeText('${publicUrl}'); alert('Link copied!')" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg text-sm font-bold">Share</button>
        </div>
        <div class="p-4 bg-gray-900 border-t border-gray-700 max-h-60 overflow-y-auto">
          <h5 class="font-bold text-green-400 mb-3">Comments (0)</h5>
          <div class="comments-container"><p class="text-gray-500 text-sm italic">No comments yet</p></div>
        </div>
        <button onclick="if(confirm('Delete forever?')) deleteVideo('${video.id}', '${video.video_url}', '${video.thumbnail_url || ''}')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3">
          Delete Video
        </button>
      </div>`;

    const existing = document.querySelector(`[data-video-id="${video.id}"]`);
    if (existing) existing.outerHTML = cardHTML;
    else document.getElementById('videoList').insertAdjacentHTML('afterbegin', cardHTML);
  }

  // These two functions are unchanged — just shorter for clarity
  async function updateLikeCount(videoId) { /* same as before */ }
  function addNewComment(videoId, comment) { /* same as before */ }
  async function toggleLike(videoId, button) { /* same as before */ }
  async function deleteVideo(id, videoPath, thumbPath) { /* same as before */ }

  async function uploadAndPublish() {
    const thumbnail = document.getElementById('thumbnailInput').files[0];
    const videoFile = document.getElementById('videoInput').files[0];
    if (!thumbnail || !videoFile) return alert('Select both files');

    document.getElementById('uploadSpinner').classList.remove('hidden');
    document.getElementById('uploadVideo').disabled = true;

    const videoName = `${currentUser.id}/videos/${Date.now()}.mp4`;
    const thumbName = `${currentUser.id}/thumbnails/${Date.now()}.jpg`;

    await Promise.all([
      supabase.storage.from('media').upload(videoName, videoFile, { upsert: true }),
      supabase.storage.from('media').upload(thumbName, thumbnail, { upsert: true })
    ]);

    await supabase.from('user_videos').insert({
      user_id: currentUser.id,
      video_url: videoName,
      thumbnail_url: thumbName,
      title: videoFile.name.replace(/\.mp4$/i, '').substring(0, 60)
    });

    alert('Video published instantly!');
    document.getElementById('uploadSpinner').classList.add('hidden');
    document.getElementById('uploadVideo').disabled = false;
    document.getElementById('thumbnailInput').value = '';
    document.getElementById('videoInput').value = '';
  }

  // ... rest of your functions (uploadBanner, saveName, etc.) stay exactly the same ...
</script>
</body>
</html>
