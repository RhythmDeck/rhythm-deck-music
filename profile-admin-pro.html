<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Profile | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.livepeer.com/player.js"></script>
  <style>
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin-left:8px;}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .glow-btn {background: linear-gradient(45deg, #10b981, #34d399);box-shadow: 0 0 50px rgba(16,185,129,0.9);animation: pulse 2s infinite;}
    @keyframes pulse{0%,100%{box-shadow:0 0 40px rgba(16,185,129,0.7)}50%{box-shadow:0 0 70px rgba(16,185,129,1)}}
    .live-border {border-left: 6px solid transparent;border-image: linear-gradient(to bottom, #a855f7, #ec4899) 1;}
    .video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-card:hover .video-overlay{opacity:1}
    #videoModal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    #videoModal.show{opacity:1;visibility:visible}
    #modalVideo{max-width:90%;max-height:90%;border:8px solid #10b981;border-radius:16px}
    #closeModal{position:absolute;top:20px;right:20px;background:white;color:black;width:60px;height:60px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;font-weight:bold}
    .like-btn{display:flex;align-items:center;gap:8px;font-weight:bold;color:#666;transition:all .3s;pointer-events:none;opacity:0.8}
    .like-btn svg{width:28px;height:28px;stroke:#ef4444;fill:none;transition:all .3s}
    .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem 1rem;margin-bottom:.5rem}
    .comment-name{font-weight:700;color:#10b981}
    .comment-text{color:#1f2937;margin-left:.5rem;font-weight:500}
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

<header class="bg-black text-white p-4 flex justify-between items-center shadow-lg">
  <div class="flex items-center space-x-3">
    <img src="logo-1-sm.jpg" alt="Logo" class="w-10 h-10 rounded-full">
    <div><h1 class="text-2xl font-bold">RHYTHM DECK</h1><p class="text-sm text-gray-300">Pro Plan</p></div>
  </div>
  <nav class="space-x-6">
    <a href="index.html" class="hover:underline">Home</a>
    <a href="collaborate.html" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-lg font-bold text-lg">Collaboration Network</a>
    <button onclick="logout()" class="bg-white text-black px-4 py-1 rounded hover:bg-gray-300 font-medium">Logout</button>
  </nav>
</header>

<main class="flex-grow">
  <section class="relative h-[300px] bg-gradient-to-br from-purple-900 to-blue-900 overflow-hidden">
    <img id="bannerPreview" src="" alt="Banner" class="absolute inset-0 w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="absolute inset-0 flex items-center justify-center">
      <p class="text-white text-4xl font-bold opacity-70">Your Banner Image Here</p>
    </div>
    <div class="absolute bottom-4 left-4 w-32 h-32 rounded-full border-8 border-white shadow-2xl overflow-hidden bg-white">
      <img id="logoPreview" src="logo-placeholder.png" alt="Logo" class="w-full h-full object-cover">
    </div>
    <input type="file" id="bannerInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('bannerInput').click()" class="absolute bottom-4 right-4 bg-green-600 text-white px-5 py-3 rounded-lg hover:bg-green-700 font-bold shadow-lg">Upload Banner</button>
    <input type="file" id="logoInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('logoInput').click()" class="absolute bottom-4 left-40 bg-green-600 text-white px-5 py-3 rounded-lg hover:bg-green-700 font-bold text-sm">Change Logo</button>
  </section>

  <section class="max-w-7xl mx-auto mt-8 px-6 pb-12">
    <div class="grid lg:grid-cols-4 gap-8">

      <!-- LEFT SIDEBAR -->
      <div class="space-y-6">
        <div class="bg-gray-50 p-5 rounded-xl shadow">
          <h3 class="text-xl font-bold mb-3">Artist / Band Name</h3>
          <input type="text" id="artistNameInput" class="w-full border p-3 rounded-lg mb-3" placeholder="Enter your name">
          <button onclick="saveArtistName()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-bold">Save Name</button>
        </div>

        <div class="bg-gray-50 p-5 rounded-xl shadow">
          <label class="block font-bold mb-2">Bio</label>
          <textarea id="bioInput" placeholder="Tell your story..." class="w-full border p-3 rounded-lg h-40 resize-none"></textarea>
          <button onclick="saveBio()" class="mt-3 w-full glow-btn text-black py-3 rounded-lg font-black hover:scale-105 transition">Save Bio</button>
        </div>

        <div class="bg-green-50 p-5 rounded-xl shadow text-center">
          <p class="text-sm text-gray-600">Your Public Page:</p>
          <p id="publicUrl" class="font-bold text-green-700 text-lg break-all mt-2">Loading...</p>
          <a id="publicLink" target="_blank" class="block mt-2 text-sm text-blue-600 underline">Open in new tab</a>
        </div>

        <!-- GO LIVE BUTTON -->
        <div class="live-border bg-gradient-to-br from-purple-900 via-purple-800 to-pink-800 p-8 rounded-2xl shadow-2xl text-white text-center relative overflow-hidden">
          <div class="absolute inset-y-0 left-0 w-3 bg-gradient-to-b from-purple-400 to-pink-400"></div>
          <h3 class="text-4xl font-black mb-4">GO LIVE NOW</h3>
          <p class="text-lg mb-8 opacity-90">Stream in HD to all your fans</p>
          <button onclick="goLive()" class="glow-btn w-full py-6 text-black font-black text-3xl rounded-2xl transform hover:scale-105 transition">
            GO LIVE NOW
          </button>
          <div id="streamInfo" class="mt-6 hidden">
            <p class="text-yellow-300 font-bold text-2xl animate-pulse">● LIVE NOW</p>
            <p class="text-xs mt-4 font-mono bg-black/40 p-4 rounded break-all">
              rtmp://rtmp.livepeer.com/live/<span id="streamKeyDisplay"></span>
            </p>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="lg:col-span-3 space-y-10">

        <!-- LIVE SECTION - CHAT LEFT, PLAYER RIGHT -->
        <div id="liveSection" class="hidden">
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-gray-900 rounded-2xl shadow-2xl p-6 flex flex-col">
              <h3 class="text-2xl font-bold text-white mb-4">Live Chat</h3>
              <div id="liveChat" class="flex-1 overflow-y-auto bg-black rounded-lg p-4 mb-4 text-white space-y-3 min-h-96"></div>
              <div class="flex gap-3">
                <input type="text" id="chatInput" onkeypress="if(event.key==='Enter') sendChat()" placeholder="Say something..." class="flex-1 p-3 rounded-lg bg-gray-800 text-white">
                <button onclick="sendChat()" class="bg-green-600 hover:bg-green-700 px-8 py-3 rounded-lg font-bold">Send</button>
              </div>
            </div>
            <div class="lg:col-span-2 bg-black rounded-2xl shadow-2xl overflow-hidden border-4 border-purple-600">
              <div class="aspect-video relative">
                <div id="livepeer-player" class="w-full h-full"></div>
                <div class="absolute top-4 left-4 bg-red-600 text-white px-8 py-4 rounded-full font-bold text-2xl animate-pulse shadow-2xl">
                  LIVE NOW
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Upload Video -->
        <div class="bg-gray-50 p-8 rounded-xl shadow-lg">
          <h3 class="text-2xl font-bold mb-6">Upload New Video</h3>
          <div class="grid md:grid-cols-2 gap-6 mb-6">
            <div><label class="block font-bold mb-2">Thumbnail</label><input type="file" accept="image/*" id="thumbnailInput" class="w-full"></div>
            <div><label class="block font-bold mb-2">Video (.mp4)</label><input type="file" accept="video/mp4" id="videoInput" class="w-full"></div>
          </div>
          <button id="uploadVideo" class="bg-green-600 text-white px-10 py-5 rounded-lg hover:bg-green-700 font-bold text-xl flex items-center gap-3">
            <span>Upload & Publish</span>
            <div id="uploadSpinner" class="spinner hidden"></div>
          </button>
        </div>

        <!-- Videos Grid WITH Hearts, Share & Comments (view-only for artist) -->
        <div id="videoList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      </div>
    </div>
  </section>
</main>

<div id="videoModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-50">
  <div class="relative">
    <button onclick="closeModal()" class="absolute -top-12 right-0 text-white text-6xl">&times;</button>
    <video id="modalVideo" controls autoplay class="max-w-5xl w-full rounded-2xl shadow-2xl" style="max-height:85vh"></video>
  </div>
</div>

<footer class="bg-black text-white p-6 text-center">© 2025 Rhythm Deck Music</footer>

<script>
  const supabase = window.supabase.createClient('https://bxoqhmfnseskwqkywppg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc');
  let currentUser = null;
  let currentStream = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return location.href = 'login.html';
    currentUser = user;
    await Promise.all([loadProfileData(), loadVideos(), checkExistingStream()]);
    document.getElementById('bannerInput').addEventListener('change', uploadBanner);
    document.getElementById('logoInput').addEventListener('change', uploadLogo);
    document.getElementById('uploadVideo').addEventListener('click', uploadAndPublish);
  });

  // LIVE STREAM (unchanged - your original working version)
  async function checkExistingStream() {
    const { data } = await supabase.from('live_streams').select('*').eq('user_id', currentUser.id).maybeSingle();
    if (data) { currentStream = data; activateLive(data); }
  }
  async function goLive() {
    if (currentStream) return alert("You're already live!");
    const res = await fetch('https://livepeer.studio/api/stream', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer 6d5c32a1-1177-4ffc-a0da-8d411ddcc6ff', 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: `RhythmDeck_${currentUser.id}` })
    });
    const stream = await res.json();
    currentStream = stream;
    await supabase.from('live_streams').insert({ user_id: currentUser.id, stream_key: stream.streamKey, playback_id: stream.playbackId });
    activateLive(stream);
  }
  function activateLive(stream) {
    document.getElementById('streamInfo').classList.remove('hidden');
    document.getElementById('streamKeyDisplay').textContent = stream.streamKey;
    document.getElementById('liveSection').classList.remove('hidden');
    const player = document.createElement('div');
    player.setAttribute('data-playback-id', stream.playbackId);
    player.className = 'lp-player';
    document.getElementById('livepeer-player').innerHTML = '';
    document.getElementById('livepeer-player').appendChild(player);
    const channel = supabase.channel(`livechat:${stream.playbackId}`);
    channel.on('broadcast', { event: 'msg' }, ({ payload }) => {
      const chat = document.getElementById('liveChat');
      chat.insertAdjacentHTML('beforeend', `<div class="bg-gray-800 p-3 rounded"><strong class="text-green-400">${payload.name}:</strong> ${payload.message}</div>`);
      chat.scrollTop = chat.scrollHeight;
    }).subscribe();
  }
  async function sendChat() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg || !currentStream) return;
    const { data: profile } = await supabase.from('profiles').select('name').eq('id', currentUser.id).single();
    await supabase.channel(`livechat:${currentStream.playbackId}`).send({
      type: 'broadcast', event: 'msg', payload: { name: profile?.name || 'Artist', message: msg }
    });
    input.value = '';
  }

  // FIXED loadVideos() - NOW SHOWS HEARTS, SHARE & COMMENTS (view-only)
  async function loadVideos() {
    const { data: videos } = await supabase.from('user_videos').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
    const container = document.getElementById('videoList');
    container.innerHTML = '';
    if (!videos || videos.length === 0) {
      container.innerHTML = '<p class="col-span-full text-center text-gray-500 italic text-lg py-10">No videos uploaded yet.</p>';
      return;
    }
    for (const v of videos) {
      const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
      const thumbUrl = v.thumbnail_url ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'logo-placeholder.png';

      const { count: likes = 0 } = await supabase.from('video_likes').select('*', { count: 'exact', head: true }).eq('video_id', v.id);
      const { data: comments = [] } = await supabase.from('video_comments').select('name, comment').eq('video_id', v.id).order('created_at', { ascending: false });

      container.innerHTML += `
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col">
          <div class="relative cursor-pointer" onclick="openVideoPopup('${videoUrl}')">
            <img src="${thumbUrl}" class="w-full h-64 object-cover">
            <div class="video-overlay">
              <svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z"/></svg>
            </div>
          </div>
          <div class="p-6 space-y-4 flex-1">
            <h4 class="font-black text-xl text-gray-800 truncate">${v.title || 'Untitled Video'}</h4>
            <div class="flex justify-between items-center">
              <div class="like-btn">
                Heart
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                </svg>
                <span class="font-bold text-red-600">${likes}</span>
              </div>
              <button onclick="navigator.clipboard.writeText('${videoUrl}'); alert('Video link copied!')" class="text-green-600 font-bold hover:text-green-700">Share</button>
            </div>
            <div class="border-t pt-4 space-y-2 max-h-48 overflow-y-auto text-sm">
              ${comments.length === 0 ? '<p class="text-gray-500 italic">No comments yet</p>' : ''}
              ${comments.map(c => `<div class="comment-bubble"><span class="comment-name">${c.name}:</span> <span class="comment-text">${c.comment}</span></div>`).join('')}
            </div>
          </div>
          <button onclick="if(confirm('Delete this video forever?')) deleteVideo('${v.id}', '${v.video_url}', '${v.thumbnail_url || ''}')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3">Delete Video</button>
        </div>`;
    }
  }

  async function deleteVideo(id, videoPath, thumbPath) {
    await Promise.all([
      supabase.from('user_videos').delete().eq('id', id),
      supabase.storage.from('media').remove([videoPath]),
      thumbPath && supabase.storage.from('media').remove([thumbPath])
    ]);
    loadVideos();
  }

  async function saveBio() {
    const bio = document.getElementById('bioInput').value;
    await supabase.from('profiles').update({ bio }).eq('id', currentUser.id);
    alert("Bio saved!");
  }

  async function saveArtistName() {
    const name = document.getElementById('artistNameInput').value.trim();
    if (!name) return alert("Enter a name");
    await supabase.from('profiles').update({ name }).eq('id', currentUser.id);
    alert("Name saved!");
  }

  function openVideoPopup(url) {
    document.getElementById('modalVideo').src = url;
    document.getElementById('videoModal').classList.remove('hidden');
  }
  function closeModal() {
    document.getElementById('videoModal').classList.add('hidden');
    document.getElementById('modalVideo').src = '';
  }
  async function logout() { await supabase.auth.signOut(); location.href = 'login.html'; }
</script>
</body>
</html>
