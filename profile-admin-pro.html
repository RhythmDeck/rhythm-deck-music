<!DOCTYPE html>

<head>

  <script src="https://cdn.livepeer.studio/player"></script>
  <script src="https://unpkg.com/talkjs@0.16.2/dist/talkjs.js"></script> <!-- Added TalkJS -->
  <style>
    /* ALL YOUR EXISTING STYLES ARE UNCHANGED */
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin-left:8px;}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-card:hover .video-overlay{opacity:1}
    #videoModal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    #videoModal.show{opacity:1;visibility:visible}
    #modalVideo{max-width:90%;max-height:90%;border:8px solid #10b981;border-radius:16px}
    #closeModal{position:absolute;top:20px;right:20px;background:white;color:black;width:60px;height:60px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;font-weight:bold}
    .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem 1rem;margin-bottom:.5rem}
    .comment-name{font-weight:700;color:#10b981}
    .comment-text{color:#1f2937;margin-left:.5rem;font-weight:500}
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">
  <!-- YOUR ENTIRE HEADER AND ALL EXISTING SECTIONS ARE 100% UNCHANGED -->
  <!-- ... (everything you already have... -->

  <!-- ONLY THIS NEW SECTION IS ADDED (right before the Danger Zone) -->
  <div class="md:col-span-1 space-y-6">
    <!-- ALL YOUR EXISTING LEFT SIDEBAR CODE (Name, Bio, Public URL) -->

    <!-- ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←← NEW COLLABORATION OPT-IN ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←← -->
    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 p-6 rounded-xl shadow-lg border-l-8 border-indigo-600">
      <h3 class="text-2xl font-black text-indigo-800 mb-4">Collaboration Network</h3>
      <p class="text-sm text-gray-700 mb-4">
        Join thousands of Pro artists who are open to collaborations, production deals, and distribution offers.
      </p>
      <label class="flex items-start space-x-3 cursor-pointer">
        <input type="checkbox" id="collabOptIn" class="mt-1 w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
        <span class="text-sm leading-tight">
          I agree to appear in the Rhythm Deck Collaboration Network.<br>
          My <strong>artist name, logo, banner, all uploaded videos, total likes/comments/followers, and email address</strong> will be visible to other Pro artists and invited producers/distributors so we can collaborate.<br>
          I can turn this off anytime.
        </span>
      </label>
      <button id="saveCollabBtn" class="mt-5 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
        <span id="collabBtnText">Save & Join Network</span>
      </button>
      <p id="collabStatus" class="mt-3 text-center font-medium"></p>
    </div>
    <!-- ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←← END OF NEW SECTION ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←← -->

    <!-- DANGER ZONE (unchanged) -->
    <div class="mt-16 p-8 bg-red-50 border-4 border-red-500 rounded-2xl max-w-4xl mx-auto">
      <!-- ...your existing danger zone code... -->
    </div>
  </div>
  <!-- REST OF YOUR PAGE (videos grid, modal, footer) 100% UNCHANGED -->

  <!-- YOUR ENTIRE <script> TAG WITH ONLY TWO SMALL ADDITIONS AT THE END -->
  <script>
    const supabase = window.supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );
    let currentUser = null;
    // ...ALL YOUR EXISTING JAVASCRIPT FUNCTIONS ARE UNCHANGED...

    // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←← NEW COLLABORATION CODE (added at the very end) ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
    document.getElementById('saveCollabBtn').addEventListener('click', async () => {
      const checkbox = document.getElementById('collabOptIn');
      const status = document.getElementById('collabStatus');
      const btnText = document.getElementById('collabBtnText');

      if (!checkbox.checked) return;

      btnText.textContent = 'Saving...';
      const { error } = await supabase
        .from('profiles')
        .update({ collaboration_opt_in: checkbox.checked })
        .eq('id', currentUser.id);

      if (error) {
        status.textContent = 'Error – try again';
        status.className = 'mt-3 text-center font-medium text-red-600';
      } else {
        status.textContent = checkbox.checked ? 'You are now visible in the Collaboration Network!' : 'You are hidden from the Collaboration Network';
        status.className = 'mt-3 text-center font-medium text-green-600';
      }
      btnText.textContent = 'Save & Join Network';
    });

    // Load current opt-in status when page loads
    async function loadCollabStatus() {
      const { data } = await supabase.from('profiles').select('collaboration_opt_in').eq('id', currentUser.id).single();
      if (data?.collaboration_opt_in) {
        document.getElementById('collabOptIn').checked = true;
        document.getElementById('collabStatus').textContent = 'You are currently visible in the Collaboration Network';
        document.getElementById('collabStatus').className = 'mt-3 text-center font-medium text-green-600';
      }
    }

    // Call it after loadProfileData()
    document.addEventListener('DOMContentLoaded', async () => {
      // ...your existing code...
      await Promise.all([loadProfileData(), loadVideos(), initLiveStream()]);
      await loadCollabStatus(); // ← new line
      // ...rest of your existing listeners...
    });
    // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←← END OF NEW CODE ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
  </script>
</body>
</html>
