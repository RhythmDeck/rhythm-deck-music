<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Profile | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin-left:8px;}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-card:hover .video-overlay{opacity:1}
    #videoModal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    #videoModal.show{opacity:1;visibility:visible}
    #modalVideo{max-width:90%;max-height:90%;border:4px solid #10b981;border-radius:12px}
    #closeModal{position:absolute;top:20px;right:20px;background:white;color:black;width:50px;height:50px;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(0,0,0,.8);z-index:10}
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">
<header class="bg-black text-white p-4 flex justify-between items-center shadow-lg flex">
  <div class="flex items-center space-x-3">
    <img src="logo-1-sm.jpg" alt="Logo" class="w-10 h-10 rounded-full">
    <div>
      <h1 class="text-2xl font-bold">RHYTHM DECK</h1>
      <p class="text-sm text-gray-300">Unleash Your Beat</p>
    </div>
  </div>
  <nav class="space-x-4">
    <a href="index.html" class="hover:underline">Home</a>
    <button onclick="logout()" class="bg-white text-black px-4 py-2 rounded font-medium">Logout</button>
  </nav>
</header>

<main class="flex-grow max-w-7xl mx-auto p-6">
  <!-- Banner & Logo -->
  <section class="relative h-80 bg-gradient-to-br from-purple-900 to-blue-900 rounded-2xl overflow-hidden mb-12">
    <img id="bannerPreview" src="" alt="Banner" class="absolute inset-0 w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="absolute inset-0 flex items-center justify-center h-full text-white text-5xl font-black opacity-70">
      Your Banner Image Here
    </div>
    <div class="absolute bottom-6 left-6 w-40 h-40 rounded-full border-10 border-white shadow-2xl overflow-hidden bg-white">
      <img id="logoPreview" src="logo-placeholder.png" alt="Logo" class="w-full h-full object-cover">
    </div>
    <input type="file" id="bannerInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('bannerInput').click()" class="absolute bottom-6 right-6 bg-green-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-green-700">
      Upload Banner
    </button>
    <input type="file" id="logoInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('logoInput').click()" class="absolute bottom-6 left-52 bg-green-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg text-sm">
      Change Logo
    </button>
  </section>

  <!-- Main Content -->
  <div class="grid lg:grid-cols-4 gap-8">
    <!-- Left Column -->
    <div class="space-y-8">
      <div class="bg-white p-6 rounded-xl shadow-lg">
        <h3 class="text-xl font-bold mb-4">Artist Name</h3>
        <input type="text" id="artistNameInput" class="w-full border p-3 rounded-lg" placeholder="Your artist name">
        <button onclick="saveArtistName()" class="w-full mt-3 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">Save Name</button>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-lg">
        <label class="block font-bold mb-2">Bio</label>
        <textarea id="bioInput" class="w-full border p-3 rounded-lg h-40" placeholder="Tell your story..."></textarea>
        <button onclick="saveBio()" class="w-full mt-3 bg-black text-white py-3 rounded-lg font-bold">Save Bio</button>
      </div>

      <div class="bg-emerald-50 p-6 rounded-xl shadow-lg text-center">
        <p class="text-sm text-gray-600">Your Public Page:</p>
        <p id="publicUrl" class="font-bold text-emerald-700 text-lg break-all mt-2">Loading...</p>
        <a id="publicLink" target="_blank" class="block mt-3 text-blue-600 underline">Open in new tab</a>
      </div>
    </div>

    <!-- Right Column -->
    <div class="lg:col-span-3 space-y-10">
      <!-- Upload Video -->
      <div class="bg-white p-8 rounded-xl shadow-xl">
        <h3 class="text-2xl font-bold mb-6">Upload New Video</h3>
        <div class="grid md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block font-bold mb-2">Thumbnail</label>
            <input type="file" id="thumbnailInput" accept="image/*" class="w-full file:bg-green-600 file:text-white file:py-3 file:px-6 file:rounded-full">
          </div>
          <div>
            <label class="block font-bold mb-2">Video (.mp4)</label>
            <input type="file" id="videoInput" accept="video/mp4" class="w-full file:bg-green-600 file:text-white file:py-3 file:px-6 file:rounded-full">
          </div>
        </div>
        <button id="uploadVideo" class="mt-4 bg-green-600 text-white px-10 py-4 rounded-xl font-bold text-lg flex items-center shadow-lg hover:bg-green-700">
          Upload & Publish
          <div id="uploadSpinner" class="spinner hidden"></div>
        </button>
      </div>

      <!-- Published Videos -->
      <div class="bg-white p-8 rounded-xl shadow-xl">
        <h3 class="text-2xl font-bold mb-8">Your Published Videos</h3>
        <div id="videoList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
          <p class="col-span-full text-center text-gray-500 italic text-xl">No videos yet — upload your first one!</p>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Video Modal -->
<div id="videoModal" class="hidden">
  <div id="closeModal" onclick="closeModal()">X</div>
  <video id="modalVideo" controls class="shadow-2xl"></video>
</div>

<footer class="bg-black text-white p-6 text-center mt-auto">
  © 2025 Rhythm Deck Music
</footer>

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );

  let currentUser = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return location.href = 'login.html';
    currentUser = user;

    let { data: profile } = await supabase.from('profiles')
      .select('subdomain, name, bio, banner_url, logo_url')
      .eq('id', user.id).single();

    let subdomain = profile?.subdomain || `user-${Date.now().toString().slice(-6)}`;
    subdomain = subdomain.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').trim('-');

    const publicUrl = `${location.origin}/public-profile.html?id=${subdomain}`;
    document.getElementById('publicUrl').textContent = publicUrl;
    document.getElementById('publicLink').href = publicUrl;

    if (profile?.name) document.getElementById('artistNameInput').value = profile.name;
    if (profile?.bio) document.getElementById('bioInput').value = profile.bio;

    if (profile?.banner_url) {
      const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl + '?t=' + Date.now();
      document.getElementById('bannerPreview').src = url;
      document.getElementById('bannerPreview').classList.remove('hidden');
      document.getElementById('bannerPlaceholder').classList.add('hidden');
    }
    if (profile?.logo_url) {
      document.getElementById('logoPreview').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl + '?t=' + Date.now();
    }

    await loadVideos();

    document.getElementById('bannerInput').addEventListener('change', e => uploadBanner(e));
    document.getElementById('logoInput').addEventListener('change', e => uploadLogo(e));
    document.getElementById('uploadVideo').addEventListener('click', uploadAndPublish);
  });

  async function loadVideos() {
    const { data: videos } = await supabase.from('user_videos')
      .select('*').eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });

    const container = document.getElementById('videoList');
    container.innerHTML = '';

    if (!videos?.length) {
      container.innerHTML = '<p class="col-span-full text-center text-gray-500 italic text-xl">No videos yet — upload your first one!</p>';
      return;
    }

    for (const v of videos) {
      const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl + '?t=' + Date.now();
      const thumbUrl = v.thumbnail_url 
        ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl + '?t=' + Date.now()
        : 'https://via.placeholder.com/600x340/10b981/ffffff?text=Video';

      const [{ count: likes = 0 }, { count: comments = 0 }] = await Promise.all([
        supabase.from('video_likes').select('id', { count: 'exact', head: true }).eq('video_id', v.id),
        supabase.from('video_comments').select('id', { count: 'exact', head: true }).eq('video_id', v.id)
      ]);

      const card = document.createElement('div');
      card.className = 'bg-gray-900 rounded-xl overflow-hidden shadow-xl group relative';
      card.innerHTML = `
        <div class="relative">
          <img src="${thumbUrl}" class="w-full h-64 object-cover" onerror="this.src='https://via.placeholder.com/600x340/10b981/ffffff?text=Video'">
          <div class="video-overlay" onclick="openVideoPopup('${videoUrl}')">
            <svg class="w-20 h-20 text-white" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 0111 8v4a1 1 0 01-1.555.832l-3-2a1 1 0 010-1.664l3-2z"/>
            </svg>
          </div>
        </div>

        <div class="p-5 text-white">
          <h4 class="font-bold text-lg truncate">${v.title || 'Untitled Video'}</h4>
          <div class="flex justify-between items-center mt-4 text-sm opacity-90">
            <div class="flex gap-6">
              <span>Heart ${likes}</span>
              <span>Chat ${comments}</span>
              <span class="cursor-pointer" onclick="event.stopPropagation(); navigator.clipboard.writeText('${publicUrl}'); alert('Link copied!')">
                Share
              </span>
            </div>
          </div>
        </div>

        <!-- DELETE BUTTON BELOW VIDEO -->
        <div class="p-4 border-t border-gray-700 text-center">
          <button onclick="event.stopPropagation(); if(confirm('Delete this video forever?')) deleteVideo('${v.id}', '${v.video_url}', '${v.thumbnail_url}')"
            class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-bold text-sm shadow-lg">
            Delete Video
          </button>
        </div>
      `;
      container.appendChild(card);
    }
  }

  async function deleteVideo(id, videoPath, thumbPath) {
    await Promise.all([
      supabase.from('user_videos').delete().eq('id', id),
      supabase.from('video_likes').delete().eq('video_id', id),
      supabase.from('video_comments').delete().eq('video_id', id),
      videoPath && supabase.storage.from('media').remove([videoPath]),
      thumbPath && supabase.storage.from('media').remove([thumbPath])
    ]);
    alert('Video deleted!');
    loadVideos();
  }

  async function uploadAndPublish() {
    const thumb = document.getElementById('thumbnailInput').files[0];
    const video = document.getElementById('videoInput').files[0];
    if (!thumb || !video) return alert('Please select both files');

    document.getElementById('uploadSpinner').classList.remove('hidden');

    const vName = `${currentUser.id}/videos/${Date.now()}.mp4`;
    const tName = `${currentUser.id}/thumbnails/${Date.now()}.jpg`;

    const [vUp, tUp] = await Promise.all([
      supabase.storage.from('media').upload(vName, video, { upsert: true }),
      supabase.storage.from('media').upload(tName, thumb, { upsert: true })
    ]);

    if (vUp.error || tUp.error) {
      document.getElementById('uploadSpinner').classList.add('hidden');
      return alert('Upload failed: ' + (vUp.error?.message || tUp.error?.message));
    }

    await supabase.from('user_videos').insert({
      user_id: currentUser.id,
      video_url: vName,
      thumbnail_url: tName,
      title: video.name.replace(/\.mp4$/i, '')
    });

    document.getElementById('uploadSpinner').classList.add('hidden');
    document.getElementById('thumbnailInput').value = '';
    document.getElementById('videoInput').value = '';
    alert('Video published!');
    loadVideos();
  }

  // Other functions (uploadBanner, uploadLogo, saveName, saveBio, modal, logout) remain same as before
  async function uploadBanner(e) { /* same as before */ const f=e.target.files[0]; if(!f)return; const n=`${currentUser.id}/banner.${f.name.split('.').pop()}`; await supabase.storage.from('media').upload(n,f,{upsert:true}); const u=supabase.storage.from('media').getPublicUrl(n).data.publicUrl+'?t='+Date.now(); document.getElementById('bannerPreview').src=u; document.getElementById('bannerPreview').classList.remove('hidden'); document.getElementById('bannerPlaceholder').classList.add('hidden'); await supabase.from('profiles').update({banner_url:n}).eq('id',currentUser.id); }
  async function uploadLogo(e) { /* same */ const f=e.target.files[0]; if(!f)return; const n=`${currentUser.id}/logo.${f.name.split('.').pop()}`; await supabase.storage.from('media').upload(n,f,{upsert:true}); document.getElementById('logoPreview').src=supabase.storage.from('media').getPublicUrl(n).data.publicUrl+'?t='+Date.now(); await supabase.from('profiles').update({logo_url:n}).eq('id',currentUser.id); }
  async function saveArtistName() { const n=document.getElementById('artistNameInput').value.trim(); if(!n)return alert('Enter name'); await supabase.from('profiles').update({name:n}).eq('id',currentUser.id); alert('Saved!'); }
  async function saveBio() { await supabase.from('profiles').update({bio:document.getElementById('bioInput').value}).eq('id',currentUser.id); alert('Bio saved!'); }
  function openVideoPopup(u) { document.getElementById('modalVideo').src = u; document.getElementById('videoModal').classList.remove('hidden'); }
  function closeModal() { document.getElementById('videoModal').classList.add('hidden'); document.getElementById('modalVideo').src = ''; }
  async function logout() { await supabase.auth.signOut(); location.href='index.html'; }
</script>
</body>
</html>
