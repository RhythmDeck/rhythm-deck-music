<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Dashboard | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin-left:8px;display:inline-block}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-card:hover .video-overlay{opacity:1}
    #videoModal{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    #videoModal.show{opacity:1;visibility:visible}
    #modalVideo{max-width:90%;max-height:90%;border:8px solid #10b981;border-radius:16px;box-shadow:0 0 60px rgba(16,185,129,0.6)}
    #closeModal{position:absolute;top:20px;right:20px;background:white;color:black;width:60px;height:60px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;font-weight:bold}
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

<header class="bg-black text-white p-5 flex justify-between items-center shadow-xl">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" alt="Logo" class="w-12 h-12 rounded-full">
    <div>
      <h1 class="text-3xl font-black">RHYTHM DECK</h1>
      <p class="text-sm opacity-80">Artist Dashboard</p>
    </div>
  </div>
  <button onclick="logout()" class="bg-white text-black px-6 py-3 rounded-full font-bold hover:bg-gray-200 transition">
    Logout
  </button>
</header>

<main class="flex-1 max-w-7xl mx-auto p-6 space-y-12">

  <!-- Banner & Logo -->
  <div class="relative h-80 bg-gradient-to-br from-purple-900 to-indigo-900 rounded-3xl overflow-hidden shadow-2xl">
    <img id="bannerPreview" src="" alt="Banner" class="absolute inset-0 w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="absolute inset-0 flex items-center justify-center text-white text-5xl font-black bg-black/50">
      Upload Your Banner
    </div>
    <div class="absolute bottom-6 left-6 w-40 h-40 rounded-full border-8 border-white shadow-2xl overflow-hidden bg-white">
      <img id="logoPreview" src="logo-placeholder.png" alt="Logo" class="w-full h-full object-cover">
    </div>
    <input type="file" id="bannerInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('bannerInput').click()" class="absolute bottom-6 right-6 bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-emerald-700">
      Change Banner
    </button>
    <input type="file" id="logoInput" accept="image/*" class="hidden">
    <button onclick="document.getElementById('logoInput').click()" class="absolute bottom-6 left-52 bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg text-sm">
      Change Logo
    </button>
  </div>

  <!-- Live Stream Section -->
  <div class="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-3xl shadow-2xl p-8 border-8 border-emerald-600">
    <h2 class="text-4xl font-black text-emerald-900 mb-8 text-center">Go Live</h2>
    <div class="grid md:grid-cols-3 gap-8">
      <div class="md:col-span-2">
        <div id="livePreview" class="bg-gray-900 rounded-3xl h-96 flex items-center justify-center text-white text-2xl font-bold">
          Camera Off — Click "Start Stream" to go live
        </div>
      </div>
      <div class="bg-white rounded-3xl shadow-2xl p-6 flex flex-col h-96">
        <h3 class="text-2xl font-black text-emerald-700 mb-4">Live Chat</h3>
        <div id="liveMessages" class="flex-1 overflow-y-auto bg-gray-50 rounded-xl p-4 text-sm space-y-2">
          <p class="text-gray-500 italic text-center">Waiting for stream...</p>
        </div>
        <div class="mt-4 flex gap-2">
          <input type="text" id="chatInput" placeholder="Say hi..." class="flex-1 px-4 py-3 rounded-xl border border-emerald-300">
          <button id="sendMessage" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl">Send</button>
        </div>
      </div>
    </div>
    <div class="text-center mt-8 space-x-6">
      <button id="startStream" class="bg-red-600 hover:bg-red-700 text-white px-10 py-5 rounded-xl font-black text-xl shadow-lg">
        Start Livestream
      </button>
      <button id="stopStream" class="bg-gray-600 hover:bg-gray-700 text-white px-10 py-5 rounded-xl font-black text-xl shadow-lg hidden">
        Stop Stream
      </button>
    </div>
  </div>

  <!-- Upload Video -->
  <div class="bg-white rounded-3xl shadow-2xl p-10">
    <h2 class="text-4xl font-black text-emerald-900 mb-8">Upload New Video</h2>
    <div class="grid md:grid-cols-2 gap-8 mb-8">
      <div>
        <label class="block text-xl font-bold mb-3">Thumbnail</label>
        <input type="file" id="thumbnailInput" accept="image/*" class="w-full file:bg-emerald-600 file:text-white file:py-4 file:px-8 file:rounded-full file:border-0">
      </div>
      <div>
        <label class="block text-xl font-bold mb-3">Video (.mp4)</label>
        <input type="file" id="videoInput" accept="video/mp4" class="w-full file:bg-emerald-600 file:text-white file:py-4 file:px-8 file:rounded-full file:border-0">
      </div>
    </div>
    <button id="uploadBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-12 py-5 rounded-xl font-black text-2xl flex items-center gap-3 shadow-2xl">
      Upload & Publish
      <span id="uploadSpinner" class="spinner hidden"></span>
    </button>
  </div>

  <!-- Your Videos -->
  <div class="bg-white rounded-3xl shadow-2xl p-10">
    <h2 class="text-4xl font-black text-emerald-900 mb-10">Your Published Videos</h2>
    <div id="videoList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-10">
      <p class="col-span-full text-center text-3xl text-gray-500 py-20">No videos yet — upload your first!</p>
    </div>
  </div>

  <!-- Danger Zone -->
  <div class="bg-red-50 border-4 border-red-600 rounded-3xl p-10 text-center">
    <h3 class="text-3xl font-black text-red-800 mb-6">Danger Zone</h3>
    <input type="text" id="deleteConfirm" placeholder="Type: DELETE MY ACCOUNT" class="w-full max-w-md px-6 py-4 rounded-xl border-2 border-red-600 text-red-700 text-xl mb-6">
    <button id="deleteAccountBtn" disabled class="bg-red-700 hover:bg-red-800 disabled:bg-gray-400 text-white px-12 py-5 rounded-xl font-black text-xl">
      Delete Account Forever
    </button>
  </div>
</main>

<!-- Video Modal -->
<div id="videoModal">
  <div id="closeModal" onclick="closeModal()">X</div>
  <video id="modalVideo" controls></video>
</div>

<footer class="bg-black text-white text-center py-8 mt-12">
  © 2025 Rhythm Deck • All Rights Reserved
</footer>

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );

  let currentUser = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return location.href = 'login.html';
    currentUser = user;

    // Load profile
    const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
    if (profile?.banner_url) {
      const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl + '?t=' + Date.now();
      document.getElementById('bannerPreview').src = url;
      document.getElementById('bannerPreview').classList.remove('hidden');
      document.getElementById('bannerPlaceholder').classList.add('hidden');
    }
    if (profile?.logo_url) {
      document.getElementById('logoPreview').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl + '?t=' + Date.now();
    }

    await loadVideos();

    // Event Listeners
    document.getElementById('uploadBtn').addEventListener('click', uploadVideo);
    document.getElementById('bannerInput').addEventListener('change', e => uploadFile(e, 'banner'));
    document.getElementById('logoInput').addEventListener('change', e => uploadFile(e, 'logo'));
    document.getElementById('deleteConfirm').addEventListener('input', function() {
      document.getElementById('deleteAccountBtn').disabled = this.value !== 'DELETE MY ACCOUNT';
    });
    document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
      if (confirm('This deletes EVERYTHING forever. Are you 100% sure?')) {
        await supabase.from('profiles').delete().eq('id', currentUser.id);
        await supabase.auth.signOut();
        location.href = '/';
      }
    });
  });

  async function uploadFile(e, type) {
    const file = e.target.files[0];
    if (!file) return;
    const path = `${currentUser.id}/${type}/${Date.now()}.${file.name.split('.').pop()}`;
    await supabase.storage.from('media').upload(path, file, { upsert: true });
    await supabase.from('profiles').update({ [type + '_url']: path }).eq('id', currentUser.id);
    location.reload();
  }

  async function uploadVideo() {
    const thumb = document.getElementById('thumbnailInput').files[0];
    const video = document.getElementById('videoInput').files[0];
    if (!thumb || !video) return alert('Please select both thumbnail and video');

    document.getElementById('uploadSpinner').classList.remove('hidden');
    document.getElementById('uploadBtn').disabled = true;

    const videoPath = `${currentUser.id}/videos/${Date.now()}.mp4`;
    const thumbPath = `${currentUser.id}/thumbnails/${Date.now()}.jpg`;

    const [vRes, tRes] = await Promise.all([
      supabase.storage.from('media').upload(videoPath, video, { upsert: true }),
      supabase.storage.from('media').upload(thumbPath, thumb, { upsert: true })
    ]);

    if (vRes.error || tRes.error) {
      alert('Upload failed');
      document.getElementById('uploadSpinner').classList.add('hidden');
      document.getElementById('uploadBtn').disabled = false;
      return;
    }

    await supabase.from('user_videos').insert({
      user_id: currentUser.id,
      video_url: videoPath,
      thumbnail_url: thumbPath,
      title: video.name.replace('.mp4', '').substring(0, 80)
    });

    document.getElementById('uploadSpinner').classList.add('hidden');
    document.getElementById('uploadBtn').disabled = false;
    document.getElementById('thumbnailInput').value = '';
    document.getElementById('videoInput').value = '';
    alert('Video uploaded and published!');
    loadVideos();
  }

  async function loadVideos() {
    const { data: videos } = await supabase
      .from('user_videos')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });

    const container = document.getElementById('videoList');
    container.innerHTML = '';

    if (!videos || videos.length === 0) {
      container.innerHTML = '<p class="col-span-full text-center text-3xl text-gray-500 py-20">No videos yet — upload your first!</p>';
      return;
    }

    for (const v of videos) {
      const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
      const thumbUrl = v.thumbnail_url ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'https://via.placeholder.com/600x340.png?text=No+Thumbnail';

      const [{ count: likes = 0 }, { count: comments = 0 }] = await Promise.all([
        supabase.from('video_likes').select('id', { count: 'exact', head: true }).eq('video_id', v.id),
        supabase.from('video_comments').select('id', { count: 'exact', head: true }).eq('video_id', v.id)
      ]);

      const card = document.createElement('div');
      card.className = 'bg-gray-900 rounded-3xl overflow-hidden shadow-2xl group relative';
      card.innerHTML = `
        <img src="${thumbUrl}" class="w-full h-64 object-cover" onerror="this.src='https://via.placeholder.com/600x340.png?text=No+Thumbnail'">
        <div class="video-overlay" onclick="openModal('${videoUrl}')">
          <svg class="w-20 h-20 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7L8 5z"/>
          </svg>
        </div>
        <div class="p-6 text-white">
          <h3 class="font-black text-xl truncate mb-3">${v.title || 'Untitled'}</h3>
          <div class="flex justify-between text-sm opacity-90">
            <span>Heart ${likes}</span>
            <span>Chat ${comments}</span>
            <span class="cursor-pointer hover:text-emerald-400" onclick="event.stopPropagation(); navigator.clipboard.writeText(location.origin + '/public-profile.html?id=' + '${currentUser.id}'); alert('Link copied!')">
              Share
            </span>
          </div>
        </div>
        <!-- DELETE BUTTON BELOW VIDEO -->
        <div class="p-4 bg-red-600 hover:bg-red-700 transition">
          <button onclick="event.stopPropagation(); if(confirm('Delete this video forever?')) deleteVideo('${v.id}', '${v.video_url}', '${v.thumbnail_url || ''}')" 
            class="w-full text-white font-black py-3 rounded-xl text-lg">
            Delete Video
          </button>
        </div>
      `;
      container.appendChild(card);
    }
  }

  async function deleteVideo(id, videoPath, thumbPath) {
    await Promise.all([
      supabase.from('user_videos').delete().eq('id', id),
      supabase.from('video_likes').delete().eq('video_id', id),
      supabase.from('video_comments').delete().eq('video_id', id),
      videoPath && supabase.storage.from('media').remove([videoPath]),
      thumbPath && supabase.storage.from('media').remove([thumbPath])
    ]);
    alert('Video deleted forever.');
    loadVideos();
  }

  function openModal(url) {
    document.getElementById('modalVideo').src = url;
    document.getElementById('videoModal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('videoModal').classList.remove('show');
    document.getElementById('modalVideo').src = '';
  }

  async function logout() {
    await supabase.auth.signOut();
    location.href = '/';
  }

  // Live stream placeholders
  document.getElementById('startStream').onclick = () => alert('Live streaming coming soon!');
</script>
</body>
</html>
