<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rhythm Deck | Early Artist Signup</title>

<link rel="icon" href="logo-favicon.png" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Inter;
background:#0b0b11;
color:white;
}

header{
display:flex;
align-items:center;
padding:20px 40px;
background:#0e0e14;
border-bottom:3px solid #00a86b;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo img{
width:42px;
height:42px;
}

.brand{
font-weight:800;
font-size:22px;
}

.tagline{
font-size:13px;
opacity:.7;
}

.hero{
text-align:center;
padding:70px 20px;
}

.hero h1{
font-size:44px;
margin-bottom:10px;
}

.hero p{
opacity:.8;
}

.counter{
margin-top:20px;
font-size:20px;
}

.founding{
margin-top:10px;
color:#ffd166;
}

.section{
max-width:460px;
margin:auto;
background:#14141c;
padding:35px;
border-radius:12px;
border:3px solid #00a86b;
margin-top:40px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:8px;
margin-bottom:15px;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
background:linear-gradient(90deg,#00a86b,#00e0a0);
color:white;
font-weight:700;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.error{
color:#ff6b6b;
margin-top:10px;
}

.note{
font-size:13px;
opacity:.7;
margin-top:15px;
}

.ticker{
margin-top:70px;
text-align:center;
opacity:.7;
}

footer{
margin-top:120px;
padding:30px;
text-align:center;
background:#0e0e14;
border-top:3px solid #00a86b;
font-size:13px;
opacity:.6;
}

</style>

</head>

<body>

<header>

<div class="logo">

<img src="logo-1-sm.jpg">

<div>
<div class="brand">Rhythm Deck</div>
<div class="tagline">Unleash Your Beat</div>
</div>

</div>

</header>

<section class="hero">

<h1>Claim Your Artist Profile</h1>

<p>Join the next generation music platform for independent artists.</p>

<div class="counter" id="artistCount">Loading artist count...</div>

<div class="founding" id="foundingCount"></div>

</section>

<div class="section">

<input id="artistName" placeholder="Artist or Band Name">

<input id="email" placeholder="Email Address">

<button onclick="signup()">Join Rhythm Deck</button>

<div class="error" id="error"></div>

<div class="note">

After signing up you will receive:<br><br>

• A confirmation email<br>
• Instructions for your Platinum Pro admin page

</div>

</div>

<div class="ticker" id="ticker"></div>

<footer>

Rhythm Deck © 2026

</footer>

<script>

const SUPABASE_URL = "https://bxoqhmfnseskwqkywppg.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

async function loadCounts(){

try{

const { count } = await supabaseClient
.from("profiles")
.select("*",{ count:"exact", head:true })

const total = count || 0

document.getElementById("artistCount").innerText =
"🎧 " + total.toLocaleString() + " artists already joined Rhythm Deck"

const remaining = 10000 - total

document.getElementById("foundingCount").innerText =
remaining.toLocaleString() + " founding artist spots remaining"

}catch(err){

document.getElementById("artistCount").innerText =
"Artist count unavailable"

}

}

loadCounts()


async function signup(){

document.getElementById("error").innerText=""

const artist = document.getElementById("artistName").value.trim()
const email = document.getElementById("email").value.trim()

if(!artist || !email){

document.getElementById("error").innerText =
"Please fill both fields"

return

}

const referral =
new URLSearchParams(window.location.search).get("ref")

const password =
Math.random().toString(36).slice(-10)

const { data, error } =
await supabaseClient.auth.signUp({
email:email,
password:password
})

if(error){

document.getElementById("error").innerText =
error.message

return

}

const user = data.user

await supabaseClient.from("profiles").insert({

id:user.id,
name:artist,
email:email,
plan:"free",
paid:false,
referral_code:user.id.slice(0,6),
referred_by:referral

})

await fetch("https://formsubmit.co/ajax/rhythmdeckmusic@gmail.com",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

subject:"New Rhythm Deck Artist",

artist:artist,
email:email

})
})

setTimeout(()=>{

window.location.href="platinum-pro-admin.html"

},1500)

}

async function ticker(){

try{

const { data } = await supabaseClient
.from("profiles")
.select("name")
.order("created_at",{ascending:false})
.limit(5)

if(!data) return

const text =
data.map(a=>"🎤 "+a.name+" joined").join(" • ")

document.getElementById("ticker").innerText=text

}catch(e){}

}

ticker()

setInterval(ticker,8000)

</script>

</body>
</html>
