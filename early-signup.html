<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Early Sign-Up | Rhythm Deck Music</title>

<link rel="icon" href="logo-favicon.png" type="image/png">

<script src="https://cdn.tailwindcss.com"></script>

<style>

.menu-btn{
padding:.6rem 1.25rem;
border-radius:9999px;
font-weight:600;
transition:.3s;
box-shadow:0 2px 8px rgba(0,0,0,.25);
font-size:1rem
}

.menu-btn:hover{
transform:translateY(-2px);
box-shadow:0 6px 16px rgba(0,0,0,.35)
}

.home-btn{background:linear-gradient(to right,#22c55e,#16a34a);color:#fff}
.about-btn{background:linear-gradient(to right,#3b82f6,#2563eb);color:#fff}
.benefits-btn{background:linear-gradient(to right,#f59e0b,#d97706);color:#fff}
.pricing-btn{background:linear-gradient(to right,#ec4899,#db2777);color:#fff}
.contact-btn{background:linear-gradient(to right,#8b5cf6,#7c3aed);color:#fff}

.features-badge{
background:linear-gradient(135deg,#a855f7,#d946ef);
color:#fff;
font-weight:bold;
padding:.5rem 1.1rem;
border-radius:9999px;
box-shadow:0 4px 12px rgba(168,85,247,.5);
cursor:pointer
}

.dropdown-menu{
position:absolute;
top:100%;
right:0;
margin-top:.5rem;
width:280px;
background:#fff;
border-radius:1rem;
box-shadow:0 10px 30px rgba(0,0,0,.25);
border:1px solid #e5e7eb;
overflow:hidden;
z-index:50;
display:none
}

.dropdown-item{
padding:.85rem 1.5rem;
cursor:pointer
}

.dropdown-item:hover{
background:#f3e8ff;
color:#7c3aed
}

.required::after{content:" *";color:red}

.progressBar{
width:100%;
background:#e5e7eb;
border-radius:9999px;
overflow:hidden;
height:16px;
margin-top:10px
}

.progressFill{
height:100%;
background:linear-gradient(90deg,#22c55e,#16a34a);
width:0%;
transition:width .6s ease
}

</style>

</head>

<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen font-sans">

<header class="bg-black text-white p-4 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-lg">

<div class="flex items-center space-x-3">

<img src="logo-1-sm.jpg" class="w-12 h-12 rounded-full">

<div>
<h1 class="text-2xl font-bold tracking-wide">RHYTHM DECK</h1>
<p class="text-sm text-gray-300">Unleash Your Beat</p>
</div>

</div>

<nav class="flex flex-wrap justify-end items-center gap-3">

<a href="index.html" class="menu-btn home-btn">Home</a>
<a href="about.html" class="menu-btn about-btn">About</a>
<a href="benefits.html" class="menu-btn benefits-btn">Benefits</a>
<a href="pricing.html" class="menu-btn pricing-btn">Pricing</a>
<a href="contact.html" class="menu-btn contact-btn">Contact</a>

<a href="login.html" class="bg-white text-black px-5 py-2 rounded-lg hover:bg-gray-200 text-base font-medium">Login</a>

<a href="signup.html" class="bg-green-500 text-white px-5 py-2 rounded-lg hover:bg-green-400 text-base font-medium">Sign Up</a>

</nav>

</header>

<main class="flex-grow flex items-center justify-center py-16 px-4">

<div class="container mx-auto">

<div class="bg-white shadow-2xl rounded-xl max-w-5xl w-full flex overflow-hidden mx-auto">

<div class="w-1/2 hidden md:block">
<img src="early-signup.jpg" class="w-full h-full object-cover">
</div>

<div class="w-full md:w-1/2 p-10">

<h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">
Pre-Launch Early Sign-Up
</h2>

<div class="text-center mb-6">

<p id="artistCount" class="text-xl font-bold text-green-700"></p>

<div class="progressBar">
<div id="progressFill" class="progressFill"></div>
</div>

<p id="progressText" class="text-sm mt-2 text-gray-600"></p>

</div>

<form id="signupForm" class="space-y-4">

<div>
<label class="block text-gray-700 font-semibold mb-1 required">Name / Band Name</label>
<input type="text" id="artistName" required class="w-full border border-gray-300 rounded-lg p-3">
</div>

<div>
<label class="block text-gray-700 font-semibold mb-1 required">Email Address</label>
<input type="email" id="email" required class="w-full border border-gray-300 rounded-lg p-3">
</div>

<div>
<label class="block text-gray-700 font-semibold mb-1 required">Password</label>

<div class="relative">

<input type="password" id="password" required minlength="6"
class="w-full border border-gray-300 rounded-lg p-3 pr-12">

<button type="button" id="togglePassword"
class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 text-lg">👁</button>

</div>
</div>

<div>
<label class="block text-gray-700 font-semibold mb-1 required">Choose Your Subdomain</label>

<div class="flex">
<input type="text" id="subdomain" required minlength="3"
class="flex-grow border border-gray-300 rounded-l-lg p-3">

<span class="bg-gray-200 px-3 py-3 rounded-r-lg text-sm flex items-center border border-l-0 border-gray-300">
.rhythmdeckmusic.com
</span>
</div>

<div id="subdomainStatus" class="mt-2 text-sm h-5"></div>

</div>

<div class="flex items-center space-x-2">
<input type="checkbox" id="terms" required>
<label class="text-gray-700 text-sm">
I agree to the
<a href="terms.html" class="text-green-500">Terms</a>
and
<a href="privacy.html" class="text-green-500">Privacy Policy</a>
</label>
</div>

<button id="submitButton"
class="w-full bg-green-500 text-white font-bold py-4 rounded-lg hover:bg-green-600 text-lg">
Sign Up Now & Get Platinum Pro FREE for Life!
</button>

</form>

</div>
</div>
</div>
</div>

</main>

<footer class="bg-black text-white mt-10 p-5 text-center text-sm">
<p>© 2025 Rhythm Deck Music</p>
</footer>

function loadArtistCount(){

const total=1000
const joined=646
const remaining=total-joined
const percent=(joined/total)*100

</body>
</html>
