<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Manual Password Reset | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-lg mx-auto">

    <!-- PASSWORD GATE -->
    <div id="loginScreen">
      <div class="bg-white p-10 rounded-3xl shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-8">Admin Access</h1>
        <input 
          id="adminPassword" 
          type="password" 
          placeholder="Enter admin password"
          class="w-full p-4 border border-gray-300 rounded-2xl text-lg mb-4"
        >
        <button onclick="checkPassword()" 
                class="w-full bg-black text-white py-4 rounded-2xl font-bold hover:bg-gray-800">
          Login
        </button>
        <p id="loginError" class="text-red-500 text-center mt-4 hidden"></p>
      </div>
    </div>

    <!-- RESET FORM (Hidden until correct password) -->
    <div id="resetScreen" class="hidden">
      <div class="bg-white p-8 rounded-3xl shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-2 text-red-600">Manual Password Reset</h1>
        <p class="text-center text-gray-500 mb-8">Only use for users who cannot reset via email</p>
        
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-medium mb-2">User Email</label>
            <input id="userEmail" type="email" placeholder="user@example.com" 
                   class="w-full p-4 border border-gray-300 rounded-2xl text-lg">
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-2">New Password</label>
            <input id="newPassword" type="password" placeholder="Minimum 6 characters" 
                   class="w-full p-4 border border-gray-300 rounded-2xl text-lg">
          </div>

          <button onclick="performReset()" 
                  class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-5 rounded-2xl text-lg">
            Reset Password Now
          </button>
        </div>

        <p id="result" class="mt-6 text-center font-medium min-h-[50px]"></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2MDkyOTgzOCwiZXhwIjoyMDc2NTA1ODM4fQ.BcePDirpc0ky2lY8urdVyjIFb7-ewf6KcdYE5eh3fWs'  
      // ← REPLACE WITH YOUR ACTUAL SERVICE ROLE KEY
    );

    const ADMIN_PASSWORD = "RicciTopo1234$";   // ← CHANGE THIS TO SOMETHING STRONG

    function checkPassword() {
      const input = document.getElementById('adminPassword').value;
      const error = document.getElementById('loginError');
      
      if (input === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('resetScreen').classList.remove('hidden');
      } else {
        error.textContent = "Incorrect password";
        error.classList.remove('hidden');
      }
    }

    async function performReset() {
      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('newPassword').value;
      const resultEl = document.getElementById('result');

      if (!email || password.length < 6) {
        resultEl.innerHTML = '<span class="text-red-600">Please enter a valid email and password (6+ characters)</span>';
        return;
      }

      resultEl.innerHTML = 'Resetting password...';

      const { error } = await supabase.auth.admin.updateUserByEmail(email, { password });

      if (error) {
        resultEl.innerHTML = `<span class="text-red-600">${error.message}</span>`;
      } else {
        resultEl.innerHTML = `<span class="text-green-600">✅ Password successfully reset for ${email}</span>`;
      }
    }

    // Allow pressing Enter on password field
    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
