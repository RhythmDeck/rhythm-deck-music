<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Rhythm Deck Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(16,185,129,0.4); }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

<div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-1/2 bg-green-600 text-white px-10 py-6 rounded-2xl shadow-2xl text-center hidden">
    <div class="text-2xl font-black" id="toastTitle"></div>
    <div class="mt-2" id="toastMsg"></div>
</div>

<header class="bg-black p-6 flex justify-between items-center">
    <div class="flex items-center gap-4">
        <img src="logo-1-sm.jpg" alt="Logo" class="w-12 h-12 rounded-full">
        <div>
            <h1 class="text-3xl font-bold">RHYTHM DECK</h1>
            <p class="text-sm text-gray-400">Unleash Your Beat</p>
        </div>
    </div>
    <nav class="space-x-6">
        <a href="login.html" class="hover:text-green-400">Login</a>
        <a href="signup.html" class="bg-green-500 px-6 py-3 rounded-full font-bold">Sign Up</a>
    </nav>
</header>

<main class="flex-grow flex items-center justify-center p-6">
    <div class="bg-gray-800 rounded-3xl shadow-2xl p-10 max-w-lg w-full">
        <h2 class="text-4xl font-black text-center mb-10">Create Your Artist Page</h2>

        <form id="signupForm" class="space-y-6">
            <input type="text" id="name" placeholder="Artist Name" required class="w-full p-4 bg-gray-700 rounded-xl input-focus">

            <input type="email" id="email" placeholder="Email" required class="w-full p-4 bg-gray-700 rounded-xl input-focus">

            <div class="relative">
                <input type="password" id="password" placeholder="Password (6+ chars)" minlength="6" required class="w-full p-4 bg-gray-700 rounded-xl pr-14 input-focus">
                <span id="togglePass" class="absolute right-right-4 top-5 cursor-pointer text-gray-400">Show</span>
            </div>

            <div>
                <label class="text-sm text-gray-400">Your permanent link:</label>
                <div class="flex mt-2">
                    <input type="text" id="subdomain" placeholder="yourname" required minlength="3" class="flex-1 p-4 bg-gray-700 rounded-l-xl input-focus">
                    <div class="bg-gray-600 px-5 py-4 rounded-r-xl">.rhythmdeckmusic.com</div>
                </div>
                <div id="subStatus" class="h-6 text-sm mt-2"></div>
            </div>

            <select id="planType" required class="w-full p-4 bg-gray-700 rounded-xl">
                <option value="" disabled selected>Select Plan</option>
                <option value="free">Free Plan – Instant Access</option>
                <option value="pro">Pro Plan – More Features</option>
            </select>

            <button type="submit" id="submitBtn" class="w-full bg-green-500 hover:bg-green-400 font-black text-xl py-5 rounded-xl transition">
                CREATE MY PAGE
            </button>
        </form>
    </div>
</main>

<script>
    const supabase = window.supabase.createClient(
        'https://bxoqhmfnseskwqkywppg.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    // Disable email confirmation in Supabase → Authentication → Settings → "Confirm email" = OFF
    // (Do this once in your dashboard)

    function toast(title, msg) {
        document.getElementById('toastTitle').textContent = title;
        document.getElementById('toastMsg').textContent = msg;
        const t = document.getElementById('toast');
        t.classList.remove('hidden');
        setTimeout(() => t.classList.add('hidden'), 4000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        let subdomainOk = false;

        // Password toggle
        document.getElementById('togglePass').onclick = () => {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        };

        // Subdomain checker
        document.getElementById('subdomain').addEventListener('input', () => {
            clearTimeout(window.sdTimer);
            const val = document.getElementById('subdomain').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            const status = document.getElementById('subStatus');
            if (val.length < 3) { status.textContent = 'Too short'; status.className = 'text-red-500'; return; }
            status.textContent = 'Checking...'; status.className = 'text-yellow-500';
            window.sdTimer = setTimeout(async () => {
                const { data } = await supabase.from('profiles').select('id').eq('subdomain', val).maybeSingle();
                if (data) {
                    status.textContent = 'Already taken'; status.className = 'text-red-500';
                    subdomainOk = false;
                } else {
                    status.textContent = 'Available!'; status.className = 'text-green-500';
                    subdomainOk = true;
                }
            }, 600);
        });

        // FORM SUBMIT
        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!subdomainOk) return toast('Error', 'Pick an available subdomain');

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const subdomain = document.getElementById('subdomain').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            const plan = document.getElementById('planType').value;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Creating your page...';

            try {
                // 1. Sign up (email confirmation OFF → instant session)
                const { data: { user }, error } = await supabase.auth.signUp({
                    email, password,
                    options: { data: { full_name: name, subdomain } }
                });

                if (error) throw error;

                // 2. Save profile
                await supabase.from('profiles').upsert({
                    id: user.id,
                    name, email, subdomain, plan,
                    bio: '', created_at: new Date().toISOString()
                });

                // 3. INSTANT REDIRECT TO THEIR OWN ADMIN PAGE
                toast('Success!', 'Welcome to Rhythm Deck');
                setTimeout(() => {
                    window.location.href = `https://${subdomain}.rhythmdeckmusic.com/profile-admin.html`;
                }, 1500);

            } catch (err) {
                console.error(err);
                toast('Error', err.message || 'Try again');
                btn.disabled = false;
                btn.textContent = 'CREATE MY PAGE';
            }
        };
    });
</script>
</body>
</html>
