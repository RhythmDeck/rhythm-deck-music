<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .cart-item { border-bottom: 1px solid #e5e7eb; padding: 1rem 0; }
    .menu-btn {
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 0.95rem;
    }
    .menu-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    .home-btn { background: linear-gradient(to right, #22c55e, #16a34a); color: white; }
    .about-btn { background: linear-gradient(to right, #3b82f6, #2563eb); color: white; }
    .benefits-btn { background: linear-gradient(to right, #f59e0b, #d97706); color: white; }
    .pricing-btn { background: linear-gradient(to right, #ec4899, #db2777); color: white; }
    .contact-btn { background: linear-gradient(to right, #8b5cf6, #7c3aed); color: white; }
    .merch-btn { background: linear-gradient(to right, #f97316, #ea580c); color: white; }
    .featured-btn { background: linear-gradient(to right, #8b5cf6, #6366f1); color: white; }
    .category-btn {
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .apparel-btn { background: linear-gradient(to right, #f97316, #ea580c); color: white; }
    .accessories-btn { background: linear-gradient(to right, #8b5cf6, #6366f1); color: white; }
    .product-card img {
      transition: transform 0.4s ease;
    }
    .product-card:hover img {
      transform: scale(1.05);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">
  <!-- HEADER -->
  <header class="bg-black text-white p-4 flex flex-col sm:flex-row justify-between items-center shadow-lg gap-4">
    <div class="flex items-center space-x-3">
      <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="w-10 h-10 rounded-full">
      <div>
        <h1 class="text-2xl font-bold tracking-wide">RHYTHM DECK</h1>
        <p class="text-sm text-gray-300">Merch Store</p>
      </div>
    </div>
    <nav class="flex flex-col items-end gap-4 sm:gap-3">
      <div class="flex flex-wrap justify-end items-center gap-2 sm:gap-3">
        <a href="index.html" class="menu-btn home-btn">Home</a>
        <a href="featured-artists.html" class="menu-btn featured-btn">Featured Artists</a>
        <a href="about.html" class="menu-btn about-btn">About</a>
        <a href="benefits.html" class="menu-btn benefits-btn">Benefits</a>
        <a href="contact.html" class="menu-btn contact-btn">Contact</a>
        <a href="store.html" class="menu-btn merch-btn">Rhythm Deck Merch</a>
        <a href="login.html" class="bg-white text-black px-5 py-2 rounded-lg hover:bg-gray-200 text-base font-medium">Login</a>
        <a href="early-signup.html" class="bg-green-500 text-white px-5 py-2 rounded-lg hover:bg-green-400 text-base font-medium">Sign Up</a>
      </div>
    </nav>
    <div class="flex items-center gap-6">
      <button id="cartBtn" class="relative text-white hover:text-yellow-400 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <span id="cartCount" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <!-- SUCCESS MESSAGE -->
  <div id="successMessage" class="hidden bg-green-600 text-white text-center py-6 font-bold text-2xl shadow-lg">
    Success! Thank you for your order!
  </div>

  <!-- BANNER -->
  <section class="relative bg-black overflow-hidden" style="aspect-ratio: 16 / 9; max-height: 700px;">
    <div id="userBannerSection" class="w-full h-full bg-no-repeat bg-center" style="background-image: url('merch-banner.jpg'); background-size: contain;"></div>
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none bg-black/30">
      <h1 class="text-white text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-black text-center drop-shadow-[0_6px_12px_rgba(0,0,0,0.9)] px-4">MERCH STORE</h1>
    </div>
    <div class="absolute bottom-8 left-6 sm:left-8 z-10">
      <img id="currentLogoPreview" src="logo-1-sm.jpg" alt="Store Logo" class="w-28 h-28 sm:w-36 sm:h-36 md:w-44 md:h-44 rounded-full object-cover border-8 border-white shadow-2xl">
    </div>
  </section>

  <!-- CATEGORY BUTTONS -->
  <div class="max-w-7xl mx-auto px-6 py-8 flex flex-wrap gap-4 justify-center">
    <a href="#apparel-section" class="category-btn apparel-btn text-lg">👕 Apparel</a>
    <a href="#accessories-section" class="category-btn accessories-btn text-lg">🕶️ Accessories</a>
  </div>

  <!-- MAIN CONTENT -->
  <main class="flex-grow max-w-7xl mx-auto px-6 pb-12">
    <section id="apparel-section" class="mb-16">
      <h2 class="text-4xl font-black text-orange-800 mb-8">Apparel</h2>
      <div id="apparelGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </section>

    <section id="accessories-section">
      <h2 class="text-4xl font-black text-orange-800 mb-8">Accessories</h2>
      <div id="accessoriesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="bg-black text-white mt-auto p-6 text-center">
    <p class="text-sm">© 2026 Rhythm Deck Music. All rights reserved.</p>
  </footer>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-8 relative">
      <button id="closeCart" class="absolute top-4 right-6 text-gray-500 hover:text-black text-3xl">×</button>
      <h2 class="text-3xl font-black text-orange-800 mb-6">Your Cart</h2>
      <div id="cartItems" class="space-y-4 mb-8"></div>
      <div class="flex justify-between items-center mb-6">
        <span class="text-xl font-bold">Total:</span>
        <span id="cartTotal" class="text-2xl font-black text-orange-600">$0.00</span>
      </div>
      <button id="checkoutBtn" class="w-full bg-gradient-to-r from-yellow-500 to-orange-600 hover:from-yellow-600 hover:to-orange-700 text-white font-black py-4 rounded-lg text-xl transition disabled:opacity-50">
        Checkout with Stripe
      </button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );
    const stripe = Stripe('pk_test_51SKhZj2WyyY6hPDEpILctCkaS4KOIdG2HOY1FQCvH32Z4LJcDQcPYzunaQHczLu1qQM1mOMuLytHPWTyLmYDufMZ00JODfXiiW');
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    async function loadBranding() {
      const subdomain = window.location.hostname.split('.')[0];
      if (!subdomain || subdomain === 'www' || subdomain === 'rhythm-deck-music') return;
      try {
        const { data } = await supabase.from('profiles').select('logo_url, banner_url').eq('subdomain', subdomain).single();
        if (data) {
          if (data.logo_url) document.getElementById('currentLogoPreview').src = data.logo_url;
          if (data.banner_url) document.getElementById('userBannerSection').style.backgroundImage = `url('${data.banner_url}')`;
        }
      } catch (err) {
        console.error('Branding load error:', err);
      }
    }

    async function loadProducts() {
      const subdomain = window.location.hostname.split('.')[0];
      const { data: profile } = await supabase.from('profiles').select('id').eq('subdomain', subdomain).single();

      let query = supabase.from('merch_products').select('id, name, description, image_url, variants, category').order('created_at', { ascending: false });
      if (profile) query = query.eq('user_id', profile.id);

      const { data: products } = await query;

      const apparelGrid = document.getElementById('apparelGrid');
      const accessoriesGrid = document.getElementById('accessoriesGrid');
      apparelGrid.innerHTML = '';
      accessoriesGrid.innerHTML = '';

      products.forEach(product => {
        const imgSrc = product.image_url ? supabase.storage.from('merch_images').getPublicUrl(product.image_url).data.publicUrl : 'https://placehold.co/600x400?text=No+Image';
        const variantOptions = (product.variants || []).map(v => `<option value="${v.price}|${v.option || 'Default'}">${v.option || 'Default'} - $${v.price.toFixed(2)}</option>`).join('');

        const cardHTML = `
          <div class="product-card bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition">
            <img src="${imgSrc}" alt="${product.name}" class="w-full h-80 object-contain bg-gray-100 p-4">
            <div class="p-6">
              <h3 class="font-bold text-2xl mb-2">${product.name}</h3>
              <p class="text-gray-600 mb-4 line-clamp-3">${product.description}</p>
              <select id="variant-${product.id}" class="w-full border border-gray-300 rounded-lg p-3 mb-4">
                ${variantOptions || '<option>No variants</option>'}
              </select>
              <button class="add-to-cart w-full bg-gradient-to-r from-yellow-500 to-orange-600 hover:from-yellow-600 hover:to-orange-700 text-white font-bold py-3 rounded-lg transition"
                      data-id="${product.id}"
                      data-name="${product.name}"
                      data-image="${imgSrc}">
                Add to Cart
              </button>
            </div>
          </div>
        `;

        if (product.category === 'accessories' || product.category?.toLowerCase() === 'accessory') {
          accessoriesGrid.innerHTML += cardHTML;
        } else {
          apparelGrid.innerHTML += cardHTML;
        }
      });

      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', () => {
          const productId = btn.dataset.id;
          const select = document.getElementById(`variant-${productId}`);
          if (!select || !select.value) return alert('Select a variant');
          const [price, option] = select.value.split('|');
          const item = {
            id: `${productId}-${option.trim().replace(/\s+/g, '-')}`,
            name: btn.dataset.name,
            option: option.trim(),
            price: parseFloat(price),
            image: btn.dataset.image,
            quantity: 1
          };
          const existing = cart.find(i => i.id === item.id);
          if (existing) existing.quantity++;
          else cart.push(item);
          localStorage.setItem('cart', JSON.stringify(cart));
          updateCartCount();
          alert(`${item.name} (${item.option}) added!`);
        });
      });
    }

    function updateCartCount() {
      const total = cart.reduce((sum, i) => sum + i.quantity, 0);
      document.getElementById('cartCount').textContent = total;
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      container.innerHTML = cart.length === 0 ? '<p class="text-center text-gray-500 py-8">Your cart is empty.</p>' : '';
      let total = 0;
      cart.forEach((item, index) => {
        total += item.price * item.quantity;
        container.innerHTML += `
          <div class="cart-item flex justify-between items-center">
            <div class="flex items-center gap-4">
              <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded">
              <div>
                <p class="font-bold">${item.name}</p>
                <p class="text-sm text-gray-600">${item.option}</p>
                <p class="text-sm">$${item.price.toFixed(2)} × ${item.quantity}</p>
              </div>
            </div>
            <button class="remove-item text-red-600 hover:text-red-800 font-bold text-xl" data-index="${index}">×</button>
          </div>
        `;
      });
      document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
      document.getElementById('checkoutBtn').disabled = cart.length === 0;
      document.querySelectorAll('.remove-item').forEach(btn => {
        btn.addEventListener('click', () => {
          cart.splice(parseInt(btn.dataset.index), 1);
          localStorage.setItem('cart', JSON.stringify(cart));
          renderCart();
          updateCartCount();
        });
      });
    }

    document.getElementById('cartBtn').addEventListener('click', () => {
      renderCart();
      document.getElementById('cartModal').classList.remove('hidden');
    });

    document.getElementById('closeCart').addEventListener('click', () => {
      document.getElementById('cartModal').classList.add('hidden');
    });

    document.getElementById('checkoutBtn').addEventListener('click', async () => {
      if (cart.length === 0) return;

      const lineItems = cart.map(item => ({
        price_data: {
          currency: 'usd',
          product_data: {
            name: `${item.name} - ${item.option}`,
            images: [item.image]
          },
          unit_amount: Math.round(item.price * 100)
        },
        quantity: item.quantity
      }));

      try {
        const response = await fetch(
          'https://bxoqhmfnseskwqkywppg.supabase.co/functions/v1/create-checkout-session',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ line_items: lineItems })
          }
        );

        const result = await response.json();

        if (result.error) {
          throw new Error(result.error);
        }

        if (!result.sessionId) {
          throw new Error("No session ID returned from server");
        }

        stripe.redirectToCheckout({ sessionId: result.sessionId });
      } catch (err) {
        console.error(err);
        alert('Checkout error: ' + err.message);
      }
    });

    async function init() {
      await loadBranding();
      await loadProducts();
      updateCartCount();
      checkSuccessRedirect();
    }

    window.onload = init;
  </script>
</body>
</html>
