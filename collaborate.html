<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaboration Network | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/talkjs@0.16.8/dist/talkjs.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    .artist-card:hover {transform: translateY(-8px);transition:all .3s;box-shadow:0 20px 40px rgba(0,0,0,.7);}
    .email-hover {opacity:0;transition:opacity .4s;}
    .artist-card:hover .email-hover {opacity:1;}
    .video-item:hover {background-color:#4c1d95;color:white;}
    .modal {display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:99999;justify-content:center;align-items:center;}
    .modal:target {display:flex;}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">

<header class="bg-black/80 backdrop-blur-md border-b border-purple-500 p-6 shadow-2xl">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <img src="logo-1-sm.jpg" alt="Logo" class="w-12 h-12 rounded-full">
      <h1 class="text-4xl font-black tracking-wider">RHYTHM DECK</h1>
    </div>
    <nav class="space-x-8">
      <a href="profile-admin-pro.html" class="hover:text-purple-400 transition">Back to Dashboard</a>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold">Logout</button>
    </nav>
  </div>
</header>

<section class="text-center py-20 px-6">
  <h2 class="text-6xl font-black mb-6 bg-gradient-to-r from-green-400 to-purple-500 bg-clip-text text-transparent">
    Collaboration Network
  </h2>
  <p class="text-xl max-w-3xl mx-auto opacity-90">
    Connect with Pro artists • View their public profile • Watch their videos • Message instantly
  </p>
</section>

<section class="max-w-7xl mx-auto px-6 pb-20">
  <div id="artistsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
  <p id="noArtists" class="text-center text-2xl py-20 text-gray-500 hidden">No artists in the network yet.</p>
</section>

<!-- TalkJS Chat Container -->
<div id="talkjs-container" style="position:fixed;bottom:20px;right:20px;width:380px;height:580px;z-index:9999;display:none;background:white;border-radius:16px;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.9);border:5px solid #10b981;"></div>

<!-- Video Modal (hidden until clicked) -->
<div id="videoModal" class="modal">
  <div class="relative max-w-4xl w-full p-8">
    <a href="#" class="absolute top-4 right-8 text-white text-5xl font-bold z-10">&times;</a>
    <video id="modalVideo" controls class="w-full rounded-xl shadow-2xl" style="max-height:80vh;"></video>
  </div>
</div>

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );

  const TALKJS_APP_ID     = 'tLZqiXQU';
  const TALKJS_SECRET_KEY = 'sk_test_IEmPfWI8f9gVZUhShLIv8NibfXnXsZI1'; // ← Your real key

  let currentUser = null;
  let talkSession = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { alert('Login required'); window.location.href = 'login.html'; return; }
    currentUser = user;

    const { data: profile } = await supabase.from('profiles').select('collaboration_opt_in').eq('id', user.id).single();
    if (!profile?.collaboration_opt_in) {
      alert("Join the network first in your dashboard!");
      window.location.href = 'profile-admin-pro.html';
      return;
    }

    await loadArtists();
    await initTalkJS();
  });

  async function loadArtists() {
    const { data: artists } = await supabase
      .from('profiles')
      .select('id, name, logo_url, banner_url, email')
      .eq('collaboration_opt_in', true)
      .neq('id', currentUser.id);

    const grid = document.getElementById('artistsGrid');
    grid.innerHTML = '';

    if (!artists?.length) {
      document.getElementById('noArtists').classList.remove('hidden');
      return;
    }

    for (const artist of artists) {
      const logoUrl = artist.logo_url 
        ? supabase.storage.from('media').getPublicUrl(artist.logo_url).data.publicUrl 
        : 'logo-placeholder.png';

      const bannerUrl = artist.banner_url 
        ? supabase.storage.from('media').getPublicUrl(artist.banner_url).data.publicUrl 
        : 'https://via.placeholder.com/800x300/4c1d95/ffffff?text=Artist';

      // Get ALL videos (not just 4)
      const { data: videos } = await supabase
        .from('user_videos')
        .select('id, title, video_url')
        .eq('user_id', artist.id)
        .order('created_at', { ascending: false });

      const videoCount = videos?.length || 0;

      const videoListHtml = videoCount > 0 ? videos.map(v => `
        <a href="#videoModal" onclick="playVideo('${v.video_url.replace(/'/g, "\\'")}')" 
           class="block p-3 rounded-lg video-item cursor-pointer border border-purple-600 mb-2 hover:bg-purple-600 transition">
          ${v.title || 'Untitled Video'}
        </a>
      `).join('') : '<p class="text-gray-500 text-sm">No videos yet</p>';

      // CORRECT PUBLIC PROFILE URL
      const publicProfileUrl = `https://rhythm-deck-music.onrender.com/public-profile.html?id=${artist.id}`;

      grid.innerHTML += `
        <div class="artist-card bg-gradient-to-br from-purple-900/50 to-black rounded-2xl overflow-hidden shadow-2xl border border-purple-600">
          <div class="h-40 bg-cover bg-center" style="background-image:url('${bannerUrl}')"></div>
          <div class="p-6 -mt-20 relative z-10 text-center">
            <img src="${logoUrl}" class="w-32 h-32 rounded-full mx-auto border-8 border-black shadow-2xl object-cover">
            <h3 class="text-2xl font-black mt-4">${artist.name || 'Artist'}</h3>
            <p class="email-hover text-green-300 text-sm">Email: ${artist.email || 'Hidden'}</p>
            <div class="text-sm text-gray-400 mt-3">${videoCount} Video${videoCount !== 1 ? 's' : ''}</div>

            <!-- Video List -->
            <div class="mt-6 max-h-60 overflow-y-auto bg-black/50 rounded-xl p-4">
              ${videoListHtml}
            </div>

            <!-- View Public Profile Button -->
            <a href="${publicProfileUrl}" target="_blank" class="inline-block w-full mt-5">
              <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-lg py-3 rounded-xl shadow-xl transition transform hover:scale-105">
                View Public Profile
              </button>
            </a>

            <!-- Message Button -->
            <button onclick="startChat('${artist.id}', '${(artist.name || 'Artist').replace(/'/g, "\\'")}', '${artist.email || ''}')"
              class="w-full mt-3 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-black text-lg py-4 rounded-xl shadow-xl transform hover:scale-105 transition">
              Message for Collaboration
            </button>
          </div>
        </div>`;
    }
  }

  // Play video in modal
  function playVideo(videoUrl) {
    const modalVideo = document.getElementById('modalVideo');
    modalVideo.src = videoUrl;
    modalVideo.play();
  }

  // Close modal when clicking outside
  document.getElementById('videoModal').addEventListener('click', function(e) {
    if (e.target === this || e.target.tagName === 'A') {
      document.getElementById('modalVideo').pause();
      document.getElementById('modalVideo').src = '';
      this.style.display = 'none';
      window.location.hash = '';
    }
  });

  function createTalkJSSignature(userId) {
    const message = userId + ':' + TALKJS_APP_ID;
    const hash = CryptoJS.HmacSHA256(message, TALKJS_SECRET_KEY);
    return CryptoJS.enc.Base64.stringify(hash);
  }

  async function initTalkJS() {
    await Talk.ready;

    const signature = createTalkJSSignature(currentUser.id);

    talkSession = new Talk.Session({
      appId: TALKJS_APP_ID,
      me: new Talk.User({
        id: currentUser.id,
        name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        email: currentUser.email,
        photoUrl: supabase.storage.from('media').getPublicUrl(`logos/${currentUser.id}`).data.publicUrl || null
      }),
      signature: signature
    });

    // Auto-register current user
    await fetch(`https://api.talkjs.com/v1/${TALKJS_APP_ID}/users/${currentUser.id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TALKJS_SECRET_KEY}` },
      body: JSON.stringify({
        name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        email: [currentUser.email]
      })
    }).catch(() => {});

    // Pre-mount chatbox
    talkSession.createChatbox().mount(document.getElementById('talkjs-container'));
  }

  async function startChat(otherUserId, otherUserName, otherUserEmail) {
    if (!talkSession) {
      alert('Chat is initializing... please wait 2 seconds and try again.');
      return;
    }

    // Register other user
    await fetch(`https://api.talkjs.com/v1/${TALKJS_APP_ID}/users/${otherUserId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TALKJS_SECRET_KEY}` },
      body: JSON.stringify({
        name: otherUserName,
        email: [otherUserEmail || `${otherUserId}@rhythmdeck.local`]
      })
    }).catch(() => {});

    const otherUser = new Talk.User({ id: otherUserId, name: otherUserName });
    const convo = talkSession.getOrCreateConversation(Talk.oneOnOneId(talkSession.me, otherUser));
    convo.setParticipant(talkSession.me);
    convo.setParticipant(otherUser);
    convo.setAttributes({ subject: "Collaboration – Rhythm Deck" });

    talkSession.createChatbox(convo).mount(document.getElementById('talkjs-container'));
    document.getElementById('talkjs-container').style.display = 'block';
  }

  async function logout() {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
