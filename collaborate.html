<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaboration Network | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/talkjs@0.16.8/dist/talkjs.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite;display:inline-block;margin-left:8px;}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .artist-card:hover {transform: translateY(-8px);transition:all .3s;box-shadow:0 20px 40px rgba(0,0,0,.5);}
    .email-hover {opacity:0;transition:opacity .4s;pointer-events:none;}
    .artist-card:hover .email-hover {opacity:1;}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">

<header class="bg-black/80 backdrop-blur-md border-b border-purple-500 p-6 shadow-2xl">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <img src="logo-1-sm.jpg" alt="Logo" class="w-12 h-12 rounded-full">
      <h1 class="text-4xl font-black tracking-wider">RHYTHM DECK</h1>
    </div>
    <nav class="space-x-8">
      <a href="profile-admin-pro.html" class="hover:text-purple-400 transition">Back to Dashboard</a>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold">Logout</button>
    </nav>
  </div>
</header>

<section class="text-center py-20 px-6">
  <h2 class="text-6xl font-black mb-6 bg-gradient-to-r from-green-400 to-purple-500 bg-clip-text text-transparent">
    Collaboration Network
  </h2>
  <p class="text-xl max-w-3xl mx-auto opacity-90">
    Discover other Pro artists. Message instantly for collabs, features, remixes, shows.
  </p>
</section>

<section class="max-w-7xl mx-auto px-6 pb-20">
  <div id="artistsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
  <p id="noArtists" class="text-center text-2xl py-20 text-gray-500 hidden">
    No artists in the network yet. Be the first!
  </p>
</section>

<div id="talkjs-container" style="position:fixed;bottom:20px;right:20px;width:380px;height:560px;z-index:9999;display:none;background:white;border-radius:16px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.8);border:4px solid #10b981;"></div>

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );

  // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
  //    REPLACE THESE TWO LINES WITH YOUR REAL CREDENTIALS
  // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←

  const TALKJS_APP_ID      = 'tLZqiXQU';                                      
  const TALKJS_SECRET_KEY  = 'sk_test_IEmPfWI8f9gVZUhShLIv8NibfXnXsZI1';     

  let currentUser = null;
  let talkSession = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { alert('Login required'); window.location.href = 'login.html'; return; }
    currentUser = user;

    const { data: profile } = await supabase
      .from('profiles')
      .select('collaboration_opt_in')
      .eq('id', user.id)
      .single();

    if (!profile?.collaboration_opt_in) {
      alert("You must join the Collaboration Network first! Go to your dashboard and check the box.");
      window.location.href = 'profile-admin-pro.html';
      return;
    }

    await loadArtists();
    await initTalkJS();
  });

  async function loadArtists() {
    const { data: artists } = await supabase
      .from('profiles')
      .select('id, name, logo_url, banner_url, email')
      .eq('collaboration_opt_in', true)
      .neq('id', currentUser.id);

    const grid = document.getElementById('artistsGrid');
    grid.innerHTML = '';

    if (!artists || artists.length === 0) {
      document.getElementById('noArtists').classList.remove('hidden');
      return;
    }

    for (const artist of artists) {
      const logoUrl = artist.logo_url
        ? supabase.storage.from('media').getPublicUrl(artist.logo_url).data.publicUrl
        : 'logo-placeholder.png';

      const bannerUrl = artist.banner_url
        ? supabase.storage.from('media').getPublicUrl(artist.banner_url).data.publicUrl
        : 'https://via.placeholder.com/800x300/4c1d95/ffffff?text=Artist+Banner';

      const { count: videoCount = 0 } = await supabase.from('user_videos').select('id', { count: 'exact', head: true }).eq('user_id', artist.id);
      const videoIds = (await supabase.from('user_videos').select('id').eq('user_id', artist.id)).data || [];
      const { count: likeCount = 0 } = videoIds.length > 0
        ? await supabase.from('video_likes').select('id', { count: 'exact', head: true }).in('video_id', videoIds.map(v => v.id))
        : { count: 0 };

      grid.innerHTML += `
        <div class="artist-card bg-gradient-to-br from-purple-800 to-black rounded-2xl overflow-hidden shadow-2xl border border-purple-600 relative">
          <div class="h-32 bg-cover bg-center" style="background-image:url('${bannerUrl}')"></div>
          <div class="p-6 text-center -mt-16 relative z-10">
            <img src="${logoUrl}" class="w-32 h-32 rounded-full mx-auto border-8 border-black shadow-2xl object-cover">
            <h3 class="text-2xl font-black mt-4">${artist.name || 'Artist'}</h3>
            <p class="email-hover text-green-300 text-sm mt-1">Email: ${artist.email || 'Hidden'}</p>
            <div class="flex justify-around mt-6 text-sm">
              <div><strong>${videoCount}</strong><br>Videos</div>
              <div><strong>${likeCount}</strong><br>Likes</div>
            </div>
            <button onclick="startChat('${artist.id}', '${(artist.name || 'Artist').replace(/'/g, "\\'")}', '${artist.email || ''}')"
              class="w-full mt-6 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-black text-lg py-4 rounded-xl shadow-xl transform hover:scale-105 transition">
              Message for Collaboration
            </button>
          </div>
        </div>`;
    }
  }

  function createTalkJSSignature(userId) {
    const message = `${userId}:${TALKJS_APP_ID}`;
    const hash = CryptoJS.HmacSHA256(message, TALKJS_SECRET_KEY);
    return CryptoJS.enc.Base64.stringify(hash);
  }

  async function initTalkJS() {
    if (TALKJS_SECRET_KEY.includes('XXXX') || TALKJS_SECRET_KEY.length < 30) {
      alert('STOP! You forgot to replace the TalkJS secret key! Check line with TALKJS_SECRET_KEY');
      return;
    }

    await Talk.ready;

    const signature = createTalkJSSignature(currentUser.id);

    talkSession = new Talk.Session({
      appId: TALKJS_APP_ID,
      me: new Talk.User({
        id: currentUser.id,
        name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        email: currentUser.email,
        photoUrl: supabase.storage.from('media').getPublicUrl(`logos/${currentUser.id}`).data.publicUrl || 'logo-placeholder.png'
      }),
      signature: signature
    });

    // Auto-register user in TalkJS (required in test mode)
    await fetch(`https://api.talkjs.com/v1/${TALKJS_APP_ID}/users/${currentUser.id}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TALKJS_SECRET_KEY}`
      },
      body: JSON.stringify({
        name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        email: [currentUser.email],
        photoUrl: supabase.storage.from('media').getPublicUrl(`logos/${currentUser.id}`).data.publicUrl || null
      })
    }).catch(() => {});

    const chatbox = talkSession.createChatbox();
    chatbox.mount(document.getElementById('talkjs-container'));
  }

  function startChat(otherUserId, otherUserName, otherUserEmail) {
    if (!talkSession) return alert('Chat still loading…');

    const otherUser = new Talk.User({
      id: otherUserId,
      name: otherUserName,
      email: otherUserEmail || `${otherUserId}@rhythmdeck.local`,
      photoUrl: supabase.storage.from('media').getPublicUrl(`logos/${otherUserId}`).data.publicUrl || 'logo-placeholder.png'
    });

    const conversationId = Talk.oneOnOneId(talkSession.me, otherUser);
    const conversation = talkSession.getOrCreateConversation(conversationId);
    conversation.setParticipant(talkSession.me);
    conversation.setParticipant(otherUser);
    conversation.setAttributes({ subject: "Collaboration – Rhythm Deck" });

    talkSession.createChatbox(conversation).mount(document.getElementById('talkjs-container'));
    document.getElementById('talkjs-container').style.display = 'block';
  }

  async function logout() {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
