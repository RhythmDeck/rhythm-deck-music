<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaboration Network | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/talkjs@0.16.8/dist/talkjs.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    .artist-card:hover {transform: translateY(-8px);transition:all .3s;box-shadow:0 20px 40px rgba(0,0,0,.9);}
    .email-hover {opacity:0;transition:opacity .4s;}
    .artist-card:hover .email-hover {opacity:1;}
    .song-item {
      padding: 10px 12px;
      border-radius: 8px;
      margin: 3px 0;
      background: rgba(139,92,246,0.1);
      transition: all .2s;
      cursor: pointer;
      font-weight: 500;
      border: 1px solid #a855f7;
    }
    .song-item:hover {
      background: #a855f7;
      color: white;
      transform: translateX(4px);
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.98);
      z-index: 99999;
      justify-content: center;
      align-items: center;
    }
    .modal.active { display: flex; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">

<header class="bg-black/90 backdrop-blur-lg border-b border-purple-600 p-6 shadow-2xl">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <img src="logo-1-sm.jpg" alt="Logo" class="w-12 h-12 rounded-full">
      <h1 class="text-4xl font-black tracking-wider">RHYTHM DECK</h1>
    </div>
    <nav class="space-x-8">
      <a href="profile-admin-pro.html" class="hover:text-purple-400 transition">Dashboard</a>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold">Logout</button>
    </nav>
  </div>
</header>

<section class="text-center py-20 px-6">
  <h2 class="text-6xl font-black mb-6 bg-gradient-to-r from-green-400 to-purple-500 bg-clip-text text-transparent">
    Collaboration Network
  </h2>
  <p class="text-xl max-w-3xl mx-auto opacity-90">
    Connect • Listen • Collab
  </p>
</section>

<section class="max-w-7xl mx-auto px-6 pb-20">
  <div id="artistsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
  <p id="noArtists" class="text-center text-2xl py-20 text-gray-500 hidden">No artists in the network yet.</p>
</section>

<div id="talkjs-container" style="position:fixed;bottom:20px;right:20px;width:380px;height:580px;z-index:9999;display:none;background:white;border-radius:16px;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.9);border:5px solid #10b981;"></div>

<div id="videoModal" class="modal">
  <div class="relative max-w-5xl w-full p-8">
    <button onclick="closeModal()" class="absolute top-4 right-6 text-white text-7xl z-10 hover:text-red-500 transition">×</button>
    <video id="modalVideo" controls class="w-full rounded-full rounded-2xl shadow-2xl border-4 border-purple-600" style="max-height:85vh;"></video>
  </div>
</div>

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );

  const TALKJS_APP_ID = 'tLZqiXQU';
  const TALKJS_SECRET_KEY = 'sk_test_IEmPfWI8f9gVZUhShLIv8NibfXnXsZI1';

  let currentUser = null;
  let talkSession = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return window.location.href = 'login.html';
    currentUser = user;

    const { data: profile } = await supabase.from('profiles').select('collaboration_opt_in').eq('id', user.id).single();
    if (!profile?.collaboration_opt_in) {
      alert("Join the network first!");
      return window.location.href = 'profile-admin-pro.html';
    }

    // Load artists first (no await on TalkJS)
    loadArtists();
    initTalkJS(); // runs in background
  });

  async function loadArtists() {
    try {
      const { data: artists, error } = await supabase
        .from('profiles')
        .select('id, name, logo_url, banner_url, email, subdomain')
        .eq('collaboration_opt_in', true)
        .neq('id', currentUser.id);

      if (error) throw error;

      const grid = document.getElementById('artistsGrid');
      grid.innerHTML = '';

      if (!artists || artists.length === 0) {
        document.getElementById('noArtists').classList.remove('hidden');
        return;
      }

      for (const artist of artists) {
        const logoUrl = artist.logo_url 
          ? supabase.storage.from('media').getPublicUrl(artist.logo_url).data.publicUrl 
          : 'logo-placeholder.png';

        const bannerUrl = artist.banner_url 
          ? supabase.storage.from('media').getPublicUrl(artist.banner_url).data.publicUrl 
          : 'https://via.placeholder.com/800x300/4c1d95/ffffff?text=Artist';

        const { data: videos } = await supabase
          .from('user_videos')
          .select('title, video_url')
          .eq('user_id', artist.id);

        const videoList = (videos?.length > 0)
          ? videos.map(v => {
              const url = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
              return `<div class="song-item" onclick="playVideo('${url}')">${v.title || 'Untitled'}</div>`;
            }).join('')
          : '<p class="text-gray-500 text-xs">No tracks yet</p>';

        const profileId = artist.subdomain?.trim() || artist.id;
        const publicProfileUrl = `https://rhythm-deck-music.onrender.com/public-profile.html?id=${profileId}`;

        grid.innerHTML += `
          <div class="artist-card bg-gradient-to-br from-purple-900/50 to-black rounded-2xl overflow-hidden shadow-2xl border border-purple-600">
            <div class="h-40 bg-cover bg-center" style="background-image:url('${bannerUrl}')"></div>
            <div class="p-6 -mt-20 relative z-10 text-center">
              <img src="${logoUrl}" class="w-32 h-32 rounded-full mx-auto border-8 border-black shadow-2xl object-cover">
              <h3 class="text-2xl font-black mt-4">${artist.name}</h3>
              <p class="email-hover text-green-300 text-sm mt-1">Email: ${artist.email}</p>
              <p class="text-sm text-gray-400 mt-2">${videos?.length || 0} Track${videos?.length !== 1 ? 's' : ''}</p>

              <div class="mt-5 text-left bg-black/60 rounded-xl p-4 max-h-64 overflow-y-auto text-sm">
                ${videoList}
              </div>

              <a href="${publicProfileUrl}" target="_blank" class="block mt-5">
                <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl transition transform hover:scale-105 shadow-lg">
                  View Public Profile
                </button>
              </a>

              <button onclick="startChat('${artist.id}', '${artist.name.replace(/'/g, "\\'")}', '${artist.email}')"
                class="w-full mt-3 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-black text-lg py-5 rounded-xl shadow-xl transition transform hover:scale-105">
                Message for Collab
              </button>
            </div>
          </div>`;
      }
    } catch (err) {
      console.error("Failed to load artists:", err);
      alert("Error loading artists. Check console.");
    }
  }

  function playVideo(url) {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('modalVideo');
    video.src = url;
    modal.classList.add('active');
    video.play();
  }

  function closeModal() {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('modalVideo');
    video.pause();
    video.src = '';
    modal.classList.remove('active');
  }

  document.getElementById('videoModal').onclick = e => e.target === e.currentTarget && closeModal();

  // CORRECT TALKJS SIGNATURE (this is the real fix)
  async function initTalkJS() {
    await Talk.ready;

    const message = TALKJS_APP_ID + ':' + currentUser.id;
    const signature = CryptoJS.HmacSHA256(message, TALKJS_SECRET_KEY);
    const signatureB64 = signature.toString(CryptoJS.enc.Base64url); // URL-SAFE!

    talkSession = new Talk.Session({
      appId: TALKJS_APP_ID,
      me: new Talk.User(currentUser.id, {
        name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        email: currentUser.email
      }),
      signature: signatureB64
    });

    talkSession.createChatbox().mount(document.getElementById('talkjs-container'));
  }

  function startChat(id, name, email) {
    if (!talkSession) return setTimeout(() => startChat(id, name, email), 500);

    const other = new Talk.User(id, { name);
    const convo = talkSession.getOrCreateConversation(Talk.oneOnOneId(talkSession.me, other));
    convo.setParticipant(talkSession.me);
    convo.setParticipant(other);
    convo.setAttributes({ subject: "Collab Request – Rhythm Deck" });

    talkSession.createChatbox(convo).mount(document.getElementById('talkjs-container'));
    document.getElementById('talkjs-container').style.display = 'block';
  }

  async function logout() {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
