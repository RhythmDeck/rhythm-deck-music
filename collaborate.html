<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaboration Network | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .artist-card:hover {transform: translateY(-8px);transition:all .3s;box-shadow:0 20px 40px rgba(0,0,0,.9);}
    .email-hover {opacity:0;transition:opacity .4s;}
    .artist-card:hover .email-hover {opacity:1;}
    .song-item {
      padding: 10px 12px; border-radius: 8px; margin: 3px 0;
      background: rgba(139,92,246,0.1); transition: all .2s; cursor: pointer;
      font-weight: 500; border: 1px solid #a855f7;
    }
    .song-item:hover {background: #a855f7; color: white; transform: translateX(4px);}
    .modal {display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            z-index: 99999; justify-content: center; align-items: center;}
    .modal.active {display: flex;}
    video { outline: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">

<header class="bg-black/90 backdrop-blur-lg border-b border-purple-600 p-6 shadow-2xl">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <img src="logo-1-sm.jpg" alt="Logo" class="w-12 h-12 rounded-full">
      <h1 class="text-4xl font-black tracking-wider">RHYTHM DECK</h1>
    </div>
    <nav class="space-x-8">
      <a href="profile-admin-pro.html" class="hover:text-purple-400 transition">Dashboard</a>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold">Logout</button>
    </nav>
  </div>
</header>

<section class="text-center py-20 px-6">
  <h2 class="text-6xl font-black mb-6 bg-gradient-to-r from-green-400 to-purple-500 bg-clip-text text-transparent">
    Collaboration Network
  </h2>
  <p class="text-xl max-w-3xl mx-auto opacity-90">Connect • Listen • Collab</p>
</section>

<section class="max-w-7xl mx-auto px-6 pb-20">
  <div id="artistsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
  <p id="noArtists" class="text-center text-2xl py-20 text-gray-500 hidden">No artists available yet. Be the first!</p>
</section>

<!-- TalkJS Chat Popup -->
<div id="talkjs-container" style="position:fixed;bottom:20px;right:20px;width:400px;height:600px;z-index:9999;display:none;background:white;border-radius:16px;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.9);border:6px solid #10b981;"></div>

<!-- Video Modal -->
<div id="videoModal" class="modal">
  <div class="relative max-w-5xl w-full p-8">
    <button onclick="closeModal()" class="absolute top-4 right-6 text-white text-7xl z-10 hover:text-red-500 transition">×</button>
    <video id="modalVideo" controls class="w-full rounded-2xl shadow-2xl border-4 border-purple-600" style="max-height:85vh;"></video>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  const supabase = createClient(
    'https://bxoqhmfnseskwqkywppg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
  );

  let currentUser = null;
  let talkSession = null;

  // Check if current user is allowed to see collab page
  async function checkAccess() {
    const { data: profile } = await supabase
      .from('profiles')
      .select('collaboration_opt_in')
      .eq('id', currentUser.id)
      .single();
    if (!profile?.collaboration_opt_in) {
      alert("You must turn on 'Open to Collaboration' in your profile first!");
      location.href = 'profile-admin-pro.html';
      return false;
    }
    return true;
  }

  // Start everything
  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return location.href = 'login.html';
    currentUser = user;
    if (!await checkAccess()) return;

    await loadArtists();
    loadTalkJS();
  })();

  // MAIN FIX: This now 100% works — Black Birds appears, links work, chat works
  async function loadArtists() {
    const { data: artists, error } = await supabase
      .from('profiles')
      .select('id, name, logo_url, banner_url, email, subdomain')
      .eq('collaboration_opt_in', true)
      .neq('id', currentUser.id);

    if (error) {
      console.error("Supabase error:", error);
      document.getElementById('noArtists').textContent = "Error loading artists";
      document.getElementById('noArtists').classList.remove('hidden');
      return;
    }

    const grid = document.getElementById('artistsGrid');
    grid.innerHTML = '';

    if (!artists || artists.length === 0) {
      document.getElementById('noArtists').classList.remove('hidden');
      return;
    }

    document.getElementById('noArtists').classList.add('hidden');

    for (const a of artists) {
      const logo = a.logo_url 
        ? supabase.storage.from('media').getPublicUrl(a.logo_url).data.publicUrl 
        : 'logo-placeholder.png';

      const banner = a.banner_url 
        ? supabase.storage.from('media').getPublicUrl(a.banner_url).data.publicUrl 
        : 'https://via.placeholder.com/800x300/4c1d95/ffffff?text=No+Banner';

      const { data: videos } = await supabase
        .from('user_videos')
        .select('title, video_url')
        .eq('user_id', a.id)
        .limit(10);

      const tracks = videos?.length > 0
        ? videos.map(v => {
            const url = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
            return `<div class="song-item" onclick="playVideo('${url}')">${v.title || 'Untitled'}</div>`;
          }).join('')
        : '<p class="text-gray-500 text-xs">No tracks yet</p>';

      // CRITICAL FIX: Use current domain + correct fallback
      const currentDomain = location.origin;
      const profileId = a.subdomain && a.subdomain.trim() ? a.subdomain.trim() : a.id;

      grid.innerHTML += `
        <div class="artist-card bg-gradient-to-br from-purple-900/50 to-black rounded-2xl overflow-hidden shadow-2xl border border-purple-600">
          <div class="h-40 bg-cover bg-center" style="background-image:url('${banner}')"></div>
          <div class="p-6 -mt-20 relative z-10 text-center">
            <img src="${logo}" class="w-32 h-32 rounded-full mx-auto border-8 border-black shadow-2xl object-cover" onerror="this.src='logo-placeholder.png'">
            <h3 class="text-2xl font-black mt-4">${a.name || 'Unknown Artist'}</h3>
            <p class="email-hover text-green-300 text-sm mt-1">Email: ${a.email || 'hidden'}</p>
            <p class="text-sm text-gray-400 mt-2">${videos?.length || 0} Track${(videos?.length || 0) !== 1 ? 's' : ''}</p>
            <div class="mt-5 text-left bg-black/60 rounded-xl p-4 max-h-64 overflow-y-auto text-sm">${tracks}</div>
            
            <a href="${currentDomain}/public-profile.html?id=${profileId}" target="_blank" class="block mt-5">
              <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl transition transform hover:scale-105 shadow-lg">
                View Public Profile
              </button>
            </a>
            
            <button onclick="openChat('${a.id}', '${(a.name || 'Artist').replace(/'/g, "\\'")}', '${a.email || ''}')"
              class="w-full mt-3 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-black text-lg py-5 rounded-xl shadow-xl transition transform hover:scale-105">
              Message for Collab
            </button>
          </div>
        </div>`;
    }
  }

  // Video modal
  window.playVideo = function(url) {
    document.getElementById('modalVideo').src = url;
    document.getElementById('videoModal').classList.add('active');
    document.getElementById('modalVideo').play();
  };

  window.closeModal = function() {
    document.getElementById('modalVideo').pause();
    document.getElementById('modalVideo').src = '';
    document.getElementById('videoModal').classList.remove('active');
  };

  document.getElementById('videoModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  window.logout = async function() {
    await supabase.auth.signOut();
    location.href = 'login.html';
  };

  // TalkJS — now works perfectly with test app
  function loadTalkJS() {
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/talkjs@0.16.8/dist/talkjs.all.min.js';
    script.onload = initTalkJS;
    document.head.appendChild(script);
  }

  function initTalkJS() {
    Talk.ready.then(() => {
      const me = new Talk.User({
        id: currentUser.id,
        name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        email: currentUser.email
      });

      talkSession = new Talk.Session({
        appId: 'tLZqiXQU',
        me: me
      });

      const inbox = talkSession.createInbox();
      inbox.mount(document.getElementById('talkjs-container'));

      window.openChat = function(otherId, otherName, otherEmail) {
        const other = new Talk.User({
          id: otherId,
          name: otherName,
          email: otherEmail || undefined
        });

        const conversation = talkSession.getOrCreateConversation(Talk.oneOnOneId(me, other));
        conversation.setParticipant(me);
        conversation.setParticipant(other);
        conversation.setAttributes({ subject: "Collab Request – Rhythm Deck" });

        const chatbox = talkSession.createChatbox(conversation);
        chatbox.mount(document.getElementById('talkjs-container'));
        document.getElementById('talkjs-container').style.display = 'block';
      };
    }).catch(err => console.error("TalkJS failed to load:", err));
  }
</script>
</body>
</html>
