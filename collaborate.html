<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaboration Network | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .artist-card:hover {transform: translateY(-8px);transition:all .3s;box-shadow:0 20px 40px rgba(0,0,0,.9);}
    .video-item {padding: 10px 12px; border-radius: 8px; margin: 3px 0; background: rgba(139,92,246,0.1); transition: all .2s; cursor: pointer; font-weight: 500; border: 1px solid #a855f7;}
    .video-item:hover {background: #a855f7; color: white; transform: translateX(4px);}
    .modal {display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 99999; justify-content: center; align-items: center;}
    .modal.active {display: flex;}
    video { outline: none; }
    .stat-badge {background: rgba(16,185,129,0.2); border: 1px solid #10b981; padding: 6px 12px; border-radius: 999px; font-size: 0.9rem;}
    .btn-dashboard {
      background: linear-gradient(to right, #d4af37, #b8860b);
      color: #1a0f2e;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
    }
    .btn-dashboard:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212,175,55,0.6);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">
<header class="bg-black/90 backdrop-blur-lg border-b border-purple-600 p-6 shadow-2xl">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <img src="logo-1-sm.jpg" alt="Logo" class="w-12 h-12 rounded-full">
      <h1 class="text-4xl font-black tracking-wider">RHYTHM DECK</h1>
    </div>
  </div>
</header>
<section class="text-center py-20 px-6">
  <h2 class="text-6xl font-black mb-6 bg-gradient-to-r from-green-400 to-purple-500 bg-clip-text text-transparent">
    Collaboration Network
  </h2>
  <p class="text-xl max-w-3xl mx-auto opacity-90">Discover Pro artists open to collaboration</p>
</section>
<section class="max-w-7xl mx-auto px-6 pb-20">
  <div id="artistsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
  <p id="noArtists" class="text-center text-2xl py-20 text-gray-500 hidden">No artists available for collaboration yet.</p>
</section>
<!-- VIDEO MODAL -->
<div id="videoModal" class="modal">
  <div class="relative max-w-5xl w-full p-8">
    <button onClick="closeModal()" class="absolute top-4 right-6 text-white text-7xl z-10 hover:text-red-500 transition">×</button>
    <video id="modalVideo" controls autoplay class="w-full rounded-2xl shadow-2xl border-4 border-purple-600" style="max-height:85vh;"></video>
  </div>
</div>
<!-- MESSAGE MODAL -->
<div id="collabModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-[99999] opacity-0 invisible transition-all duration-300">
  <div class="bg-gray-900 rounded-3xl shadow-2xl w-full max-w-lg mx-4 relative max-h-screen overflow-y-auto">
    <button onClick="closeCollabModal()" class="absolute top-4 right-4 w-12 h-12 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-white text-3xl font-bold z-50 shadow-xl transition transform hover:scale-110">
      ×
    </button>
    <div class="p-8 pt-16">
      <h2 class="text-4xl font-black text-emerald-400 mb-6 text-center">
        Message <span id="targetArtistName">Artist</span>
      </h2>
      <div class="space-y-5">
        <div>
          <label class="block text-base font-bold mb-1">Your Name / Band *</label>
          <input type="text" id="collabName" placeholder="Your name or band" required class="w-full p-3 rounded-lg bg-white/10 text-white border border-emerald-500 placeholder-gray-400 focus:outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="block text-base font-bold mb-1">Your Email *</label>
          <input type="email" id="collabEmail" placeholder="you@example.com" required class="w-full p-3 rounded-lg bg-white/10 text-white border border-emerald-500 placeholder-gray-400 focus:outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="block text-base font-bold mb-1">Message *</label>
          <textarea id="collabMessage" rows="5" placeholder="Hey! I'd love to collab..." required class="w-full p-3 rounded-lg bg-white/10 text-white border border-emerald-500 placeholder-gray-400 resize-none focus:outline-none focus:border-emerald-400"></textarea>
        </div>
      </div>
      <button onClick="sendCollabMessage()" class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xl py-4 rounded-xl transition transform hover:scale-105 shadow-xl">
        Send Message
      </button>
      <p class="text-center text-gray-400 mt-4 text-sm">They'll get your message in their dashboard</p>
    </div>
  </div>
</div>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const supabase = createClient(
    'https://bxoqhmfnseskwqkywppg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
  );
  const getMediaUrl = (path) => `https://bxoqhmfnseskwqkywppg.supabase.co/storage/v1/object/public/media/${path?.replace(/^\/+/g, '') || ''}`;
  let currentUser = null;
  let targetArtistId = null;
  let targetArtistName = null;
  // Smart Dashboard redirect: Platinum → platinum-pro-admin, others → profile-admin-pro
  window.goToDashboard = async function() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
      alert("Please log in first");
      return;
    }
    const { data: profile } = await supabase
      .from('profiles')
      .select('plan')
      .eq('id', user.id)
      .single();
    if (profile?.plan === 'platinum') {
      window.location.href = 'platinum-pro-admin.html';
    } else {
      window.location.href = 'profile-admin-pro.html';
    }
  };
  window.openCollabModal = function(artistId, artistName) {
    targetArtistId = artistId;
    targetArtistName = artistName;
    document.getElementById('targetArtistName').textContent = artistName;
    document.getElementById('collabModal').classList.remove('invisible', 'opacity-0');
    document.getElementById('collabModal').classList.add('opacity-100');
  };
  window.closeCollabModal = function() {
    document.getElementById('collabModal').classList.add('invisible', 'opacity-0');
    document.getElementById('collabModal').classList.remove('opacity-100');
    document.getElementById('collabName').value = '';
    document.getElementById('collabEmail').value = '';
    document.getElementById('collabMessage').value = '';
  };
  window.sendCollabMessage = async function() {
    if (!targetArtistId) return alert('Error: No artist selected');
    const name = document.getElementById('collabName').value.trim();
    const email = document.getElementById('collabEmail').value.trim();
    const message = document.getElementById('collabMessage').value.trim();
    if (!name || !email || !message) {
      return alert('Please fill all fields');
    }
    const { error } = await supabase
      .from('collab_requests')
      .insert({
        artist_id: targetArtistId,
        sender_name: name,
        sender_email: email,
        message: message,
        status: 'pending'
      });
    if (error) {
      console.error('Send error:', error);
      alert('Failed to send: ' + error.message);
    } else {
      alert(`Message sent to ${targetArtistName}!`);
      closeCollabModal();
    }
  };
  window.playVideo = function(url) {
    document.getElementById('modalVideo').src = url;
    document.getElementById('videoModal').classList.add('active');
    document.getElementById('modalVideo').play();
  };
  window.closeModal = function() {
    document.getElementById('modalVideo').pause();
    document.getElementById('modalVideo').src = '';
    document.getElementById('videoModal').classList.remove('active');
  };
  document.getElementById('videoModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
  window.logout = async function() {
    await supabase.auth.signOut();
    location.href = 'login.html';
  };
  async function loadArtists() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return location.href = 'login.html';
    currentUser = user;
    const { data: artists } = await supabase
      .from('profiles')
      .select('id, name, logo_url, subdomain')
      .eq('collaboration_opt_in', true)
      .neq('id', currentUser.id);
    const grid = document.getElementById('artistsGrid');
    grid.innerHTML = '';
    if (!artists || artists.length === 0) {
      document.getElementById('noArtists').classList.remove('hidden');
      return;
    }
    for (const artist of artists) {
      const logo = artist.logo_url ? getMediaUrl(artist.logo_url) : 'https://placehold.co/200x200/emerald/white?text=Artist';
      const { data: videos } = await supabase
        .from('user_videos')
        .select('id, title, video_url')
        .eq('user_id', artist.id);
      let totalHearts = 0;
      let totalComments = 0;
      if (videos) {
        for (const v of videos) {
          const { count: hearts } = await supabase.from('video_likes').select('*', { count: 'exact', head: true }).eq('video_id', v.id);
          const { count: comments } = await supabase.from('video_comments').select('*', { count: 'exact', head: true }).eq('video_id', v.id);
          totalHearts += hearts || 0;
          totalComments += comments || 0;
        }
      }
      const videoList = videos?.length > 0
        ? videos.map(v => `<div class="video-item" onclick="playVideo('${getMediaUrl(v.video_url)}')">${v.title || 'Untitled Video'}</div>`).join('')
        : '<p class="text-gray-500 text-sm">No videos yet</p>';
      const profileId = artist.subdomain?.trim() || artist.id;
      const publicLink = `public-profile.html?id=${profileId}`;
      grid.innerHTML += `
        <div class="artist-card bg-gradient-to-br from-purple-900/50 to-black rounded-2xl overflow-hidden shadow-2xl border border-purple-600">
          <div class="p-6 text-center">
            <div class="flex items-center justify-center gap-4 mb-4">
              <img src="${logo}" class="w-20 h-20 rounded-full border-4 border-emerald-500 shadow-xl object-cover" onerror="this.src='https://placehold.co/80x80/emerald/white?text=A'">
              <h3 class="text-2xl font-black">${artist.name || 'Unknown Artist'}</h3>
            </div>
            <div class="flex justify-center gap-6 mb-6">
              <div class="stat-badge">
                ❤️ ${totalHearts} Hearts
              </div>
              <div class="stat-badge">
                💬 ${totalComments} Comments
              </div>
            </div>
            <div class="mb-6 bg-black/60 rounded-xl p-4 max-h-48 overflow-y-auto text-sm">
              ${videoList}
            </div>
            <div class="space-y-3">
              <a href="${publicLink}" target="_blank" class="block">
                <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition shadow-lg">
                  View Public Profile
                </button>
              </a>
              <button onclick="window.location.href='message-dashboard.html?initiate=${artist.id}&name=${encodeURIComponent(artist.name || 'Artist')}'"
                class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black py-4 rounded-xl shadow-xl transition transform hover:scale-105">
                Message for Collab
              </button>
            </div>
          </div>
        </div>`;
    }
  }
  loadArtists();
</script>
</body>
</html>
