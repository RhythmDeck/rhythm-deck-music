<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaboration Network | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/talkjs@0.16.8/dist/talkjs.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    .artist-card:hover {transform: translateY(-8px);transition:all .3s;box-shadow:0 20px 40px rgba(0,0,0,.8);}
    .email-hover {opacity:0;transition:opacity .4s;}
    .artist-card:hover .email-hover {opacity:1;}
    .song-item {
      padding: 10px 14px;
      border-radius: 10px;
      margin: 5px 0;
      background: rgba(255,255,255,0.05);
      transition: all .2s;
      cursor: pointer;
      font-weight: 500;
    }
    .song-item:hover {
      background: #a855f7;
      color: white;
      transform: translateX(6px);
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.98);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .modal.active { display: flex; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">

<header class="bg-black/80 backdrop-blur-md border-b border-purple-500 p-6 shadow-2xl">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <img src="logo-1-sm.jpg" alt="Logo" class="w-12 h-12 rounded-full">
      <h1 class="text-4xl font-black tracking-wider">RHYTHM DECK</h1>
    </div>
    <nav class="space-x-8">
      <a href="profile-admin-pro.html" class="hover:text-purple-400 transition">Back to Dashboard</a>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold">Logout</button>
    </nav>
  </div>
</header>

<section class="text-center py-20 px-6">
  <h2 class="text-6xl font-black mb-6 bg-gradient-to-r from-green-400 to-purple-500 bg-clip-text text-transparent">
    Collaboration Network
  </h2>
  <p class="text-xl max-w-3xl mx-auto opacity-90">
    Connect with Pro artists • View profiles • Listen • Message instantly
  </p>
</section>

<section class="max-w-7xl mx-auto px-6 pb-20">
  <div id="artistsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
  <p id="noArtists" class="text-center text-2xl py-20 text-gray-500 hidden">No artists in the network yet.</p>
</section>

<!-- TalkJS Chat -->
<div id="talkjs-container" style="position:fixed;bottom:20px;right:20px;width:380px;height:580px;z-index:9999;display:none;background:white;border-radius:16px;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.9);border:5px solid #10b981;"></div>

<!-- Video Modal -->
<div id="videoModal" class="modal">
  <div class="relative max-w-5xl w-full p-6">
    <button onclick="closeModal()" class="absolute top-4 right-6 text-white text-6xl z-10 hover:text-red-500 transition">&times;</button>
    <video id="modalVideo" controls autoplay class="w-full rounded-2xl shadow-2xl border-4 border-purple-600" style="max-height:85vh;"></video>
  </div>
</div>

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );

  const TALKJS_APP_ID = 'tLZqiXQU';
  const TALKJS_SECRET_KEY = 'sk_test_IEmPfWI8f9gVZUhShLIv8NibfXnXsZI1';

  let currentUser = null;
  let talkSession = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { alert('Login required'); window.location.href = 'login.html'; return; }
    currentUser = user;

    const { data: profile } = await supabase
      .from('profiles')
      .select('collaboration_opt_in')
      .eq('id', user.id)
      .single();

    if (!profile?.collaboration_opt_in) {
      alert("Join the network first in your dashboard!");
      window.location.href = 'profile-admin-pro.html';
      return;
    }

    await loadArtists();
    await initTalkJS();
  });

  async function loadArtists() {
    const { data: artists } = await supabase
      .from('profiles')
      .select('id, name, logo_url, banner_url, email, custom_url_id')
      .eq('collaboration_opt_in', true)
      .neq('id', currentUser.id);

    const grid = document.getElementById('artistsGrid');
    grid.innerHTML = '';

    if (!artists || artists.length === 0) {
      document.getElementById('noArtists').classList.remove('hidden');
      return;
    }

    for (const artist of artists) {
      // Logo & Banner
      const logoUrl = artist.logo_url 
        ? supabase.storage.from('media').getPublicUrl(artist.logo_url).data.publicUrl 
        : 'logo-placeholder.png';

      const bannerUrl = artist.banner_url 
        ? supabase.storage.from('media').getPublicUrl(artist.banner_url).data.publicUrl 
        : 'https://via.placeholder.com/800x300/4c1d95/ffffff?text=Artist+Banner';

      // Videos
      const { data: videos } = await supabase
        .from('user_videos')
        .select('title, video_url')
        .eq('user_id', artist.id)
        .order('created_at', { ascending: false });

      const videoCount = videos?.length || 0;

      const videoList = videoCount > 0 
        ? videos.map(v => `
          <div class="song-item" onclick="playVideo('${v.video_url.replace(/'/g, "\\'")}')">
            ${v.title || 'Untitled Track'}
          </div>
        `).join('')
        : '<p class="text-gray-500 text-xs">No tracks uploaded yet</p>';

      // CRITICAL FIX: Use custom_url_id if exists and not empty
      const useId = (artist.custom_url_id && artist.custom_url_id.trim() !== '') 
        ? artist.custom_url_id 
        : artist.id;

      const publicProfileUrl = `https://rhythm-deck-music.onrender.com/public-profile.html?id=${useId}`;

      grid.innerHTML += `
        <div class="artist-card bg-gradient-to-br from-purple-900/40 to-black rounded-2xl overflow-hidden shadow-2xl border border-purple-600">
          <div class="h-40 bg-cover bg-center" style="background-image:url('${bannerUrl}')"></div>
          <div class="p-6 -mt-20 relative z-10 text-center">
            <img src="${logoUrl}" class="w-32 h-32 rounded-full mx-auto border-8 border-black shadow-2xl object-cover">
            <h3 class="text-2xl font-black mt-4">${artist.name || 'Artist'}</h3>
            <p class="email-hover text-green-300 text-sm mt-1">Email: ${artist.email || 'Hidden'}</p>
            <p class="text-sm text-gray-400 mt-2">${videoCount} Track${videoCount !== 1 ? 's' : ''}</p>

            <div class="mt-5 text-left bg-black/50 rounded-xl p-4 max-h-64 overflow-y-auto text-sm font-medium">
              ${videoList}
            </div>

            <a href="${publicProfileUrl}" target="_blank" class="block mt-5">
              <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition transform hover:scale-105">
                View Public Profile
              </button>
            </a>

            <button onclick="startChat('${artist.id}', '${(artist.name || 'Artist').replace(/'/g, "\\'")}', '${artist.email || ''}')"
              class="w-full mt-3 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-black text-lg py-4 rounded-xl shadow-xl transition transform hover:scale-105">
              Message for Collab
            </button>
          </div>
        </div>`;
    }
  }

  // Video Modal
  function playVideo(url) {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('modalVideo');
    video.src = url;
    modal.classList.add('active');
    setTimeout(() => video.play(), 300); // Small delay for smooth load
  }

  function closeModal() {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('modalVideo');
    video.pause();
    video.src = '';
    modal.classList.remove('active');
  }

  document.getElementById('videoModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('videoModal')) closeModal();
  });

  // TalkJS
  function createTalkJSSignature(userId) {
    const message = userId + ':' + TALKJS_APP_ID;
    const hash = CryptoJS.HmacSHA256(message, TALKJS_SECRET_KEY);
    return CryptoJS.enc.Base64.stringify(hash);
  }

  async function initTalkJS() {
    await Talk.ready;

    const signature = createTalkJSSignature(currentUser.id);

    talkSession = new Talk.Session({
      appId: TALKJS_APP_ID,
      me: new Talk.User({
        id: currentUser.id,
        name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        email: currentUser.email
      }),
      signature: signature
    });

    // Register current user
    await fetch(`https://api.talkjs.com/v1/${TALKJS_APP_ID}/users/${currentUser.id}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TALKJS_SECRET_KEY}`
      },
      body: JSON.stringify({
        name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
        email: [currentUser.email]
      })
    }).catch(console.error);

    // Pre-mount empty chatbox
    talkSession.createChatbox().mount(document.getElementById('talkjs-container'));
  }

  async function startChat(otherUserId, otherUserName, otherUserEmail) {
    if (!talkSession) {
      alert("Chat still loading... try again in 2 seconds");
      return;
    }

    try {
      // Register other user
      await fetch(`https://api.talkjs.com/v1/${TALKJS_APP_ID}/users/${otherUserId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${TALKJS_SECRET_KEY}`
        },
        body: JSON.stringify({
          name: otherUserName,
          email: [otherUserEmail || `${otherUserId}@rhythmdeck.local`]
        })
      });

      const otherUser = new Talk.User({ id: otherUserId, name: otherUserName });
      const conversation = talkSession.getOrCreateConversation(Talk.oneOnOneId(talkSession.me, otherUser));
      conversation.setParticipant(talkSession.me);
      conversation.setParticipant(otherUser);
      conversation.setAttributes({ subject: "Let's Collab – Rhythm Deck" });

      const chatbox = talkSession.createChatbox(conversation);
      chatbox.mount(document.getElementById('talkjs-container'));
      document.getElementById('talkjs-container').style.display = 'block';

    } catch (err) {
      console.error("Chat failed:", err);
      alert("Chat failed to open. Please try again.");
    }
  }

  async function logout() {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
