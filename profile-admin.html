<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Free Profile | Rhythm Deck</title>
 <base href="/">
 <script src="https://cdn.tailwindcss.com"></script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <style>
   .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin-left:8px;}
   @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
   .video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
   .video-card:hover .video-overlay{opacity:1}
   #videoModal{position:fixed;inset:0;background:rgba(0,0,0.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
   #videoModal.show{opacity:1;visibility:visible}
   #modalVideo{max-width:90%;max-height:90%;border:4px solid #10b981;border-radius:12px}
   #closeModal{position:absolute;top:20px;right:20px;background:white;color:black;width:50px;height:50px;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(0,0,0,.8);z-index:10}
   #risingStarBadge{position:absolute;top:20px;right:20px;width:120px;height:120px;z-index:20;opacity:0;transform:scale(0);transition:all .6s cubic-bezier(.68,-.55,.265,1.55)}
   #risingStarBadge.show{opacity:1;transform:scale(1) rotate(8deg)}
   .like-btn{display:flex;align-items:center;gap:8px;font-weight:bold;color:#666;transition:all .3s}
   .like-btn.liked{color:#ef4444}
   .like-btn.liked svg{fill:#ef4444;stroke:#ef4444;filter:drop-shadow(0 0 10px #ef4444)}
   .like-btn svg{width:24px;height:24px;transition:all .3s}
   .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem 1rem;margin-bottom:.5rem}
   .comment-name{font-weight:700;color:#10b981}
   .comment-text{color:#1f2937;margin-left:.5rem;font-weight:500}
 </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

<!-- YOUR HTML (unchanged) -->
<header class="bg-black text-white p-4 flex justify-between items-center shadow-lg">
  <div class="flex items-center space-x-3">
    <img src="logo-1-sm.jpg" alt="Logo" class="w-10 h-10 rounded-full">
    <div><h1 class="text-2xl font-bold tracking-wide">RHYTHM DECK</h1><p class="text-sm text-gray-300">Free Plan</p></div>
  </div>
  <nav class="space-x-4">
    <a href="index.html" class="hover:underline">Home</a>
    <a href="pricing.html" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white px-5 py-2 rounded-lg font-bold hover:from-green-600 hover:to-emerald-700 shadow-lg">Upgrade to Pro</a>
    <button onClick="logout()" class="bg-white text-black px-4 py-1 rounded hover:bg-gray-300 font-medium">Logout</button>
  </nav>
</header>

<!-- ... rest of your HTML exactly the same ... -->

<script>
  // THIS IS THE ONLY CHANGE YOU NEED
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2MDkyOTgzOCwiZXhwIjoyMDc2NTA1ODM4fQ.9gKZs9q3bK8i0Y8p4d5f6g7h8j9k0l1m2n3o4p5q6r7s8t9u0v"
  );

  let currentUser = null;

  async function loadVideos() {
    const { data: videos } = await supabase
      .from('user_videos')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });

    const list = document.getElementById('videoList');
    list.innerHTML = videos?.length ? '' : '<p class="col-span-full text-center text-gray-600 italic py-12 text-xl">No videos yet. Upload your first one!</p>';

    for (const v of (videos || [])) {
      const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;

      const thumbUrl = supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl;

      // NOW THIS WORKS — service_role key bypasses RLS
      const { count: likeCount = 0 } = await supabase
        .from('video_likes')
        .select('id', { count: 'exact', head: true })
        .eq('video_id', v.id);

      const { data: comments = [] } = await supabase
        .from('video_comments')
        .select('name, comment')
        .eq('video_id', v.id)
        .order('created_at', { ascending: false });

      list.innerHTML += `
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
          <div class="relative cursor-pointer" onclick="openVideoPopup('${videoUrl}')">
            <img src="${thumbUrl}" class="w-full h-48 object-cover" onerror="this.src='logo-placeholder.png'">
            <div class="video-overlay">
              <svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M8 5v10l7-5-7-5z"/></svg>
            </div>
          </div>
          <div class="p-6 space-y-4">
            <h4 class="font-black text-xl text-emerald-900 truncate">${v.title || 'Untitled Video'}</h4>
            <div class="flex justify-between items-center">
              <div class="like-btn ${likeCount > 0 ? 'liked' : ''}">
                Heart
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                </svg>
                <span class="font-bold">${likeCount}</span>
              </div>
              <button onclick="navigator.clipboard.writeText('${videoUrl}'); alert('Video link copied!')"
                      class="text-emerald-600 font-bold hover:text-emerald-700">Share</button>
            </div>
            <div class="border-t pt-4 space-y-3 max-h-48 overflow-y-auto">
              ${comments.length === 0 ? '<p class="text-gray-500 italic text-center">No comments yet</p>' : ''}
              ${comments.map(c => `<div class="comment-bubble"><span class="comment-name">${c.name}:</span> <span class="comment-text">${c.comment}</span></div>`).join('')}
            </div>
            <button onclick="event.stopPropagation(); deleteVideo('${v.id}', '${v.video_url}', '${v.thumbnail_url}')"
                    class="w-full mt-4 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg">
              Delete Video
            </button>
          </div>
        </div>`;
    }
    document.getElementById('risingStarBadge').classList.toggle('show', (videos?.length || 0) >= 3);
  }

  // ... rest of your functions stay exactly the same ...
  // deleteVideo, uploadAndPublish, saveArtistName, etc. — all unchanged

  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return location.href = 'login.html';
    currentUser = user;

    // ... your existing profile loading code ...

    await loadVideos(); // ← Now hearts will show immediately
  });
</script>
</body>
</html>
