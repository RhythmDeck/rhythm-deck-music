<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Deck Artist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .video-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-overlay:hover{opacity:1}
    #videoModal{position:fixed;inset:0;background:rgba(0,0,0.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    #videoModal.show{opacity:1;visibility:visible}
    #modalVideo{max-width:90%;max-height:90%;border:4px solid #10b981;border-radius:12px}
    #closeModal{position:absolute;top:20px;right:20px;background:white;color:black;width:50px;height:50px;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(0,0,0,.8);z-index:10}
    #risingStarBadge{position:absolute;top:20px;right:20px;width:120px;height:120px;z-index:20;opacity:0;transform:scale(0);transition:all .6s cubic-bezier(.68,-.55,.265,1.55)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(8deg)}
    .like-btn{display:flex;align-items:center;gap:8px;font-weight:bold;color:#666;transition:all .3s}
    .like-btn.liked{color:#ef4444}
    .like-btn.liked svg{fill:#ef4444;stroke:#ef4444;filter:drop-shadow(0 0 10px #ef4444)}
    .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem 1rem;margin-bottom:.5rem}
    .comment-name{font-weight:700;color:#10b981}
    .comment-text{color:#1f2937;margin-left:.5rem;font-weight:500}
  </style>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Header -->
  <header class="bg-black text-white p-6 text-center">
    <h1 class="text-4xl font-black tracking-wider">RHYTHM DECK</h1>
  </header>

  <!-- Hero Section -->
  <section class="relative h-96 bg-gradient-to-br from-purple-900 to-blue-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="absolute inset-0 w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="absolute inset-0 flex items-center justify-center text-white text-5xl font-black opacity-70">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star" class="hidden">

    <div class="absolute bottom-6 left-6 w-40 h-40 rounded-full border-8 border-white shadow-2xl overflow-hidden bg-white">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-full h-full object-cover">
    </div>
  </section>

  <!-- Artist Info -->
  <section class="max-w-6xl mx-auto px-6 py-12">
    <div class="text-center mb-12">
      <h1 id="artistName" class="text-5xl font-black text-emerald-700 mb-4">Loading Artist...</h1>
      <p id="bio" class="text-xl text-gray-700 max-w-3xl mx-auto leading-relaxed">Bio loading...</p>
    </div>

    <!-- Videos Grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-10" id="videoGrid">
      <p class="col-span-full text-center text-gray-600 text-xl italic py-20">Loading videos...</p>
    </div>
  </section>

  <!-- Video Modal -->
  <div id="videoModal">
    <div id="closeModal">X</div>
    <video id="modalVideo" controls autoplay class="shadow-2xl"></video>
  </div>

<script>
  const supabase = window.supabase.createClient(
    "https://bxoqhmfnseskwqkywppg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
  );

  // Get the subdomain from URL: public-profile.html?id=yourname
  const urlParams = new URLSearchParams(window.location.search);
  const subdomain = urlParams.get('id') || 'demo';

  async function loadPublicProfile() {
    try {
      // Find the profile by subdomain
      const { data: profile } = await supabase
        .from('profiles')
        .select('name, bio, banner_url, logo_url')
        .eq('subdomain', subdomain)
        .single();

      if (!profile) {
        document.body.innerHTML = `<div class="text-center py-40 text-3xl">Artist not found</div>`;
        return;
      }

      // Update name & bio
      document.getElementById('artistName').textContent = profile.name || 'Unnamed Artist';
      document.getElementById('bio').textContent = profile.bio || 'No bio yet.';

      // Load banner
      if (profile.banner_url) {
        const bannerUrl = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl;
        const bannerImg = document.getElementById('banner');
        bannerImg.src = bannerUrl;
        bannerImg.classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      }

      // Load logo
      if (profile.logo_url) {
        document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl;
      }

      // Find user_id from profile (we need it to load videos)
      const { data: fullProfile } = await supabase
        .from('profiles')
        .select('id')
        .eq('subdomain', subdomain)
        .single();

      if (!fullProfile) return;

      // Load videos
      const { data: videos } = await supabase
        .from('user_videos')
        .select('*')
        .eq('user_id', fullProfile.id)
        .order('created_at', { ascending: false });

      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (!videos || videos.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-gray-600 text-xl italic py-20">No videos published yet.</p>';
        return;
      }

      // Show rising star badge if 3+ videos
      if (videos.length >= 3) {
        document.getElementById('risingStarBadge').classList.remove('hidden');
        document.getElementById('risingStarBadge').classList.add('show');
      }

      for (const v of videos) {
        const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
        const thumbUrl = supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl;

        const { count: likes = 0 } = await supabase
          .from('video_likes')
          .select('*', { count: 'exact', head: true })
          .eq('video_id', v.id);

        const { data: comments = [] } = await supabase
          .from('video_comments')
          .select('name, comment')
          .eq('video_id', v.id)
          .order('created_at', { ascending: false });

        grid.innerHTML += `
          <div class="bg-white rounded-2xl shadow-2xl overflow-hidden transform hover:scale-105 transition">
            <div class="relative cursor-pointer" onclick="openVideo('${videoUrl}')">
              <img src="${thumbUrl}" class="w-full h-64 object-cover" onerror="this.src='logo-placeholder.png'">
              <div class="video-overlay">
                <svg class="w-20 h-20 text-white" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M8 5v10l7-5-7-5z"/>
                </svg>
              </div>
            </div>
            <div class="p-6">
              <h3 class="font-black text-2xl text-emerald-900 mb-3">${v.title || 'Untitled'}</h3>
              <div class="flex items-center gap-3 text-lg">
                <div class="like-btn liked">
                  Heart <span class="font-bold">${likes}</span>
                </div>
              </div>
              <div class="mt-4 space-y-2 text-sm">
                ${comments.slice(0, 3).map(c => 
                  `<div class="comment-bubble"><span class="comment-name">${c.name}:</span> <span class="comment-text">${c.comment}</span></div>`
                ).join('')}
                ${comments.length > 3 ? `<p class="text-gray-500 italic">+${comments.length - 3} more comments</p>` : ''}
              </div>
            </div>
          </div>`;
      }
    } catch (err) {
      console.error(err);
      document.getElementById('videoGrid').innerHTML = '<p class="col-span-full text-center text-red-600">Error loading profile.</p>';
    }
  }

  function openVideo(url) {
    document.getElementById('modalVideo').src = url;
    document.getElementById('videoModal').classList.add('show');
  }

  document.getElementById('closeModal').onclick = () => {
    document.getElementById('modalVideo').src = '';
    document.getElementById('videoModal').classList.remove('show');
  };

  // Load everything when page opens
  loadPublicProfile();
</script>
</body>
</html>
