<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(to bottom, #000000, #0f172a); color: white; }
    .password-toggle { cursor: pointer; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: #9ca3af; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <!-- Header -->
  <header class="sticky top-0 z-10 bg-black/90 backdrop-blur-md border-b border-gray-800/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-5 flex flex-col sm:flex-row items-center justify-between gap-4 sm:gap-0">
      <div class="flex items-center gap-3 sm:gap-4">
        <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="w-10 sm:w-12 h-10 sm:h-12 rounded-full border-2 border-emerald-500 shadow-md object-cover" />
        <div>
          <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">
            Rhythm Deck
          </h1>
          <p class="text-xs sm:text-sm text-gray-300 font-medium">Unleash Your Beat</p>
        </div>
      </div>
      <div class="flex items-center">
        <a href="index.html" class="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-emerald-400 hover:text-emerald-300 px-4 sm:px-6 py-2 sm:py-3 rounded-lg font-medium transition shadow-md text-sm sm:text-base">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 sm:h-5 w-4 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Back to Home
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-16 sm:py-24 flex items-center justify-center min-h-[70vh]">
    <div class="bg-gray-900/70 rounded-2xl p-8 sm:p-12 border border-emerald-600/50 shadow-2xl w-full max-w-lg">
      <h2 class="text-3xl sm:text-4xl font-bold mb-6 text-center text-emerald-400">
        Reset Your Password
      </h2>
      <p class="text-lg text-gray-300 mb-10 text-center">
        Choose a strong new password for your account.
      </p>

      <form id="resetForm" class="space-y-6">
        <div class="relative">
          <label class="block text-sm font-medium text-gray-300 mb-2">New Password *</label>
          <input type="password" id="newPassword" required minlength="8" class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500" placeholder="New password (min 8 characters)">
          <span class="password-toggle absolute right-4 top-10 text-gray-400" onclick="togglePassword('newPassword')">👁️</span>
        </div>

        <div class="relative">
          <label class="block text-sm font-medium text-gray-300 mb-2">Confirm New Password *</label>
          <input type="password" id="confirmPassword" required class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500" placeholder="Confirm new password">
          <span class="password-toggle absolute right-4 top-10 text-gray-400" onclick="togglePassword('confirmPassword')">👁️</span>
        </div>

        <div id="status" class="text-center text-sm min-h-[1.5rem] mt-4"></div>

        <div class="text-center pt-4">
          <button type="button" onclick="handleReset()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold text-xl px-12 py-5 rounded-full shadow-2xl transform hover:scale-105 transition-all duration-300 w-full">
            Update Password
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-black text-white mt-16 p-8 text-center text-sm border-t border-gray-800">
    <p>© 2025 Rhythm Deck Music. All rights reserved.</p>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const toggleIcon = field.nextElementSibling;
      if (field.type === "password") {
        field.type = "text";
        toggleIcon.textContent = "🙈";
      } else {
        field.type = "password";
        toggleIcon.textContent = "👁️";
      }
    }

    async function handleReset() {
      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const status = document.getElementById('status');

      // Basic client-side validation
      if (!newPassword || !confirmPassword) {
        status.textContent = 'Please fill both password fields.';
        status.className = 'text-red-400';
        return;
      }

      if (newPassword !== confirmPassword) {
        status.textContent = 'Passwords do not match.';
        status.className = 'text-red-400';
        return;
      }

      if (newPassword.length < 8) {
        status.textContent = 'Password must be at least 8 characters long.';
        status.className = 'text-red-400';
        return;
      }

      status.textContent = 'Updating password...';
      status.className = 'text-gray-300';

      // Update password via Supabase (session is already active from recovery link)
      const { data, error } = await supabase.auth.updateUser({
        password: newPassword
      });

      if (error) {
        console.error('Password update error:', error);
        status.textContent = 'Error: ' + (error.message || 'Failed to update password. The link may have expired.');
        status.className = 'text-red-400';
      } else {
        status.textContent = 'Password updated successfully! Redirecting to login...';
        status.className = 'text-emerald-400';

        // Sign out the temporary recovery session
        await supabase.auth.signOut();

        // Redirect to login after short delay
        setTimeout(() => {
          window.location.href = 'industry-login.html';
        }, 2500);
      }
    }

    // On page load: check if we arrived via valid recovery link
    window.addEventListener('load', async () => {
      const { data: { session }, error } = await supabase.auth.getSession();

      if (error || !session) {
        document.querySelector('main').innerHTML = `
          <div class="text-center py-20 px-6">
            <h2 class="text-3xl font-bold text-red-400 mb-6">Invalid or Expired Reset Link</h2>
            <p class="text-lg text-gray-300 mb-8">This password reset link is no longer valid or has expired.</p>
            <a href="industry-login.html" class="inline-block bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-4 rounded-xl transition">
              Back to Login
            </a>
            <p class="text-gray-400 mt-6">Request a new reset link from the login page.</p>
          </div>`;
      }
    });
  </script>
</body>
</html>
