<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create New Password | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex flex-col">

<!-- HEADER -->
<header class="bg-black/70 border-b border-purple-700/50 px-6 py-4 flex items-center justify-between gap-4">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full">
    <div>
      <div class="text-2xl font-black text-emerald-400">RHYTHM DECK</div>
      <div class="text-sm text-purple-300">Unleash Your Beat</div>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="flex-1 flex items-center justify-center px-6">
  <div class="bg-gray-900 p-10 rounded-2xl max-w-md w-full border border-emerald-500 shadow-xl">

    <h1 class="text-3xl font-black text-emerald-400 text-center mb-6">
      Create New Password
    </h1>

    <form id="passwordForm" class="space-y-4">
      <input
        id="password"
        type="password"
        required
        placeholder="New password"
        class="w-full p-4 bg-gray-800 border border-gray-700 rounded-xl"
      />

      <input
        id="confirmPassword"
        type="password"
        required
        placeholder="Confirm new password"
        class="w-full p-4 bg-gray-800 border border-gray-700 rounded-xl"
      />

      <button
        type="submit"
        class="w-full py-4 bg-emerald-600 rounded-xl font-black hover:bg-emerald-700 transition"
      >
        Update Password
      </button>
    </form>

    <p id="status" class="text-center text-sm mt-4 hidden"></p>

  </div>
</main>

<!-- FOOTER -->
<footer class="bg-black/80 border-t border-purple-700/30 py-4 text-center text-sm text-gray-400">
  © 2026 Rhythm Deck Music
</footer>

<!-- SCRIPT -->
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

// 🔐 Determine where user came from
const params = new URLSearchParams(window.location.search);
const from = params.get('from') === 'industry' ? 'industry' : 'artist';

const form = document.getElementById('passwordForm');
const status = document.getElementById('status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;

  if (password.length < 6) {
    showError('Password must be at least 6 characters.');
    return;
  }

  if (password !== confirm) {
    showError('Passwords do not match.');
    return;
  }

  status.textContent = 'Updating password…';
  status.className = 'text-center text-sm mt-4 text-gray-300';
  status.classList.remove('hidden');

  const { error } = await supabase.auth.updateUser({ password });

  if (error) {
    showError(error.message);
    return;
  }

  status.textContent = 'Password updated! Redirecting…';
  status.className = 'text-center text-sm mt-4 text-emerald-400';

  setTimeout(() => {
    window.location.href =
      from === 'industry'
        ? 'industry-login.html'
        : 'login.html';
  }, 1500);
});

function showError(msg) {
  status.textContent = msg;
  status.className = 'text-center text-sm mt-4 text-red-400';
  status.classList.remove('hidden');
}
</script>

</body>
</html>
