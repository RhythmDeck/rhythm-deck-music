<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create New Password | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
  <!-- HEADER -->
  <header class="bg-black/70 border-b border-purple-700/50 px-6 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full" alt="Rhythm Deck Logo">
      <div>
        <div class="text-2xl font-black text-emerald-400">RHYTHM DECK</div>
        <div class="text-sm text-purple-300">Unleash Your Beat</div>
      </div>
    </div>
    <a href="index.html" class="bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-black px-6 py-3 rounded-full hover:opacity-90">
      Home
    </a>
  </header>

  <!-- MAIN -->
  <main class="flex-1 flex items-center justify-center px-6">
    <div class="bg-gray-900 p-10 rounded-2xl max-w-md w-full border border-emerald-500 shadow-xl">
      <h1 class="text-3xl font-black text-emerald-400 text-center mb-6">
        Create New Password
      </h1>
      <p class="text-gray-400 text-center mb-8">
        Enter your new password below
      </p>

      <form id="passwordForm" class="space-y-5">
        <div class="relative">
          <input
            id="password"
            type="password"
            required
            minlength="6"
            placeholder="New password (min 6 characters)"
            class="w-full p-4 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500"
          />
          <button type="button" id="togglePassword" 
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
            👁
          </button>
        </div>

        <div class="relative">
          <input
            id="confirmPassword"
            type="password"
            required
            minlength="6"
            placeholder="Confirm new password"
            class="w-full p-4 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500"
          />
          <button type="button" id="toggleConfirmPassword" 
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
            👁
          </button>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full py-4 bg-emerald-600 rounded-xl font-black hover:bg-emerald-700 transition"
        >
          Update Password
        </button>
      </form>

      <p id="status" class="text-center text-sm mt-6 hidden"></p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-black/80 border-t border-purple-700/30 py-4 text-center text-sm text-gray-400">
    © 2026 Rhythm Deck Music
  </footer>

  <!-- SCRIPT -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    const form = document.getElementById('passwordForm');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');

    // Password visibility toggles
    function setupToggle(inputId, toggleId) {
      const input = document.getElementById(inputId);
      const toggle = document.getElementById(toggleId);
      if (toggle && input) {
        toggle.addEventListener('click', () => {
          if (input.type === 'password') {
            input.type = 'text';
            toggle.textContent = '🙈';
          } else {
            input.type = 'password';
            toggle.textContent = '👁';
          }
        });
      }
    }

    setupToggle('password', 'togglePassword');
    setupToggle('confirmPassword', 'toggleConfirmPassword');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password.length < 6) {
        showStatus('Password must be at least 6 characters.', 'red');
        return;
      }

      if (password !== confirm) {
        showStatus('Passwords do not match.', 'red');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      showStatus('Updating password…', 'gray');

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        showStatus(error.message, 'red');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      } else {
        showStatus('✅ Password updated successfully!', 'emerald');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      }
    });

    function showStatus(message, color) {
      status.textContent = message;
      status.classList.remove('hidden');
      if (color === 'red') {
        status.className = 'text-center text-sm mt-6 text-red-400';
      } else if (color === 'emerald') {
        status.className = 'text-center text-sm mt-6 text-emerald-400';
      } else {
        status.className = 'text-center text-sm mt-6 text-gray-300';
      }
    }
  </script>
</body>
</html>
