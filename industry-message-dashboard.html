<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Industry Messages | Rhythm Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo-favicon.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>

<style>
html,body{height:100%}
.msg-item:hover{background:rgba(255,255,255,0.08)}
.msg-preview{
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical
}
.selected{background:rgba(255,255,255,0.15)!important}
.folder-active{background:rgba(255,255,255,0.12)}
</style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white flex flex-col min-h-screen">

<!-- HEADER -->
<header class="bg-black/70 border-b border-purple-700/50 px-6 py-4 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full">
    <div>
      <div class="text-2xl font-black text-emerald-400">RHYTHM DECK</div>
      <div class="text-sm text-purple-300">Unleash Your Beat</div>
    </div>
  </div>

  <a href="industry-dashboard.html"
     class="bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-black px-6 py-3 rounded-full">
    Back to Dashboard
  </a>
</header>

<!-- MAIN -->
<main class="flex-1 p-4">

  <h1 class="text-4xl font-black mb-4 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
    Industry Messages
  </h1>

  <!-- 3 COLUMN LAYOUT -->
  <div
    class="h-[80vh] grid gap-4"
    style="grid-template-columns: 260px 420px 1fr;"
  >

    <!-- FOLDERS -->
    <aside class="bg-black/40 rounded-xl overflow-hidden flex flex-col">
      <div class="p-4 font-black border-b border-purple-600 text-emerald-400">
        Folders
      </div>

      <button onclick="loadFolder('inbox')" id="folder-inbox"
        class="text-left px-5 py-3 font-bold hover:bg-white/10 folder-active">
        📥 Inbox <span id="inboxCount"></span>
      </button>

      <button onclick="loadFolder('sent')" id="folder-sent"
        class="text-left px-5 py-3 font-bold hover:bg-white/10">
        📤 Sent
      </button>

      <button onclick="loadFolder('trash')" id="folder-trash"
        class="text-left px-5 py-3 font-bold hover:bg-white/10 text-red-400">
        🧹 Trash
      </button>
    </aside>

    <!-- CONVERSATION LIST -->
    <aside class="bg-black/40 rounded-xl overflow-hidden flex flex-col">
      <div id="folderTitle" class="p-4 font-bold border-b border-purple-600">
        Inbox
      </div>
      <div id="conversationList" class="flex-1 overflow-y-auto"></div>
    </aside>

    <!-- MESSAGE VIEW -->
    <section id="messageView"
      class="bg-black/40 rounded-xl p-6 overflow-y-auto">
      <div class="text-gray-400 text-center mt-32">
        Select a conversation
      </div>
    </section>

  </div>

</main>

<footer class="bg-black/80 border-t border-purple-700/30 py-4 text-center text-sm text-gray-400">
  © 2026 Rhythm Deck Music
</footer>

<!-- REPLY MODAL -->
<div id="replyModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
  <div class="bg-gray-900 rounded-xl p-6 w-full max-w-xl relative">
    <button onclick="closeReply()" class="absolute top-3 right-4 text-3xl text-red-500">×</button>
    <h2 class="text-2xl font-black text-emerald-400 mb-3">Reply</h2>
    <textarea id="replyText" rows="6"
      class="w-full bg-black/50 border border-emerald-500 rounded-lg p-3 text-white"></textarea>
    <button onclick="sendReply()"
      class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-black">
      Send Reply
    </button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

let userId;
let messages = [];
let activeRoot = null;
let currentFolder = 'inbox';

(async ()=>{
  const { data } = await supabase.auth.getSession();
  if (!data.session) return location.href='index.html';
  userId = data.session.user.id;
  loadFolder('inbox');
})();

async function loadFolder(folder){
  currentFolder = folder;
  activeRoot = null;

  ['inbox','sent','trash'].forEach(f=>{
    document.getElementById('folder-'+f)
      .classList.toggle('folder-active',f===folder);
  });

  document.getElementById('folderTitle').innerText =
    folder.charAt(0).toUpperCase()+folder.slice(1);

  const { data } = await supabase
    .from('messages')
    .select('*')
    .eq('owner_id',userId)
    .eq('folder',folder)
    .order('created_at',{ascending:false});

  messages = data || [];
  renderConversations();
  updateInboxCount();
}

function renderConversations(){
  const list = document.getElementById('conversationList');
  list.innerHTML = '';

  const threads = {};
  messages.forEach(m=>{
    const root = m.parent_id || m.id;
    threads[root] ??= [];
    threads[root].push(m);
  });

  Object.entries(threads).forEach(([rootId,thread])=>{
    const latest = thread.at(-1);
    const unread = latest.receiver_id===userId && !latest.read_at;

    const div = document.createElement('div');
    div.className = `msg-item p-4 border-b border-gray-800 cursor-pointer ${activeRoot===rootId?'selected':''}`;
    div.onclick=()=>openThread(rootId);
    div.innerHTML=`
      <p class="font-bold ${unread?'text-emerald-400':''}">
        ${latest.subject || 'Conversation'}
      </p>
      <p class="msg-preview text-gray-400">${latest.body}</p>
    `;
    list.appendChild(div);
  });
}

async function openThread(rootId){
  activeRoot = rootId;
  const thread = messages.filter(m=>m.id===rootId||m.parent_id===rootId);

  await supabase.from('messages')
    .update({read_at:new Date().toISOString()})
    .eq('owner_id',userId)
    .eq('parent_id',rootId)
    .is('read_at',null);

  document.getElementById('messageView').innerHTML =
    thread.map(m=>`
      <div class="mb-4 p-4 rounded-xl bg-black/30">
        <p class="font-bold ${m.sender_id===userId?'text-emerald-400':'text-purple-400'}">
          ${m.sender_id===userId?'You':'Them'}
        </p>
        <p>${m.body}</p>
      </div>
    `).join('')+
    `<button onclick="openReply()" class="mt-6 bg-emerald-600 px-8 py-3 rounded-xl font-black">Reply</button>`;

  updateInboxCount();
}

function openReply(){replyModal.classList.remove('hidden');replyModal.classList.add('flex')}
function closeReply(){replyModal.classList.add('hidden')}

async function sendReply(){
  const text = replyText.value.trim();
  if(!text) return;

  const root = messages.find(m=>m.id===activeRoot);
  const receiver = root.sender_id===userId?root.receiver_id:root.sender_id;

  await supabase.from('messages').insert([
    {parent_id:activeRoot,sender_id:userId,receiver_id:receiver,owner_id:userId,folder:'sent',body:text},
    {parent_id:activeRoot,sender_id:userId,receiver_id:receiver,owner_id:receiver,folder:'inbox',body:text}
  ]);

  closeReply();
  loadFolder(currentFolder);
}

async function updateInboxCount(){
  const { data } = await supabase
    .from('messages')
    .select('id')
    .eq('owner_id',userId)
    .eq('folder','inbox')
    .is('read_at',null);

  document.getElementById('inboxCount').innerText =
    data?.length ? `(${data.length})` : '';
}

window.loadFolder=loadFolder;
window.openReply=openReply;
window.closeReply=closeReply;
window.sendReply=sendReply;
</script>

</body>
</html>
