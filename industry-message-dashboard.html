<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Industry Messages | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; }
    .msg-item:hover { background: rgba(255,255,255,0.08); cursor: pointer; }
    .msg-preview { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .selected { background: rgba(255,255,255,0.15) !important; }
    .folder-active { background: rgba(255,255,255,0.12); }
    .unread-conv { font-weight: bold; }
    .status-unread { color: #10b981; font-weight: bold; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white flex flex-col min-h-screen">
<header class="bg-black/70 border-b border-purple-700/50 px-6 py-4 flex items-center justify-between gap-4">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full">
    <div>
      <div class="text-2xl font-black text-emerald-400">RHYTHM DECK</div>
      <div class="text-sm text-purple-300">Unleash Your Beat</div>
    </div>
  </div>
  <a href="industry-dashboard.html" class="bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-black px-6 py-3 rounded-full hover:opacity-90">
    Back to Dashboard
  </a>
</header>
<main class="flex-1 p-4">
  <h1 class="text-4xl font-black mb-6 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent text-center md:text-left">
    Industry Messages
  </h1>
  <div class="h-[80vh] grid gap-4" style="grid-template-columns: 260px 420px 1fr;">
    <aside class="bg-black/40 rounded-xl overflow-hidden flex flex-col">
      <div class="p-4 font-black border-b border-purple-600 text-emerald-400">Folders</div>
      <button onclick="loadFolder('inbox')" id="folder-inbox" class="text-left px-5 py-3 font-bold hover:bg-white/10 folder-active">
        📥 Inbox <span id="inboxCount"></span>
      </button>
      <button onclick="loadFolder('sent')" id="folder-sent" class="text-left px-5 py-3 font-bold hover:bg-white/10">📤 Sent</button>
      <button onclick="loadFolder('trash')" id="folder-trash" class="text-left px-5 py-3 font-bold hover:bg-white/10 text-red-400">🧹 Trash</button>
    </aside>
    <aside class="bg-black/40 rounded-xl overflow-hidden flex flex-col">
      <div id="folderTitle" class="p-4 font-bold border-b border-purple-600">Inbox</div>
      <div id="conversationList" class="flex-1 overflow-y-auto"></div>
    </aside>
    <section id="messageView" class="bg-black/40 rounded-xl p-6 overflow-y-auto">
      <div class="text-gray-400 text-center mt-32">Select a conversation</div>
    </section>
  </div>
</main>
<footer class="bg-black/80 border-t border-purple-700/30 py-4 text-center text-sm text-gray-400">
  © 2026 Rhythm Deck Music
</footer>
<div id="replyModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-xl p-6 w-full max-w-xl relative">
    <button onclick="closeReplyModal()" class="absolute top-3 right-4 text-3xl text-red-500 hover:text-red-400">×</button>
    <h2 class="text-2xl font-black text-emerald-400 mb-4">Reply</h2>
    <input id="replySubject" type="text" placeholder="Subject" class="w-full mb-4 p-3 bg-black/50 border border-emerald-500 rounded-lg text-white">
    <textarea id="replyText" rows="6" class="w-full bg-black/50 border border-emerald-500 rounded-lg p-3 text-white resize-none" placeholder="Write your reply..."></textarea>
    <button onclick="sendReply()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-black transition">
      Send Reply
    </button>
  </div>
</div>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(
    'https://bxoqhmfnseskwqkywppg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
  );
  let currentUserId = null;
  let currentFolder = 'inbox';
  let currentConversationId = null;
  let currentMessages = [];
  async function init() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
      alert('Please log in to view messages.');
      window.location.href = 'login.html';
      return;
    }
    currentUserId = user.id;
    await loadFolder('inbox');
  }
  window.loadFolder = async function(folder) {
    currentFolder = folder;
    document.getElementById('folderTitle').textContent = folder.charAt(0).toUpperCase() + folder.slice(1);
    document.querySelectorAll('[id^="folder-"]').forEach(btn => {
      btn.classList.toggle('folder-active', btn.id === `folder-${folder}`);
    });
    document.getElementById('messageView').innerHTML = '<div class="text-gray-400 text-center mt-32">Select a conversation</div>';
    currentConversationId = null;
    await loadConversations();
  };
  async function loadConversations() {
    const listEl = document.getElementById('conversationList');
    listEl.innerHTML = '<div class="text-center py-10 text-gray-500">Loading...</div>';
    const { data: messages, error } = await supabase
      .from('messages')
      .select(`
        id,
        parent_id,
        sender_id,
        receiver_id,
        subject,
        body,
        created_at,
        read_at,
        folder,
        owner_id,
        sender:profiles (name)
      `)
      .eq('owner_id', currentUserId)
      .eq('folder', currentFolder)
      .order('created_at', { ascending: false });
    if (error) {
      listEl.innerHTML = `<div class="text-red-400 text-center py-10">Error loading messages: ${error.message}</div>`;
      console.error("Load conversations error:", error);
      return;
    }
    currentMessages = messages || [];
    if (currentMessages.length === 0) {
      listEl.innerHTML = '<div class="text-gray-400 text-center py-10">No messages here yet</div>';
      updateInboxCount();
      return;
    }
    const conversations = {};
    currentMessages.forEach(msg => {
      const rootId = msg.parent_id || msg.id;
      if (!conversations[rootId]) conversations[rootId] = { root: null, messages: [], latest: null };
      conversations[rootId].messages.push(msg);
      if (!msg.parent_id) conversations[rootId].root = msg;
      if (!conversations[rootId].latest || new Date(msg.created_at) > new Date(conversations[rootId].latest.created_at)) {
        conversations[rootId].latest = msg;
      }
    });
    const sorted = Object.values(conversations)
      .filter(c => c.root)
      .sort((a, b) => new Date(b.latest.created_at) - new Date(a.latest.created_at));
    listEl.innerHTML = sorted.map(conv => {
      const latest = conv.latest;
      const isUnread = !latest.read_at && latest.sender_id !== currentUserId;
      const isTrashFolder = currentFolder === 'trash';
      return `
        <div data-id="${conv.root.id}" class="msg-item p-4 border-b border-gray-800 cursor-pointer hover:bg-white/5 ${isUnread ? 'unread-conv' : ''}">
          <div class="flex justify-between items-start">
            <div class="flex-1">
              <p class="font-bold">${conv.root.sender?.name || 'Unknown'}</p>
              <p class="text-sm text-gray-400">${new Date(latest.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
              <p class="msg-preview text-gray-300 mt-1">${latest.subject ? latest.subject + ' — ' : ''}${latest.body.substring(0, 80)}${latest.body.length > 80 ? '...' : ''}</p>
            </div>
            <div class="flex items-center gap-2">
              ${isUnread ? '<span class="w-3 h-3 bg-emerald-500 rounded-full mt-2"></span>' : ''}
              ${!isTrashFolder ? `
                <button class="trash-btn text-red-400 hover:text-red-300 text-xl" title="Move to Trash">🗑️</button>
              ` : `
                <button class="delete-btn text-red-500 hover:text-red-700 text-xl" title="Delete Forever">❌</button>
              `}
            </div>
          </div>
        </div>
      `;
    }).join('');
    document.querySelectorAll('.msg-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (!e.target.classList.contains('trash-btn') && !e.target.classList.contains('delete-btn')) {
          showThread(item.dataset.id);
        }
      });
    });
    document.querySelectorAll('.trash-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const msgItem = btn.closest('.msg-item');
        const msgId = msgItem.dataset.id;
        if (!confirm('Move this message to Trash?')) return;
        const { error } = await supabase
          .from('messages')
          .update({ folder: 'trash' })
          .eq('id', msgId)
          .eq('owner_id', currentUserId);
        if (error) {
          alert('Failed to move to Trash: ' + error.message);
        } else {
          await loadConversations();
        }
      });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const msgItem = btn.closest('.msg-item');
        const msgId = msgItem.dataset.id;
        if (!confirm('Delete this message permanently? This cannot be undone.')) return;
        const { error } = await supabase
          .from('messages')
          .delete()
          .eq('id', msgId)
          .eq('owner_id', currentUserId);
        if (error) {
          alert('Delete failed: ' + error.message);
        } else {
          await loadConversations();
        }
      });
    });
    updateInboxCount();
  }
  async function updateInboxCount() {
    const el = document.getElementById('inboxCount');
    if (!el) return;
    const { count, error } = await supabase
      .from('messages')
      .select('id', { count: 'exact', head: true })
      .eq('owner_id', currentUserId)
      .eq('folder', 'inbox')
      .is('read_at', null);
    if (error) {
      console.error('Inbox count error:', error);
      return;
    }
    el.textContent = count > 0 ? `(${count})` : '';
  }
  async function showThread(rootId) {
    currentConversationId = rootId;
    const rootMsg = currentMessages.find(m => m.id === rootId);
    if (!rootMsg) return;
    if (!rootMsg.read_at && rootMsg.sender_id !== currentUserId) {
      await supabase.from('messages').update({ read_at: new Date().toISOString() }).eq('id', rootId);
    }
    const replies = currentMessages.filter(m => m.parent_id === rootId)
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    let html = `
      <div class="space-y-6">
        <div class="bg-gray-800/40 p-5 rounded-xl border-l-4 border-emerald-500">
          <div class="flex justify-between items-start mb-3">
            <div>
              <p class="font-bold text-lg">${rootMsg.sender?.name || 'Unknown'}</p>
              <p class="text-sm text-gray-400">${new Date(rootMsg.created_at).toLocaleString()}</p>
            </div>
            <span class="text-xs px-2 py-1 rounded-full ${rootMsg.read_at ? 'bg-emerald-600' : 'bg-amber-600'}">
              ${rootMsg.read_at ? 'Read' : 'Unread'}
            </span>
          </div>
          <p class="font-semibold mb-2">${rootMsg.subject || '(No subject)'}</p>
          <p class="whitespace-pre-wrap">${rootMsg.body}</p>
        </div>
    `;
    if (replies.length > 0) {
      html += `<h3 class="text-lg font-bold mt-6 mb-3 border-b border-gray-700 pb-2">Replies</h3>`;
      replies.forEach(r => {
        html += `
          <div class="pl-6 bg-black/30 p-4 rounded-xl">
            <div class="flex justify-between items-start mb-2">
              <p class="font-semibold text-emerald-300">${r.sender?.name || 'Unknown'}</p>

              <span class="text-xs text-gray-500">${new Date(r.created_at).toLocaleString([], {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            <p class="whitespace-pre-wrap">${r.body}</p>
          </div>
        `;
      });
    }
    html += `
      </div>
      <div class="mt-8 flex justify-end">
        <button onclick="openReplyModal()" class="bg-emerald-600 hover:bg-emerald-700 px-8 py-3 rounded-xl font-bold">
          Reply
        </button>
      </div>
    `;
    document.getElementById('messageView').innerHTML = html;
    await loadConversations();
  }
  window.openReplyModal = function() {
    document.getElementById('replySubject').value = '';
    document.getElementById('replyText').value = '';
    document.getElementById('replyModal').classList.remove('hidden');
  };
  window.closeReplyModal = function() {
    document.getElementById('replyModal').classList.add('hidden');
  };
  window.sendReply = async function() {
    const subject = document.getElementById('replySubject').value.trim();
    const text = document.getElementById('replyText').value.trim();
    if (!subject) return alert('Please enter a subject.');
    if (!text) return alert('Please write a reply.');
    const original = currentMessages.find(m => m.id === currentConversationId);
    if (!original) return alert('No conversation selected.');
    const receiverId = original.sender_id === currentUserId ? original.receiver_id : original.sender_id;
    const messageData = {
      parent_id: currentConversationId,
      sender_id: currentUserId,
      receiver_id: receiverId,
      subject: subject || (original.subject ? `Re: ${original.subject}` : 'Re: Message'),
      body: text,
      read_at: null
    };
    const { error: sentError } = await supabase.from('messages').insert({
      ...messageData,
      owner_id: currentUserId,
      folder: 'sent'
    });
    if (sentError) {
      alert('Failed to save reply to your Sent folder: ' + sentError.message);
      return;
    }
    const { error: inboxError } = await supabase.from('messages').insert({
      ...messageData,
      owner_id: receiverId,
      folder: 'inbox'
    });
    if (inboxError) {
      console.error('Inbox insert failed:', inboxError);
      alert('Reply saved to your Sent, but failed to deliver to recipient inbox: ' + inboxError.message);
      return;
    }
    alert('Reply sent successfully!');
    closeReplyModal();
    await loadConversations();
    showThread(currentConversationId);
  };
  init();
</script>
</body>
</html>
