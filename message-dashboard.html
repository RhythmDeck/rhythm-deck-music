<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Messages | Rhythm Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo-favicon.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>

<style>
html,body{height:100%}
.msg-item:hover{background:rgba(255,255,255,0.08)}
.msg-preview{
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical
}
.selected{background:rgba(255,255,255,0.15)!important}
.folder-active{background:rgba(255,255,255,0.12)}
</style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white flex flex-col min-h-screen">

<!-- HEADER -->
<header class="bg-black/70 border-b border-purple-700/50 px-6 py-4 flex items-center gap-4">
  <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full">
  <div>
    <div class="text-2xl font-black text-emerald-400">RHYTHM DECK</div>
    <div class="text-sm text-purple-300">Unleash Your Beat</div>
  </div>
  <div align="right"><a href="industry-dashboard.html"
     class="bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-black px-6 py-3 rounded-full">
    Back to Dashboard
    </a>
  </div>
</header>

<!-- MAIN -->
<main class="flex-1 p-4">

  <h1 class="text-4xl font-black mb-4 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
    Messages
  </h1>

  <!-- FULL WIDTH GRID -->
  <div
    class="h-[80vh] grid gap-4"
    style="grid-template-columns: 260px 420px 1fr;"
  >

    <!-- FOLDERS -->
    <aside class="bg-black/40 rounded-xl overflow-hidden flex flex-col">
      <div class="p-4 font-black border-b border-purple-600 text-emerald-400">
        Folders
      </div>

      <button onclick="loadFolder('inbox')" id="folder-inbox"
        class="text-left px-5 py-3 font-bold hover:bg-white/10 folder-active">
        📥 Inbox
      </button>

      <button onclick="loadFolder('sent')" id="folder-sent"
        class="text-left px-5 py-3 font-bold hover:bg-white/10">
        📤 Sent
      </button>

      <button onclick="loadFolder('trash')" id="folder-trash"
        class="text-left px-5 py-3 font-bold hover:bg-white/10 text-red-400">
        🧹 Trash
      </button>
    </aside>

    <!-- CONVERSATION LIST -->
    <aside class="bg-black/40 rounded-xl overflow-hidden flex flex-col">
      <div id="folderTitle" class="p-4 font-bold border-b border-purple-600">
        Inbox
      </div>
      <div id="conversationList" class="flex-1 overflow-y-auto"></div>
    </aside>

    <!-- MESSAGE VIEW -->
    <section id="messageView"
      class="bg-black/40 rounded-xl p-6 overflow-y-auto">
      <div class="text-gray-400 text-center mt-32">
        Select a conversation
      </div>
    </section>

  </div>

</main>

<footer class="bg-black/80 border-t border-purple-700/30 py-4 text-center text-sm text-gray-400">
  © 2026 Rhythm Deck Music
</footer>

<!-- REPLY MODAL -->
<div id="replyModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
  <div class="bg-gray-900 rounded-xl p-6 w-full max-w-xl relative">
    <button onclick="closeReply()" class="absolute top-3 right-4 text-3xl text-red-500">×</button>
    <h2 class="text-2xl font-black text-emerald-400 mb-3">Reply</h2>
    <textarea id="replyText" rows="6"
      class="w-full bg-black/50 border border-emerald-500 rounded-lg p-3 text-white"></textarea>
    <button onclick="sendReply()"
      class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-black">
      Send Reply
    </button>
  </div>
</div>

<script type="module">
/* KEEP YOUR EXISTING MESSAGE JS HERE */
/* ONLY ADD THE SMALL UI HELPERS BELOW */

let currentFolder = 'inbox';

window.loadFolder = async function(folder){
  currentFolder = folder;

  document.getElementById('folderTitle').innerText =
    folder.charAt(0).toUpperCase() + folder.slice(1);

  ['inbox','sent','trash'].forEach(f=>{
    document.getElementById('folder-'+f)
      .classList.toggle('folder-active', f===folder);
  });

  // YOUR EXISTING SUPABASE LOAD LOGIC RUNS HERE
};
</script>

</body>
</html>
