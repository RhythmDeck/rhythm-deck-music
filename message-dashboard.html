<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Messages | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .selected { background: rgba(255,255,255,0.15) !important; }
    .reply-indent {
      margin-left: 2rem;
      border-left: 3px solid #10b981;
      padding-left: 1rem;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-black/60 border-b border-purple-700/50 py-6 px-6 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full">
    <div>
      <h1 class="text-3xl font-black text-emerald-400">RHYTHM DECK</h1>
      <p class="text-sm text-purple-300">Unleash Your Beat</p>
    </div>
  </div>

  <a href="platinum-pro-admin.html"
     class="bg-gradient-to-r from-yellow-400 to-amber-500 px-8 py-3 rounded-full font-black text-black shadow-xl hover:scale-105 transition">
    Back to Dashboard
  </a>
</header>

<main class="flex-1 max-w-7xl mx-auto p-6">
  <h1 class="text-4xl font-black mb-8 text-emerald-400">Messages</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-[75vh]">

    <!-- Conversation List -->
    <div id="conversationList"
         class="bg-black/40 rounded-2xl p-4 overflow-y-auto border border-purple-700/30">
    </div>

    <!-- Message View -->
    <div id="messageView"
         class="md:col-span-2 bg-black/40 rounded-2xl p-6 overflow-y-auto border border-purple-700/30">
      <p class="text-gray-400 text-center mt-24">
        Select a conversation
      </p>
    </div>

  </div>
</main>

<!-- Reply Modal -->
<div id="replyModal"
     class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl p-8 max-w-lg w-full relative">
    <button id="closeReplyBtn"
            class="absolute top-4 right-4 text-3xl text-red-500">&times;</button>

    <h2 class="text-2xl font-black text-emerald-400 mb-4">Reply</h2>

    <textarea id="replyText"
              rows="6"
              class="w-full bg-black/60 border border-emerald-500 rounded-lg p-4"></textarea>

    <button id="sendReplyBtn"
            class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-black">
      Send Reply
    </button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

let userId = null;
let threads = [];
let activeThread = null;

/* INIT */
supabase.auth.onAuthStateChange(async (_, session) => {
  if (!session?.user) {
    location.href = 'login.html';
    return;
  }
  userId = session.user.id;
  loadThreads();
});

/* LOAD THREADS */
async function loadThreads() {
  const { data, error } = await supabase
    .from('collab_requests')
    .select(`
      id,
      parent_id,
      sender_id,
      receiver_id,
      message,
      created_at
    `)
    .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`)
    .order('created_at', { ascending: true });

  if (error) {
    alert(error.message);
    return;
  }

  const map = {};
  data.forEach(m => {
    const root = m.parent_id || m.id;
    if (!map[root]) map[root] = { root: null, replies: [] };
    if (!m.parent_id) map[root].root = m;
    else map[root].replies.push(m);
  });

  threads = Object.values(map).filter(t => t.root);
  renderThreadList();
}

/* RENDER LIST */
function renderThreadList() {
  const list = document.getElementById('conversationList');
  list.innerHTML = threads.map(t => `
    <div class="msg-item p-4 border-b border-gray-700 cursor-pointer"
         onclick="openThread('${t.root.id}')">
      <p class="font-bold text-white">
        ${t.root.sender_id === userId ? 'You' : 'Partner'}
      </p>
      <p class="text-sm text-gray-400">
        ${t.root.message.slice(0, 80)}
      </p>
    </div>
  `).join('');
}

/* OPEN THREAD */
window.openThread = function(id) {
  activeThread = threads.find(t => t.root.id === id);
  if (!activeThread) return;

  document.getElementById('messageView').innerHTML = `
    <div class="space-y-4">
      <div class="bg-black/50 p-4 rounded-xl">
        ${activeThread.root.message}
      </div>
      ${activeThread.replies.map(r => `
        <div class="reply-indent bg-black/30 p-3 rounded-xl">
          ${r.message}
        </div>
      `).join('')}
    </div>

    <button onclick="openReply()"
            class="mt-6 bg-emerald-600 px-6 py-3 rounded-xl font-black">
      Reply
    </button>
  `;
};

/* REPLY */
function openReply() {
  document.getElementById('replyModal').classList.remove('hidden');
  document.getElementById('replyModal').classList.add('flex');
}

function closeReply() {
  document.getElementById('replyModal').classList.add('hidden');
}

async function sendReply() {
  const text = document.getElementById('replyText').value.trim();
  if (!text) return;

  const receiver =
    activeThread.root.sender_id === userId
      ? activeThread.root.receiver_id
      : activeThread.root.sender_id;

  await supabase.from('collab_requests').insert({
    parent_id: activeThread.root.id,
    sender_id: userId,
    receiver_id: receiver,
    message: text,
    status: 'pending'
  });

  closeReply();
  loadThreads();
}

document.getElementById('sendReplyBtn').addEventListener('click', sendReply);
document.getElementById('closeReplyBtn').addEventListener('click', closeReply);
</script>

</body>
</html>
