<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Messages | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .msg-preview { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .selected { background: rgba(255,255,255,0.12) !important; }
    .badge-new { background:#8b5cf6; color:white; font-weight:800; }
    .badge-read { background:#6b7280; color:white; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-black/60 border-b border-purple-700/50 py-6 px-4 sm:px-6 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="h-10 sm:h-12 w-10 sm:w-12 rounded-full">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black text-emerald-400">RHYTHM DECK</h1>
        <p class="text-sm text-purple-300">Unleash Your Beat</p>
      </div>
    </div>
  </header>

  <div class="flex-1 max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    <h1 class="text-4xl sm:text-5xl font-black mb-6 sm:mb-8 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent text-center lg:text-left">
      Messages
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 gap-6 lg:gap-8 h-[70vh] sm:h-[80vh]">
      <!-- LEFT: Folders & Conversations -->
      <div class="bg-black/40 rounded-2xl flex flex-col overflow-hidden md:col-span-1 lg:col-span-1 border border-purple-700/30 shadow-xl">
        <div class="p-5 sm:p-6 border-b border-purple-600 font-bold text-xl sm:text-2xl text-emerald-400">
          Folders
        </div>
        <div class="p-4 border-b border-gray-700 space-y-2">
          <button onclick="loadFolder('inbox')" class="w-full text-left py-3 px-4 hover:bg-white/10 rounded-lg font-bold flex justify-between items-center">
            Inbox <span id="inboxCount" class="badge-new px-2 py-1 text-xs rounded-full hidden">0</span>
          </button>
          <button onclick="loadFolder('sent')" class="w-full text-left py-3 px-4 hover:bg-white/10 rounded-lg font-bold">
            Sent
          </button>
          <button onclick="loadFolder('trash')" class="w-full text-left py-3 px-4 hover:bg-white/10 rounded-lg font-bold">
            Trash
          </button>
        </div>
        <div id="conversationList" class="flex-1 overflow-y-auto p-4 sm:p-6"></div>
      </div>

      <!-- RIGHT: Message View -->
      <div id="messageView" class="md:col-span-3 lg:col-span-4 bg-black/40 rounded-2xl p-6 sm:p-8 lg:p-10 overflow-y-auto border border-purple-700/30 shadow-xl">
        <p class="text-gray-400 text-center mt-16 sm:mt-32 text-lg sm:text-xl font-medium">
          Select a folder or conversation to view messages
        </p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-black/80 border-t border-purple-700/30 py-6 text-center text-gray-400 text-sm">
    © 2026 Rhythm Deck Music
  </footer>

  <!-- Reply Modal -->
  <div id="replyModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-2xl p-6 sm:p-8 max-w-lg w-[90%] sm:w-full mx-4 relative">
      <button onclick="closeReply()" class="absolute top-4 right-4 text-3xl font-black text-red-500">×</button>
      <h2 class="text-2xl sm:text-3xl font-black text-emerald-400 mb-4 text-center">
        Reply to <span id="replyName"></span>
      </h2>
      <textarea id="replyText" rows="6" class="w-full bg-black/50 border border-emerald-500 rounded-lg p-4 text-white text-base"></textarea>
      <button id="sendReplyBtn" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 py-3 sm:py-4 rounded-xl font-black text-lg sm:text-xl">
        Send Reply
      </button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    let userId = null;
    let currentFolder = 'inbox';
    let messages = [];
    let activeConversationId = null;

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        location.replace('login.html');
        return;
      }
      userId = session.user.id;
      loadFolder('inbox');
    }

    supabase.auth.onAuthStateChange((_, session) => {
      if (session?.user) {
        userId = session.user.id;
        loadFolder(currentFolder);
      }
    });

    init();

    async function loadFolder(folder) {
      currentFolder = folder;
      document.getElementById('conversationList').innerHTML = '<p class="text-gray-400 text-center py-10">Loading...</p>';

      const { data, error } = await supabase
        .from('messages')
        .select('id, parent_id, sender_id, receiver_id, subject, body, created_at, read_at, folder')
        .eq('owner_id', userId)
        .eq('folder', folder)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Load messages error:', error);
        document.getElementById('messageView').innerHTML = `<p class="text-red-400 text-center py-10">Error: ${error.message}</p>`;
        return;
      }

      messages = data || [];
      renderConversationList();

      // Update unread count for Inbox
      if (folder === 'inbox') {
        const unread = messages.filter(m => !m.read_at && m.receiver_id === userId).length;
        const countEl = document.getElementById('inboxCount');
        countEl.textContent = unread || '';
        countEl.classList.toggle('hidden', unread === 0);
      }

      if (messages.length > 0) {
        openConversation(messages[0].id);
      } else {
        document.getElementById('messageView').innerHTML = `<p class="text-gray-400 text-center mt-20 text-xl">No messages in ${folder}</p>`;
      }
    }

    function renderConversationList() {
      const list = document.getElementById('conversationList');
      list.innerHTML = '';

      const conversations = {};
      messages.forEach(m => {
        const partnerId = m.sender_id === userId ? m.receiver_id : m.sender_id;
        if (!conversations[partnerId]) {
          conversations[partnerId] = {
            partnerId,
            messages: [],
            latest: m,
            unread: (!m.read_at && m.receiver_id === userId) ? 1 : 0
          };
        }
        conversations[partnerId].messages.push(m);
        if (new Date(m.created_at) > new Date(conversations[partnerId].latest.created_at)) {
          conversations[partnerId].latest = m;
        }
        if (!m.read_at && m.receiver_id === userId) conversations[partnerId].unread++;
      });

      Object.values(conversations).sort((a, b) => new Date(b.latest.created_at) - new Date(a.latest.created_at)).forEach(conv => {
        const div = document.createElement('div');
        div.className = `msg-item p-4 border-b border-gray-800 cursor-pointer hover:bg-white/5 ${activeConversationId === conv.latest.id ? 'selected' : ''}`;
        div.onclick = () => openConversation(conv.latest.id);
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <div>
              <p class="font-bold ${conv.unread > 0 ? 'text-white' : 'text-gray-400'}">Partner ID: ${conv.partnerId}</p>
              <p class="msg-preview text-gray-300">${conv.latest.subject || conv.latest.body.substring(0, 60) + '...'}</p>
            </div>
            <div class="flex items-center gap-3">
              ${conv.unread > 0 ? `<span class="badge-new px-2 py-1 text-xs rounded-full">${conv.unread}</span>` : ''}
            </div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function openConversation(messageId) {
      activeConversationId = messageId;
      const conversation = messages.filter(m => m.id === messageId || m.parent_id === messageId);
      const root = conversation.find(m => !m.parent_id) || conversation[0];

      if (root.receiver_id === userId && !root.read_at) {
        await supabase.from('messages').update({ read_at: new Date().toISOString() }).eq('id', root.id);
        loadFolder(currentFolder); // Refresh unread count
      }

      const partnerId = root.sender_id === userId ? root.receiver_id : root.sender_id;

      let html = `<h2 class="text-3xl font-black text-emerald-400 mb-6">Conversation with Partner ID: ${partnerId}</h2>`;

      conversation.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).forEach(m => {
        const who = m.sender_id === userId ? 'You' : 'Partner';
        const isUnread = !m.read_at && m.receiver_id === userId;
        html += `
          <div class="mb-4 p-4 rounded-xl ${isUnread ? 'bg-purple-900/30 border-l-4 border-purple-500' : 'bg-black/30'}">
            <p class="font-bold text-emerald-300">${who}</p>
            <p class="text-xs text-gray-500">${new Date(m.created_at).toLocaleString()}</p>
            ${m.subject ? `<p class="font-semibold mt-1">Subject: ${m.subject}</p>` : ''}
            <p class="mt-1">${m.body}</p>
          </div>
        `;
      });

      html += `<button id="replyButton" class="mt-6 bg-emerald-600 px-8 py-3 rounded-xl font-black">Reply</button>`;

      document.getElementById('messageView').innerHTML = html;
      document.getElementById('replyButton')?.addEventListener('click', () => openReply(partnerId));
    }

    function openReply(partnerId) {
      document.getElementById('replyName').innerText = 'Partner ID: ' + partnerId;
      document.getElementById('replyText').value = '';
      document.getElementById('replyModal').classList.remove('hidden');
      document.getElementById('replyModal').classList.add('flex');
    }

    function closeReply() {
      document.getElementById('replyModal').classList.remove('flex');
      document.getElementById('replyModal').classList.add('hidden');
    }

    async function sendReply() {
      const text = document.getElementById('replyText').value.trim();
      if (!text) return alert('Please type a message');

      const root = messages.find(m => m.id === activeConversationId);
      if (!root) return alert('No active conversation');

      const receiverId = root.sender_id === userId ? root.receiver_id : root.sender_id;

      const { error } = await supabase.from('messages').insert({
        parent_id: activeConversationId,
        sender_id: userId,
        receiver_id: receiverId,
        subject: 'Re: ' + (root.subject || '(No subject)'),
        body: text,
        owner_id: userId,
        folder: 'sent'
      });

      if (error) {
        console.error(error);
        alert('Failed to send: ' + error.message);
        return;
      }

      closeReply();
      loadFolder(currentFolder);
    }

    document.getElementById('sendReplyBtn')?.addEventListener('click', sendReply);
  </script>
</body>
</html>
