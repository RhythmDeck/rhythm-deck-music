<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Messages | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(to bottom right, #020617, #3b0764, #000000);
      color: white;
    }
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .selected { background: rgba(255,255,255,0.12) !important; }
    .msg-preview {
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .badge-new {
      background:#8b5cf6;
      color:white;
      font-weight:800;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col font-sans antialiased">

<!-- HEADER -->
<header class="bg-black/70 border-b border-purple-700/40 py-5 px-6 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full border-2 border-emerald-500">
    <div>
      <h1 class="text-2xl font-black text-emerald-400">RHYTHM DECK</h1>
      <p class="text-sm text-purple-300">Unleash Your Beat</p>
    </div>
  </div>

  <a href="platinum-pro-admin.html"
     class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600
            text-black font-black px-8 py-3 rounded-full shadow-xl transition hover:scale-105">
    Back to Dashboard
  </a>
</header>

<!-- MAIN -->
<main class="flex-1 max-w-7xl mx-auto p-6">

  <h1 class="text-4xl font-black mb-6 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
    Messages
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 gap-6 h-[75vh]">

    <!-- LEFT COLUMN -->
    <div class="bg-black/40 rounded-2xl border border-purple-700/30 flex flex-col overflow-hidden">

      <div class="p-5 border-b border-purple-600 font-black text-xl text-emerald-400">
        Folders
      </div>

      <div class="p-4 border-b border-gray-700 space-y-2">
        <button onclick="loadFolder('inbox')" class="w-full text-left py-3 px-4 hover:bg-white/10 rounded-lg font-bold flex justify-between">
          Inbox <span id="inboxCount" class="badge-new px-2 py-1 text-xs rounded-full hidden">0</span>
        </button>
        <button onclick="loadFolder('sent')" class="w-full text-left py-3 px-4 hover:bg-white/10 rounded-lg font-bold">
          Sent
        </button>
      </div>

      <div id="conversationList" class="flex-1 overflow-y-auto p-4"></div>
    </div>

    <!-- RIGHT COLUMN -->
    <div id="messageView" class="md:col-span-3 lg:col-span-4 bg-black/40 rounded-2xl p-8 border border-purple-700/30 overflow-y-auto">
      <p class="text-gray-400 text-center mt-24 text-xl">
        Select a conversation
      </p>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="bg-black/80 border-t border-purple-700/30 py-6 text-center text-gray-400 text-sm">
  © 2026 Rhythm Deck
</footer>

<!-- REPLY MODAL -->
<div id="replyModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl p-8 max-w-lg w-full relative">
    <button onclick="closeReply()" class="absolute top-4 right-4 text-3xl font-black text-red-500">×</button>
    <h2 class="text-2xl font-black text-emerald-400 mb-4">
      Reply
    </h2>
    <textarea id="replyText" rows="6"
      class="w-full bg-black/50 border border-emerald-500 rounded-lg p-4 text-white"></textarea>
    <button id="sendReplyBtn"
      class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-black text-lg">
      Send Reply
    </button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

let userId;
let messages = [];
let currentFolder = 'inbox';
let activeConversationRoot = null;

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    location.replace('login.html');
    return;
  }
  userId = session.user.id;
  loadFolder('inbox');
}

async function loadFolder(folder) {
  currentFolder = folder;
  document.getElementById('conversationList').innerHTML = 'Loading...';

  const { data, error } = await supabase
    .from('messages')
    .select('*')
    .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`)
    .order('created_at', { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  messages = data.filter(m =>
    folder === 'sent' ? m.sender_id === userId : m.receiver_id === userId
  );

  renderConversationList();
}

function renderConversationList() {
  const list = document.getElementById('conversationList');
  list.innerHTML = '';

  if (messages.length === 0) {
    list.innerHTML = `<p class="text-gray-400 text-center mt-6">No messages</p>`;
    return;
  }

  const threads = {};
  messages.forEach(m => {
    const rootId = m.parent_id || m.id;
    if (!threads[rootId]) threads[rootId] = [];
    threads[rootId].push(m);
  });

  Object.values(threads).forEach(thread => {
    const root = thread.find(m => !m.parent_id) || thread[0];
    const partnerId = root.sender_id === userId ? root.receiver_id : root.sender_id;

    const div = document.createElement('div');
    div.className = 'msg-item p-4 border-b border-gray-800 cursor-pointer';
    div.onclick = () => openConversation(root.id);

    div.innerHTML = `
      <p class="font-bold">User ${partnerId.slice(0,8)}</p>
      <p class="msg-preview text-gray-400">${root.body}</p>
    `;
    list.appendChild(div);
  });
}

function openConversation(rootId) {
  activeConversationRoot = rootId;
  const thread = messages.filter(m => m.id === rootId || m.parent_id === rootId);

  let html = '';
  thread.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))
    .forEach(m => {
      html += `
        <div class="mb-4 p-4 rounded-xl bg-black/30">
          <p class="font-bold ${m.sender_id===userId?'text-emerald-400':'text-purple-400'}">
            ${m.sender_id===userId?'You':'Them'}
          </p>
          <p>${m.body}</p>
        </div>
      `;
    });

  html += `<button onclick="openReply()" class="mt-6 bg-emerald-600 px-8 py-3 rounded-xl font-black">Reply</button>`;
  document.getElementById('messageView').innerHTML = html;
}

function openReply() {
  document.getElementById('replyModal').classList.remove('hidden');
  document.getElementById('replyModal').classList.add('flex');
}

function closeReply() {
  document.getElementById('replyModal').classList.add('hidden');
  document.getElementById('replyModal').classList.remove('flex');
}

async function sendReply() {
  const text = document.getElementById('replyText').value.trim();
  if (!text) return;

  const root = messages.find(m => m.id === activeConversationRoot);
  const receiver = root.sender_id === userId ? root.receiver_id : root.sender_id;

  await supabase.from('messages').insert({
    parent_id: activeConversationRoot,
    sender_id: userId,
    receiver_id: receiver,
    body: text
  });

  closeReply();
  loadFolder(currentFolder);
}

document.getElementById('sendReplyBtn').addEventListener('click', sendReply);
init();
</script>

</body>
</html>
