<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collab Messages | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">
  <div class="max-w-5xl mx-auto p-8">
    <div class="flex justify-between items-center mb-10">
      <h1 class="text-5xl font-black bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
        Collab Messages
      </h1>
      <a href="profile-admin-pro.html" class="text-xl underline hover:text-emerald-400">Back to Dashboard</a>
    </div>
    <div id="messagesList" class="space-y-6">
      <p class="text-center text-gray-400 text-xl">Loading your messages...</p>
    </div>
  </div>

  <!-- REPLY MODAL -->
  <div id="replyModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-[99999] opacity-0 invisible transition-all duration-300">
    <div class="bg-gray-900 rounded-3xl shadow-2xl w-full max-w-lg mx-4 relative">
      <button onclick="closeReplyModal()" class="absolute top-4 right-4 w-12 h-12 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-white text-3xl font-bold z-50 shadow-xl transition">
        ×
      </button>
      <div class="p-8 pt-16">
        <h2 class="text-4xl font-black text-emerald-400 mb-6 text-center">
          Reply to <span id="replyTargetName">Artist</span>
        </h2>
        <textarea id="replyMessage" rows="6" placeholder="Write your reply..." required
                  class="w-full p-4 rounded-lg bg-white/10 text-white border border-emerald-500 placeholder-gray-400 resize-none focus:outline-none focus:border-emerald-400"></textarea>
        <button onclick="sendReply()" class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xl py-4 rounded-xl transition shadow-xl transform hover:scale-105">
          Send Reply
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    const supabase = window.supabase.createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    let currentUserId = null;
    let replyTargetId = null;
    let replyTargetName = null;

    function openReplyModal(targetId, name) {
      replyTargetId = targetId;
      replyTargetName = name;
      document.getElementById('replyTargetName').textContent = name;
      document.getElementById('replyModal').classList.remove('invisible', 'opacity-0');
      document.getElementById('replyModal').classList.add('opacity-100');
    }

    function closeReplyModal() {
      document.getElementById('replyModal').classList.add('invisible', 'opacity-0');
      document.getElementById('replyModal').classList.remove('opacity-100');
      document.getElementById('replyMessage').value = '';
    }

    async function sendReply() {
      const message = document.getElementById('replyMessage').value.trim();
      if (!message) return alert('Please write a reply!');

      const { error } = await supabase
        .from('collab_requests')
        .insert({
          artist_id: replyTargetId,
          sender_name: 'You',
          message: message,
          status: 'pending'
        })
        .select();

      if (error) {
        console.error('Reply failed:', error);
        alert('Failed to send reply.');
      } else {
        alert('Reply sent!');
        closeReplyModal();
      }
    }

    // MARK AS READ
    async function markAsRead(messageId, element) {
      await supabase.from('collab_requests').update({ status: 'read' }).eq('id', messageId);
      element.remove();
    }

    // DELETE — NOW WORKS PERMANENTLY
    async function deleteMessage(messageId) {
      if (!confirm('Delete this message permanently?')) return;

      const { error } = await supabase
        .from('collab_requests')
        .delete()
        .eq('id', messageId)
        .eq('artist_id', currentUserId)
        .select(); // THIS LINE FIXES DELETION WITH ANON KEY + RLS

      if (error) {
        console.error('Delete failed:', error);
        alert('Delete failed. Try again.');
      } else {
        document.getElementById(`msg-${messageId}`).remove();
        if (!document.querySelector('#messagesList > div')) {
          document.getElementById('messagesList').innerHTML = '<p class="text-center text-gray-400 text-2xl">No messages yet.</p>';
        }
      }
    }

    (async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return location.href = 'login.html';
      currentUserId = user.id;

      const { data: profile } = await supabase.from('profiles').select('id').eq('id', user.id).single();
      if (!profile) return document.getElementById('messagesList').innerHTML = '<p class="text-red-400">Profile not found.</p>';

      const { data: messages } = await supabase
        .from('collab_requests')
        .select('*')
        .eq('artist_id', profile.id)
        .order('created_at', { ascending: false });

      const list = document.getElementById('messagesList');
      list.innerHTML = messages?.length ? '' : '<p class="text-center text-gray-400 text-2xl">No messages yet.</p>';

      messages?.forEach(m => {
        const hasEmail = m.sender_email && m.sender_email.trim() !== '';
        list.innerHTML += `
          <div id="msg-${m.id}" class="bg-black/50 rounded-2xl p-8 border ${m.status === 'pending' ? 'border-emerald-500 shadow-lg shadow-emerald-500/20' : 'border-gray-700'}">
            <div class="flex justify-between items-start mb-4">
              <div>
                <p class="text-2xl font-black text-emerald-400">${m.sender_name || 'Anonymous'}</p>
                ${hasEmail ? `<p class="text-sm text-gray-300 mt-1">Email: ${m.sender_email}</p>` : ''}
                <p class="text-sm text-gray-400">${new Date(m.created_at).toLocaleString()}</p>
              </div>
              <div class="flex gap-3">
                ${m.status === 'pending' ? `<button onclick="markAsRead('${m.id}', this)" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-bold">Mark as Read</button>` : ''}
                <button onclick="deleteMessage('${m.id}')" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-bold">Delete</button>
              </div>
            </div>
            <p class="text-lg whitespace-pre-line mt-4">${m.message}</p>

            <div class="mt-6">
              ${hasEmail ? `<p class="text-gray-400 text-sm mb-3">Reply via Email above or</p>` : ''}
              <button onclick="openReplyModal('${m.original_sender_id || m.artist_id}', '${(m.sender_name || 'Artist').replace(/'/g, "\\'")}')"
                      class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black px-8 py-4 rounded-xl text-lg transition transform hover:scale-105 shadow-xl">
                Reply via Message
              </button>
            </div>
          </div>`;
      });
    })();
  </script>
</body>
</html>
