<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collab Messages | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .msg-preview { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .selected { background: rgba(255,255,255,0.1) !important; }
    .btn-dashboard {
      background: linear-gradient(to right, #d4af37, #b8860b);
      color: #1a0f2e;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
    }
    .btn-dashboard:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212,175,55,0.6);
    }
    .btn-industry {
      background: linear-gradient(to right, #8b5cf6, #a78bfa);
      color: white;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(139,92,246,0.4);
    }
    .btn-industry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139,92,246,0.6);
    }
    .reply-indent { margin-left: 2.5rem; border-left: 3px solid #10b981; padding-left: 1.25rem; opacity: 0.9; }
    #replyModal.hidden { display: none; }
    .status-pending { background: #f59e0b; color: white; }
    .status-accepted { background: #10b981; color: white; }
    .status-declined { background: #ef4444; color: white; }
    .status-read { background: #6b7280; color: white; }
    .status-new-reply { background: #8b5cf6; color: white; font-weight: bold; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
      <h1 class="text-5xl font-black bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
        Collab Messages
      </h1>
      <div class="flex flex-wrap gap-4 justify-center sm:justify-end">
        <button onClick="goToDashboard()" class="btn-dashboard">
          ← Back to Dashboard
        </button>
        <a href="industry-directory.html" target="_blank" class="btn-industry">
          Contact Industry Pros →
        </a>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[80vh]">
      <div class="bg-black/40 rounded-2xl overflow-hidden flex flex-col">
        <div class="p-4 border-b border-purple-600">
          <h2 class="text-xl font-bold">Conversations</h2>
        </div>
        <div id="conversationList" class="flex-1 overflow-y-auto"></div>
      </div>
      <div id="messageView" class="lg:col-span-2 bg-black/40 rounded-2xl p-8 flex flex-col overflow-y-auto">
        <p class="text-gray-400 text-center mt-20">Select a conversation to view messages</p>
      </div>
    </div>
  </div>

  <!-- Reply Modal -->
  <div id="replyModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-[99999] hidden">
    <div class="bg-gray-900 rounded-3xl shadow-2xl w-full max-w-lg mx-4 relative">
      <button id="closeModalBtn" class="absolute top-4 right-4 w-12 h-12 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-white text-3xl font-bold z-50 shadow-xl">
        ×
      </button>
      <div class="p-8 pt-16">
        <h2 class="text-4xl font-black text-emerald-400 mb-6 text-center">
          Reply to <span id="replyTargetName"></span>
        </h2>
        <textarea id="replyMessage" rows="6" placeholder="Write your reply..." class="w-full p-4 rounded-lg bg-white/10 text-white border border-emerald-500 placeholder-gray-400 resize-none focus:outline-none focus:border-emerald-400"></textarea>
        <button id="sendReplyBtn" class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xl py-4 rounded-xl transition shadow-xl transform hover:scale-105">
          Send Reply
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    let currentUserId = null;
    let currentConversationId = null;
    let currentMessages = [];

    window.goToDashboard = async function() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert("Please log in first");
      const { data: profile } = await supabase.from('profiles').select('plan, role').eq('id', user.id).single();
      if (profile?.plan === 'platinum') {
        window.location.href = 'platinum-pro-admin.html';
      } else if (profile?.role?.toLowerCase().includes('producer') ||
                 profile?.role?.toLowerCase().includes('distributor') ||
                 profile?.role?.toLowerCase().includes('publisher') ||
                 profile?.role?.toLowerCase().includes('supervisor')) {
        window.location.href = 'industry-dashboard.html';
      } else {
        window.location.href = 'profile-admin-pro.html';
      }
    };

    function openReplyModal(targetId, name) {
      currentConversationId = targetId;
      document.getElementById('replyTargetName').textContent = name || 'User';
      document.getElementById('replyModal').classList.remove('hidden');
      document.getElementById('replyMessage').focus();
    }

    function closeReplyModal() {
      document.getElementById('replyModal').classList.add('hidden');
      document.getElementById('replyMessage').value = '';
    }

    async function sendReply() {
      const message = document.getElementById('replyMessage').value.trim();
      if (!message) return alert('Please write a reply!');

      const original = currentMessages.find(m => m.id === currentConversationId);
      const receiverId = original?.sender_id || currentUserId;

      const { error } = await supabase.from('collab_requests').insert({
        parent_id: currentConversationId,
        sender_id: currentUserId,
        receiver_id: receiverId,
        message: message,
        created_at: new Date().toISOString(),
        status: 'pending'
      });

      if (error) {
        console.error('Send reply error:', error);
        alert('Failed to send reply: ' + (error.message || 'Unknown error'));
        return;
      }

      alert('Reply sent!');
      closeReplyModal();
      loadMessages();
    }

    async function updateStatus(messageId, newStatus) {
      const { error } = await supabase.from('collab_requests').update({ status: newStatus }).eq('id', messageId).eq('receiver_id', currentUserId);
      if (error) {
        alert('Failed to update status: ' + error.message);
      } else {
        loadMessages();
      }
    }

    function showThread(originalMsg) {
      currentConversationId = originalMsg.id;

      // Mark root as read when opened
      if (originalMsg.receiver_id === currentUserId && originalMsg.status !== 'read') {
        supabase.from('collab_requests').update({
          status: 'read',
          read_at: new Date().toISOString()
        }).eq('id', originalMsg.id);
      }

      const replies = currentMessages
        .filter(m => m.parent_id === originalMsg.id)
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      let statusHtml = '';
      if (originalMsg.status === 'pending' && originalMsg.receiver_id === currentUserId) {
        statusHtml = `
          <div class="flex space-x-4 mt-4">
            <button onclick="updateStatus('${originalMsg.id}', 'accepted')" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-bold text-white">
              Accept
            </button>
            <button onclick="updateStatus('${originalMsg.id}', 'declined')" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-bold text-white">
              Decline
            </button>
          </div>
        `;
      } else if (originalMsg.status) {
        const statusClass = originalMsg.status === 'pending' ? 'status-pending' :
                           originalMsg.status === 'accepted' ? 'status-accepted' :
                           originalMsg.status === 'declined' ? 'status-declined' :
                           originalMsg.status === 'read' ? 'status-read' : '';
        statusHtml = `<span class="inline-block px-3 py-1 text-sm font-bold rounded-full ${statusClass}">
          ${originalMsg.status.charAt(0).toUpperCase() + originalMsg.status.slice(1)}
        </span>`;
      }

      let html = `
        <div class="flex-1 overflow-y-auto pr-4 space-y-6">
          <div class="bg-black/40 rounded-2xl p-6 border-l-4 border-emerald-500">
            <div class="flex justify-between items-center mb-4">
              <div>
                <h2 class="text-2xl font-black text-emerald-400">${originalMsg.sender?.name || 'User'}</h2>
                <p class="text-sm text-gray-400 mt-1">${new Date(originalMsg.created_at).toLocaleString()}</p>
              </div>
              ${statusHtml}
            </div>
            <p class="text-lg whitespace-pre-line">${originalMsg.message}</p>
          </div>
      `;

      if (replies.length > 0) {
        html += `<h3 class="text-xl font-bold mt-6 mb-4">Replies</h3>`;
        replies.forEach(reply => {
          html += `
            <div class="reply-indent bg-black/30 rounded-xl p-5">
              <p class="font-semibold text-emerald-300">${reply.sender?.name || 'User'}</p>
              <p class="text-xs text-gray-500">${new Date(reply.created_at).toLocaleString()}</p>
              <p class="mt-2">${reply.message}</p>
            </div>
          `;
        });
      } else {
        html += `<p class="text-gray-400 italic mt-6">No replies yet</p>`;
      }

      html += `
        </div>
        <div class="mt-8 flex justify-end">
          <button id="replyThreadBtn" data-target-id="${originalMsg.id}" data-target-name="${(originalMsg.sender?.name || 'User').replace(/"/g, '&quot;').replace(/'/g, "&#39;")}"
                  class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold px-10 py-4 rounded-xl text-xl transition transform hover:scale-105 shadow-xl">
            Reply to this thread
          </button>
        </div>
      `;

      document.getElementById('messageView').innerHTML = html;
      document.getElementById('messageView').scrollTop = 0; // Ensure scroll starts at top

      document.getElementById('replyThreadBtn')?.addEventListener('click', function() {
        openReplyModal(this.dataset.targetId, this.dataset.targetName);
      });

      document.querySelectorAll('.msg-item').forEach(el => el.classList.remove('selected'));
      document.querySelector(`[data-id="${originalMsg.id}"]`)?.classList.add('selected');
    }

    async function loadMessages() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        location.href = 'login.html';
        return;
      }

      currentUserId = user.id;

      const list = document.getElementById('conversationList');
      list.innerHTML = '<p class="text-center text-gray-500 py-10">Loading...</p>';

      const { data: messages, error } = await supabase
        .from('collab_requests')
        .select(`
          id,
          parent_id,
          sender_id,
          receiver_id,
          message,
          created_at,
          read_at,
          status,
          sender:fk_collab_sender (name)
        `)
        .or(`sender_id.eq.${currentUserId},receiver_id.eq.${currentUserId}`)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Load messages error:', error);
        list.innerHTML = `<p class="text-red-400 text-center py-10">Error loading messages: ${error.message || 'Unknown error'}</p>`;
        document.getElementById('messageView').innerHTML = '<p class="text-gray-400 text-center mt-20">No conversations found</p>';
        return;
      }

      currentMessages = messages || [];

      if (!currentMessages.length) {
        list.innerHTML = '<p class="text-gray-400 text-center py-10">No messages yet</p>';
        document.getElementById('messageView').innerHTML = '<p class="text-gray-400 text-center mt-20">No conversations found</p>';
        return;
      }

      // Group by root message (only root messages have parent_id === null)
      const conversations = {};
      currentMessages.forEach(msg => {
        const rootId = msg.parent_id || msg.id;
        if (!conversations[rootId]) {
          conversations[rootId] = {
            root: null,
            messages: [],
            latest: null
          };
        }
        conversations[rootId].messages.push(msg);
        if (!msg.parent_id) conversations[rootId].root = msg;

        // Update latest message in this conversation
        if (!conversations[rootId].latest || new Date(msg.created_at) > new Date(conversations[rootId].latest.created_at)) {
          conversations[rootId].latest = msg;
        }
      });

      // Only keep conversations with a valid root
      const validConversations = Object.values(conversations)
        .filter(conv => conv.root)
        .sort((a, b) => new Date(b.latest.created_at) - new Date(a.latest.created_at));

      list.innerHTML = validConversations.map(conv => {
        const root = conv.root;
        const latest = conv.latest;

        let badgeText = root.status === 'pending' ? 'Pending' : 'Read';
        let badgeClass = root.status === 'pending' ? 'status-pending' : 'status-read';

        // If latest message is from someone else → show "New Reply"
        if (latest.sender_id !== currentUserId) {
          badgeText = 'New Reply';
          badgeClass = 'status-new-reply';
        }

        return `
          <div data-id="${root.id}" class="msg-item p-4 border-b border-gray-800 cursor-pointer hover:bg-white/5">
            <div class="flex justify-between items-center">
              <p class="font-bold">${root.sender?.name || 'Unknown'}</p>
              <span class="inline-block px-3 py-1 text-sm font-bold rounded-full ${badgeClass}">
                ${badgeText}
              </span>
            </div>
            <p class="text-sm text-gray-400">${new Date(latest.created_at).toLocaleString()}</p>
            <p class="msg-preview text-gray-300">${latest.message.substring(0, 80)}${latest.message.length > 80 ? '...' : ''}</p>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.msg-item').forEach(item => {
        item.addEventListener('click', () => {
          const rootId = item.dataset.id;
          const rootMsg = currentMessages.find(m => m.id === rootId);
          if (rootMsg) showThread(rootMsg);
        });
      });

      // Auto-open the most recent conversation
      if (validConversations.length > 0) {
        showThread(validConversations[0].root);
      }
    }

    loadMessages();

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('closeModalBtn')?.addEventListener('click', closeReplyModal);
      document.getElementById('sendReplyBtn')?.addEventListener('click', sendReply);
    });
  </script>
</body>
</html>
