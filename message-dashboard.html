<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collab Messages | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .msg-item.unread { font-weight: bold; border-left: 4px solid #10b981; background: rgba(16,185,129,0.05); }
    .msg-preview { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
    .selected { background: rgba(255,255,255,0.1) !important; }
    .btn-dashboard {
      background: linear-gradient(to right, #d4af37, #b8860b);
      color: #1a0f2e;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
    }
    .btn-dashboard:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212,175,55,0.6);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-5xl font-black bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
        Collab Messages
      </h1>
      <button onclick="goToDashboard()" class="btn-dashboard">
        ← Back to Dashboard
      </button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[80vh]">
      <!-- LEFT: Conversations -->
      <div class="bg-black/40 rounded-2xl overflow-hidden flex flex-col">
        <div class="p-4 border-b border-purple-600">
          <h2 class="text-xl font-bold">Conversations</h2>
        </div>
        <div id="conversationList" class="flex-1 overflow-y-auto"></div>
      </div>
      <!-- RIGHT: Message View -->
      <div id="messageView" class="lg:col-span-2 bg-black/40 rounded-2xl p-8 flex flex-col">
        <p class="text-gray-400 text-center">Select a message to read</p>
      </div>
    </div>
  </div>

  <!-- REPLY MODAL -->
  <div id="replyModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-[99999] opacity-0 invisible transition-all duration-300">
    <div class="bg-gray-900 rounded-3xl shadow-2xl w-full max-w-lg mx-4 relative">
      <button onClick="closeReplyModal()" class="absolute top-4 right-4 w-12 h-12 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-white text-3xl font-bold z-50 shadow-xl">
        ×
      </button>
      <div class="p-8 pt-16">
        <h2 class="text-4xl font-black text-emerald-400 mb-6 text-center">
          Reply to <span id="replyTargetName">Artist</span>
        </h2>
        <textarea id="replyMessage" rows="6" placeholder="Write your reply..." required
                  class="w-full p-4 rounded-lg bg-white/10 text-white border border-emerald-500 placeholder-gray-400 resize-none focus:outline-none focus:border-emerald-400"></textarea>
        <button onClick="sendReply()" class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xl py-4 rounded-xl transition shadow-xl transform hover:scale-105">
          Send Reply
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    let currentUserId = null;
    let currentUserName = null;
    let replyTargetId = null;

    // Smart Dashboard redirect: Platinum → platinum-pro-admin, others → profile-admin-pro
    window.goToDashboard = async function() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert("Please log in first");
        return;
      }

      const { data: profile, error } = await supabase
        .from('profiles')
        .select('plan')
        .eq('id', user.id)
        .single();

      if (error || !profile) {
        console.error("Error fetching plan:", error);
        alert("Could not determine your dashboard. Please contact support.");
        return;
      }

      if (profile.plan === 'platinum') {
        window.location.href = 'platinum-pro-admin.html';
      } else {
        window.location.href = 'profile-admin-pro.html';
      }
    };

    function openReplyModal(targetId, name) {
      replyTargetId = targetId;
      document.getElementById('replyTargetName').textContent = name;
      document.getElementById('replyModal').classList.remove('invisible', 'opacity-0');
      document.getElementById('replyModal').classList.add('opacity-100');
    }

    function closeReplyModal() {
      document.getElementById('replyModal').classList.add('invisible', 'opacity-0');
      document.getElementById('replyModal').classList.remove('opacity-100');
      document.getElementById('replyMessage').value = '';
    }

    async function sendReply() {
      const message = document.getElementById('replyMessage').value.trim();
      if (!message) return alert('Please write a reply!');
      const { error } = await supabase.from('collab_requests').insert({
        artist_id: replyTargetId,
        sender_name: currentUserName,
        message: message,
        status: 'pending'
      });
      if (error) {
        console.error('Send reply error:', error);
        alert('Failed to send reply: ' + error.message);
      } else {
        alert('Reply sent!');
        closeReplyModal();
        loadMessages();
      }
    }

    async function deleteMessage(id) {
      if (!confirm('Delete this message permanently?')) return;
      const { error } = await supabase.from('collab_requests').delete().eq('id', id).eq('artist_id', currentUserId);
      if (error) {
        console.error('Delete error:', error);
        alert('Failed to delete: ' + error.message);
      } else {
        loadMessages();
      }
    }

    function showMessage(msg) {
      const hasEmail = msg.sender_email?.trim();
      const isFromMe = msg.sender_name === currentUserName;
      document.getElementById('messageView').innerHTML = `
        <div class="flex-1 overflow-y-auto">
          <div class="flex justify-between items-start mb-6">
            <div>
              <h2 class="text-3xl font-black text-emerald-400">${isFromMe ? 'You' : msg.sender_name}</h2>
              ${hasEmail ? `<p class="text-gray-300 mt-1">Email: ${msg.sender_email}</p>` : ''}
              <p class="text-sm text-gray-400">${new Date(msg.created_at).toLocaleString()}</p>
            </div>
            <button onclick="deleteMessage('${msg.id}')" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-bold">
              Delete
            </button>
          </div>
          <div class="bg-black/30 rounded-2xl p-6 text-lg whitespace-pre-line mb-8">
            ${msg.message}
          </div>
          <div class="flex items-center gap-4">
            ${hasEmail ? `<p class="text-gray-400 text-sm">Reply via Email above or</p>` : ''}
            <button onclick="openReplyModal('${msg.artist_id}', '${msg.sender_name.replace(/'/g, "\\'")}')"
                    class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black px-8 py-4 rounded-xl text-lg transition transform hover:scale-105 shadow-xl">
              Reply via Message
            </button>
          </div>
        </div>`;
      document.querySelectorAll('.msg-item').forEach(el => el.classList.remove('selected'));
      document.querySelector(`[data-id="${msg.id}"]`)?.classList.add('selected');
    }

    async function loadMessages() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return location.href = 'login.html';
      currentUserId = user.id;

      const { data: profile } = await supabase.from('profiles').select('name').eq('id', user.id).single();
      currentUserName = profile?.name || 'You';

      const { data: messages, error } = await supabase
        .from('collab_requests')
        .select('*')
        .eq('artist_id', currentUserId)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Load messages error:', error);
        return;
      }

      const list = document.getElementById('conversationList');
      list.innerHTML = messages?.length ? '' : '<p class="p-8 text-center text-gray-400">No messages yet.</p>';

      messages?.forEach(m => {
        const hasEmail = m.sender_email?.trim();
        const isUnread = m.status === 'pending';
        const displayName = m.sender_name === currentUserName ? 'You' : m.sender_name;
        const safeMsg = JSON.stringify(m).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        list.innerHTML += `
          <div data-id="${m.id}" onclick="showMessage(${safeMsg})"
               class="msg-item ${isUnread ? 'unread' : ''} p-4 border-b border-gray-800 cursor-pointer">
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <p class="font-bold text-lg">${displayName}</p>
                ${hasEmail ? `<p class="text-xs text-gray-400">Email: ${m.sender_email}</p>` : ''}
                <p class="text-sm text-gray-400">${new Date(m.created_at).toLocaleDateString()}</p>
                <p class="text-sm text-gray-300 msg-preview mt-1">${m.message}</p>
              </div>
              ${isUnread ? '<span class="bg-emerald-600 text-xs px-2 py-1 rounded-full">New</span>' : ''}
            </div>
          </div>`;
      });

      if (messages?.length && window.innerWidth >= 1024) {
        showMessage(messages[0]);
      }
    }

    loadMessages();
  </script>
</body>
</html>
