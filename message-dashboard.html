<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collab Messages | Rhythm Deck</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.msg-item:hover { background: rgba(255,255,255,0.08); }
.msg-item.unread {
  font-weight: bold;
  border-left: 4px solid #10b981;
  background: rgba(16,185,129,0.05);
}
.msg-preview {
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
}
.reply-indent {
  margin-left: 2rem;
  border-left: 3px solid #10b981;
  padding-left: 1rem;
}
.unread-text {
  font-size: 0.7rem;
  font-weight: 800;
  color: #10b981;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
</style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">
<div class="max-w-7xl mx-auto p-6">

<h1 class="text-5xl font-black mb-8 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
Collab Messages
</h1>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[80vh]">

<!-- LEFT -->
<div class="bg-black/40 rounded-2xl flex flex-col">
  <div class="p-4 border-b border-purple-600 font-bold">Conversations</div>
  <div id="conversationList" class="flex-1 overflow-y-auto"></div>
</div>

<!-- RIGHT -->
<div id="messageView" class="lg:col-span-2 bg-black/40 rounded-2xl p-8 flex flex-col">
  <p class="text-gray-400 text-center mt-20">Select a conversation</p>
</div>

</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

let messages = [];
let activeThread = null;

/* LOAD ALL MESSAGES */
async function loadMessages() {
  const { data } = await supabase
    .from('collab_requests')
    .select('*')
    .order('created_at', { ascending: false });

  messages = data || [];
  renderConversationList();

  if (activeThread) openThread(activeThread, false);
}

/* LEFT COLUMN */
function renderConversationList() {
  const roots = messages.filter(m => m.parent_id === null);
  const list = document.getElementById('conversationList');

  list.innerHTML = roots.map(root => {
    const hasUnread = messages.some(
      m => m.parent_id === root.id && m.status === 'unread'
    );

    return `
      <div class="msg-item p-4 border-b border-gray-800 cursor-pointer ${hasUnread ? 'unread' : ''}"
           data-id="${root.id}">
        <div class="flex justify-between items-center">
          <span>${root.sender_name}</span>
          ${hasUnread ? `<span class="unread-text">Unread</span>` : ``}
        </div>
        <p class="msg-preview text-gray-300">${root.message}</p>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.msg-item').forEach(el => {
    el.onclick = () => openThread(el.dataset.id, true);
  });
}

/* OPEN THREAD */
async function openThread(rootId, markRead = true) {
  activeThread = rootId;

  if (markRead) {
    await supabase
      .from('collab_requests')
      .update({ status: 'read' })
      .eq('parent_id', rootId);

    // update local cache so UI changes immediately
    messages = messages.map(m =>
      m.parent_id === rootId ? { ...m, status: 'read' } : m
    );

    renderConversationList();
  }

  const root = messages.find(m => m.id === rootId);
  const replies = messages
    .filter(m => m.parent_id === rootId)
    .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));

  document.getElementById('messageView').innerHTML = `
    <div class="flex-1 overflow-y-auto space-y-6">
      <div class="border-l-4 border-emerald-500 pl-4">
        <h2 class="text-xl font-bold">${root.sender_name}</h2>
        <p>${root.message}</p>
      </div>

      ${replies.map(r => `
        <div class="reply-indent">
          <p class="font-semibold">${r.sender_name}</p>
          <p>${r.message}</p>
        </div>
      `).join('')}
    </div>

    <div class="mt-6 border-t border-gray-700 pt-4">
      <textarea id="replyInput"
        class="w-full p-4 rounded-lg bg-white/10 text-white resize-none"
        rows="3"
        placeholder="Write a reply..."></textarea>
      <button onclick="sendReply()"
        class="mt-4 bg-emerald-600 px-8 py-3 rounded-xl font-bold">
        Send Reply
      </button>
    </div>
  `;
}

/* SEND REPLY */
window.sendReply = async () => {
  const input = document.getElementById('replyInput');
  const message = input.value.trim();
  if (!message) return;

  await supabase.from('collab_requests').insert({
    parent_id: activeThread,
    sender_name: 'You',
    message,
    status: 'unread',
    created_at: new Date().toISOString()
  });

  input.value = '';
  loadMessages();
};

/* REALTIME */
supabase.channel('collab-live')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'collab_requests' }, loadMessages)
  .subscribe();

loadMessages();
</script>
</body>
</html>
