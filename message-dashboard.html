<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Messages | Rhythm Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo-favicon.png" type="image/png">
  <meta name="description" content="Discover exclusive videos, live streams, and support your favorite artists on Rhythm Deck. Watch, comment, like, and buy premium content directly from creators.">
  <meta name="keywords" content="rhythm deck, music artists, exclusive videos, live stream, artist support, premium content, music platform">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Rhythm Deck Team">
<script src="https://cdn.tailwindcss.com"></script>
<style>
.msg-item:hover { background: rgba(255,255,255,0.08); }
.msg-preview { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.selected { background: rgba(255,255,255,0.12)!important; }
.badge-new { background:#8b5cf6;color:white;font-weight:800; }
.badge-read { background:#6b7280;color:white; }
</style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-black/60 border-b border-purple-700/50 py-6 px-6 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="h-12 w-12 rounded-full">
    <div>
      <h1 class="text-3xl font-black text-emerald-400">RHYTHM DECK</h1>
      <p class="text-sm text-purple-300">Unleash Your Beat</p>
    </div>
  </div>
</header>

<div class="flex-1 max-w-7xl mx-auto p-6">
<h1 class="text-5xl font-black mb-8 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
Messages
</h1>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[80vh]">
<!-- LEFT: Conversations List -->
<div class="bg-black/40 rounded-2xl flex flex-col overflow-hidden">
  <div class="p-4 border-b border-purple-600 font-bold text-xl">Conversations</div>
  <div id="conversationList" class="flex-1 overflow-y-auto"></div>
</div>
<!-- RIGHT: Message View -->
<div id="messageView" class="lg:col-span-2 bg-black/40 rounded-2xl p-8 overflow-y-auto">
  <p class="text-gray-400 text-center mt-20">Select a conversation</p>
</div>
</div>
</div>

<!-- Footer -->
<footer class="bg-black/80 border-t border-purple-700/30 py-6 text-center text-gray-400 text-sm">
  © 2026 Rhythm Deck Music
</footer>

<!-- REPLY MODAL -->
<div id="replyModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl p-8 max-w-lg w-full relative">
    <button onclick="closeReply()" class="absolute top-4 right-4 text-3xl font-black text-red-500">×</button>
    <h2 class="text-3xl font-black text-emerald-400 mb-4">
      Reply to <span id="replyName"></span>
    </h2>
    <textarea id="replyText" rows="6" class="w-full bg-black/50 border border-emerald-500 rounded-lg p-4 text-white"></textarea>
    <button id="sendReplyBtn" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-black">
      Send Reply
    </button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc',
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

let userId = null;
let messages = [];
let activeRoot = null;
let initialized = false;

/* ───────────────────────── AUTH SAFE INIT ───────────────────────── */
async function initAuth() {
  const { data } = await supabase.auth.getSession();
  if (!data.session) {
    location.replace('login.html');
    return;
  }
  userId = data.session.user.id;
  loadMessages();
}

supabase.auth.onAuthStateChange((_event, session) => {
  if (!initialized && session?.user) {
    initialized = true;
    userId = session.user.id;
    loadMessages();
  }
});

initAuth();

/* ───────────────────────── MESSAGES ───────────────────────── */
async function loadMessages() {
  if (!userId) return;
  const { data, error } = await supabase
    .from('collab_requests')
    .select(`
      id,parent_id,sender_id,receiver_id,message,created_at,read_at,
      sender:sender_id(name),
      receiver:receiver_id(name)
    `)
    .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`)
    .order('created_at', { ascending: false });
  if (error) {
    console.error('Load messages error:', error);
    return;
  }
  messages = data || [];
  renderConversations();
}

function renderConversations() {
  const list = document.getElementById('conversationList');
  list.innerHTML = '';
  const threads = {};
  messages.forEach(m => {
    const root = m.parent_id || m.id;
    if (!threads[root]) threads[root] = [];
    threads[root].push(m);
  });

  Object.entries(threads).forEach(([rootId, thread]) => {
    const root = thread.find(m => !m.parent_id);
    if (!root) return;
    const latest = thread.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
    const isUnread = !root.read_at && root.receiver_id === userId;
    const name = root.sender_id === userId ? root.receiver.name : root.sender.name;
    const div = document.createElement('div');
    div.className = 'msg-item p-4 border-b border-gray-800 cursor-pointer hover:bg-white/5';
    div.onclick = () => openThread(rootId);
    div.innerHTML = `
      <div class="flex justify-between items-center">
        <div>
          <p class="font-bold">${name}</p>
          <p class="msg-preview text-gray-300">${latest.message}</p>
        </div>
        <div class="flex items-center gap-3">
          <span class="px-3 py-1 rounded-full ${isUnread ? 'badge-new' : 'badge-read'}">
            ${isUnread ? 'New' : 'Read'}
          </span>
          <button onclick="deleteThread('${rootId}',event)" class="text-red-400 text-xl">🗑️</button>
        </div>
      </div>
    `;
    list.appendChild(div);
  });

  const first = Object.keys(threads)[0];
  if (first) openThread(first);
}

async function openThread(rootId) {
  activeRoot = rootId;
  const thread = messages
    .filter(m => m.id === rootId || m.parent_id === rootId)
    .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const root = thread[0];
  if (root.receiver_id === userId && !root.read_at) {
    await supabase.from('collab_requests')
      .update({ read_at: new Date().toISOString() })
      .eq('id', root.id);
  }
  const name = root.sender_id === userId ? root.receiver.name : root.sender.name;
  let html = `<h2 class="text-3xl font-black text-emerald-400 mb-6">${name}</h2>`;
  thread.forEach(m => {
    const who = m.sender_id === userId ? 'You' : name;
    html += `
      <div class="mb-4 p-4 rounded-xl bg-black/30">
        <p class="font-bold text-emerald-300">${who}</p>
        <p>${m.message}</p>
      </div>
    `;
  });
  html += `<button id="replyButton" class="mt-6 bg-emerald-600 px-8 py-3 rounded-xl font-black">Reply</button>`;
  document.getElementById('messageView').innerHTML = html;

  // Attach event listener to Reply button after HTML is inserted
  document.getElementById('replyButton')?.addEventListener('click', () => openReply(name));
}

function openReply(name) {
  document.getElementById('replyName').innerText = name;
  document.getElementById('replyModal').classList.remove('hidden');
  document.getElementById('replyModal').classList.add('flex');
}

function closeReply() {
  document.getElementById('replyModal').classList.remove('flex');
  document.getElementById('replyModal').classList.add('hidden');
  document.getElementById('replyText').value = '';
}

async function sendReply() {
  const text = document.getElementById('replyText').value.trim();
  if (!text) {
    alert('Please type a message');
    return;
  }

  const root = messages.find(m => m.id === activeRoot);
  if (!root) {
    alert('No active conversation');
    return;
  }

  const receiver = root.sender_id === userId ? root.receiver_id : root.sender_id;

  const { error } = await supabase.from('collab_requests').insert({
    parent_id: activeRoot,
    sender_id: userId,
    receiver_id: receiver,
    message: text
  });

  if (error) {
    console.error('Reply failed:', error);
    alert('Failed to send reply: ' + error.message);
    return;
  }

  closeReply();
  loadMessages(); // Reload to show new reply
}

async function deleteThread(rootId, e) {
  e.stopPropagation();
  if (!confirm('Delete this conversation?')) return;
  const toDelete = messages.filter(m => m.id === rootId || m.parent_id === rootId);
  for (const m of toDelete) {
    await supabase.from('collab_requests').delete().eq('id', m.id);
  }
  loadMessages();
}

// Attach sendReply listener once on page load (since modal is static)
document.getElementById('sendReplyBtn')?.addEventListener('click', sendReply);
</script>
</body>
</html>
