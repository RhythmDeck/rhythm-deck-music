<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collab Messages | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .msg-preview { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
    .selected { background: rgba(255,255,255,0.1) !important; }
    .btn-dashboard {
      background: linear-gradient(to right, #d4af37, #b8860b);
      color: #1a0f2e;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
    }
    .btn-dashboard:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212,175,55,0.6);
    }
    .reply-indent { margin-left: 2rem; border-left: 3px solid #10b981; padding-left: 1rem; opacity: 0.9; }
    #replyModal {
      transition: opacity 0.3s ease;
    }
    #replyModal.open {
      opacity: 1;
      pointer-events: auto;
    }
    #replyModal:not(.open) {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-5xl font-black bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
        Collab Messages
      </h1>
      <button onClick="goToDashboard()" class="btn-dashboard">
        ← Back to Dashboard
      </button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[80vh]">
      <div class="bg-black/40 rounded-2xl overflow-hidden flex flex-col">
        <div class="p-4 border-b border-purple-600">
          <h2 class="text-xl font-bold">Conversations</h2>
        </div>
        <div id="conversationList" class="flex-1 overflow-y-auto"></div>
      </div>
      <div id="messageView" class="lg:col-span-2 bg-black/40 rounded-2xl p-8 flex flex-col overflow-y-auto">
        <p class="text-gray-400 text-center mt-20">Select a conversation to view messages</p>
      </div>
    </div>
  </div>

  <div id="replyModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-[99999] opacity-0 pointer-events-none">
    <div class="bg-gray-900 rounded-3xl shadow-2xl w-full max-w-lg mx-4 relative">
      <button onClick="closeReplyModal()" class="absolute top-4 right-4 w-12 h-12 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center text-white text-3xl font-bold z-50 shadow-xl">
        ×
      </button>
      <div class="p-8 pt-16">
        <h2 class="text-4xl font-black text-emerald-400 mb-6 text-center">
          Reply to <span id="replyTargetName">Artist</span>
        </h2>
        <textarea id="replyMessage" rows="6" placeholder="Write your reply..." required
                  class="w-full p-4 rounded-lg bg-white/10 text-white border border-emerald-500 placeholder-gray-400 resize-none focus:outline-none focus:border-emerald-400"></textarea>
        <button onClick="sendReply()" class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xl py-4 rounded-xl transition shadow-xl transform hover:scale-105">
          Send Reply
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    let currentUserId = null;
    let currentConversationId = null;
    let currentMessages = [];

    window.goToDashboard = async function() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert("Please log in first");
      const { data: profile } = await supabase.from('profiles').select('plan').eq('id', user.id).single();
      if (profile?.plan === 'platinum') {
        window.location.href = 'platinum-pro-admin.html';
      } else {
        window.location.href = 'profile-admin-pro.html';
      }
    };

    function openReplyModal(targetId, name) {
      currentConversationId = targetId;
      document.getElementById('replyTargetName').textContent = name;
      const modal = document.getElementById('replyModal');
      modal.classList.add('opacity-100');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('replyMessage').focus();
    }

    function closeReplyModal() {
      const modal = document.getElementById('replyModal');
      modal.classList.remove('opacity-100');
      modal.classList.add('pointer-events-none');
      // After fade-out finishes, reset everything
      setTimeout(() => {
        modal.classList.add('opacity-0');
        document.getElementById('replyMessage').value = '';
      }, 350);
    }

    async function sendReply() {
      const message = document.getElementById('replyMessage').value.trim();
      if (!message) return alert('Please write a reply!');

      const { data: profile } = await supabase.from('profiles').select('name').eq('id', currentUserId).single();
      const senderName = profile?.name || 'You';

      const { error } = await supabase.from('collab_requests').insert({
        parent_id: currentConversationId,
        sender_name: senderName,
        message: message,
        created_at: new Date().toISOString()
      });

      if (error) {
        console.error('Send reply error:', error);
        alert('Failed to send reply: ' + error.message);
      } else {
        alert('Reply sent!');
        closeReplyModal();
        loadMessages();
      }
    }

    function showThread(originalMsg) {
      currentConversationId = originalMsg.id;

      const replies = currentMessages
        .filter(m => m.parent_id === originalMsg.id)
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      let html = `
        <div class="flex-1 overflow-y-auto pr-4 space-y-6">
          <div class="bg-black/40 rounded-2xl p-6 border-l-4 border-emerald-500">
            <div class="flex justify-between items-start mb-4">
              <div>
                <h2 class="text-2xl font-black text-emerald-400">${originalMsg.sender_name}</h2>
                <p class="text-sm text-gray-400 mt-1">${new Date(originalMsg.created_at).toLocaleString()}</p>
              </div>
            </div>
            <p class="text-lg whitespace-pre-line">${originalMsg.message}</p>
          </div>
      `;

      if (replies.length > 0) {
        html += `<h3 class="text-xl font-bold mt-6 mb-4">Replies</h3>`;
        replies.forEach(reply => {
          html += `
            <div class="reply-indent bg-black/30 rounded-xl p-5">
              <p class="font-semibold text-emerald-300">${reply.sender_name}</p>
              <p class="text-xs text-gray-500">${new Date(reply.created_at).toLocaleString()}</p>
              <p class="mt-2">${reply.message}</p>
            </div>
          `;
        });
      } else {
        html += `<p class="text-gray-400 italic mt-6">No replies yet</p>`;
      }

      html += `
        </div>
        <div class="mt-8 flex justify-end">
          <button id="replyThreadBtn" data-target-id="${originalMsg.id}" data-target-name="${originalMsg.sender_name.replace(/"/g, '&quot;').replace(/'/g, "&#39;")}"
                  class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold px-10 py-4 rounded-xl text-xl transition transform hover:scale-105 shadow-xl">
            Reply to this thread
          </button>
        </div>
      `;

      document.getElementById('messageView').innerHTML = html;

      document.getElementById('replyThreadBtn')?.addEventListener('click', function() {
        const targetId = this.dataset.targetId;
        const targetName = this.dataset.targetName;
        openReplyModal(targetId, targetName);
      });

      document.querySelectorAll('.msg-item').forEach(el => el.classList.remove('selected'));
      document.querySelector(`[data-id="${originalMsg.id}"]`)?.classList.add('selected');
    }

    async function loadMessages() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        location.href = 'login.html';
        return;
      }

      currentUserId = user.id;

      const list = document.getElementById('conversationList');
      list.innerHTML = '<p class="text-center text-gray-500 py-10">Loading...</p>';

      const { data: messages, error } = await supabase
        .from('collab_requests')
        .select('*')
        .eq('artist_id', currentUserId)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Load error:', error);
        list.innerHTML = '<p class="text-red-400 text-center py-10">Error loading messages</p>';
        return;
      }

      currentMessages = messages || [];

      if (!currentMessages.length) {
        list.innerHTML = '<p class="text-gray-400 text-center py-10">No messages yet</p>';
        document.getElementById('messageView').innerHTML = '<p class="text-gray-400 text-center mt-20">No conversations found</p>';
        return;
      }

      const topLevel = currentMessages.filter(m => !m.parent_id);

      list.innerHTML = topLevel.map(msg => `
        <div data-id="${msg.id}" class="msg-item p-4 border-b border-gray-800 cursor-pointer hover:bg-white/5">
          <p class="font-bold">${msg.sender_name}</p>
          <p class="text-sm text-gray-400">${new Date(msg.created_at).toLocaleString()}</p>
          <p class="msg-preview text-gray-300">${msg.message}</p>
        </div>
      `).join('');

      document.querySelectorAll('.msg-item').forEach(item => {
        item.addEventListener('click', () => {
          const msgId = item.dataset.id;
          const msg = currentMessages.find(m => m.id === msgId);
          if (msg) showThread(msg);
        });
      });

      if (topLevel.length > 0) {
        showThread(topLevel[0]);
      }
    }

    loadMessages();
  </script>
</body>
</html>
