<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Messages | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="logo-favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(to bottom right, #020617, #3b0764, #000000);
      color: white;
    }
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .msg-unread { font-weight: 800; }
    .msg-preview {
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col font-sans">

<!-- HEADER -->
<header class="bg-black/70 border-b border-purple-700/40 py-5 px-6 flex justify-between items-center">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full border-2 border-emerald-500">
    <div>
      <h1 class="text-2xl font-black text-emerald-400">RHYTHM DECK</h1>
      <p class="text-sm text-purple-300">Unleash Your Beat</p>
    </div>
  </div>
  <a href="platinum-pro-admin.html"
     class="bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-black px-6 py-3 rounded-full">
     Back to Dashboard
  </a>
</header>

<!-- MAIN -->
<main class="flex-1 max-w-7xl mx-auto p-4 md:p-6 w-full">

  <h1 class="text-4xl font-black mb-6 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
    Messages
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 gap-4 h-[75vh]">

    <!-- LEFT COLUMN -->
    <aside class="bg-black/40 rounded-2xl border border-purple-700/30 flex flex-col overflow-hidden">
      <div class="p-5 border-b border-purple-600 font-black text-xl text-emerald-400">
        Folders
      </div>

      <div class="p-4 space-y-2 border-b border-gray-700">
        <button onclick="loadFolder('inbox')" class="w-full text-left py-3 px-4 rounded-lg font-bold hover:bg-white/10">
          Inbox <span id="inboxCount" class="ml-2 text-sm text-emerald-400"></span>
        </button>
        <button onclick="loadFolder('sent')" class="w-full text-left py-3 px-4 rounded-lg font-bold hover:bg-white/10">
          Sent
        </button>
        <button onclick="loadFolder('trash')" class="w-full text-left py-3 px-4 rounded-lg font-bold hover:bg-white/10 text-red-400">
          Trash
        </button>
      </div>

      <div id="conversationList" class="flex-1 overflow-y-auto"></div>
    </aside>

    <!-- RIGHT COLUMN -->
    <section id="messageView"
      class="md:col-span-3 lg:col-span-4 bg-black/40 rounded-2xl p-6 border border-purple-700/30 overflow-y-auto">
      <p class="text-gray-400 text-center mt-24 text-xl">
        Select a conversation
      </p>
    </section>

  </div>
</main>

<!-- REPLY MODAL -->
<div id="replyModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl p-8 max-w-lg w-full relative">
    <button onclick="closeReply()" class="absolute top-4 right-4 text-3xl font-black text-red-500">×</button>
    <h2 class="text-2xl font-black text-emerald-400 mb-4">Reply</h2>
    <textarea id="replyText" rows="6"
      class="w-full bg-black/50 border border-emerald-500 rounded-lg p-4 text-white"></textarea>
    <button onclick="sendReply()"
      class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-black text-lg">
      Send Reply
    </button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

let userId;
let threads = [];
let currentFolder = 'inbox';
let activeRootId = null;

/* INIT */
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return location.href = 'login.html';
  userId = session.user.id;
  loadFolder('inbox');
})();

/* LOAD FOLDER */
async function loadFolder(folder) {
  currentFolder = folder;
  activeRootId = null;

  const { data } = await supabase
    .from('messages')
    .select('*')
    .eq('owner_id', userId)
    .eq('folder', folder)
    .order('created_at', { ascending: false });

  buildThreads(data || []);
  renderConversationList();
  updateInboxCount();
}

/* THREADS */
function buildThreads(messages) {
  const map = {};
  messages.forEach(m => {
    const root = m.parent_id || m.id;
    map[root] ??= [];
    map[root].push(m);
  });

  threads = Object.entries(map).map(([rootId, msgs]) => {
    msgs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    return { rootId, messages: msgs, latest: msgs.at(-1) };
  });
}

/* LIST */
function renderConversationList() {
  const list = document.getElementById('conversationList');
  list.innerHTML = threads.length ? '' : '<p class="text-center text-gray-400 mt-6">No messages</p>';

  threads.forEach(t => {
    const unread = t.latest.receiver_id === userId && !t.latest.read_at;
    const div = document.createElement('div');
    div.className = `msg-item p-4 border-b border-gray-800 cursor-pointer ${unread ? 'msg-unread' : ''}`;
    div.onclick = () => openConversation(t.rootId);
    div.innerHTML = `
      <p class="font-bold">${t.latest.subject || 'Conversation'}</p>
      <p class="msg-preview text-gray-400">${t.latest.body}</p>
    `;
    list.appendChild(div);
  });
}

/* OPEN */
async function openConversation(rootId) {
  activeRootId = rootId;
  const thread = threads.find(t => t.rootId === rootId);
  if (!thread) return;

  await supabase
    .from('messages')
    .update({ read_at: new Date().toISOString() })
    .eq('receiver_id', userId)
    .eq('parent_id', rootId)
    .is('read_at', null);

  document.getElementById('messageView').innerHTML = thread.messages.map(m => `
    <div class="mb-4 p-4 rounded-xl bg-black/30">
      <p class="font-bold ${m.sender_id===userId?'text-emerald-400':'text-purple-400'}">
        ${m.sender_id===userId?'You':'Them'}
      </p>
      <p>${m.body}</p>
    </div>
  `).join('') + `
    <button onclick="openReply()" class="mt-6 bg-emerald-600 px-8 py-3 rounded-xl font-black">
      Reply
    </button>
  `;
}

/* COUNTS */
async function updateInboxCount() {
  const { data } = await supabase
    .from('messages')
    .select('id')
    .eq('owner_id', userId)
    .eq('folder', 'inbox')
    .is('read_at', null);

  document.getElementById('inboxCount').textContent =
    data?.length ? `(${data.length})` : '';
}

/* REPLY */
function openReply(){replyModal.classList.remove('hidden');replyModal.classList.add('flex')}
function closeReply(){replyModal.classList.add('hidden')}

async function sendReply() {
  const text = replyText.value.trim();
  if (!text) return;

  const thread = threads.find(t=>t.rootId===activeRootId);
  const root = thread.messages[0];
  const receiver = root.sender_id === userId ? root.receiver_id : root.sender_id;

  await supabase.from('messages').insert([
    {
      parent_id: activeRootId,
      sender_id: userId,
      receiver_id: receiver,
      owner_id: userId,
      folder: 'sent',
      body: text
    },
    {
      parent_id: activeRootId,
      sender_id: userId,
      receiver_id: receiver,
      owner_id: receiver,
      folder: 'inbox',
      body: text
    }
  ]);

  closeReply();
  loadFolder(currentFolder);
}

window.loadFolder = loadFolder;
window.openConversation = openConversation;
window.openReply = openReply;
window.closeReply = closeReply;
window.sendReply = sendReply;
</script>

</body>
</html>
