<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Messages | Rhythm Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo-favicon.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: linear-gradient(to bottom, #000000, #0f172a); color: white; font-family: system-ui, sans-serif; }
.msg-item:hover { background: rgba(255,255,255,0.08); }
.msg-preview { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.selected { background: rgba(255,255,255,0.12) !important; }
.badge-unread { background: #8b5cf6; color: white; font-weight: 800; }
.badge-read { background: #6b7280; color: white; }
.reply-indent { margin-left: 2.5rem; border-left: 3px solid #10b981; padding-left: 1.25rem; opacity: 0.9; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="bg-black/60 border-b border-purple-700/50 py-6 px-6 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="h-12 w-12 rounded-full">
    <div>
      <h1 class="text-3xl font-black text-emerald-400">RHYTHM DECK</h1>
      <p class="text-sm text-purple-300">Unleash Your Beat</p>
    </div>
  </div>
</header>

<div class="flex-1 max-w-7xl mx-auto p-6">
  <h1 class="text-5xl font-black mb-8 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
    Messages
  </h1>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 h-[80vh]">
    <!-- Sidebar: Folders & Conversations -->
    <div class="bg-black/40 rounded-2xl flex flex-col overflow-hidden lg:col-span-1 border border-purple-700/30">
      <div class="p-6 border-b border-purple-600 font-bold text-2xl text-emerald-400">
        Folders
      </div>
      <div class="p-4 border-b border-gray-700">
        <button onclick="loadFolder('inbox')" class="w-full text-left py-3 px-4 hover:bg-white/10 rounded-lg font-bold flex justify-between items-center">
          Inbox <span id="inboxCount" class="badge-unread px-2 py-1 text-xs rounded-full hidden">0</span>
        </button>
        <button onclick="loadFolder('sent')" class="w-full text-left py-3 px-4 hover:bg-white/10 rounded-lg font-bold flex justify-between items-center">
          Sent
        </button>
        <button onclick="loadFolder('trash')" class="w-full text-left py-3 px-4 hover:bg-white/10 rounded-lg font-bold flex justify-between items-center">
          Trash
        </button>
      </div>
      <div id="conversationList" class="flex-1 overflow-y-auto p-4"></div>
    </div>

    <!-- Main Message View -->
    <div id="messageView" class="lg:col-span-3 bg-black/40 rounded-2xl p-8 overflow-y-auto border border-purple-700/30">
      <p class="text-gray-400 text-center mt-20 text-xl">Select a conversation</p>
    </div>
  </div>
</div>

<footer class="bg-black/80 border-t border-purple-700/30 py-6 text-center text-gray-400 text-sm">
  © 2026 Rhythm Deck Music
</footer>

<!-- Reply Modal -->
<div id="replyModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl p-8 max-w-lg w-full relative">
    <button onclick="closeReply()" class="absolute top-4 right-4 text-3xl font-black text-red-500">×</button>
    <h2 class="text-3xl font-black text-emerald-400 mb-4">
      Reply to <span id="replyName"></span>
    </h2>
    <input id="replySubject" type="text" class="w-full bg-black/50 border border-emerald-500 rounded-lg p-4 mb-4 text-white" placeholder="Subject">
    <textarea id="replyText" rows="6" class="w-full bg-black/50 border border-emerald-500 rounded-lg p-4 text-white"></textarea>
    <button id="sendReplyBtn" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-black">
      Send Reply
    </button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc',
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
);

let userId = null;
let messages = [];
let currentFolder = 'inbox';
let activeConversationId = null;

async function init() {
  const { data } = await supabase.auth.getSession();
  if (!data.session) {
    location.replace('login.html');
    return;
  }
  userId = data.session.user.id;
  loadFolder('inbox');
}

supabase.auth.onAuthStateChange((_, session) => {
  if (session?.user) {
    userId = session.user.id;
    loadFolder(currentFolder);
  }
});

init();

async function loadFolder(folder) {
  currentFolder = folder;
  const { data, error } = await supabase
    .from('messages')
    .select(`
      id,sender_id,receiver_id,subject,body,created_at,read_at,
      sender:sender_id(name),
      receiver:receiver_id(name)
    `)
    .eq('folder', folder)
    .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`)
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Load error:', error);
    return;
  }

  messages = data || [];
  renderConversationList();
  if (messages.length > 0) {
    openConversation(messages[0].id);
  } else {
    document.getElementById('messageView').innerHTML = '<p class="text-gray-400 text-center mt-20 text-xl">No messages in this folder</p>';
  }
}

function renderConversationList() {
  const list = document.getElementById('conversationList');
  list.innerHTML = '';

  const conversations = {};
  messages.forEach(m => {
    const partnerId = m.sender_id === userId ? m.receiver_id : m.sender_id;
    const partnerName = m.sender_id === userId ? m.receiver.name : m.sender.name;
    if (!conversations[partnerId]) conversations[partnerId] = { name: partnerName, messages: [] };
    conversations[partnerId].messages.push(m);
  });

  Object.entries(conversations).forEach(([partnerId, conv]) => {
    const latest = conv.messages.sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
    const unreadCount = conv.messages.filter(m => !m.read_at && m.receiver_id === userId).length;
    const div = document.createElement('div');
    div.className = `msg-item p-4 border-b border-gray-800 cursor-pointer hover:bg-white/5 ${activeConversationId === latest.id ? 'selected' : ''}`;
    div.onclick = () => openConversation(latest.id);
    div.innerHTML = `
      <div class="flex justify-between items-center">
        <div>
          <p class="font-bold ${unreadCount > 0 ? 'text-white' : 'text-gray-400'}">${conv.name}</p>
          <p class="msg-preview text-gray-300">${latest.subject || '(No subject)'}</p>
        </div>
        <div class="flex items-center gap-3">
          ${unreadCount > 0 ? `<span class="badge-new px-2 py-1 text-xs rounded-full">${unreadCount}</span>` : ''}
        </div>
      </div>
    `;
    list.appendChild(div);
  });
}

async function openConversation(messageId) {
  activeConversationId = messageId;
  const conversation = messages.filter(m => m.id === messageId || m.parent_id === messageId);
  const root = conversation.find(m => !m.parent_id) || conversation[0];
  const partnerName = root.sender_id === userId ? root.receiver.name : root.sender.name;

  if (root.receiver_id === userId && !root.read_at) {
    await supabase.from('messages').update({ read_at: new Date().toISOString() }).eq('id', root.id);
  }

  let html = `<h2 class="text-3xl font-black text-emerald-400 mb-6">${partnerName}</h2>`;
  conversation.forEach(m => {
    const who = m.sender_id === userId ? 'You' : partnerName;
    const isUnread = !m.read_at && m.receiver_id === userId;
    html += `
      <div class="mb-4 p-4 rounded-xl ${isUnread ? 'bg-purple-900/30' : 'bg-black/30'}">
        <p class="font-bold text-emerald-300">${who} - ${m.subject || '(No subject)'}</p>
        <p class="text-xs text-gray-500">${new Date(m.created_at).toLocaleString()}</p>
        <p class="mt-2">${m.body}</p>
      </div>
    `;
  });
  html += `<button id="replyButton" class="mt-6 bg-emerald-600 px-8 py-3 rounded-xl font-black">Reply</button>`;
  document.getElementById('messageView').innerHTML = html;

  document.getElementById('replyButton')?.addEventListener('click', () => openReply(partnerName, root.subject));
  document.getElementById('messageView').scrollTop = document.getElementById('messageView').scrollHeight;
}

function openReply(name, subject) {
  document.getElementById('replyName').innerText = name;
  document.getElementById('replySubject').value = subject ? `Re: ${subject}` : 'Re: ';
  document.getElementById('replyModal').classList.remove('hidden');
  document.getElementById('replyModal').classList.add('flex');
}

function closeReply() {
  document.getElementById('replyModal').classList.remove('flex');
  document.getElementById('replyModal').classList.add('hidden');
  document.getElementById('replyText').value = '';
}

async function sendReply() {
  const subject = document.getElementById('replySubject').value.trim();
  const text = document.getElementById('replyText').value.trim();
  if (!text) return alert('Please type a message');

  const root = messages.find(m => m.id === activeConversationId);
  if (!root) return alert('No active conversation');

  const receiver = root.sender_id === userId ? root.receiver_id : root.sender_id;

  const { error } = await supabase.from('messages').insert({
    sender_id: userId,
    receiver_id: receiver,
    subject: subject || '(No subject)',
    body: text,
    parent_id: activeConversationId
  });

  if (error) {
    alert('Failed to send reply: ' + error.message);
    return;
  }

  closeReply();
  loadMessages();
}

// Attach sendReply listener
document.getElementById('sendReplyBtn')?.addEventListener('click', sendReply);
</script>
</body>
</html>
