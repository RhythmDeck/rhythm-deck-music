<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Messages | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .msg-preview { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .selected { background: rgba(255,255,255,0.12) !important; }
    .badge-new { background:#8b5cf6; color:white; font-weight:800; }
    .badge-read { background:#6b7280; color:white; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-black/60 border-b border-purple-700/50 py-6 px-4 sm:px-6 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="h-10 sm:h-12 w-10 sm:w-12 rounded-full">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black text-emerald-400">RHYTHM DECK</h1>
        <p class="text-sm text-purple-300">Unleash Your Beat</p>
      </div>
    </div>
  </header>

  <div class="flex-1 max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    <h1 class="text-4xl sm:text-5xl font-black mb-6 sm:mb-8 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent text-center lg:text-left">
      Messages
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 gap-6 lg:gap-8 h-[70vh] sm:h-[80vh]">
      <!-- LEFT: Conversations List -->
      <div class="bg-black/40 rounded-2xl flex flex-col overflow-hidden md:col-span-1 lg:col-span-1 border border-purple-700/30 shadow-xl">
        <div class="p-5 sm:p-6 border-b border-purple-600 font-bold text-xl sm:text-2xl text-emerald-400">
          Conversations
        </div>
        <div id="conversationList" class="flex-1 overflow-y-auto p-4 sm:p-6"></div>
      </div>

      <!-- RIGHT: Message View -->
      <div id="messageView" class="md:col-span-3 lg:col-span-4 bg-black/40 rounded-2xl p-6 sm:p-8 lg:p-10 overflow-y-auto border border-purple-700/30 shadow-xl">
        <p class="text-gray-400 text-center mt-16 sm:mt-32 text-lg sm:text-xl font-medium">
          Select a conversation to view messages
        </p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-black/80 border-t border-purple-700/30 py-6 text-center text-gray-400 text-sm">
    © 2026 Rhythm Deck Music
  </footer>

  <!-- Reply Modal -->
  <div id="replyModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-2xl p-6 sm:p-8 max-w-lg w-[90%] sm:w-full mx-4 relative">
      <button onclick="closeReply()" class="absolute top-4 right-4 text-3xl font-black text-red-500">×</button>
      <h2 class="text-2xl sm:text-3xl font-black text-emerald-400 mb-4 text-center">
        Reply to <span id="replyName"></span>
      </h2>
      <textarea id="replyText" rows="6" class="w-full bg-black/50 border border-emerald-500 rounded-lg p-4 text-white text-base"></textarea>
      <button id="sendReplyBtn" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 py-3 sm:py-4 rounded-xl font-black text-lg sm:text-xl">
        Send Reply
      </button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc',
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    let userId = null;
    let messages = [];
    let activeRoot = null;
    let initialized = false;

    async function initAuth() {
      const { data } = await supabase.auth.getSession();
      if (!data.session) {
        location.replace('login.html');
        return;
      }
      userId = data.session.user.id;
      loadMessages();
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      if (!initialized && session?.user) {
        initialized = true;
        userId = session.user.id;
        loadMessages();
      }
    });

    initAuth();

    async function loadMessages() {
      if (!userId) return;
      const { data, error } = await supabase
        .from('messages')
        .select(`
          id, parent_id, sender_id, receiver_id, subject, body, created_at, read_at, folder, owner_id,
          sender:sender_id(name),
          receiver:receiver_id(name)
        `)
        .eq('owner_id', userId)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Load messages error:', error);
        document.getElementById('messageView').innerHTML = '<p class="text-red-400 text-center py-10">Error loading messages</p>';
        return;
      }

      messages = data || [];
      renderConversations();
    }

    function renderConversations() {
      const list = document.getElementById('conversationList');
      list.innerHTML = '';

      // Group by root message (conversation)
      const threads = {};
      messages.forEach(m => {
        const rootId = m.parent_id || m.id;
        if (!threads[rootId]) threads[rootId] = [];
        threads[rootId].push(m);
      });

      const sortedThreads = Object.entries(threads).sort(([,a], [,b]) => {
        const latestA = a.reduce((max, m) => new Date(m.created_at) > new Date(max.created_at) ? m : max, a[0]);
        const latestB = b.reduce((max, m) => new Date(m.created_at) > new Date(max.created_at) ? m : max, b[0]);
        return new Date(latestB.created_at) - new Date(latestA.created_at);
      });

      sortedThreads.forEach(([rootId, thread]) => {
        const root = thread.find(m => !m.parent_id) || thread[0];
        const latest = thread.reduce((max, m) => new Date(m.created_at) > new Date(max.created_at) ? m : max, thread[0]);
        const isUnread = !root.read_at && root.receiver_id === userId;
        const partnerName = root.sender_id === userId ? root.receiver?.name : root.sender?.name;

        const div = document.createElement('div');
        div.className = `msg-item p-4 border-b border-gray-800 cursor-pointer hover:bg-white/5 ${activeRoot === rootId ? 'selected' : ''}`;
        div.onclick = () => openThread(rootId);
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <div>
              <p class="font-bold">${partnerName || 'Unknown'}</p>
              <p class="msg-preview text-gray-300">${latest.subject ? latest.subject : latest.body.substring(0, 60) + '...'}</p>
            </div>
            <div class="flex items-center gap-3">
              <span class="px-3 py-1 rounded-full ${isUnread ? 'badge-new' : 'badge-read'}">
                ${isUnread ? 'New' : 'Read'}
              </span>
              <button onclick="deleteThread('${rootId}', event)" class="text-red-400 text-xl">🗑️</button>
            </div>
          </div>
        `;
        list.appendChild(div);
      });

      // Auto-open first conversation if exists
      if (sortedThreads.length > 0 && !activeRoot) {
        openThread(sortedThreads[0][0]);
      }
    }

    async function openThread(rootId) {
      activeRoot = rootId;
      const thread = messages
        .filter(m => m.id === rootId || m.parent_id === rootId)
        .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

      const root = thread.find(m => !m.parent_id) || thread[0];
      if (root.receiver_id === userId && !root.read_at) {
        await supabase.from('messages')
          .update({ read_at: new Date().toISOString() })
          .eq('id', root.id);
      }

      const partnerName = root.sender_id === userId ? root.receiver?.name : root.sender?.name;

      let html = `<h2 class="text-3xl font-black text-emerald-400 mb-6">${partnerName || 'Unknown'}</h2>`;

      thread.forEach(m => {
        const who = m.sender_id === userId ? 'You' : partnerName || 'Unknown';
        html += `
          <div class="mb-4 p-4 rounded-xl bg-black/30">
            <p class="font-bold text-emerald-300">${who}</p>
            <p class="text-xs text-gray-500">${new Date(m.created_at).toLocaleString()}</p>
            <p class="mt-1">${m.subject ? `<strong>Subject:</strong> ${m.subject}<br>` : ''}${m.body}</p>
          </div>
        `;
      });

      html += `<button id="replyButton" class="mt-6 bg-emerald-600 px-8 py-3 rounded-xl font-black">Reply</button>`;

      document.getElementById('messageView').innerHTML = html;
      document.getElementById('replyButton')?.addEventListener('click', () => openReply(partnerName));
      document.getElementById('messageView').scrollTop = document.getElementById('messageView').scrollHeight;
    }

    function openReply(name) {
      document.getElementById('replyName').innerText = name || 'User';
      document.getElementById('replyText').value = '';
      document.getElementById('replyModal').classList.remove('hidden');
      document.getElementById('replyModal').classList.add('flex');
    }

    function closeReply() {
      document.getElementById('replyModal').classList.remove('flex');
      document.getElementById('replyModal').classList.add('hidden');
    }

    async function sendReply() {
      const text = document.getElementById('replyText').value.trim();
      if (!text) {
        alert('Please type a message');
        return;
      }

      const root = messages.find(m => m.id === activeRoot);
      if (!root) {
        alert('No active conversation');
        return;
      }

      const receiverId = root.sender_id === userId ? root.receiver_id : root.sender_id;

      const { error } = await supabase.from('messages').insert({
        parent_id: activeRoot,
        sender_id: userId,
        receiver_id: receiverId,
        subject: 'Re: ' + (root.subject || '(No subject)'),
        body: text,
        owner_id: userId,
        folder: 'sent'
      });

      if (error) {
        console.error('Reply failed:', error);
        alert('Failed to send reply: ' + error.message);
        return;
      }

      closeReply();
      loadMessages(); // Refresh list
    }

    async function deleteThread(rootId, e) {
      e.stopPropagation();
      if (!confirm('Delete this conversation?')) return;

      const toDelete = messages.filter(m => m.id === rootId || m.parent_id === rootId);
      for (const m of toDelete) {
        await supabase.from('messages').delete().eq('id', m.id);
      }
      loadMessages();
    }

    document.getElementById('sendReplyBtn')?.addEventListener('click', sendReply);
  </script>
</body>
</html>
