<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry Sign Up - Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(to bottom, #000000, #0f172a); color: white; }
    .password-toggle { cursor: pointer; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: #9ca3af; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">

<!-- HEADER (unchanged) -->
<header class="sticky top-0 z-10 bg-black/90 backdrop-blur-md border-b border-gray-800/50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-5 flex flex-col sm:flex-row items-center justify-between gap-4 sm:gap-0">
    <div class="flex items-center gap-3 sm:gap-4">
      <img src="logo-1-sm.jpg" class="w-12 h-12 rounded-full border-2 border-emerald-500" />
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">
          Rhythm Deck
        </h1>
        <p class="text-sm text-gray-300">Unleash Your Beat</p>
      </div>
    </div>
    <a href="index.html" class="bg-gray-800 px-6 py-3 rounded-lg text-emerald-400 font-medium">
      ← Back to Home
    </a>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-20">
  <div class="grid md:grid-cols-2 gap-12 items-center">

    <img src="industry-collab.jpg" class="rounded-xl shadow-2xl">

    <div class="bg-gray-900/70 rounded-2xl p-10 border border-emerald-600/50">
      <h2 class="text-4xl font-bold text-center text-emerald-400 mb-6">
        Join as an Industry Professional
      </h2>

      <form id="signupForm" class="space-y-6">

        <!-- BASIC INFO (unchanged) -->
        <input id="full_name" placeholder="Full Name" class="w-full p-4 bg-gray-800 rounded-lg" required>
        <input id="email" type="email" placeholder="Email" class="w-full p-4 bg-gray-800 rounded-lg" required>
        <input id="company" placeholder="Company" class="w-full p-4 bg-gray-800 rounded-lg" required>
        <input id="subdomain" placeholder="your-company-name" class="w-full p-4 bg-gray-800 rounded-lg" required>

        <select id="role" class="w-full p-4 bg-gray-800 rounded-lg" required>
          <option value="" disabled selected>Select Role</option>
          <option value="producer">Music Producer</option>
          <option value="distributor">Music Distributor</option>
          <option value="publisher">Music Publisher</option>
          <option value="supervisor">Music Supervisor</option>
        </select>

        <!-- ✅ NEW: LOGO UPLOAD -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">
            Upload Logo or Profile Image
          </label>
          <input
            type="file"
            id="logo"
            accept="image/png,image/jpeg,image/webp"
            class="w-full bg-gray-800 p-3 rounded-lg text-gray-300"
          >
          <p class="text-xs text-gray-400 mt-1">
            This image will appear in the Industry Directory.
          </p>
        </div>

        <!-- PASSWORDS -->
        <input id="password" type="password" placeholder="Password" class="w-full p-4 bg-gray-800 rounded-lg" required>
        <input id="confirm_password" type="password" placeholder="Confirm Password" class="w-full p-4 bg-gray-800 rounded-lg" required>

        <label class="flex items-center gap-3 text-sm">
          <input type="checkbox" id="terms" required>
          I agree to the terms
        </label>

        <button type="button" onclick="handleSignup()"
          class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 py-5 rounded-full font-bold text-xl">
          Create Account
        </button>

      </form>
    </div>
  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

window.handleSignup = async function () {
  const fullName = full_name.value.trim();
  const email = email.value.trim();
  const company = company.value.trim();
  const subdomain = subdomain.value.trim().toLowerCase();
  const role = role.value;
  const password = password.value;
  const confirm = confirm_password.value;
  const logoFile = document.getElementById('logo').files[0];

  if (password !== confirm) return alert('Passwords do not match');

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });

  if (error) return alert(error.message);

  let logoUrl = null;

  if (logoFile) {
    const filePath = `${data.user.id}/logo.${logoFile.name.split('.').pop()}`;

    const { error: uploadError } = await supabase.storage
      .from('industry-logos')
      .upload(filePath, logoFile, { upsert: true });

    if (!uploadError) {
      const { data: publicUrl } = supabase.storage
        .from('industry-logos')
        .getPublicUrl(filePath);

      logoUrl = publicUrl.publicUrl;
    }
  }

  await supabase.from('profiles').upsert({
    id: data.user.id,
    name: fullName,
    company,
    role: 'industry',
    industry_role: role,
    subdomain,
    industry_logo_url: logoUrl
  });

  alert('Account created! Please log in.');
  location.href = 'login.html';
};
</script>

</body>
</html>
