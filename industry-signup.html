<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industry Signup - Rhythm Deck</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(to bottom, #000000, #0f172a);
  color: white;
}
</style>
</head>

<body class="min-h-screen font-sans antialiased">

<!-- HEADER -->
<header class="sticky top-0 z-10 bg-black/90 backdrop-blur-md border-b border-gray-800/50">
  <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <img src="logo-1-sm.jpg" class="w-12 h-12 rounded-full border-2 border-emerald-500" />
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">
          Rhythm Deck
        </h1>
        <p class="text-sm text-gray-300">Unleash Your Beat</p>
      </div>
    </div>
    <a href="index.html" class="bg-gray-800 px-6 py-3 rounded-lg text-emerald-400 hover:bg-gray-700">
      ← Back to Home
    </a>
  </div>
</header>

<!-- MAIN -->
<main class="max-w-7xl mx-auto px-6 py-24">
  <div class="grid md:grid-cols-2 gap-16 items-center">

    <!-- LEFT IMAGE -->
    <img src="industry-collab.jpg" class="rounded-2xl shadow-2xl w-full">

    <!-- FORM -->
    <div class="bg-gray-900/70 border border-emerald-600/50 rounded-2xl p-12 shadow-2xl">

      <h2 class="text-4xl font-black text-center text-emerald-400 mb-6">
        Industry Professional Signup
      </h2>

      <p class="text-center text-gray-300 mb-10">
        Create your industry profile and start collaborating.
      </p>

      <form class="space-y-6" onsubmit="event.preventDefault(); handleSignup();">

        <!-- IMAGE UPLOAD -->
        <div>
          <label class="block text-gray-300 mb-2">Company Logo (optional)</label>
          <input type="file" id="logo"
            class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg">
        </div>

        <div>
          <label class="block text-gray-300 mb-2">Full Name *</label>
          <input id="full_name" type="text" required
            class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg">
        </div>

        <div>
          <label class="block text-gray-300 mb-2">Company / Brand *</label>
          <input id="company" type="text" required
            class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg">
        </div>

        <div>
          <label class="block text-gray-300 mb-2">Industry Role *</label>
          <select id="industry_role" required
            class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg">
            <option value="">Select Role</option>
            <option value="producer">Producer</option>
            <option value="label">Label</option>
            <option value="manager">Manager</option>
            <option value="publisher">Publisher</option>
            <option value="distributor">Distributor</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-300 mb-2">Email *</label>
          <input id="email" type="email" required
            class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg">
        </div>

        <div>
          <label class="block text-gray-300 mb-2">Password *</label>
          <input id="password" type="password" required
            class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg">
        </div>

        <div>
          <label class="block text-gray-300 mb-2">Confirm Password *</label>
          <input id="confirm_password" type="password"
            autocomplete="new-password" required
            class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg">
        </div>

        <button type="submit"
          class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-500 py-5 rounded-full font-black text-xl hover:scale-105 transition">
          Create Industry Account
        </button>

        <p id="status" class="text-center text-sm mt-4"></p>

      </form>
    </div>

  </div>
</main>

<!-- SUPABASE LOGIC -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

window.handleSignup = async () => {
  const status = document.getElementById('status');

  const fullName = document.getElementById('full_name').value.trim();
  const company = document.getElementById('company').value.trim();
  const industryRole = document.getElementById('industry_role').value;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;

  if (password !== confirm) {
    status.textContent = 'Passwords do not match';
    status.className = 'text-red-400 text-center';
    return;
  }

  const { data, error } = await supabase.auth.signUp({ email, password });

  if (error) {
    status.textContent = error.message;
    status.className = 'text-red-400 text-center';
    return;
  }

  const userId = data.user.id;

  const { error: profileError } = await supabase
    .from('profiles')
    .insert({
      id: userId,
      email,
      name: fullName,
      role: 'industry',
      industry_role: industryRole,
      industry_company: company,
      plan: 'industry'
    });

  if (profileError) {
    status.textContent = profileError.message;
    status.className = 'text-red-400 text-center';
    return;
  }

  window.location.href = 'industry-dashboard.html';
};
</script>

</body>
</html>
