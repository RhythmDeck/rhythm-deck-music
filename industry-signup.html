<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industry Signup - Rhythm Deck</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-b from-black to-slate-900 text-white">

<main class="max-w-3xl mx-auto px-6 py-24">
  <div class="bg-gray-900/80 border border-emerald-600/50 rounded-2xl p-12 shadow-2xl">
    <h1 class="text-4xl font-black text-center text-emerald-400 mb-8">
      Industry Professional Signup
    </h1>

    <form class="space-y-6" onsubmit="event.preventDefault(); handleSignup();">

      <input id="full_name" type="text" placeholder="Full Name"
        class="w-full p-4 bg-gray-800 rounded-lg" required>

      <input id="company" type="text" placeholder="Company / Brand"
        class="w-full p-4 bg-gray-800 rounded-lg" required>

      <select id="industry_role"
        class="w-full p-4 bg-gray-800 rounded-lg" required>
        <option value="">Select Role</option>
        <option value="producer">Producer</option>
        <option value="label">Label</option>
        <option value="manager">Manager</option>
        <option value="publisher">Publisher</option>
        <option value="distributor">Distributor</option>
      </select>

      <input id="email" type="email" placeholder="Email"
        class="w-full p-4 bg-gray-800 rounded-lg" required>

      <input id="password" type="password" placeholder="Password"
        class="w-full p-4 bg-gray-800 rounded-lg" required>

      <input id="confirm_password" type="password"
        autocomplete="new-password"
        placeholder="Confirm Password"
        class="w-full p-4 bg-gray-800 rounded-lg" required>

      <button type="submit"
        class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 py-5 rounded-full font-black text-xl hover:scale-105 transition">
        Create Industry Account
      </button>

      <p id="status" class="text-center text-sm mt-4"></p>

    </form>
  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

window.handleSignup = async () => {
  const fullName = document.getElementById('full_name').value.trim();
  const company = document.getElementById('company').value.trim();
  const industryRole = document.getElementById('industry_role').value;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  const status = document.getElementById('status');

  if (password !== confirm) {
    status.textContent = 'Passwords do not match';
    status.className = 'text-red-400 text-center';
    return;
  }

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });

  if (error) {
    status.textContent = error.message;
    status.className = 'text-red-400 text-center';
    return;
  }

  const userId = data.user.id;

  const { error: profileError } = await supabase
    .from('profiles')
    .insert({
      id: userId,
      email,
      name: fullName,
      role: 'industry',
      industry_role: industryRole,
      industry_company: company,
      plan: 'industry'
    });

  if (profileError) {
    status.textContent = profileError.message;
    status.className = 'text-red-400 text-center';
    return;
  }

  window.location.href = 'industry-dashboard.html';
};
</script>

</body>
</html>
