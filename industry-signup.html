<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry Sign Up - Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(to bottom, #000000, #0f172a); color: white; }
    .password-toggle { cursor: pointer; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: #9ca3af; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <!-- Header -->
  <header class="sticky top-0 z-10 bg-black/90 backdrop-blur-md border-b border-gray-800/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-5 flex flex-col sm:flex-row items-center justify-between gap-4 sm:gap-0">
      <div class="flex items-center gap-3 sm:gap-4">
        <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="w-10 sm:w-12 h-10 sm:h-12 rounded-full border-2 border-emerald-500 shadow-md object-cover" />
        <div>
          <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">
            Rhythm Deck
          </h1>
          <p class="text-xs sm:text-sm text-gray-300 font-medium">Unleash Your Beat</p>
        </div>
      </div>
      <div class="flex items-center">
        <a href="index.html" class="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-emerald-400 hover:text-emerald-300 px-4 sm:px-6 py-2 sm:py-3 rounded-lg font-medium transition shadow-md text-sm sm:text-base">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 sm:h-5 w-4 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Back to Home
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content - Two Columns -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-16 sm:py-24">
    <div class="grid md:grid-cols-2 gap-12 items-center">
      <!-- Left Column - Image -->
      <div class="order-2 md:order-1">
        <img src="industry-collab.jpg" alt="Diverse music industry professionals collaborating in a modern office" class="rounded-xl shadow-2xl w-full object-cover">
      </div>

      <!-- Right Column - Sign Up Form -->
      <div class="order-1 md:order-2 bg-gray-900/70 rounded-2xl p-8 sm:p-12 border border-emerald-600/50 shadow-2xl">
        <h2 class="text-3xl sm:text-4xl font-bold mb-6 text-center text-emerald-400">
          Join Rhythm Deck as an Industry Professional
        </h2>
        <p class="text-lg text-gray-300 mb-10 text-center">
          Connect with emerging artists, message them directly, and discover your next big collaboration.
        </p>
        <form id="signupForm" class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Full Name *</label>
            <input type="text" id="full_name" required class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500" placeholder="John Smith">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Email Address *</label>
            <input type="email" id="email" required class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500" placeholder="you@company.com">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Company *</label>
            <input type="text" id="company" required class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500" placeholder="Your Label / Studio / Company">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Your Role *</label>
            <select id="role" required class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500">
              <option value="" disabled selected>Select your role</option>
              <option value="producer">Music Producer</option>
              <option value="distributor">Music Distributor</option>
              <option value="publisher">Music Publisher</option>
              <option value="supervisor">Music Supervisor</option>
            </select>
          </div>
          <div class="relative">
            <label class="block text-sm font-medium text-gray-300 mb-2">Password *</label>
            <input type="password" id="password" required class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500" placeholder="Create a secure password">
            <span class="password-toggle absolute right-4 top-10 text-gray-400 cursor-pointer" onclick="togglePassword('password')">👁️</span>
          </div>
          <div class="relative">
            <label class="block text-sm font-medium text-gray-300 mb-2">Confirm Password *</label>
            <input type="password" id="confirm_password" required class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500" placeholder="Confirm your password">
            <span class="password-toggle absolute right-4 top-10 text-gray-400 cursor-pointer" onclick="togglePassword('confirm_password')">👁️</span>
          </div>
          <div class="flex items-center">
            <input type="checkbox" id="terms" required class="h-5 w-5 text-emerald-500 focus:ring-emerald-400 border-gray-600 rounded">
            <label for="terms" class="ml-3 text-sm text-gray-300">
              I have filled out the forms and submitted to Rhythm Deck.
            </label>
          </div>
          <div class="text-center pt-6">
            <button type="button" onclick="handleSignup()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold text-xl px-12 py-5 rounded-full shadow-2xl transform hover:scale-105 transition-all duration-300">
              Create Account
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-black text-white mt-16 p-8 text-center text-sm border-t border-gray-800">
    <p>© 2025 Rhythm Deck Music. All rights reserved.</p>
  </footer>

  <!-- Global toggle function -->
  <script>
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const toggleIcon = field.nextElementSibling;
      if (field.type === "password") {
        field.type = "text";
        toggleIcon.textContent = "🙈";
      } else {
        field.type = "password";
        toggleIcon.textContent = "👁️";
      }
    }
  </script>

  <!-- Supabase signup logic -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    window.handleSignup = async function() {
      const fullName = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const company = document.getElementById('company').value.trim();
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirm_password').value.trim();
      const terms = document.getElementById('terms').checked;

      if (!fullName || !email || !company || !role || !password || !confirmPassword) {
        return alert('Please fill all required fields.');
      }

      if (password !== confirmPassword) {
        return alert('Passwords do not match.');
      }

      if (password.length < 6) {
        return alert('Password must be at least 6 characters.');
      }

      if (!terms) {
        return alert('You must agree to the terms.');
      }

      // 1. Create auth user
      const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            company,
            role
          }
        }
      });

      if (signUpError) {
        console.error('Signup error:', signUpError);
        alert('Signup failed: ' + (signUpError.message || 'Unknown error'));
        return;
      }

      // 2. Insert profile – use new industry columns, leave subdomain null
      const { error: profileError } = await supabase
        .from('profiles')
        .insert({
          id: signUpData.user.id,
          name: fullName,
          company,
          industry_role: role,          // ← new column for role
          industry_company: company,    // ← new column for company
          email,
          plan: role                    // still set plan to role for filtering
          // NO subdomain — left null (allowed after you make it nullable)
        });

      if (profileError) {
        console.error('Profile insert error details:', profileError);
        alert('Account created, but profile setup failed.\nError: ' + (profileError.message || 'Unknown') + '\n\nCheck console for details.');
        return;
      }

      alert('Account created successfully! Please log in.');
      window.location.href = 'industry-login.html';
    };
  </script>
</body>
</html>
