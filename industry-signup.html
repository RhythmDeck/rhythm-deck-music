<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry Sign Up - Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(to bottom, #000000, #0f172a); color: white; }
    .password-toggle {
      cursor: pointer;
      position: absolute;
      right: 1rem;
      top: 3.2rem;
      color: #9ca3af;
    }
  </style>
</head>

<body class="min-h-screen font-sans antialiased">

<header class="sticky top-0 z-10 bg-black/90 backdrop-blur-md border-b border-gray-800/50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <img src="logo-1-sm.jpg" class="w-12 h-12 rounded-full border-2 border-emerald-500" />
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">
          Rhythm Deck
        </h1>
        <p class="text-sm text-gray-300">Unleash Your Beat</p>
      </div>
    </div>
    <a href="index.html" class="bg-gray-800 px-6 py-3 rounded-lg text-emerald-400 font-medium">
      ← Back to Home
    </a>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-20">
  <div class="grid md:grid-cols-2 gap-14 items-center">

    <img src="industry-collab.jpg" class="rounded-xl shadow-2xl">

    <div class="bg-gray-900/70 rounded-2xl p-10 border border-emerald-600/50">
      <h2 class="text-4xl font-bold text-center text-emerald-400 mb-10">
        Industry Professional Sign Up
      </h2>

      <form class="space-y-6" autocomplete="off">

        <div>
          <label class="block text-sm mb-2">Full Name</label>
          <input id="full_name" autocomplete="name" class="w-full p-4 bg-gray-800 rounded-lg" required>
        </div>

        <div>
          <label class="block text-sm mb-2">Email Address</label>
          <input id="email" type="email" autocomplete="email" class="w-full p-4 bg-gray-800 rounded-lg" required>
        </div>

        <div>
          <label class="block text-sm mb-2">Company</label>
          <input id="company" autocomplete="organization" class="w-full p-4 bg-gray-800 rounded-lg" required>
        </div>

        <div>
          <label class="block text-sm mb-2">Public Subdomain</label>
          <input id="subdomain" autocomplete="off" class="w-full p-4 bg-gray-800 rounded-lg" placeholder="your-company-name" required>
        </div>

        <div>
          <label class="block text-sm mb-2">Industry Role</label>
          <select id="industry_role" autocomplete="off" class="w-full p-4 bg-gray-800 rounded-lg" required>
            <option value="">Select role</option>
            <option value="producer">Music Producer</option>
            <option value="distributor">Music Distributor</option>
            <option value="publisher">Music Publisher</option>
            <option value="supervisor">Music Supervisor</option>
          </select>
        </div>

        <div>
          <label class="block text-sm mb-2">Logo / Profile Image</label>
          <input id="logo" type="file" accept="image/*" autocomplete="off" class="w-full bg-gray-800 p-3 rounded-lg">
        </div>

        <div class="relative">
          <label class="block text-sm mb-2">Password</label>
          <input id="password" type="password" autocomplete="new-password" class="w-full p-4 bg-gray-800 rounded-lg" required>
          <span class="password-toggle" onclick="togglePassword('password')">👁️</span>
        </div>

        <div class="relative">
          <label class="block text-sm mb-2">Confirm Password</label>
          <input id="confirm_password" type="password" autocomplete="new-password" class="w-full p-4 bg-gray-800 rounded-lg" required>
          <span class="password-toggle" onclick="togglePassword('confirm_password')">👁️</span>
        </div>

        <button
          type="button"
          onclick="handleSignup()"
          class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 py-5 rounded-full font-bold text-xl">
          Create Account
        </button>

      </form>
    </div>
  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'YOUR_PUBLIC_ANON_KEY'
);

window.togglePassword = (id) => {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
};

// Hard reset autofill on load (Chrome-safe)
window.addEventListener('load', () => {
  document.querySelectorAll('input').forEach(i => i.value = '');
});

window.handleSignup = async () => {
  const fullName = full_name.value.trim();
  const emailVal = email.value.trim();
  const companyVal = company.value.trim();
  const subdomainVal = subdomain.value.trim().toLowerCase();
  const roleVal = industry_role.value;
  const passwordVal = password.value;
  const confirmVal = confirm_password.value;
  const logoFile = logo.files[0];

  if (passwordVal !== confirmVal) {
    alert('Passwords do not match');
    return;
  }

  const { data, error } = await supabase.auth.signUp({
    email: emailVal,
    password: passwordVal
  });

  if (error) {
    alert(error.message);
    return;
  }

  let logoUrl = null;

  if (logoFile) {
    const path = `${data.user.id}/logo.${logoFile.name.split('.').pop()}`;
    await supabase.storage.from('industry-logos').upload(path, logoFile, { upsert: true });
    logoUrl = supabase.storage.from('industry-logos').getPublicUrl(path).data.publicUrl;
  }

  await supabase.from('profiles').insert({
    id: data.user.id,
    name: fullName,
    company: companyVal,
    industry_role: roleVal,
    subdomain: subdomainVal,
    industry_logo_url: logoUrl
  });

  alert('Account created successfully. Please log in.');
  location.href = 'login.html';
};
</script>

</body>
</html>
