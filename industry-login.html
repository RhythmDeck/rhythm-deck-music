<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industry Login - Rhythm Deck</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-b from-black to-slate-900 text-white">

<main class="max-w-md mx-auto px-6 py-32">
  <div class="bg-gray-900/80 border border-emerald-600/50 rounded-2xl p-12 shadow-2xl">
    <h1 class="text-4xl font-black text-center text-emerald-400 mb-8">
      Industry Login
    </h1>

    <form class="space-y-6" onsubmit="event.preventDefault(); handleLogin();">
      <input id="email" type="email" placeholder="Email"
        class="w-full p-4 bg-gray-800 rounded-lg" required>

      <input id="password" type="password" placeholder="Password"
        class="w-full p-4 bg-gray-800 rounded-lg" required>

      <button type="submit"
        class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 py-5 rounded-full font-black text-xl hover:scale-105 transition">
        Log In
      </button>

      <p id="status" class="text-center text-sm mt-4"></p>
    </form>
  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

window.handleLogin = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const status = document.getElementById('status');

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    status.textContent = error.message;
    status.className = 'text-red-400 text-center';
    return;
  }

  const userId = data.user.id;

  const { data: profile, error: profileError } = await supabase
    .from('profiles')
    .select('role')
    .eq('id', userId)
    .single();

  if (profileError || !profile) {
    status.textContent = 'Profile not found';
    status.className = 'text-red-400 text-center';
    return;
  }

  if (profile.role === 'industry') {
    window.location.href = 'industry-dashboard.html';
  } else {
    window.location.href = 'profile-admin.html';
  }
};
</script>

</body>
</html>
