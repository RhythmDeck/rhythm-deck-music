<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Industry Login - Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    .card {
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid #10b981;
      border-radius: 20px;
      padding: 48px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px rgba(16, 185, 129, 0.25);
    }
    .logo-big {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #10b981;
      padding: 6px;
    }
    .input-group {
      position: relative;
      margin-bottom: 24px;
    }
    .eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #94a3b8;
      user-select: none;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen">

<header class="bg-black/90 border-b border-purple-700/50 px-6 py-4 flex items-center gap-4">
  <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full">
  <div>
    <div class="text-2xl font-black text-emerald-400">RHYTHM DECK</div>
    <div class="text-sm text-purple-300">Unleash Your Beat</div>
  </div>
</header>

<main class="flex-grow flex items-center justify-center p-6">
  <div class="card">

    <div class="text-center mb-8">
      <img src="logo-1-sm.jpg" class="logo-big mx-auto mb-4">
      <h1 class="text-4xl font-black text-emerald-400">Industry Login</h1>
      <p class="text-gray-400 mt-2">Access your dashboard</p>
    </div>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        required
        placeholder="Email address"
        class="w-full p-4 mb-6 bg-gray-800 border border-gray-700 rounded-xl text-lg">

      <div class="input-group">
        <input
          type="password"
          id="password"
          required
          placeholder="Password"
          class="w-full p-4 bg-gray-800 border border-gray-700 rounded-xl pr-14 text-lg">
        <span class="eye" id="toggleEye">Show</span>
      </div>

      <!-- MANDATORY IMAGE UPLOAD -->
      <div class="mt-6 text-left">
        <label class="block text-sm font-bold mb-2 text-emerald-400">
          Upload Logo / Photo (required)
        </label>
        <input
          type="file"
          id="industryAvatar"
          accept="image/*"
          required
          class="w-full p-3 bg-gray-800 border border-gray-700 rounded-xl text-sm">
      </div>

      <button
        type="submit"
        class="w-full mt-8 py-5 bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full font-black text-xl hover:scale-105 transition">
        Log In
      </button>

      <p class="text-center text-amber-400 mt-4">
        <a href="forgot-password.html?from=industry" class="underline hover:text-white">
          Forgot your password?
        </a>
      </p>

      <p id="status" class="text-center text-sm mt-4 hidden"></p>
    </form>

  </div>
</main>

<footer class="bg-black/80 border-t border-purple-700/30 py-4 text-center text-sm text-gray-400">
  © 2026 Rhythm Deck Music
</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

const form = document.getElementById('loginForm');
const status = document.getElementById('status');
const avatarInput = document.getElementById('industryAvatar');

/* Password toggle */
const passwordInput = document.getElementById('password');
document.getElementById('toggleEye').onclick = () => {
  passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
};

form.onsubmit = async (e) => {
  e.preventDefault();

  if (!avatarInput.files.length) {
    status.textContent = 'Please upload a logo or photo.';
    status.className = 'text-center text-sm mt-4 text-red-400';
    status.classList.remove('hidden');
    return;
  }

  status.textContent = 'Uploading image…';
  status.className = 'text-center text-sm mt-4 text-gray-300';
  status.classList.remove('hidden');

  const file = avatarInput.files[0];

  const { error: uploadError } = await supabase
    .storage
    .from('industry-avatars')
    .upload('test/alex-rivera.jpg', file, {
      upsert: true,
      contentType: file.type
    });

  if (uploadError) {
    status.textContent = uploadError.message;
    status.className = 'text-center text-sm mt-4 text-red-400';
    return;
  }

  status.textContent = 'Logging in…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    status.textContent = error.message;
    status.className = 'text-center text-sm mt-4 text-red-400';
    return;
  }

  const { data: profile } = await supabase
    .from('profiles')
    .select('plan')
    .eq('id', data.user.id)
    .single();

  if (profile?.plan !== 'industry') {
    await supabase.auth.signOut();
    status.textContent = 'This login is for industry accounts only.';
    status.className = 'text-center text-sm mt-4 text-red-400';
    return;
  }

  location.href = 'industry-directory.html';
};
</script>

</body>
</html>
