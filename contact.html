<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact | Rhythm Deck Music</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <base href="/">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

  <!-- HEADER (your existing header) -->
  <header class="bg-black text-white p-4 flex justify-between items-center">
    <!-- ... keep your header unchanged ... -->
  </header>

  <!-- HERO (unchanged) -->
  <section class="relative h-[450px] bg-cover bg-center flex items-center justify-center"
           style="background-image: url('banner-cropped.jpg');">
    <!-- ... your hero ... -->
  </section>

  <!-- CONTACT SECTION -->
  <main class="flex-grow max-w-6xl mx-auto p-8 bg-white mt-6 rounded-lg shadow-md">
    <div class="grid md:grid-cols-2 gap-8 items-stretch">
      <!-- LEFT IMAGE -->
      <div class="rounded-lg overflow-hidden shadow-md">
        <img src="contact.png" alt="Creative Music Studio" class="w-full h-full object-cover">
      </div>

      <!-- RIGHT CONTACT FORM -->
      <div class="flex flex-col justify-center">
        <h2 class="text-3xl font-bold mb-4 text-center md:text-left">Contact Rhythm Deck Music</h2>
        <p class="text-gray-700 mb-6 text-center md:text-left">
          Have a question, collaboration idea, or just want to say hello? Fill out the form below.<br>
          For support: support@rhythmdeckmusic.com<br>
          For investors: investors@rhythmdeckmusic.com
        </p>

        <form id="contactForm"
          action="https://formsubmit.co/rhythmdeckmusic@gmail.com"
          method="POST"
          class="bg-gray-50 p-6 rounded-lg shadow space-y-5">

          <!-- FormSubmit Settings -->
          <input type="hidden" name="_next" value="https://rhythm-deck.wasmer.app/thank-you.html">
          <input type="hidden" name="_subject" value="New Contact Message from Rhythm Deck">
          <input type="hidden" name="_captcha" value="true">
          <input type="hidden" name="_autoresponse" value="Thank you for reaching out! We'll reply soon.">
          <input type="hidden" name="_blacklist" value="viagra,casino,porn,free money,loan,xxx">

          <!-- Honeypot Field (Bots love this) -->
          <div style="display: none !important;">
            <input type="text" name="website" id="website" tabindex="-1" autocomplete="off">
          </div>

          <!-- Timestamp (Anti-spam) -->
          <input type="hidden" name="timestamp" id="timestamp" value="">

          <!-- Real Fields -->
          <div>
            <label class="block mb-2 font-semibold">Full Name <span class="text-red-500">*</span></label>
            <input type="text" name="Name" id="name" class="w-full border p-3 rounded focus:outline-none focus:border-green-500" placeholder="Your Full Name" required>
          </div>

          <div>
            <label class="block mb-2 font-semibold">Email Address <span class="text-red-500">*</span></label>
            <input type="email" name="Email" id="email" class="w-full border p-3 rounded focus:outline-none focus:border-green-500" placeholder="you@email.com" required>
          </div>

          <div>
            <label class="block mb-2 font-semibold">I am a... <span class="text-red-500">*</span></label>
            <select name="Role" id="role" class="w-full border p-3 rounded focus:outline-none focus:border-green-500" required>
              <option value="">Select One</option>
              <option value="Musician">Musician</option>
              <option value="Band">Band</option>
              <option value="Vocalist">Vocalist</option>
              <option value="Songwriter">Songwriter</option>
              <option value="Music Producer">Music Producer</option>
              <option value="Distributor">Distributor</option>
              <option value="Investor">Investor</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div>
            <label class="block mb-2 font-semibold">Message <span class="text-red-500">*</span></label>
            <textarea name="Message" id="message" rows="6" class="w-full border p-3 rounded focus:outline-none focus:border-green-500" placeholder="Your message..." required></textarea>
          </div>

          <button type="submit" id="submitBtn"
                  class="w-full bg-black hover:bg-green-600 text-white font-bold py-4 rounded-lg transition text-lg">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- FOOTER (unchanged) -->
  <footer class="bg-black text-white mt-10 p-4 text-center text-sm">
    <!-- ... your footer ... -->
  </footer>

  <script>
    const form = document.getElementById('contactForm');
    const timestampField = document.getElementById('timestamp');
    const honeypot = document.getElementById('website');

    // Set timestamp when page loads
    timestampField.value = Date.now();

    form.addEventListener('submit', function(e) {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const role = document.getElementById('role').value;
      const message = document.getElementById('message').value.trim();

      // Honeypot Check
      if (honeypot.value.trim() !== '') {
        e.preventDefault();
        console.log("Spam attempt blocked (Honeypot)");
        return false;
      }

      // Time Check - Must take at least 4 seconds to fill form
      const timeTaken = (Date.now() - parseInt(timestampField.value)) / 1000;
      if (timeTaken < 4) {
        e.preventDefault();
        console.log("Spam attempt blocked (Too Fast)");
        alert("Please take a moment to fill out the form properly.");
        return false;
      }

      // Basic validation
      if (!name || !email || !role || !message) {
        e.preventDefault();
        alert("Please fill out all required fields.");
        return false;
      }
    });
  </script>
</body>
</html>
