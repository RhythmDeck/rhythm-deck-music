<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"

const supabase = createClient(
"https://bxoqhmfnseskwqkywppg.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
)

const form = document.getElementById("signupForm")
const submitButton = document.getElementById("submitButton")

/* password toggle */

const togglePassword = document.getElementById("togglePassword")
const passwordField = document.getElementById("password")

togglePassword.onclick = () => {
passwordField.type = passwordField.type === "password" ? "text" : "password"
togglePassword.innerText = passwordField.type === "password" ? "👁" : "🙈"
}

/* signup */

form.addEventListener("submit", async (e)=>{

e.preventDefault()

submitButton.disabled = true
submitButton.innerText = "Creating Account..."

const name = document.getElementById("artistName").value.trim()
const email = document.getElementById("email").value.trim()
const password = document.getElementById("password").value
const subdomain = document.getElementById("subdomain").value.trim()

/* create auth user */

const { data:authData, error:authError } = await supabase.auth.signUp({
email,
password
})

if(authError){
alert(authError.message)
submitButton.disabled = false
submitButton.innerText = "Sign Up Now & Get Platinum Pro FREE for Life!"
return
}

const user = authData.user

/* create profile */

const { error:profileError } = await supabase
.from("profiles")
.insert([
{
id: user.id,
email: email,
name: name,
subdomain: subdomain,
role: "artist",
plan: "platinum",
subscription_status: "active",
paid: false
}
])

if(profileError){
alert(profileError.message)
submitButton.disabled=false
return
}

alert("Account created successfully! Please log in.")

window.location.href = "login.html"

})

</script>
