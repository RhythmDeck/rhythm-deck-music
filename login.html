<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Rhythm Deck</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ Supabase JS v2 UMD (GLOBAL = window.Supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    .card {
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid #10b981;
      border-radius: 20px;
      padding: 48px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px rgba(16, 185, 129, 0.25);
    }
    .logo-big {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #10b981;
      padding: 6px;
    }
    .input-group {
      position: relative;
      margin-bottom: 24px;
    }
    .eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #94a3b8;
      font-size: 1.1rem;
      user-select: none;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen">

  <header class="bg-black text-white p-5 flex items-center shadow-lg">
    <img src="logo-1-sm.jpg" class="w-12 h-12 rounded-full border-2 border-green-500 mr-4">
    <div>
      <h1 class="text-3xl font-black">RHYTHM DECK</h1>
      <p class="text-sm text-green-400">Unleash Your Beat</p>
    </div>
  </header>

  <div class="flex-1 flex items-center justify-center p-6">
    <div class="card">

      <div class="text-center mb-8">
        <img src="logo-1-sm.jpg" class="logo-big mx-auto mb-4">
        <h1 class="text-4xl font-black text-green-400">Welcome Back</h1>
      </div>

      <form id="loginForm" novalidate>
        <div class="input-group">
          <input
            type="email"
            id="loginEmail"
            placeholder="Email"
            required
            class="w-full px-5 py-4 bg-gray-800 border border-gray-700 rounded-xl text-lg">
        </div>

        <div class="input-group">
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
            class="w-full px-5 py-4 bg-gray-800 border border-gray-700 rounded-xl text-lg pr-14">
          <span class="eye" id="toggleEye">Show</span>
        </div>

        <p id="errorMessage" class="text-red-400 text-center mb-4 hidden"></p>

        <button
          type="submit"
          class="w-full py-5 bg-green-600 hover:bg-green-700 text-white font-black text-xl rounded-xl">
          LOGIN
        </button>
      </form>

    </div>
  </div>

  <script>
    // ✅ CORRECT GLOBAL
    const supabase = window.Supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const passwordInput = document.getElementById("loginPassword");
    const toggleEye = document.getElementById("toggleEye");

    toggleEye.addEventListener("click", () => {
      passwordInput.type =
        passwordInput.type === "password" ? "text" : "password";
      toggleEye.textContent =
        passwordInput.type === "password" ? "Show" : "Hide";
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const errorMessage = document.getElementById("errorMessage");

      errorMessage.classList.add("hidden");

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        errorMessage.textContent = error.message;
        errorMessage.classList.remove("hidden");
        return;
      }

      // ✅ SUCCESS
      window.location.href = "platinum-pro-admin.html";
    });
  </script>

</body>
</html>
