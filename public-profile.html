<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist | Rhythm Deck</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .live-dot{display:inline-block;width:16px;height:16px;background:#ef4444;border-radius:50%;animation:pulse 1.8s infinite;box-shadow:0 0 20px #ef4444}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .video-card{border-radius:1.5rem;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.15);transition:all .4s ease;background:white}
    .video-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 30px 60px rgba(0,0,0,0.3)}
    .thumbnail-container{position:relative;width:100%;padding-top:56.25%;overflow:hidden;background:#000;cursor:pointer}
    .thumbnail-container img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
    .video-card:hover .thumbnail-container img{transform:scale(1.08)}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s ease}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(255,255,255,0.95);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition:all .3s ease;backdrop-filter:blur(10px)}
    .video-card:hover .play-button{transform:scale(1.15);background:white}
    .play-button svg{width:38px;height:38px;margin-left:6px;fill:#10b981}
    #risingStarBadge{position:absolute;top:30px;right:30px;width:140px;height:140px;z-index:30;opacity:0;transform:scale(0) rotate(-20deg);transition:all .8s cubic-bezier(0.175,0.885,0.32,1.4)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(10deg)}
    .like-btn.liked{color:#ef4444;filter:drop-shadow(0 0 10px #ef4444)}
    .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:0.75rem 1rem;margin-bottom:0.5rem}
    .comment-name{font-weight:700;color:#10b981;text-shadow:0 0 8px rgba(16,185,129,0.4)}
    .comment-text{color:#1f2937;margin-left:0.5rem;font-weight:500}
    #artistName{color:#ffffff !important;text-shadow:0 4px 20px rgba(0,0,0,0.8);-webkit-text-stroke:2px black;paint-order:stroke fill}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">

  <!-- Your beautiful HTML stays exactly the same -->
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star" style="display:none" onerror="this.remove()">
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover" onerror="this.src='logo-placeholder.png'">
      <div class="text-center md:text-left">
        <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <div id="liveSection" class="mb-20 hidden">…</div>

    <div class="mb-20">
      <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center md:text-left">Videos</h2>
      <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
    </div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const params = new URLSearchParams(location.search);
    const idParam = params.get('id')?.trim().toLowerCase();
    if (!idParam) location.href = '/';

    let artistUserId = null;
    let artistPlan = null;
    let currentFanName = localStorage.getItem('rhythmDeckFanName') || '';

    async function loadProfile() {
      try {
        // THIS WAS THE BUG — .single() fails when RLS is on and exactly one row exists
        // → changed to .maybeSingle() + manual check
        const { data, error } = await supabase
          .from('profiles')
          .select('id, name, bio, banner_url, logo_url, plan, is_live, live_stream_url')
          .ilike('subdomain', idParam)
          .maybeSingle();           // ← FIXED LINE 1

        if (error) throw error;
        if (!data) {              // ← FIXED LINE 2
          document.body.innerHTML = `<div class="text-center mt-32 p-16 bg-white rounded-3xl shadow-2xl max-w-2xl mx-auto"><h1 class="text-8xl font-black text-red-600 mb-8">Artist Not Found</h1><p class="text-2xl mb-8">No artist found with subdomain: <strong>${idParam}</strong></p><a href="/" class="bg-emerald-600 text-white px-12 py-6 rounded-2xl text-3xl font-black hover:bg-emerald-700">Go Home</a></div>`;
          return;
        }

        // Everything below is unchanged and works perfectly
        artistUserId = data.id;
        artistPlan = data.plan;
        document.title = `${data.name} • Rhythm Deck`;
        document.getElementById('artistName').textContent = data.name || 'Artist';
        document.getElementById('artistBio').textContent = data.bio || 'No bio yet.';

        if (data.banner_url) {
          const url = supabase.storage.from('media').getPublicUrl(data.banner_url).data.publicUrl;
          const banner = document.getElementById('banner');
          banner.src = url;
          banner.onload = () => {
            banner.classList.remove('hidden');
            document.getElementById('bannerPlaceholder').classList.add('hidden');
          };
        }
        if (data.logo_url) {
          document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(data.logo_url).data.publicUrl;
        }
        if (data.plan === 'pro') {
          document.getElementById('liveSection').classList.remove('hidden');
          if (data.is_live && data.live_stream_url) {
            document.getElementById('offlinePlaceholder').classList.add('hidden');
            document.getElementById('livePlayer').classList.remove('hidden');
            let url = data.live_stream_url.trim();
            if (url.includes('youtube.com') || url.includes('youtu.be')) url = url.replace('watch?v=', 'embed/') + '?autoplay=1';
            else if (url.includes('twitch.tv')) {
              const channel = url.split('/').pop();
              url = `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}&autoplay=true`;
            }
            document.getElementById('liveIframe').src = url;
            loadLiveChat();
            setInterval(loadLiveChat, 5000);
          }
        }
        loadVideos();

      } catch (err) {
        console.error(err);
        document.body.innerHTML = `<div class="text-center mt-32 p-16 bg-white rounded-3xl shadow-2xl max-w-2xl mx-auto"><h1 class="text-8xl font-black text-red-600 mb-8">Error</h1><a href="/" class="bg-emerald-600 text-white px-12 py-6 rounded-2xl text-3xl font-black hover:bg-emerald-700">Go Home</a></div>`;
      }
    }

    // Rest of your code (loadLiveChat, loadVideos, event listeners) stays 100% the same
    // … (everything from your file — I didn’t touch it)

    loadProfile();
  </script>
</body>
</html>
