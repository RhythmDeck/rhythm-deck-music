<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Rhythm Deck</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .video-card {
      background: #111;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,.3);
      transition: .4s;
      position: relative;
    }
    .video-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 60px rgba(0,0,0,.5);
    }
    .media-player {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: .4s;
    }
    .video-card:hover .play-overlay {
      opacity: 1;
    }
    .play-button {
      width: 90px;
      height: 90px;
      background: rgba(16,185,129,.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-button svg {
      width: 38px;
      height: 38px;
      margin-left: 6px;
      fill: white;
    }
    #artistName {
      color: #fff;
      text-shadow: 0 4px 20px #000;
      -webkit-text-stroke: 2px #000;
      paint-order: stroke fill;
    }
    .live-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #ef4444;
      color: white;
      font-weight: 900;
      padding: 10px 24px;
      border-radius: 50px;
      animation: pulse 2s infinite;
      z-index: 10;
      font-size: 1.2rem;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,.8); }
      70% { box-shadow: 0 0 0 16px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .comment-bubble {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: .75rem 1rem;
      margin-bottom: .5rem;
    }
    .comment-name { font-weight: 700; color: #10b981; }
    .comment-text { color: #1f2937; margin-left: .5rem; font-weight: 500; }
    .liked svg { fill: #ef4444; stroke: none; }
    #badge-container {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 30;
    }
    #badge-container img {
      width: 165px;
      height: 165px;
      filter: drop-shadow(0 0 35px rgba(255,215,0,0.9));
      transition: all .4s ease;
    }
    #badge-container img:hover {
      transform: scale(1.2) rotate(12deg);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">
  <!-- Header -->
  <header class="bg-black text-white p-5 flex flex-col sm:flex-row justify-between items-center shadow-lg">
    <div class="flex items-center space-x-4">
      <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="w-12 h-12 rounded-full border-2 border-green-500">
      <div>
        <h1 class="text-3xl font-black tracking-wider">RHYTHM DECK</h1>
        <p class="text-sm text-green-400">Unleash Your Beat</p>
      </div>
    </div>
    <div class="flex items-center gap-6 mt-4 sm:mt-0">
      <a id="merchStoreBtn" href="#" target="_blank" rel="noopener noreferrer"
         class="bg-gradient-to-r from-yellow-500 to-orange-600 hover:from-yellow-600 hover:to-orange-700 text-white px-8 py-3 rounded-lg font-bold transition shadow-lg">
        Check out our Merch Store
      </a>
    </div>
  </header>

  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <div id="badge-container"></div>
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="https://placehold.co/400x400/emerald/white?text=Artist&font=roboto" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
    </div>

    <!-- Live Stream + Tip Section – now shown for both Pro and Platinum -->
    <div id="liveStreamSection" class="mb-20 hidden">
      <div class="bg-gradient-to-r from-purple-50 to-pink-50 p-8 rounded-xl shadow-2xl border-l-8 border-purple-600">
        <h3 class="text-3xl font-black text-purple-800 mb-6">Artist is Live</h3>
        <div class="grid lg:grid-cols-3 gap-8 mb-8">
          <div class="lg:col-span-2">
            <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center text-white text-2xl font-bold">
              <div id="offlineMessage" class="text-center">The artist is not live right now</div>
              <div id="livepeer-player" class="hidden w-full h-full"></div>
              <div id="liveIndicator" class="live-badge hidden">LIVE NOW</div>
            </div>
          </div>
          <div class="bg-white rounded-xl shadow-xl p-6 flex flex-col h-full">
            <h4 class="font-black text-xl text-purple-700 mb-4">Live Chat</h4>
            <div id="liveChatMessages" class="flex-1 overflow-y-auto bg-gray-50 p-4 rounded-lg min-h-0 max-h-96 space-y-3">
              <p class="text-gray-500 text-center italic">Chat appears when the artist is live</p>
            </div>
            <div class="mt-4 space-y-3">
              <input type="text" id="chatNameInput" placeholder="Your name (optional)" class="w-full border border-purple-300 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-600">
              <input type="text" id="chatMessageInput" placeholder="Send a message..." class="w-full border border-purple-300 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-600" onKeyDown="if(event.key==='Enter') sendLiveMessage()">
              <button onClick="sendLiveMessage()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg">Send</button>
            </div>
          </div>
        </div>

        <!-- TIP BUCKET – shown for Pro/Platinum with Stripe connected -->
        <div id="tipBucketSection" class="hidden bg-gradient-to-br from-emerald-100 to-green-100 p-4 rounded-xl shadow-xl border-4 border-emerald-400 text-center max-w-xl mx-auto">
          <h4 class="text-xl font-black text-emerald-800 mb-2">Support This Artist</h4>
          <p class="text-sm text-gray-700 mb-3">Send a tip ❤️</p>
          <div class="grid grid-cols-3 gap-2 mb-3 max-w-xs mx-auto">
            <button class="tip-amount bg-white hover:bg-emerald-200 border-2 border-emerald-500 rounded-xl py-2 text-lg font-bold text-emerald-800 shadow transition" data-amount="500">$5</button>
            <button class="tip-amount bg-white hover:bg-emerald-200 border-2 border-emerald-500 rounded-xl py-2 text-lg font-bold text-emerald-800 shadow transition" data-amount="1000">$10</button>
            <button class="tip-amount bg-white hover:bg-emerald-200 border-2 border-emerald-500 rounded-xl py-2 text-lg font-bold text-emerald-800 shadow transition" data-amount="2000">$20</button>
          </div>
          <div class="max-w-xs mx-auto mb-3">
            <input type="number" id="customTip" placeholder="Custom (USD)" min="1" step="0.01" class="w-full text-center py-2 border-2 border-emerald-500 rounded-xl text-base focus:outline-none focus:border-emerald-700">
          </div>
          <button id="sendTipBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2 px-6 rounded-xl shadow-lg text-base transition">
            Send Tip ❤️
          </button>
          <p class="text-xs text-gray-600 mt-2">Powered by Stripe • Test mode</p>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center">Media</h2>
    <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
  </div>

  <!-- Modal for full-screen video (optional fallback) -->
  <div id="videoModal" class="fixed inset-0 bg-black/96 flex items-center justify-center z-[9999] opacity-0 invisible transition-all duration-300">
    <button onClick="closeVideo()" class="fixed top-8 right-8 w-16 h-16 bg-white text-black rounded-full text-4xl font-bold z-50 hover:bg-gray-200">X</button>
    <video id="modalVideo" controls autoplay muted playsinline class="max-w-[95%] max-h-[90vh] rounded-2xl shadow-2xl"></video>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    const stripe = Stripe('pk_test_51SKhZj2WyyY6hPDEpILctCkaS4KOIdG2HOY1FQCvH32Z4LJcDQcPYzunaQHczLu1qQM1mOMuLytHPWTyLmYDufMZ00JODfXiiW');

    const getMediaUrl = (path) => {
      if (!path) return '';
      const cleanPath = path.replace(/^\/+/, '');
      return `https://bxoqhmfnseskwqkywppg.supabase.co/storage/v1/object/public/media/${cleanPath}`;
    };

    function getAnonId() {
      let id = localStorage.getItem('rhythmdeck_anon_id');
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem('rhythmdeck_anon_id', id);
      }
      return id;
    }

    const urlParams = new URLSearchParams(location.search);
    const rawParam = urlParams.get('id')?.trim().toLowerCase();
    if (!rawParam) {
      document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Invalid Link</div>';
      throw new Error('No ID parameter');
    }

    let artistId = null;
    let stripeAccountId = null;
    let isPremium = false; // Pro or Platinum

    async function init() {
      let profile = null;
      const { data: subdomainData } = await supabase
        .from('profiles')
        .select('id, name, bio, banner_url, logo_url, plan, stripe_account_id, subdomain')
        .ilike('subdomain', rawParam)
        .single();
      if (subdomainData) profile = subdomainData;

      if (!profile) {
        const { data: idData } = await supabase
          .from('profiles')
          .select('id, name, bio, banner_url, logo_url, plan, stripe_account_id, subdomain')
          .eq('id', rawParam)
          .single();
        if (idData) profile = idData;
      }

      if (!profile) {
        document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Artist Not Found</div>';
        return;
      }

      artistId = profile.id;
      stripeAccountId = profile.stripe_account_id;
      isPremium = profile.plan === 'pro' || profile.plan === 'platinum';

      document.title = `${profile.name || 'Artist'} • Rhythm Deck`;
      document.getElementById('artistName').textContent = profile.name || 'Unknown Artist';
      document.getElementById('artistBio').innerHTML = (profile.bio || "No bio yet.").replace(/\n/g, '<br>');

      if (profile.banner_url) {
        const bannerUrl = getMediaUrl(profile.banner_url) + '?t=' + Date.now();
        const bannerImg = document.getElementById('banner');
        bannerImg.src = bannerUrl;
        bannerImg.onload = () => {
          bannerImg.classList.remove('hidden');

          document.getElementById('bannerPlaceholder').classList.add('hidden');
        };
      }

      if (profile.logo_url) {
        document.getElementById('logo').src = getMediaUrl(profile.logo_url) + '?t=' + Date.now();
      }

      // Platinum badge only for Platinum
      if (profile.plan === 'platinum') {
        document.getElementById('badge-container').innerHTML = `<img src="platinum-pro-artist-badge-transparent-1.png" alt="Platinum Pro Artist Badge">`;
      }

      // Show live stream + tip section for Pro AND Platinum
      if (isPremium) {
        document.getElementById('liveStreamSection').classList.remove('hidden');
        if (stripeAccountId) {
          document.getElementById('tipBucketSection').classList.remove('hidden');
        }
        checkLiveStatus();
        setInterval(checkLiveStatus, 10000);
      }

      loadVideos();

      const merchSubdomain = profile.subdomain || rawParam;
      if (merchSubdomain) {
        document.getElementById('merchStoreBtn').href = `https://rhythm-deck-music.onrender.com/public-merch.html?id=${merchSubdomain}`;
      } else {
        document.getElementById('merchStoreBtn').style.display = 'none';
      }
    }

    async function checkLiveStatus() {
      if (!artistId) return;
      const { data: session } = await supabase
        .from('live_sessions')
        .select('playback_id')
        .eq('user_id', artistId)
        .eq('is_active', true)
        .maybeSingle();

      const playerDiv = document.getElementById('livepeer-player');
      const indicator = document.getElementById('liveIndicator');
      const offlineMsg = document.getElementById('offlineMessage');

      if (session && session.playback_id) {
        indicator.classList.remove('hidden');
        offlineMsg.classList.add('hidden');
        playerDiv.classList.remove('hidden');
        playerDiv.innerHTML = `<iframe src="https://lvpr.tv?v=${session.playback_id}&autoplay=1" frameborder="0" allowfullscreen allow="autoplay; encrypted-media" class="w-full h-full"></iframe>`;
        loadLiveChat();
      } else {
        indicator.classList.add('hidden');
        offlineMsg.classList.remove('hidden');
        playerDiv.classList.add('hidden');
        playerDiv.innerHTML = '';
      }
    }

    async function loadLiveChat() {
      if (!artistId) return;
      const { data: messages } = await supabase
        .from('live_chat')
        .select('name, message')
        .eq('user_id', artistId)
        .order('created_at', { ascending: true })
        .limit(50);

      const chatContainer = document.getElementById('liveChatMessages');
      chatContainer.innerHTML = messages?.length ? '' : '<p class="text-gray-500 text-center italic">No messages yet</p>';
      messages?.forEach(msg => {
        const name = msg.name?.trim() || 'Fan';
        chatContainer.innerHTML += `<div class="bg-purple-100 p-3 rounded-lg"><strong class="text-purple-700">${name}:</strong> <span class="text-gray-800">${msg.message}</span></div>`;
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendLiveMessage() {
      const name = document.getElementById('chatNameInput').value.trim() || 'Fan';
      const message = document.getElementById('chatMessageInput').value.trim();
      if (!message || !artistId) return;
      await supabase.from('live_chat').insert({ user_id: artistId, name, message });
      document.getElementById('chatMessageInput').value = '';
      loadLiveChat();
    }

    async function loadVideos() {
      if (!artistId) return;
      const { data: items } = await supabase
        .from('user_videos')
        .select('id, video_url, thumbnail_url, title, price, type')
        .eq('user_id', artistId)
        .order('created_at', { ascending: false });

      const list = document.getElementById('videoList');
      if (!items?.length) {
        list.innerHTML = '<p class="col-span-full text-center text-5xl text-gray-500 py-20">No media yet</p>';
        return;
      }

      list.innerHTML = '';
      const anonId = getAnonId();

      for (const item of items) {
        const mediaUrl = getMediaUrl(item.video_url);
        const thumbUrl = item.thumbnail_url 
          ? getMediaUrl(item.thumbnail_url) + '?t=' + Date.now() 
          : 'https://placehold.co/600x338/emerald/white?text=No+Thumb';

        const { count: likes = 0 } = await supabase.from('video_likes').select('*', { count: 'exact', head: true }).eq('video_id', item.id);
        const { data: userLike } = await supabase.from('video_likes').select('id').eq('video_id', item.id).eq('user_id', anonId).maybeSingle();
        const { data: comments = [] } = await supabase.from('video_comments').select('name, comment').eq('video_id', item.id).order('created_at', { ascending: false });

        const price = item.price || 0;
        const isPaid = price > 0;
        const priceText = isPaid ? `$${price.toFixed(2)}` : 'FREE';

        let mediaTag = '';
        if (item.type === 'video') {
          mediaTag = `
            <video class="media-player" controls preload="metadata" poster="${thumbUrl}">
              <source src="${mediaUrl}" type="video/mp4">
              Your browser does not support the video tag.
            </video>`;
        } else if (item.type === 'audio') {
          mediaTag = `
            <div class="bg-black p-4">
              <audio class="w-full" controls>
                <source src="${mediaUrl}" type="audio/mpeg">
                Your browser does not support the audio element.
              </audio>
            </div>`;
        }

        list.innerHTML += `
          <div class="video-card">
            ${mediaTag}
            <div class="p-6 bg-gray-800 text-white">
              <h3 class="font-black text-2xl text-emerald-400 text-center mb-4">${item.title || 'Untitled'}</h3>
              <div class="text-center mb-4">
                <span class="text-2xl font-black text-emerald-400">${priceText}</span>
              </div>
              <div class="flex justify-between items-center mb-4">
                <button class="like-btn flex items-center gap-2 font-bold text-lg ${userLike ? 'liked text-red-500' : 'text-gray-400'} hover:text-red-500 transition" data-id="${item.id}">
                  Heart
                  <svg class="w-7 h-7 ${userLike ? 'fill-red-500' : 'fill-none'} stroke-current" viewBox="0 0 24 24">
                    <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                  </svg>
                  <span class="like-count">${likes}</span>
                </button>
                <button onclick="navigator.clipboard.writeText('${mediaUrl}'); alert('Link copied!')" class="text-emerald-400 font-bold hover:text-emerald-300">Share</button>
              </div>
              <div class="border-t border-gray-700 pt-4 space-y-2 text-sm max-h-48 overflow-y-auto">
                ${comments.length === 0 ? '<p class="text-gray-500 italic text-center py-4">Be the first to comment!</p>' : ''}
                ${comments.map(c => `<div class="comment-bubble"><span class="comment-name">${c.name || 'Fan'}:</span> <span class="comment-text">${c.comment}</span></div>`).join('')}
              </div>
              <div class="mt-6">
                <input type="text" placeholder="Your name (optional)" class="bg-white text-gray-900 border-2 border-emerald-500 rounded-lg p-2 w-full mb-2" id="name-${item.id}">
                <div class="flex gap-2">
                  <input type="text" placeholder="Write a comment..." class="bg-white text-gray-900 border-2 border-emerald-500 rounded-lg p-2 flex-1" id="comment-${item.id}">
                  <button data-id="${item.id}" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-lg post-comment">Post</button>
                </div>
              </div>
              ${isPaid ? `
                <div class="mt-6 text-center">
                  <button onclick="buyMedia('${item.id}', ${price}, '${mediaUrl}', '${item.type}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 px-8 rounded-xl shadow-lg text-lg transition">
                    Buy & Download – $${price.toFixed(2)}
                  </button>
                </div>` : ''}
            </div>
          </div>`;
      }

      document.querySelectorAll('.like-btn').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          const userId = getAnonId();
          const { data: existing } = await supabase.from('video_likes').select('id').eq('video_id', id).eq('user_id', userId).maybeSingle();
          if (existing) {
            await supabase.from('video_likes').delete().eq('id', existing.id);
            btn.classList.remove('liked', 'text-red-500');
            btn.querySelector('svg').classList.remove('fill-red-500');
            btn.querySelector('.like-count').textContent = parseInt(btn.querySelector('.like-count').textContent) - 1;
          } else {
            await supabase.from('video_likes').insert({ video_id: id, user_id: userId });
            btn.classList.add('liked', 'text-red-500');
            btn.querySelector('svg').classList.add('fill-red-500');
            btn.querySelector('.like-count').textContent = parseInt(btn.querySelector('.like-count').textContent) + 1;
          }
        };
      });

      document.querySelectorAll('.post-comment').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          const name = document.getElementById(`name-${id}`).value.trim() || 'Fan';
          const comment = document.getElementById(`comment-${id}`).value.trim();
          if (!comment) return;
          await supabase.from('video_comments').insert({ video_id: id, name, comment });
          document.getElementById(`comment-${id}`).value = '';
          document.getElementById(`name-${id}`).value = '';
          loadVideos();
        };
      });
    }

    window.buyMedia = (id, priceUSD, url, type) => {
      if (!stripeAccountId) {
        alert('Artist has not connected payments yet.');
        return;
      }
      if (confirm(`Pay $${priceUSD.toFixed(2)} to download this ${type === 'video' ? 'video' : 'track'}? (Test mode)`)) {
        const a = document.createElement('a');
        a.href = url;
        a.download = type === 'video' ? 'media.mp4' : 'track.mp3';
        a.click();
        alert('Download started! Thank you for supporting the artist ❤️');
      }
    };

    window.openVideo = (url) => {
      document.getElementById('modalVideo').src = url;
      document.getElementById('videoModal').classList.remove('invisible', 'opacity-0');
      document.getElementById('videoModal').classList.add('opacity-100');
    };

    window.closeVideo = () => {
      document.getElementById('videoModal').classList.add('invisible', 'opacity-0');
      document.getElementById('modalVideo').src = '';
    };

    document.querySelectorAll('.tip-amount').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('customTip').value = (btn.dataset.amount / 100).toFixed(2);
      });
    });

    document.getElementById('sendTipBtn')?.addEventListener('click', () => {
      if (!stripeAccountId) {
        alert('This artist has not enabled tips yet.');
        return;
      }
      let amount = parseFloat(document.getElementById('customTip').value || '5');
      if (isNaN(amount) || amount < 1) {
        alert('Please enter a tip amount of at least $1');
        return;
      }
      alert(`Thank you! $${amount.toFixed(2)} tip sent to the artist (test mode)`);
      document.getElementById('customTip').value = '';
    });

    // Initialize
    init();
  </script>
</body>
</html>
