<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- REMOVED THE LIVEPEER SCRIPT THAT WAS KILLING THE PAGE -->
  <style>
    .video-card{border-radius:1.5rem;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.15);transition:.4s;background:white;position:relative}
    .video-card::before{content:'';position:absolute;inset:-8px;border-radius:1.75rem;background:linear-gradient(45deg,#10b981,#34d399,#6ee7b7);z-index:-1;filter:blur(12px);opacity:.8}
    .video-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 30px 60px rgba(0,0,0,.3)}
    .thumbnail-container{position:relative;padding-top:56.25%;background:#000;cursor:pointer;overflow:hidden}
    .thumbnail-container img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:.4s}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(255,255,255,.95);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .play-button svg{width:38px;height:38px;margin-left:6px;fill:#10b981}
    #artistName{color:#fff;text-shadow:0 4px 20px #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}
    .live-badge{position:absolute;top:16px;left:16px;background:#ef4444;color:white;font-weight:900;padding:10px 24px;border-radius:50px;animation:pulse 2s infinite;z-index:10;font-size:1.2rem}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.8)}70%{box-shadow:0 0 0 16px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
    .offline-placeholder{background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:white;text-align:center;padding:3rem}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">

  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
    </div>

    <!-- LIVE STREAM — NOW 100% SAFE USING SIMPLE IFRAME -->
    <section class="mb-20">
      <div class="bg-black rounded-3xl shadow-2xl overflow-hidden border-4 border-emerald-500">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-0">
          <div class="lg:col-span-2 relative">
            <div id="liveIndicator" class="live-badge hidden">LIVE NOW</div>
            <div id="livepeerPlayer" class="w-full aspect-video bg-black">
              <div class="offline-placeholder">
                <svg class="w-24 h-24 mx-auto mb-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
                <p class="text-5xl font-black mb-4">Stream Offline</p>
                <p class="text-xl text-gray-400">The artist will appear here when live</p>
              </div>
            </div>
          </div>
          <div class="bg-gray-900 p-6 flex flex-col">
            <h3 class="text-2xl font-black text-emerald-400 mb-4">Live Chat</h3>
            <div id="liveChatMessages" class="flex-1 overflow-y-auto bg-black/50 rounded-xl p-4 space-y-3 mb-4 min-h-64">
              <p class="text-gray-500 text-center italic">Chat appears when the artist is live</p>
            </div>
            <div class="flex gap-3">
              <input type="text" id="chatNameInput" placeholder="Your name" class="flex-1 p-3 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-emerald-500">
              <input type="text" id="chatMessageInput" placeholder="Send a message..." class="flex-1 p-3 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-emerald-500" onkeydown="if(event.key==='Enter') sendLiveMessage()">
              <button onclick="sendLiveMessage()" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-lg font-bold">Send</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center">Videos</h2>
    <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
  </div>

  <div id="videoModal" class="fixed inset-0 bg-black/96 flex items-center justify-center z-[9999] opacity-0 invisible transition-all duration-300">
    <button onclick="closeVideo()" class="fixed top-8 right-8 w-16 h-16 bg-white text-black rounded-full text-4xl font-bold z-50 hover:bg-gray-200">X</button>
    <video id="modalVideo" controls autoplay class="max-w-[95%] max-h-[90vh] rounded-2xl shadow-2xl"></video>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient('https://bxoqhmfnseskwqkywppg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc')

    const params = new URLSearchParams(location.search)
    const subdomain = params.get('id')?.trim().toLowerCase()
    if (!subdomain) { document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Invalid Link</div>'; throw '' }

    let artistId = null
    let currentPlaybackId = null

    async function init() {
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('id,name,bio,banner_url,logo_url')
          .eq('subdomain', subdomain)
          .single()

        if (error || !profile) {
          document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Artist Not Found</div>'
          return
        }

        artistId = profile.id
        document.title = `${profile.name} • Rhythm Deck`
        document.getElementById('artistName').textContent = profile.name || 'Artist'
        document.getElementById('artistBio').innerHTML = (profile.bio || "No bio yet.").replace(/\n/g, '<br>')

        // THIS IS EXACTLY WHAT WORKED BEFORE — 100% PROVEN
        if (profile.banner_url) {
          const { data } = supabase.storage.from('media').getPublicUrl(profile.banner_url)
          document.getElementById('banner').src = data.publicUrl
          document.getElementById('banner').classList.remove('hidden')
          document.getElementById('bannerPlaceholder').classList.add('hidden')
        }
        if (profile.logo_url) {
          const { data } = supabase.storage.from('media').getPublicUrl(profile.logo_url)
          document.getElementById('logo').src = data.publicUrl
        }

        checkLiveStatus()
        setInterval(checkLiveStatus, 7000)
        loadVideos()

      } catch (err) {
        console.error('Init error:', err)
      }
    }

    async function checkLiveStatus() {
      if (!artistId) return
      const { data: session } = await supabase
        .from('live_sessions')
        .select('playback_id')
        .eq('user_id', artistId)
        .eq('is_active', true)
        .maybeSingle()

      if (session?.playback_id && session.playback_id !== currentPlaybackId) {
        currentPlaybackId = session.playback_id
        document.getElementById('liveIndicator').classList.remove('hidden')
        document.getElementById('livepeerPlayer').innerHTML = `
          <iframe 
            src="https://lvpr.tv?v=${currentPlaybackId}" 
            frameborder="0" 
            allowfullscreen 
            allow="autoplay; encrypted-media" 
            class="w-full h-full">
          </iframe>
        `
      } else if (!session && currentPlaybackId) {
        currentPlaybackId = null
        document.getElementById('liveIndicator').classList.add('hidden')
        document.getElementById('livepeerPlayer').innerHTML = `
          <div class="offline-placeholder">
            <svg class="w-24 h-24 mx-auto mb-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <p class="text-5xl font-black mb-4">Stream Offline</p>
            <p class="text-xl text-gray-400">The artist will appear here when live</p>
          </div>`
      }
    }

    function sendLiveMessage() {
      const name = document.getElementById('chatNameInput').value.trim() || 'Fan'
      const msg = document.getElementById('chatMessageInput').value.trim()
      if (!msg) return
      const chat = document.getElementById('liveChatMessages')
      chat.insertAdjacentHTML('beforeend', `<div class="bg-emerald-900/60 text-white p-3 rounded-lg max-w-xs"><strong class="text-emerald-300">${name}:</strong> ${msg}</div>`)
      document.getElementById('chatMessageInput').value = ''
      chat.scrollTop = chat.scrollHeight
    }

    async function loadVideos() {
      if (!artistId) return
      const { data: videos } = await supabase
        .from('user_videos')
        .select('*')
        .eq('user_id', artistId)
        .order('created_at', { ascending: false })

      const list = document.getElementById('videoList')
      list.innerHTML = videos?.length ? '' : '<p class="col-span-full text-center text-5xl text-gray-500 py-20">No videos yet</p>'

      for (const v of (videos || [])) {
        const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl
        const thumb = v.thumbnail_url 
          ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl 
          : 'https://via.placeholder.com/600x338/10b981/ffffff?text=No+Thumb'

        list.innerHTML += `
          <div class="video-card">
            <div class="thumbnail-container" onclick="openVideo('${videoUrl}')">
              <img src="${thumb}" alt="thumb" onerror="this.src='https://via.placeholder.com/600x338/10b981/ffffff?text=No+Thumb'">
              <div class="play-overlay"><div class="play-button"><svg viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z" fill="#10b981"/></svg></div></div>
            </div>
            <div class="p-6">
              <h3 class="font-black text-2xl text-emerald-900 text-center mb-4">${v.title || 'Untitled'}</h3>
            </div>
          </div>`
      }
    }

    function openVideo(url) {
      document.getElementById('modalVideo').src = url
      document.getElementById('videoModal').classList.remove('invisible', 'opacity-0')
      document.getElementById('videoModal').classList.add('opacity-100')
    }

    window.openVideo = openVideo
    window.closeVideo = () => {
      document.getElementById('videoModal').classList.add('invisible', 'opacity-0')
      document.getElementById('videoModal').classList.remove('opacity-100')
      document.getElementById('modalVideo').src = ''
    }

    // Start everything
    init()
  </script>
</body>
</html>
