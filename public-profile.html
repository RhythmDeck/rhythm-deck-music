<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Public Profile | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;display:inline-block;}
    @keyframes spin {0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .video-overlay {position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-overlay:hover {opacity:1}
    .glow-emerald {
      text-shadow: 0 0 20px #10b981, 0 0 40px #10b981, 0 0 60px #10b981;
      color: #10b981;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-gray-50 to-gray-200 text-gray-900 min-h-screen">

  <!-- Full-width Banner -->
  <section class="relative h-[400px] bg-gradient-to-br from-purple-950 to-blue-950 overflow-hidden shadow-2xl">
    <img id="banner" src="" alt="Banner" class="absolute inset-0 w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="absolute inset-0 flex items-center justify-center text-white text-5xl font-bold opacity-60 tracking-wider">
      Loading Banner...
    </div>

    <!-- Logo badge (bottom-left, professional look) -->
    <div class="absolute -bottom-16 left-8 w-40 h-40 rounded-full border-[12px] border-white/90 shadow-2xl overflow-hidden bg-white z-10">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-full h-full object-cover">
    </div>
  </section>

  <!-- Name + Bio (under banner, centered, glowing name) -->
  <div class="max-w-5xl mx-auto px-6 pt-24 pb-16 text-center">
    <h1 id="name" class="text-6xl md:text-8xl font-extrabold glow-emerald mb-6 tracking-tight">Loading...</h1>
    <p id="bio" class="text-2xl md:text-3xl text-gray-800 font-light max-w-4xl mx-auto leading-relaxed">Loading bio...</p>
  </div>

  <!-- Videos Section -->
  <section class="max-w-6xl mx-auto px-6 pb-24">
    <h2 class="text-5xl font-bold text-center mb-16 text-gray-900 tracking-wide">Videos</h2>
    <div id="videoList" class="grid md:grid-cols-3 gap-10">
      <p class="col-span-full text-center text-gray-600 py-20 text-2xl">Loading videos...</p>
    </div>
  </section>

  <script>
    const sb = supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadProfile() {
      if (!id) {
        document.getElementById('name').textContent = 'Profile not found';
        return;
      }

      // Try subdomain first, fallback to ID
      let { data: profile } = await sb
        .from('profiles')
        .select('name, bio, banner_url, logo_url')
        .eq('subdomain', id)
        .single();

      if (!profile) {
        const { data } = await sb
          .from('profiles')
          .select('name, bio, banner_url, logo_url')
          .eq('id', id)
          .single();
        profile = data;
      }

      if (!profile) {
        document.getElementById('name').textContent = 'Profile not found';
        return;
      }

      document.getElementById('name').textContent = profile.name || 'Artist';
      document.getElementById('bio').textContent = profile.bio || 'No bio yet';

      if (profile.banner_url) {
        const { data } = sb.storage.from('media').getPublicUrl(profile.banner_url);
        document.getElementById('banner').src = data.publicUrl + '?t=' + Date.now();
        document.getElementById('banner').classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      }

      if (profile.logo_url) {
        const { data } = sb.storage.from('media').getPublicUrl(profile.logo_url);
        document.getElementById('logo').src = data.publicUrl + '?t=' + Date.now();
      }
    }

    async function loadVideos() {
      const container = document.getElementById('videoList');
      container.innerHTML = '<p class="col-span-full text-center py-20 text-2xl text-gray-600">Loading videos...</p>';

      let { data: profile } = await sb
        .from('profiles')
        .select('id')
        .eq('subdomain', id)
        .single();

      if (!profile) {
        const { data } = await sb.from('profiles').select('id').eq('id', id).single();
        profile = data;
      }

      if (!profile) return container.innerHTML = '<p class="col-span-full text-center text-red-600 text-2xl py-20">No videos available</p>';

      const { data: videos } = await sb
        .from('user_videos')
        .select('*')
        .eq('user_id', profile.id)
        .order('created_at', { ascending: false });

      if (!videos?.length) {
        container.innerHTML = '<p class="col-span-full text-center italic py-20 text-2xl text-gray-600">No videos yet</p>';
        return;
      }

      container.innerHTML = '';
      for (const v of videos) {
        const videoUrl = sb.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
        const thumbUrl = v.thumbnail_url ? sb.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'https://via.placeholder.com/400x225?text=Video';

        container.innerHTML += `
          <div class="bg-white rounded-2xl shadow-xl overflow-hidden transform hover:scale-[1.03] transition-all duration-300">
            <div class="relative">
              <img src="${thumbUrl}" class="w-full h-64 object-cover">
              <div class="video-overlay" onclick="window.open('${videoUrl}', '_blank')">
                <svg class="w-20 h-20 text-white drop-shadow-lg" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z"/></svg>
              </div>
            </div>
          </div>`;
      }
    }

    window.addEventListener('load', () => {
      loadProfile();
      loadVideos();
    });
  </script>
</body>
</html>
