<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .live-dot {display:inline-block;width:16px;height:16px;background:#ef4444;border-radius:50%;animation:pulse 1.8s infinite;box-shadow:0 0 20px #ef4444}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    .video-card {
      position: relative;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      transition: all .4s ease;
      background: white;
    }
    .video-card:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 30px 60px rgba(0,0,0,0.3); }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: #000;
    }
    .thumbnail-container img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }
    .video-card:hover .thumbnail-container img { transform: scale(1.08); }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .4s ease;
    }
    .video-card:hover .play-overlay { opacity: 1; }

    .play-button {
      width: 90px;
      height: 90px;
      background: rgba(255,255,255,0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all .3s ease;
      backdrop-filter: blur(10px);
    }
    .video-card:hover .play-button { transform: scale(1.15); background: white; }
    .play-button svg {
      width: 38px;
      height: 38px;
      margin-left: 6px;
      fill: #10b981;
    }

    #risingStarBadge{position:absolute;top:30px;right:30px;width:140px;height:140px;z-index:30;opacity:0;transform:scale(0) rotate(-20deg);transition:all .8s cubic-bezier(0.175,0.885,0.32,1.4)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(10deg)}
    .like-btn.liked{ color:#ef4444; filter: drop-shadow(0 0 10px #ef4444); }
    .comment-input:focus{ outline:none; border-color:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,0.2); }

    /* Name Prompt Above Comment Box */
    .name-prompt {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      background: #10b981;
      color: white;
      padding: 12px 16px;
      border-radius: 12px 12px 0 0;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      z-index: 10;
      animation: slideDown 0.4s ease;
    }
    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">
  <!-- Your full HTML (banner, about, live section, etc.) — unchanged -->
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star">
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <!-- Artist name, bio, live section — same as before -->
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <div class="text-center md:text-left">
        <h1 id="artistName" class="text-6xl md:text-8xl font-black text-gray-900 drop-shadow-lg">Loading...</h1>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <!-- Live Section (tall, with chat) — unchanged -->
    <div id="liveSection" class="mb-20 hidden"> <!-- same as before --> </div>

    <div class="mb-20">
      <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center md:text-left">Videos</h2>
      <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10 max-w-7xl mx-auto">
        <!-- Videos load here -->
      </div>
    </div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const params = new URLSearchParams(location.search);
    const idParam = params.get('id')?.trim().toLowerCase();
    if (!idParam) throw new Error("No ID");

    let profile = null;
    let artistUserId = null;
    let currentFanName = localStorage.getItem('fanName') || null;  // Remember name!

    // Load profile, live stream, etc. — unchanged
    async function loadProfile() {
      const { data } = await supabase.from('profiles').select('id, name, bio, banner_url, logo_url, subdomain, plan').ilike('subdomain', idParam).maybeSingle();
      if (!data) { /* not found */ return; }
      profile = data; artistUserId = profile.id;
      document.title = `${profile.name || 'Artist'} • Rhythm Deck`;
      document.getElementById('artistName').textContent = profile.name || 'Artist';
      document.getElementById('artistBio').textContent = profile.bio || 'No bio yet.';

      if (profile.banner_url) { /* set banner */ }
      if (profile.logo_url) { /* set logo */ }

      if (profile.plan === 'pro') {
        document.getElementById('liveSection').classList.remove('hidden');
        checkLiveStatus(); setupRealtimeListener(); setupLiveChat();
      }
      await loadVideos();
    }

    // ... live stream functions (unchanged)

    async function loadVideos() {
      const { data: videos } = await supabase.from('user_videos').select('*').eq('user_id', artistUserId).order('created_at', { ascending: false });
      const list = document.getElementById('videoList');
      list.innerHTML = '';

      if (!videos || videos.length === 0) {
        list.innerHTML = '<p class="col-span-full text-center text-5xl text-gray-600 font-medium">No videos yet</p>';
        return;
      }

      let html = '';
      for (const v of videos) {
        const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
        const thumbUrl = v.thumbnail_url ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'logo-placeholder.png';
        const [likesRes, commentsRes] = await Promise.all([
          supabase.from('video_likes').select('id', { count: 'exact', head: true }).eq('video_id', v.id),
          supabase.from('video_comments').select('name, comment, created_at').eq('video_id', v.id).order('created_at', { ascending: false }).limit(3)
        ]);

        const likeCount = likesRes.count || 0;
        const comments = commentsRes.data || [];

        html += `
          <div class="video-card relative" data-video-url="${videoUrl}" data-video-id="${v.id}">
            <div class="thumbnail-container">
              <img src="${thumbUrl}" alt="${v.title || 'Video'}" onerror="this.src='logo-placeholder.png'">
              <div class="play-overlay">
                <div class="play-button">
                  <svg viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z" fill="#10b981"/></svg>
                </div>
              </div>
            </div>
            <div class="p-6">
              <h3 class="font-black text-2xl text-emerald-900 text-center mb-4 line-clamp-2">${v.title || 'Untitled'}</h3>

              <div class="flex justify-between items-center mb-3 text-lg">
                <button class="like-btn flex items-center gap-2 font-bold ${likeCount > 0 ? 'liked' : 'text-gray-600'}">Heart ${likeCount}</button>
                <button class="share-btn text-emerald-600 font-bold">Share</button>
              </div>

              <div class="text-sm space-y-2 mb-4">
                ${comments.length === 0 ? '<p class="text-gray-500 italic">No comments yet</p>' : ''}
                ${comments.map(c => `<div class="bg-gray-50 rounded-lg p-2"><span class="font-bold text-emerald-700">${c.name}</span>: ${c.comment}</div>`).join('')}
              </div>

              <!-- Comment Box with Inline Name Prompt -->
              <div class="relative">
                ${!currentFanName ? '<div class="name-prompt hidden" id="namePrompt">What’s your name? (so others can see you)</div>' : ''}
                <div class="flex gap-2">
                  <input type="text" placeholder="${currentFanName ? 'Add a comment...' : 'Click to comment...'}" 
                         class="comment-input flex-1 px-3 py-2 rounded-lg border text-sm" 
                         ${currentFanName ? '' : 'readonly'}>
                  <button class="post-comment bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-sm ${!currentFanName ? 'opacity-50' : ''}" 
                          ${!currentFanName ? 'disabled' : ''}>Post</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      list.innerHTML = html;

      // Show name prompt when clicking comment box (only if no name yet)
      document.querySelectorAll('.comment-input').forEach(input => {
        input.addEventListener('focus', function() {
          if (currentFanName) return;

          const prompt = this.parentElement.parentElement.querySelector('.name-prompt');
          if (prompt) {
            prompt.classList.remove('hidden');
            this.placeholder = "Type your name here...";
            this.removeAttribute('readonly');
            this.focus();

            // Save name when they type and blur or press Enter
            const saveName = () => {
              const name = this.value.trim();
 if (name) {
                currentFanName = name;
                localStorage.setItem('fanName', name);
                prompt.remove();
                this.placeholder = "Add a comment...";
                this.closest('.flex').querySelector('.post-comment').classList.remove('opacity-50');
                this.closest('.flex').querySelector('.post-comment').disabled = false;
              }
            };

            this.addEventListener('blur', saveName, { once: true });
            this.addEventListener('keypress', e => { if (e.key === 'Enter') saveName(); });
          }
        });
      });

      // Video play, like, share, post comment — all working
      document.querySelectorAll('.video-card').forEach(card => { /* play modal */ });
      document.querySelectorAll('.like-btn').forEach(btn => { /* like */ });
      document.querySelectorAll('.share-btn').forEach(btn => { /* share */ });
      document.querySelectorAll('.post-comment').forEach(btn => {
        const input = btn.previousElementSibling.querySelector('.comment-input');
        btn.onclick = async () => {
          const comment = input.value.trim();
          if (!comment || !currentFanName) return;
          const videoId = btn.closest('.video-card').dataset.videoId;
          await supabase.from('video_comments').insert({ video_id: videoId, name: currentFanName, comment });
          input.value = '';
          loadVideos();
        };
      });
    }

    loadProfile();
  </script>
</body>
</html>
