<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .live-dot{display:inline-block;width:16px;height:16px;background:#ef4444;border-radius:50%;animation:pulse 1.8s infinite;box-shadow:0 0 20px #ef4444}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .video-card{border-radius:1.5rem;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.15);transition:all .4s;background:white}
    .video-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 30px 60px rgba(0,0,0,0.3)}
    .thumbnail-container{position:relative;width:100%;padding-top:56.25%;overflow:hidden;background:#000;cursor:pointer}
    .thumbnail-container img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
    .video-card:hover .thumbnail-container img{transform:scale(1.08)}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(255,255,255,0.95);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition:all .3s;backdrop-filter:blur(10px)}
    .video-card:hover .play-button{transform:scale(1.15);background:white}
    .play-button svg{width:38px;height:38px;margin-left:6px;fill:#10b981}
    #risingStarBadge{position:absolute;top:30px;right:30px;width:140px;height:140px;z-index:30;opacity:0;transform:scale(0) rotate(-20deg);transition:all .8s cubic-bezier(0.175,0.885,0.32,1.4)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(10deg)}
    .like-btn.liked{color:#ef4444;filter:drop-shadow(0 0 10px #ef4444)}
    .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem 1rem;margin-bottom:.5rem;transition:all .3s}
    .comment-name{font-weight:700;color:#10b981;text-shadow:0 0 8px rgba(16,185,129,0.4)}
    .comment-text{color:#1f2937;margin-left:.5rem;font-weight:500}
    #artistName{color:#ffffff !important;text-shadow:0 4px 20px rgba(0,0,0,0.8);-webkit-text-stroke:2px black;paint-order:stroke fill}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">

  <!-- Banner -->
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star">
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <div class="text-center md:text-left">
        <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <!-- LIVE STREAM SECTION -->
    <div class="mb-20">
      <div class="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-3xl shadow-2xl p-8 border-8 border-emerald-600">
        <div class="grid md:grid-cols-3 gap-8">
          <div class="md:col-span-2">
            <div id="livePlayer" class="hidden">
              <iframe id="liveIframe" width="100%" height="495" frameborder="0" allowfullscreen class="rounded-3xl shadow-2xl"></iframe>
              <div class="text-center mt-4">
                <span class="live-dot"></span>
                <span class="text-4xl font-black text-red-500 ml-4">LIVE NOW</span>
              </div>
            </div>
            <div id="offlinePlaceholder">
              <div class="bg-gray-900 rounded-3xl h-96 md:h-[495px] flex flex-col items-center justify-center text-center p-10 text-white">
                <svg class="w-24 h-24 mb-6 text-emerald-400" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17V8h2v6l-5 5-1.41-1.41L10 17z"/>
                </svg>
                <h2 class="text-5xl font-black text-emerald-400 mb-4">LIVE STREAM</h2>
                <p class="text-2xl">This artist is not live right now</p>
                <p class="text-lg text-gray-400 mt-2">Check back later or watch their videos below</p>
              </div>
            </div>
          </div>
          <div class="bg-white rounded-3xl shadow-2xl p-6 flex flex-col h-96 md:h-[495px]">
            <h3 class="text-2xl font-black text-emerald-700 mb-4">Live Chat</h3>
            <div id="liveMessages" class="flex-1 overflow-y-auto space-y-3 bg-gray-50 rounded-xl p-4 text-sm">
              <p class="text-gray-500 italic text-center">Waiting for artist to go live...</p>
            </div>
            <div class="mt-4 flex gap-2">
              <input type="text" id="liveChatInput" placeholder="Say something..." class="flex-1 px-4 py-3 rounded-xl border border-emerald-300 focus:border-emerald-500 bg-white">
              <button id="sendLiveMessage" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg">
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Videos -->
    <div class="mb-20">
      <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center md:text-left">Videos</h2>
      <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
    </div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const params = new URLSearchParams(location.search);
    const idParam = params.get('id')?.trim().toLowerCase();

    if (!idParam) {
      document.body.innerHTML = `<div class="text-center mt-32"><h1 class="text-8xl font-black text-red-600">Invalid Link</h1><a href="/" class="mt-8 inline-block bg-emerald-600 text-white px-12 py-6 rounded-2xl text-3xl font-black">Go Home</a></div>`;
      throw new Error();
    }

    let profile = null;
    let artistUserId = null;
    let currentFanName = localStorage.getItem('rhythmDeckFanName') || '';

    async function loadProfile() {
      const { data, error } = await supabase
        .from('profiles')
        .select('id, name, bio, banner_url, logo_url, subdomain, plan, is_live, live_stream_url')
        .ilike('subdomain', idParam)
        .single();

      if (error || !data) {
        document.body.innerHTML = `<div class="text-center mt-32 p-16 bg-white rounded-3xl shadow-2xl max-w-2xl mx-auto"><h1 class="text-8xl font-black text-red-600 mb-8">Artist Not Found</h1><a href="/" class="bg-emerald-600 text-white px-12 py-6 rounded-2xl text-3xl font-black hover:bg-emerald-700">Go Home</a></div>`;
        return;
      }

      profile = data;
      artistUserId = profile.id;

      // Update page
      document.title = `${profile.name || 'Artist'} • Rhythm Deck`;
      document.getElementById('artistName').textContent = profile.name || 'Artist';
      document.getElementById('artistBio').textContent = profile.bio || 'No bio yet.';

      // Banner
      if (profile.banner_url) {
        const bannerUrl = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl + '?t=' + Date.now();
        document.getElementById('banner').src = bannerUrl;
        document.getElementById('banner').classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      }

      // Logo
      if (profile.logo_url) {
        const logoUrl = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl + '?t=' + Date.now();
        document.getElementById('logo').src = logoUrl;
      }

      // Live Stream
      if (profile.plan === 'pro' && profile.is_live && profile.live_stream_url) {
        document.getElementById('livePlayer').classList.remove('hidden');
        document.getElementById('offlinePlaceholder').classList.add('hidden');
        let url = profile.live_stream_url.trim();
        if (url.includes('youtube.com') || url.includes('youtu.be')) {
          url = url.replace('watch?v=', 'embed/').split('&')[0] + '?autoplay=1&mute=0';
        } else if (url.includes('twitch.tv')) {
          const channel = url.split('/').pop();
          url = `https://player.twitch.tv/?channel=${channel}&parent=${location.hostname}&autoplay=true`;
        }
        document.getElementById('liveIframe').src = url;
        loadLiveChat();
        setInterval(loadLiveChat, 4000);
      }

      await loadVideos();
    }

    async function loadLiveChat() {
      if (!artistUserId) return;
      const { data } = await supabase
        .from('live_chat')
        .select('name, message')
        .eq('artist_id', artistUserId)
        .order('created_at', { ascending: false })
        .limit(50);

      const container = document.getElementById('liveMessages');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-gray-500 italic text-center">Be the first to chat!</p>';
        return;
      }
      container.innerHTML = data.reverse().map(m => `
        <div class="comment-bubble">
          <span class="comment-name">${m.name}:</span>
          <span class="comment-text">${m.message}</span>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('sendLiveMessage').onclick = async () => {
      const input = document.getElementById('liveChatInput');
      const msg = input.value.trim();
      if (!msg || !artistUserId) return;
      const name = currentFanName || 'Fan';
      await supabase.from('live_chat').insert({ artist_id: artistUserId, name, message: msg });
      input.value = '';
      loadLiveChat();
    };

    async function loadVideos() {
      if (!artistUserId) return;

      const { data: videos } = await supabase
        .from('user_videos')
        .select('*')
        .eq('user_id', artistUserId)
        .order('created_at', { ascending: false });

      const list = document.getElementById('videoList');
      list.innerHTML = '';

      if (!videos || videos.length === 0) {
        list.innerHTML = '<p class="col-span-full text-center text-5xl text-gray-600 py-20">No videos yet</p>';
        return;
      }

      for (const v of videos) {
        const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl + '?t=' + Date.now();
        const thumbUrl = v.thumbnail_url
          ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl + '?t=' + Date.now()
          : 'https://via.placeholder.com/600x338/10b981/ffffff?text=No+Thumbnail';

        const [{ count: likeCount = 0 }, { data: comments = [] }] = await Promise.all([
          supabase.from('video_likes').select('id', { count: 'exact', head: true }).eq('video_id', v.id),
          supabase.from('video_comments').select('name, comment, created_at').eq('video_id', v.id).order('created_at', { ascending: false })
        ]);

        const card = document.createElement('div');
        card.className = 'video-card';
        card.dataset.videoUrl = videoUrl;
        card.dataset.videoId = v.id;

        card.innerHTML = `
          <div class="thumbnail-container" onclick="openVideo('${videoUrl}')">
            <img src="${thumbUrl}" alt="${v.title || 'Video'}" onerror="this.src='https://via.placeholder.com/600x338/10b981/ffffff?text=No+Thumbnail'">
            <div class="play-overlay">
              <div class="play-button">
                <svg viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z" fill="#10b981"/></svg>
              </div>
            </div>
          </div>
          <div class="p-6">
            <h3 class="font-black text-2xl text-emerald-900 text-center mb-4">${v.title || 'Untitled Video'}</h3>
            <div class="flex justify-between items-center mb-4 text-lg">
              <button class="like-btn flex items-center gap-2 font-bold ${likeCount > 0 ? 'liked' : 'text-gray-600'}">
                Heart ${likeCount}
              </button>
              <button class="share-btn text-emerald-600 font-bold">Share</button>
            </div>
            <div class="space-y-2 mb-4 text-sm max-h-40 overflow-y-auto">
              ${comments.length === 0 ? '<p class="text-gray-500 italic text-center py-2">No comments yet</p>' : ''}
              ${comments.map(c => `
                <div class="comment-bubble">
                  <span class="comment-name">${c.name}:</span>
                  <span class="comment-text">${c.comment}</span>
                </div>
              `).join('')}
            </div>
            <div class="space-y-3">
              <input type="text" value="${currentFanName}" placeholder="Your name" class="name-input w-full px-4 py-3 rounded-xl border border-gray-300 bg-white text-sm">
              <div class="flex gap-2">
                <input type="text" placeholder="Add a comment..." class="comment-input flex-1 px-4 py-3 rounded-xl border border-gray-300 bg-white text-sm">
                <button class="post-comment bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl text-sm">Post</button>
              </div>
            </div>
          </div>
        `;

        list.appendChild(card);
      }

      // Rising Star Badge
      if (profile.plan !== 'pro' && videos.length >= 3) {
        document.getElementById('risingStarBadge').classList.add('show');
      }

      // Event Listeners
      document.querySelectorAll('.name-input').forEach(input => {
        input.addEventListener('change', () => {
          const name = input.value.trim();
          if (name && name !== currentFanName) {
            currentFanName = name;
            localStorage.setItem('rhythmDeckFanName', name);
          }
        });
      });

      document.querySelectorAll('.post-comment').forEach(btn => {
        btn.addEventListener('click', async () => {
          const card = btn.closest('.video-card');
          const input = card.querySelector('.comment-input');
          const nameInput = card.querySelector('.name-input');
          const comment = input.value.trim();
          const name = nameInput.value.trim() || 'Fan';
          if (!comment) return;
          await supabase.from('video_comments').insert({
            video_id: card.dataset.videoId,
            name: name,
            comment: comment
          });
          input.value = '';
          loadVideos(); // Refresh to show new comment
        });
      });

      document.querySelectorAll('.like-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const card = btn.closest('.video-card');
          const { data: existing } = await supabase
            .from('video_likes')
            .select('id')
            .eq('video_id', card.dataset.videoId)
            .limit(1);
          if (existing?.length > 0) return;
          await supabase.from('video_likes').insert({ video_id: card.dataset.videoId });
          btn.classList.add('liked');
          btn.innerHTML = `Heart ${parseInt(btn.textContent.split(' ')[1]) + 1}`;
        });
      });

      document.querySelectorAll('.share-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(location.href);
          alert('Link copied to clipboard!');
        });
      });
    }

    function openVideo(url) {
      const video = document.createElement('video');
      video.src = url;
      video.controls = true;
      video.autoplay = true;
      video.style.position = 'fixed';
      video.style.top = '50%';
      video.style.left = '50%';
      video.style.transform = 'translate(-50%, -50%)';
      video.style.maxWidth = '90%';
      video.style.maxHeight = '90%';
      video.style.zIndex = '9999';
      video.style.background = 'black';
      video.style.borderRadius = '12px';
      video.style.boxShadow = '0 0 50px rgba(0,0,0,0.9)';
      document.body.appendChild(video);

      video.onclick = () => video.remove();
      document.addEventListener('keydown', e => e.key === 'Escape' && video.remove());
    }

    // Start loading
    loadProfile();
  </script>
</body>
</html>
