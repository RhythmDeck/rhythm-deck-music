<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Pro • Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .save-btn { @apply bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl transition; }
    .input-field { @apply w-full p-4 border-2 border-emerald-200 rounded-xl focus:border-emerald-600 outline-none transition; }
    textarea.input-field { min-height: 200px; resize: vertical; }
    .preview-img { @apply w-48 h-48 rounded-full object-cover border-8 border-white shadow-2xl; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">

  <div class="max-w-4xl mx-auto p-8 pt-20">
    <h1 class="text-6xl font-black text-emerald-900 mb-10 text-center">Pro Admin Panel</h1>

    <!-- Artist Name -->
    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-10">
      <h2 class="text-3xl font-black text-emerald-800 mb-6">Artist Name</h2>
      <input type="text" id="artistNameInput" class="input-field text-2xl font-bold" placeholder="Your stage name">
      <button onclick="saveArtistName()" class="save-btn mt-6">Save Name</button>
    </div>

    <!-- Bio -->
    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-10">
      <h2 class="text-3xl font-black text-emerald-800 mb-6">Bio</h2>
      <textarea id="bioInput" class="input-field text-lg" placeholder="Tell fans about yourself..."></textarea>
      <button onclick="saveBio()" class="save-btn mt-6">Save Bio</button>
    </div>

    <!-- Logo Upload -->
    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-10">
      <h2 class="text-3xl font-black text-emerald-800 mb-6">Logo / Profile Picture</h2>
      <img id="logoPreview" src="logo-placeholder.png" alt="Logo Preview" class="preview-img mx-auto">
      <input type="file" id="logoFile" accept="image/*" class="mt-6 block w-full text-sm text-gray-600 file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:bg-emerald-600 file:text-white hover:file:bg-emerald-700">
      <button onclick="uploadLogo()" class="save-btn mt-6">Upload Logo</button>
    </div>

    <!-- Banner Upload -->
    <div class="bg-white rounded-3xl shadow-2xl p-10">
      <h2 class="text-3xl font-black text-emerald-800 mb-6">Banner Image</h2>
      <div class="bg-gray-200 border-4 border-dashed rounded-xl h-64 flex items-center justify-center mb-6">
        <img id="bannerPreview" src="" alt="Banner Preview" class="max-h-full hidden">
        <p class="text-gray-500 text-xl" id="bannerPlaceholder">No banner uploaded yet</p>
      </div>
      <input type="file" id="bannerFile" accept="image/*" class="block w-full text-sm text-gray-600 file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:bg-emerald-600 file:text-white hover:file:bg-emerald-700">
      <button onclick="uploadBanner()" class="save-btn mt-6">Upload Banner</button>
    </div>

    <div class="text-center mt-12">
      <a href="/" class="text-emerald-600 hover:text-emerald-800 underline text-xl">← Back to My Public Page</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    )

    let currentUser = null

    async function init() {
      const { data: { user } } = await supabase.auth.getUser()
      if (!user) {
        alert("You must be logged in!")
        location.href = '/login.html'
        return
      }
      currentUser = user

      const { data: profile } = await supabase
        .from('profiles')
        .select('name, bio, logo_url, banner_url')
        .eq('id', user.id)
        .single()

      if (profile) {
        document.getElementById('artistNameInput').value = profile.name || ''
        document.getElementById('bioInput').value = profile.bio || ''
        if (profile.logo_url) document.getElementById('logoPreview').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl + '?t=' + Date.now()
        if (profile.banner_url) {
          const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl + '?t=' + Date.now()
          document.getElementById('bannerPreview').src = url
          document.getElementById('bannerPreview').classList.remove('hidden')
          document.getElementById('bannerPlaceholder').classList.add('hidden')
        }
      }
    }

    window.saveArtistName = async () => {
      const name = document.getElementById('artistNameInput').value.trim()
      if (!name) return alert("Name cannot be empty!")

      const { error } = await supabase
        .from('profiles')
        .update({ name })
        .eq('id', currentUser.id)

      error ? alert("Save failed: " + error.message) : alert("Artist name saved!")
    }

    window.saveBio = async () => {
      const bio = document.getElementById('bioInput').value.trim()
      if (!bio) return alert("Bio cannot be empty!")

      const { error } = await supabase
        .from('profiles')
        .update({ bio })
        .eq('id', currentUser.id)

      error ? alert("Bio save failed: " + error.message) : alert("Bio saved perfectly!")
    }

    window.uploadLogo = async () => {
      const file = document.getElementById('logoFile').files[0]
      if (!file) return alert("Choose a file first")

      const fileExt = file.name.split('.').pop()
      const fileName = `${currentUser.id}/logo.${fileExt}`

      const { error } = await supabase.storage
        .from('media')
        .upload(fileName, file, { upsert: true })

      if (error) return alert("Upload failed: " + error.message)

      await supabase
        .from('profiles')
        .update({ logo_url: fileName })
        .eq('id', currentUser.id)

      document.getElementById('logoPreview').src = supabase.storage.from('media').getPublicUrl(fileName).data.publicUrl + '?t=' + Date.now()
      alert("Logo uploaded!")
    }

    window.uploadBanner = async () => {
      const file = document.getElementById('bannerFile').files[0]
      if (!file) return alert("Choose a file first")

      const fileExt = file.name.split('.').pop()
      const fileName = `${currentUser.id}/banner.${fileExt}`

      const { error } = await supabase.storage
        .from('media')
        .upload(fileName, file, { upsert: true })

      if (error) return alert("Upload failed: " + error.message)

      await supabase
        .from('profiles')
        .update({ banner_url: fileName })
        .eq('id', currentUser.id)

      const url = supabase.storage.from('media').getPublicUrl(fileName).data.publicUrl + '?t=' + Date.now()
      document.getElementById('bannerPreview').src = url
      document.getElementById('bannerPreview').classList.remove('hidden')
      document.getElementById('bannerPlaceholder').classList.add('hidden')
      alert("Banner uploaded!")
    }

    init()
  </script>
</body>
</html>
