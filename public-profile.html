<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@livepeer/react@3/dist/livepeer-react.min.js"></script>
  <style>
    #liveStreamSection { display: none; }
    .live-container { background: #000; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 4px solid #10b981; }
    .live-player { aspect-ratio: 16/9; background: #000; position: relative; }
    .live-badge { @apply absolute top-4 left-4 bg-red-600 text-white font-black px-6 py-3 rounded-full text-lg animate-pulse z-10; }
    .join-btn { @apply w-full h-full flex items-center justify-center bg-gradient-to-br from-emerald-600 to-teal-700 text-white font-black text-5xl cursor-pointer hover:from-emerald-500 hover:to-teal-600 transition-all; }
    .join-btn svg { width: 120px; height: 120px; margin-bottom: 2rem; }
    .chat-box { background: #111; border-left: 4px solid #10b981; }
    #liveChatMessages { min-height: 500px; }
    .msg { @apply p-3 rounded-lg mb-3 max-w-xs; }
    .msg.user { background: #10b981; color: white; align-self: flex-end; }
    .msg.other { background: #333; color: #eee; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-black to-gray-900 min-h-screen text-white">

  <!-- BANNER -->
  <div class="relative h-64 md:h-96 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="w-full h-full bg-gradient-to-br from-emerald-900 to-teal-900 flex items-center justify-center text-6xl font-black">
      Artist Banner
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 -mt-32 relative z-10">
    <div class="flex flex-col md:flex-row items-center md:items-end gap-8 mb-16">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-64 h-64 rounded-full border-8 border-white shadow-2xl object-cover">
      <h1 id="artistName" class="text-7xl md:text-9xl font-black drop-shadow-2xl">Loading...</h1>
    </div>

    <!-- LIVE STREAM SECTION — PRO ONLY -->
    <section id="liveStreamSection" class="mb-20 live-container">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-0">
        <!-- Player Area -->
        <div class="lg:col-span-3 relative">
          <div id="liveIndicator" class="live-badge hidden">LIVE NOW</div>
          <div id="livePlayerContainer" class="live-player">
            <!-- This gets replaced with either Join button or real player -->
            <div id="joinLivePlaceholder" class="join-btn flex-col">
              <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
              <div>Join Live When Ready</div>
              <div class="text-2xl mt-4 opacity-80">Pro supporters only</div>
            </div>
          </div>
        </div>

        <!-- Chat -->
        <div class="chat-box p-6 flex flex-col">
          <h3 class="text-3xl font-black text-emerald-400 mb-4">Live Chat</h3>
          <div id="liveChatMessages" class="flex-1 overflow-y-auto space-y-3 mb-4">
            <p class="text-gray-500 text-center italic">Waiting for stream to start...</p>
          </div>
          <div class="flex gap-2">
            <input type="text" id="chatNameInput" placeholder="Your name" class="flex-1 bg-black/50 border border-emerald-600 rounded-lg px-4 py-3 text-white placeholder-gray-400">
            <input type="text" id="chatMessageInput" placeholder="Say something..." class="flex-1 bg-black/50 border border-emerald-600 rounded-lg px-4 py-3 text-white placeholder-gray-400" onkeydown="if(event.key==='Enter')sendLiveMessage()">
            <button onclick="sendLiveMessage()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-lg font-bold">Send</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Rest of your page (About, Videos, etc.) -->
    <div class="bg-white/10 backdrop-blur rounded-3xl p-10 mb-16">
      <h2 class="text-4xl font-black text-emerald-400 mb-6">About</h2>
      <p id="artistBio" class="text-xl leading-relaxed">Loading bio...</p>
    </div>

    <h2 class="text-6xl font-black text-emerald-400 mb-12 text-center">Videos</h2>
    <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient('https://bxoqhmfnseskwqkywppg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc')

    const urlParams = new URLSearchParams(location.search)
    const subdomain = urlParams.get('id')?.trim().toLowerCase()
    if (!subdomain) { document.body.innerHTML = "<h1 class='text-9xl text-red-600 text-center mt-40'>Invalid Link</h1>"; throw '' }

    let artistId = null
    let isPro = false
    let currentPlaybackId = null

    async function init() {
      const { data: profile } = await supabase
        .from('profiles')
        .select('id, name, bio, banner_url, logo_url, plan')
        .eq('subdomain', subdomain)
        .single()

      if (!profile) { document.body.innerHTML = "<h1 class='text-9xl text-red-600 text-center mt-40'>Artist Not Found</h1>"; return }

      artistId = profile.id
      isPro = profile.plan === 'pro'

      document.title = `${profile.name} • Rhythm Deck`
      document.getElementById('artistName').textContent = profile.name
      document.getElementById('artistBio').textContent = profile.bio || "No bio yet."

      if (profile.banner_url) {
        document.getElementById('banner').src = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl
        document.getElementById('banner').classList.remove('hidden')
        document.getElementById('bannerPlaceholder').remove()
      }
      if (profile.logo_url) {
        document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl
      }

      if (isPro) {
        document.getElementById('liveStreamSection').style.display = 'block'
        checkLiveStatus()
        setInterval(checkLiveStatus, 7000)
      }

      loadVideos()
    }

    async function checkLiveStatus() {
      if (!isPro) return

      const { data: session } = await supabase
        .from('live_sessions')
        .select('playback_id')
        .eq('user_id', artistId)
        .eq('is_active', true)
        .maybeSingle()

      if (session?.playback_id && session.playback_id !== currentPlaybackId) {
        currentPlaybackId = session.playback_id
        document.getElementById('liveIndicator').classList.remove('hidden')
        document.getElementById('joinLivePlaceholder').remove()
        loadLivePlayer()
      } else if (!session && currentPlaybackId) {
        currentPlaybackId = null
        document.getElementById('liveIndicator').classList.add('hidden')
        location.reload() // Simple way to bring back "Join Live" button
      }
    }

    function loadLivePlayer() {
      if (!currentPlaybackId || document.querySelector('lp-player')) return

      const Player = window.livepeerReact.Player
      const root = ReactDOM.createRoot(document.getElementById('livePlayerContainer'))
      root.render(React.createElement(Player, {
        playbackId: currentPlaybackId,
        autoPlay: true,
        muted: false,
        showTitle: false,
        className: "w-full h-full"
      }))
    }

    function sendLiveMessage() {
      const name = document.getElementById('chatNameInput').value.trim() || 'Fan'
      const msg = document.getElementById('chatMessageInput').value.trim()
      if (!msg) return

      const chat = document.getElementById('liveChatMessages')
      chat.innerHTML += `<div class="msg user"><strong>${name}:</strong> ${msg}</div>`
      document.getElementById('chatMessageInput').value = ''
      chat.scrollTop = chat.scrollHeight
    }

    // Videos section (unchanged, works perfectly)
    async function loadVideos() {
      const { data: videos } = await supabase.from('user_videos').select('*').eq('user_id', artistId).order('created_at', { ascending: false })
      const container = document.getElementById('videoList')
      if (!videos?.length) {
        container.innerHTML = '<p class="col-span-full text-center text-6xl text-gray-500">No videos yet</p>'
        return
      }
      // ... your existing video rendering code (keep it exactly as before)
    }

    init()
  </script>
</body>
</html>
