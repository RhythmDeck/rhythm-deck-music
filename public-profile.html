<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Public Profile | Rhythm Deck</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; }

    #videoModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }

    #videoModal.show { display: flex; }

    #modalVideo {
      max-width: 95vw;
      max-height: 80vh;
      background: black;
      border-radius: 12px;
    }

    #closeModal {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10000;
    }
  </style>
</head>

<body class="bg-gray-50">

<!-- ================= HEADER ================= -->
<section class="relative h-72 bg-gradient-to-br from-purple-900 to-blue-900">
  <img id="banner" class="absolute inset-0 w-full h-full object-cover hidden">
  <div class="absolute bottom-6 left-6 w-32 h-32 bg-white rounded-full overflow-hidden border-8 border-white">
    <img id="logo" class="w-full h-full object-cover">
  </div>
</section>

<!-- ================= PROFILE ================= -->
<div class="max-w-4xl mx-auto text-center mt-20 px-6">
  <h1 id="name" class="text-5xl font-black text-emerald-600">Loading…</h1>
  <p id="bio" class="mt-4 text-gray-700 text-lg">Loading profile…</p>
</div>

<!-- ================= VIDEOS ================= -->
<section class="max-w-6xl mx-auto mt-16 px-6">
  <h2 class="text-4xl font-bold text-center mb-10">Videos</h2>
  <div id="videoList" class="grid md:grid-cols-3 gap-8"></div>
</section>

<!-- ================= LIVESTREAM / CHAT / TIP ================= -->
<section id="liveSection"
         class="max-w-6xl mx-auto mt-20 p-8 bg-gradient-to-r from-purple-50 to-pink-50 rounded-xl shadow-xl">

  <h3 class="text-3xl font-black text-purple-800 mb-6 text-center">
    Live Stream & Fan Support
  </h3>

  <div class="grid md:grid-cols-3 gap-6">

    <!-- VIDEO -->
    <div class="md:col-span-2 bg-black rounded-xl flex items-center justify-center h-64 text-white text-xl font-bold">
      Artist is not live right now
    </div>

    <!-- CHAT -->
    <div class="bg-white rounded-xl shadow p-4 flex flex-col">
      <h4 class="font-black mb-3">Live Chat</h4>
      <div class="flex-1 bg-gray-100 rounded p-3 text-sm text-gray-500 flex items-center justify-center">
        Chat opens when the artist goes live
      </div>
    </div>
  </div>

  <!-- TIP BUCKET -->
  <div class="mt-8 bg-emerald-100 p-6 rounded-xl text-center border-4 border-emerald-400">
    <h4 class="text-2xl font-black text-emerald-800 mb-3">
      Support the Artist
    </h4>

    <p class="mb-4 text-gray-700">
      Tip bucket enabled (Stripe test mode)
    </p>

    <div class="flex justify-center gap-4 flex-wrap">
      <button class="bg-emerald-600 text-white font-black px-6 py-3 rounded-lg">$5</button>
      <button class="bg-emerald-600 text-white font-black px-6 py-3 rounded-lg">$10</button>
      <button class="bg-emerald-600 text-white font-black px-6 py-3 rounded-lg">$20</button>
    </div>
  </div>
</section>

<!-- ================= VIDEO MODAL ================= -->
<div id="videoModal">
  <div id="closeModal">✕</div>
  <video id="modalVideo" controls></video>
</div>

<!-- ================= SCRIPT ================= -->
<script>
/* ================= SUPABASE (SINGLE INSTANCE) ================= */
const supabase = window.supabase.createClient(
  "https://bxoqhmfnseskwqkywppg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
);

/* ================= URL PARAM ================= */
const params = new URLSearchParams(window.location.search);
const profileId = params.get("id");

/* ================= LOAD PROFILE ================= */
async function loadProfile() {
  const { data, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("subdomain", profileId)
    .single();

  if (error || !data) {
    document.getElementById("name").innerText = "Profile Not Found";
    return null;
  }

  document.getElementById("name").innerText = data.name || data.username;
  document.getElementById("bio").innerText = data.bio || "";

  if (data.banner_url) {
    document.getElementById("banner").src =
      supabase.storage.from("media").getPublicUrl(data.banner_url).data.publicUrl;
    document.getElementById("banner").classList.remove("hidden");
  }

  if (data.logo_url) {
    document.getElementById("logo").src =
      supabase.storage.from("media").getPublicUrl(data.logo_url).data.publicUrl;
  }

  return data.id;
}

/* ================= LOAD VIDEOS ================= */
async function loadVideos(userId) {
  const { data } = await supabase
    .from("user_videos")
    .select("*")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });

  const container = document.getElementById("videoList");

  if (!data || data.length === 0) {
    container.innerHTML =
      `<p class="col-span-full text-center text-gray-500">No videos yet.</p>`;
    return;
  }

  container.innerHTML = "";

  data.forEach(v => {
    const url = supabase.storage.from("media").getPublicUrl(v.video_url).data.publicUrl;

    container.innerHTML += `
      <div class="bg-white rounded-xl shadow-lg cursor-pointer"
           onclick="openVideo('${url}')">
        <div class="h-48 bg-black text-white flex items-center justify-center text-5xl">▶</div>
        <div class="p-4 font-bold">${v.title || "Untitled"}</div>
      </div>
    `;
  });
}

/* ================= VIDEO MODAL ================= */
function openVideo(url) {
  const modal = document.getElementById("videoModal");
  const video = document.getElementById("modalVideo");
  video.src = url;
  modal.classList.add("show");
}

document.getElementById("closeModal").onclick = () => {
  const modal = document.getElementById("videoModal");
  const video = document.getElementById("modalVideo");
  video.pause();
  video.src = "";
  modal.classList.remove("show");
};

/* ================= INIT ================= */
(async () => {
  if (!profileId) return;
  const userId = await loadProfile();
  if (userId) await loadVideos(userId);
})();
</script>

</body>
</html>
