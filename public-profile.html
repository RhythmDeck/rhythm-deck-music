<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Public Profile | Rhythm Deck</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; }

    #videoModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #videoModal.show { display: flex; }
  </style>
</head>

<body class="bg-gray-50">

<!-- HEADER -->
<section class="relative h-72 bg-gradient-to-br from-purple-900 to-blue-900">
  <img id="banner" class="absolute inset-0 w-full h-full object-cover hidden">
  <div class="absolute bottom-6 left-6 w-32 h-32 bg-white rounded-full overflow-hidden border-8 border-white">
    <img id="logo" class="w-full h-full object-cover">
  </div>
</section>

<!-- PROFILE -->
<div class="max-w-4xl mx-auto text-center mt-20 px-6">
  <h1 id="name" class="text-5xl font-black text-emerald-600">Loading…</h1>
  <p id="bio" class="mt-4 text-gray-700 text-lg"></p>
</div>

<!-- LIVE STREAM -->
<section class="max-w-6xl mx-auto mt-16 px-6">
  <h2 class="text-3xl font-bold mb-4">Live Stream</h2>

  <div id="livestreamBox"
       class="bg-black rounded-xl text-white h-80 flex items-center justify-center text-xl">
    Offline
  </div>
</section>

<!-- CHAT + TIPS -->
<section class="max-w-6xl mx-auto mt-12 px-6 grid md:grid-cols-3 gap-8">

  <!-- CHAT -->
  <div class="md:col-span-2 bg-white rounded-xl shadow p-6">
    <h3 class="text-2xl font-bold mb-4">Live Chat</h3>
    <div id="chatBox"
         class="h-64 overflow-y-auto border rounded p-4 text-gray-600">
      Chat will appear when the stream is live.
    </div>
  </div>

  <!-- TIP BUCKET -->
  <div class="bg-gradient-to-br from-emerald-500 to-green-600 text-white rounded-xl shadow p-6">
    <h3 class="text-2xl font-bold mb-4">Tip the Artist</h3>
    <p class="mb-4">Support the stream 💚</p>
    <button class="w-full bg-white text-emerald-600 font-bold py-3 rounded-lg">
      Tip (Test Mode)
    </button>
  </div>

</section>

<!-- VIDEOS -->
<section class="max-w-6xl mx-auto mt-16 px-6">
  <h2 class="text-4xl font-bold text-center mb-10">Videos</h2>
  <div id="videoList" class="grid md:grid-cols-3 gap-8"></div>
</section>

<!-- VIDEO MODAL -->
<div id="videoModal">
  <video id="modalVideo" controls class="max-w-4xl w-full rounded-xl"></video>
</div>

<script>
/* ===============================
   SUPABASE
================================ */
const supabase = window.supabase.createClient(
  "https://bxoqhmfnseskwqkywppg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
);

const params = new URLSearchParams(window.location.search);
const profileId = params.get("id");

/* ===============================
   LOAD PROFILE
================================ */
async function loadProfile() {
  const { data } = await supabase
    .from("profiles")
    .select("*")
    .or(`id.eq.${profileId},subdomain.eq.${profileId}`)
    .single();

  if (!data) return null;

  name.innerText = data.name;
  bio.innerText = data.bio || "";

  if (data.banner_url) {
    banner.src = supabase.storage.from("media")
      .getPublicUrl(data.banner_url).data.publicUrl;
    banner.classList.remove("hidden");
  }

  if (data.logo_url) {
    logo.src = supabase.storage.from("media")
      .getPublicUrl(data.logo_url).data.publicUrl;
  }

  return data.id;
}

/* ===============================
   LOAD VIDEOS
================================ */
async function loadVideos(userId) {
  const { data } = await supabase
    .from("user_videos")
    .select("*")

    .eq("user_id", userId);

  if (!data || !data.length) {
    videoList.innerHTML =
      `<p class="col-span-full text-center text-gray-500">No videos yet.</p>`;
    return;
  }

  data.forEach(v => {
    const url = supabase.storage.from("media")
      .getPublicUrl(v.video_url).data.publicUrl;

    videoList.innerHTML += `
      <div onclick="playVideo('${url}')"
           class="bg-white shadow rounded-xl cursor-pointer">
        <div class="p-4 font-bold">${v.title}</div>
      </div>`;
  });
}

/* ===============================
   VIDEO PLAYER
================================ */
function playVideo(url) {
  modalVideo.src = url;
  videoModal.classList.add("show");
}
videoModal.onclick = () => {
  modalVideo.pause();
  modalVideo.src = "";
  videoModal.classList.remove("show");
};

/* ===============================
   INIT
================================ */
(async () => {
  const userId = await loadProfile();
  if (userId) loadVideos(userId);
})();
</script>

</body>
</html>
