<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Public Profile | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;display:inline-block;}
    @keyframes spin {0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .video-overlay {position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-overlay:hover {opacity:1}
    #videoModal {position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    #videoModal.show {opacity:1;visibility:visible}
    #modalVideo {max-width:90%;max-height:85vh;border:4px solid #10b981;border-radius:12px;box-shadow:0 0 40px rgba(16,185,129,.5)}
    #closeModal {position:absolute;top:20px;right:20px;background:#10b981;color:white;width:50px;height:50px;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(0,0,0,.6);z-index:10}
    .glow-emerald {color:#10b981;text-shadow:0 0 15px rgba(16,185,129,0.7),0 0 30px rgba(16,185,129,0.4);}
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <!-- Full-width Banner -->
  <section class="relative h-[400px] bg-gradient-to-br from-purple-950 to-blue-950 overflow-hidden shadow-2xl">
    <img id="banner" src="" alt="Banner" class="absolute inset-0 w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="absolute inset-0 flex items-center justify-center text-white text-5xl font-bold opacity-50">
      Loading Banner...
    </div>
    <!-- Logo badge (bottom-left) -->
    <div class="absolute -bottom-16 left-8 w-40 h-40 rounded-full border-[12px] border-white/90 shadow-2xl overflow-hidden bg-white z-10">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-full h-full object-cover">
    </div>
  </section>

  <!-- Name + Bio -->
  <div class="max-w-5xl mx-auto px-6 pt-24 pb-16 text-center">
    <h1 id="name" class="text-6xl md:text-7xl font-bold glow-emerald mb-6 tracking-tight">Loading...</h1>
    <p id="bio" class="text-xl md:text-2xl text-gray-700 font-light max-w-4xl mx-auto leading-relaxed">Loading bio...</p>
  </div>

  <!-- Videos -->
  <section class="max-w-6xl mx-auto px-6 pb-24">
    <h2 class="text-5xl font-bold text-center mb-16 text-gray-900">Videos</h2>
    <div id="videoList" class="grid md:grid-cols-3 gap-10">
      <p class="col-span-full text-center text-gray-600 py-20 text-2xl">Loading videos...</p>
    </div>
  </section>

  <!-- Video Modal -->
  <div id="videoModal">
    <div id="closeModal" onclick="document.getElementById('videoModal').classList.remove('show')">×</div>
    <video id="modalVideo" controls autoplay class="shadow-2xl"></video>
  </div>

  <script>
    const sb = supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadProfile() {
      if (!id) {
        document.getElementById('name').textContent = 'Profile not found';
        return;
      }

      let profile;
      let { data } = await sb
        .from('profiles')
        .select('name, bio, banner_url, logo_url')
        .eq('subdomain', id)
        .single();

      if (!data) {
        ({ data } = await sb
          .from('profiles')
          .select('name, bio, banner_url, logo_url')
          .eq('id', id)
          .single());
      }

      profile = data;

      if (!profile) {
        document.getElementById('name').textContent = 'Profile not found';
        return;
      }

      document.getElementById('name').textContent = profile.name || 'Artist';
      document.getElementById('bio').textContent = profile.bio || 'No bio yet';

      if (profile.banner_url) {
        const { data: urlData } = sb.storage.from('media').getPublicUrl(profile.banner_url);
        document.getElementById('banner').src = urlData.publicUrl + '?t=' + Date.now();
        document.getElementById('banner').classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      }

      if (profile.logo_url) {
        const { data: urlData } = sb.storage.from('media').getPublicUrl(profile.logo_url);
        document.getElementById('logo').src = urlData.publicUrl + '?t=' + Date.now();
      }
    }

    async function loadVideos() {
      const container = document.getElementById('videoList');
      container.innerHTML = '<p class="col-span-full text-center py-20 text-2xl text-gray-600">Loading videos...</p>';

      let profile;
      let { data } = await sb
        .from('profiles')
        .select('id')
        .eq('subdomain', id)
        .single();

      if (!data) {
        ({ data } = await sb.from('profiles').select('id').eq('id', id).single());
      }

      profile = data;

      if (!profile) return container.innerHTML = '<p class="col-span-full text-center text-red-600 text-2xl py-20">No videos available</p>';

      const { data: videos } = await sb
        .from('user_videos')
        .select('*')
        .eq('user_id', profile.id)
        .order('created_at', { ascending: false });

      if (!videos?.length) {
        container.innerHTML = '<p class="col-span-full text-center italic py-20 text-2xl text-gray-600">No videos yet</p>';
        return;
      }

      container.innerHTML = '';
      for (const v of videos) {
        const videoUrl = sb.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
        const thumbUrl = v.thumbnail_url ? sb.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'https://via.placeholder.com/400x225?text=Video';

        const { count: likes } = await sb
          .from('video_likes')
          .select('*', { count: 'exact', head: true })
          .eq('video_id', v.id);

        const { data: comments } = await sb
          .from('video_comments')
          .select('name, comment')
          .eq('video_id', v.id)
          .order('created_at', { ascending: false });

        container.innerHTML += `
          <div class="bg-white rounded-2xl shadow-xl overflow-hidden transform hover:scale-[1.02] transition-all duration-300">
            <div class="relative">
              <img src="${thumbUrl}" class="w-full h-64 object-cover">
              <div class="video-overlay" onclick="document.getElementById('modalVideo').src='${videoUrl}'; document.getElementById('videoModal').classList.add('show')">
                <svg class="w-20 h-20 text-white drop-shadow-2xl" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7L8 5z"/>
                </svg>
              </div>
            </div>
            <div class="p-6">
              <h4 class="font-bold text-xl truncate mb-4">${v.title || 'Untitled'}</h4>
              <div class="flex justify-between items-center mb-6">
                <button class="flex items-center gap-3 text-2xl font-bold hover:text-red-600 transition" onclick="likeVideo('${v.id}', this)">
                  ❤️ ${likes || 0}
                </button>
                <button onclick="navigator.clipboard.writeText('${videoUrl}'); alert('Link copied!')" class="text-green-600 font-bold hover:text-green-700 text-lg">
                  Share
                </button>
              </div>

              <!-- Comments -->
              <div class="border-t pt-4 mb-6">
                <h5 class="font-bold text-lg mb-3">Comments</h5>
                ${comments.length === 0 ? '<p class="text-gray-500 italic text-sm">No comments yet</p>' : ''}
                ${comments.map(c => `<div class="mb-3 text-sm"><strong>${c.name}:</strong> ${c.comment}</div>`).join('')}
              </div>

              <!-- Comment form -->
              <div class="mt-4">
                <input type="text" id="commentName-${v.id}" placeholder="Your name" class="w-full p-3 border rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <textarea id="commentText-${v.id}" placeholder="Add a comment..." class="w-full p-3 border rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-emerald-500" rows="2"></textarea>
                <button onclick="addComment('${v.id}')" class="bg-emerald-600 text-white px-6 py-3 rounded-lg hover:bg-emerald-700 transition w-full font-medium">
                  Post Comment
                </button>
              </div>
            </div>
          </div>`;
      }
    }

    async function likeVideo(videoId, button) {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return alert("Log in to like");

      const { data: existing } = await sb
        .from('video_likes')
        .select('id')
        .eq('video_id', videoId)
        .eq('user_id', user.id)
        .single();

      if (existing) {
        await sb.from('video_likes').delete().eq('id', existing.id);
      } else {
        await sb.from('video_likes').insert({ video_id: videoId, user_id: user.id });
      }

      loadVideos(); // refresh
    }

    async function addComment(videoId) {
      const nameEl = document.getElementById(`commentName-${videoId}`);
      const textEl = document.getElementById(`commentText-${videoId}`);
      const name = nameEl.value.trim();
      const comment = textEl.value.trim();

      if (!name || !comment) return alert("Name and comment required");

      await sb.from('video_comments').insert({ video_id: videoId, name, comment });

      nameEl.value = '';
      textEl.value = '';
      loadVideos();
    }

    window.addEventListener('load', () => {
      loadProfile();
      loadVideos();
    });
  </script>
</body>
</html>
