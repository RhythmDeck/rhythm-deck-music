<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Rhythm Deck</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .video-card{background:#111;border-radius:1rem;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.3);transition:.4s;position:relative}
    .video-card:hover{transform:translateY(-10px);box-shadow:0 30px 60px rgba(0,0,0,.5)}
    .thumbnail-container{position:relative;padding-top:56.25%;background:#000;cursor:pointer;overflow:hidden}
    .thumbnail-container img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:.4s}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(16,185,129,.9);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .play-button svg{width:38px;height:38px;margin-left:6px;fill:white}
    #artistName{color:#fff;text-shadow:0 4px 20px #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}
    .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem 1rem;margin-bottom:.5rem}
    .comment-name{font-weight:700;color:#10b981}
    .comment-text{color:#1f2937;margin-left:.5rem;font-weight:500}
    .liked svg{fill:#ef4444;stroke:none}
    #badge-container{position:absolute;top:20px;right:20px;z-index:30}
    #badge-container img{width:110px;height:110px;filter:drop-shadow(0 0 25px rgba(255,215,0,0.8));transition:all .4s}
    #badge-container img:hover{transform:scale(1.2) rotate(12deg)}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <div id="badge-container"></div>
  </div>
  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="https://placehold.co/400x400/emerald/white?text=Artist&font=roboto" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center">Videos</h2>
    <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
  </div>

  <div id="videoModal" class="fixed inset-0 bg-black/96 flex items-center justify-center z-[9999] opacity-0 invisible transition-all duration-300">
    <button onclick="closeVideo()" class="fixed top-8 right-8 w-16 h-16 bg-white text-black rounded-full text-4xl font-bold z-50 hover:bg-gray-200">X</button>
    <video id="modalVideo" controls autoplay muted playsinline class="max-w-[95%] max-h-[90vh] rounded-2xl shadow-2xl"></video>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    );

    const getMediaUrl = (path) => {
      if (!path) return '';
      const cleanPath = path.replace(/^\/+/, '');
      return `https://bxoqhmfnseskwqkywppg.supabase.co/storage/v1/object/public/media/${cleanPath}`;
    };

    // Generate real UUID for anon user — matches your uuid column
    function getAnonId() {
      let id = localStorage.getItem('rhythmdeck_anon_id');
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem('rhythmdeck_anon_id', id);
      }
      return id;
    }

    const urlParams = new URLSearchParams(location.search);
    const rawParam = urlParams.get('id')?.trim().toLowerCase();

    if (!rawParam) {
      document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Invalid Link</div>';
      throw new Error('No ID parameter');
    }

    let artistId = null;
    let videoCount = 0;

    async function init() {
      let profile = null;

      const { data: subdomainData } = await supabase
        .from('profiles')
        .select('id, name, bio, banner_url, logo_url, plan')
        .ilike('subdomain', rawParam)
        .limit(1);

      if (subdomainData && subdomainData.length > 0) {
        profile = subdomainData[0];
      }

      if (!profile) {
        const { data: idData } = await supabase
          .from('profiles')
          .select('id, name, bio, banner_url, logo_url, plan')
          .eq('id', rawParam)
          .limit(1);

        if (idData && idData.length > 0) {
          profile = idData[0];
        }
      }

      if (!profile) {
        document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Artist Not Found</div>';
        return;
      }

      artistId = profile.id;

      document.title = `${profile.name || 'Artist'} • Rhythm Deck`;
      document.getElementById('artistName').textContent = profile.name || 'Unknown Artist';
      document.getElementById('artistBio').innerHTML = (profile.bio || "No bio yet.").replace(/\n/g, '<br>');

      if (profile.banner_url) {
        const bannerUrl = getMediaUrl(profile.banner_url) + '?t=' + Date.now();
        const bannerImg = document.getElementById('banner');
        bannerImg.src = bannerUrl;
        bannerImg.onload = () => {
          bannerImg.classList.remove('hidden');
          document.getElementById('bannerPlaceholder').classList.add('hidden');
        };
      }

      if (profile.logo_url) {
        document.getElementById('logo').src = getMediaUrl(profile.logo_url) + '?t=' + Date.now();
      }

      loadVideos();
    }

    async function loadVideos() {
      if (!artistId) return;

      const { data: videos } = await supabase
        .from('user_videos')
        .select('id, video_url, thumbnail_url, title')
        .eq('user_id', artistId)
        .order('created_at', { ascending: false });

      const list = document.getElementById('videoList');
      videoCount = videos?.length || 0;

      const badge = document.getElementById('badge-container');
      badge.innerHTML = '';
      if (videoCount >= 3) {
        badge.innerHTML = `<img src="https://raw.githubusercontent.com/RhythmDeck/rhythm-deck-music/main/pro-artist-badge.png" alt="Pro Artist Badge">`;
      }

      if (!videos || videos.length === 0) {
        list.innerHTML = '<p class="col-span-full text-center text-5xl text-gray-500 py-20">No videos yet</p>';
        return;
      }

      list.innerHTML = '';
      const anonId = getAnonId();

      for (const v of videos) {
        const videoUrl = getMediaUrl(v.video_url);
        const thumbUrl = v.thumbnail_url 
          ? getMediaUrl(v.thumbnail_url) + '?t=' + Date.now() 
          : 'https://placehold.co/600x338/emerald/white?text=No+Thumb';

        const { count: likes = 0 } = await supabase.from('video_likes').select('*', { count: 'exact', head: true }).eq('video_id', v.id);
        const { data: userLike } = await supabase.from('video_likes').select('id').eq('video_id', v.id).eq('user_id', anonId).maybeSingle();
        const { data: comments = [] } = await supabase.from('video_comments').select('name, comment').eq('video_id', v.id).order('created_at', { ascending: false });

        list.innerHTML += `
          <div class="video-card">
            <div class="relative">
              <img src="${thumbUrl}" class="w-full h-48 object-cover">
              <div class="play-overlay" onclick="openVideo('${videoUrl}')">
                <div class="play-button">
                  <svg viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z" fill="white"/></svg>
                </div>
              </div>
            </div>
            <div class="p-6 bg-gray-800 text-white">
              <h3 class="font-black text-2xl text-emerald-400 text-center mb-4">${v.title || 'Untitled'}</h3>
              <div class="flex justify-between items-center mb-4">
                <button class="like-btn flex items-center gap-2 font-bold text-lg ${userLike ? 'liked text-red-500' : 'text-gray-400'} hover:text-red-500 transition" data-id="${v.id}">
                  Heart
                  <svg class="w-7 h-7 ${userLike ? 'fill-red-500' : 'fill-none'} stroke-current" viewBox="0 0 24 24">
                    <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                  </svg>
                  <span class="like-count">${likes}</span>
                </button>
                <button onclick="navigator.clipboard.writeText('${videoUrl}'); alert('Link copied!')" class="text-emerald-400 font-bold hover:text-emerald-300">Share</button>
              </div>
              <div class="border-t border-gray-700 pt-4 space-y-2 text-sm max-h-48 overflow-y-auto">
                ${comments.length === 0 ? '<p class="text-gray-500 italic text-center py-4">Be the first to comment!</p>' : ''}
                ${comments.map(c => `<div class="comment-bubble"><span class="comment-name">${c.name || 'Fan'}:</span> <span class="comment-text">${c.comment}</span></div>`).join('')}
              </div>
              <div class="mt-6">
                <input type="text" placeholder="Your name (optional)" class="bg-white text-gray-900 border-2 border-emerald-500 rounded-lg p-2 w-full mb-2" id="name-${v.id}">
                <div class="flex gap-2">
                  <input type="text" placeholder="Write a comment..." class="bg-white text-gray-900 border-2 border-emerald-500 rounded-lg p-2 flex-1" id="comment-${v.id}">
                  <button data-id="${v.id}" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-lg post-comment">Post</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      window.openVideo = function(url) {
        document.getElementById('modalVideo').src = url;
        document.getElementById('videoModal').classList.remove('invisible', 'opacity-0');
        document.getElementById('videoModal').classList.add('opacity-100');
      };

      window.closeVideo = function() {
        document.getElementById('videoModal').classList.add('invisible', 'opacity-0');
        document.getElementById('videoModal').classList.remove('opacity-100');
        document.getElementById('modalVideo').src = '';
      };

      document.querySelectorAll('.like-btn').forEach(btn => {
        btn.onclick = async () => {
          const videoId = btn.dataset.id;
          const userId = getAnonId();

          const { data: existing } = await supabase
            .from('video_likes')
            .select('id')
            .eq('video_id', videoId)
            .eq('user_id', userId)
            .maybeSingle();

          if (existing) {
            await supabase.from('video_likes').delete().eq('id', existing.id);
          } else {
            await supabase.from('video_likes').insert({
              video_id: videoId,
              user_id: userId,
              fan_name: 'Fan'
            });
          }

          loadVideos();
        };
      });

      document.querySelectorAll('.post-comment').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          const name = document.getElementById(`name-${id}`).value.trim() || 'Fan';
          const comment = document.getElementById(`comment-${id}`).value.trim();
          if (!comment) return;

          await supabase.from('video_comments').insert({ video_id: id, name, comment });
          document.getElementById(`comment-${id}`).value = '';
          document.getElementById(`name-${id}`).value = '';
          loadVideos();
        };
      });
    }

    init();
  </script>
</body>
</html>
