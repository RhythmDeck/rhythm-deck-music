<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Rhythm Deck</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .video-card{background:#111;border-radius:1rem;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.3);transition:.4s;position:relative}
    .video-card:hover{transform:translateY(-10px);box-shadow:0 30px 60px rgba(0,0,0,.5)}
    .thumbnail-container{position:relative;padding-top:56.25%;background:#000;cursor:pointer;overflow:hidden}
    .thumbnail-container img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:.4s}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(16,185,129,.9);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .play-button svg{width:38px;height:38px;margin-left:6px;fill:white}
    #artistName{color:#fff;text-shadow:0 4px 20px #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}
    .live-badge{position:absolute;top:16px;left:16px;background:#ef4444;color:white;font-weight:900;padding:10px 24px;border-radius:50px;animation:pulse 2s infinite;z-index:10;font-size:1.2rem}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.8)}70%{box-shadow:0 0 0 16px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
    .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem 1rem;margin-bottom:.5rem}
    .comment-name{font-weight:700;color:#10b981}
    .comment-text{color:#1f2937;margin-left:.5rem;font-weight:500}
    .liked svg{fill:#ef4444;stroke:none}
    #badge-container{position:absolute;top:20px;right:20px;z-index:30}
    #badge-container img{width:165px;height:165px;filter:drop-shadow(0 0 35px rgba(255,215,0,0.9));transition:all .4s ease;}
    #badge-container img:hover{transform:scale(1.2) rotate(12deg);}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">

  <!-- Rhythm Deck Header with Merch Button -->
  <header class="bg-black text-white p-5 flex flex-col sm:flex-row justify-between items-center shadow-lg">
    <div class="flex items-center space-x-4">
      <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="w-12 h-12 rounded-full border-2 border-green-500">
      <div>
        <h1 class="text-3xl font-black tracking-wider">RHYTHM DECK</h1>
        <p class="text-sm text-green-400">Unleash Your Beat</p>
      </div>
    </div>
    <div class="flex items-center gap-6 mt-4 sm:mt-0">
      <a 
        id="merchStoreBtn" 
        href="#" 
        target="_blank" 
        rel="noopener noreferrer"
        class="bg-gradient-to-r from-yellow-500 to-orange-600 hover:from-yellow-600 hover:to-orange-700 text-white px-8 py-3 rounded-lg font-bold transition shadow-lg"
      >
        Check out our Merch Store
      </a>
    </div>
  </header>

  <!-- Artist Content -->
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <div id="badge-container"></div>
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="https://placehold.co/400x400/emerald/white?text=Artist&font=roboto" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
    </div>

    <!-- LIVESTREAM, CHAT & TIP BUCKET SECTION -->
    <div id="liveStreamSection" class="mb-20 hidden">
      <div class="bg-gradient-to-r from-purple-50 to-pink-50 p-8 rounded-xl shadow-2xl border-l-8 border-purple-600">
        <h3 class="text-3xl font-black text-purple-800 mb-6">Artist is Live</h3>
        <div class="grid lg:grid-cols-3 gap-8 mb-8">
          <div class="lg:col-span-2">
            <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center text-white text-2xl font-bold">
              <div id="offlineMessage" class="text-center">The artist is not live right now</div>
              <div id="livepeer-player" class="hidden w-full h-full"></div>
              <div id="liveIndicator" class="live-badge hidden">LIVE NOW</div>
            </div>
          </div>
          <div class="bg-white rounded-xl shadow-xl p-6 flex flex-col h-full">
            <h4 class="font-black text-xl text-purple-700 mb-4">Live Chat</h4>
            <div id="liveChatMessages" class="flex-1 overflow-y-auto bg-gray-50 p-4 rounded-lg min-h-0 max-h-96 space-y-3">
              <p class="text-gray-500 text-center italic">Chat appears when the artist is live</p>
            </div>
            <div class="mt-4 space-y-3">
              <input type="text" id="chatNameInput" placeholder="Your name (optional)" class="w-full border border-purple-300 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-600">
              <input type="text" id="chatMessageInput" placeholder="Send a message..." class="w-full border border-purple-300 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-600" onKeyDown="if(event.key==='Enter') sendLiveMessage()">
              <button onClick="sendLiveMessage()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg">Send</button>
            </div>
          </div>
        </div>
        <!-- TIP BUCKET -->
        <div id="tipBucketSection" class="hidden bg-gradient-to-br from-emerald-100 to-green-100 p-4 rounded-xl shadow-xl border-4 border-emerald-400 text-center max-w-xl mx-auto">
          <h4 class="text-xl font-black text-emerald-800 mb-2">Support This Artist</h4>
          <p class="text-sm text-gray-700 mb-3">Send a tip ❤️</p>
          <div class="grid grid-cols-3 gap-2 mb-3 max-w-xs mx-auto">
            <button class="tip-amount bg-white hover:bg-emerald-200 border-2 border-emerald-500 rounded-xl py-2 text-lg font-bold text-emerald-800 shadow transition" data-amount="500">$5</button>
            <button class="tip-amount bg-white hover:bg-emerald-200 border-2 border-emerald-500 rounded-xl py-2 text-lg font-bold text-emerald-800 shadow transition" data-amount="1000">$10</button>
            <button class="tip-amount bg-white hover:bg-emerald-200 border-2 border-emerald-500 rounded-xl py-2 text-lg font-bold text-emerald-800 shadow transition" data-amount="2000">$20</button>
          </div>
          <div class="max-w-xs mx-auto mb-3">
            <input type="number" id="customTip" placeholder="Custom (USD)" min="1" step="0.01" class="w-full text-center py-2 border-2 border-emerald-500 rounded-xl text-base focus:outline-none focus:border-emerald-700">
          </div>
          <button id="sendTipBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2 px-6 rounded-xl shadow-lg text-base transition">
            Send Tip ❤️
          </button>
          <p class="text-xs text-gray-600 mt-2">Powered by Stripe • Test mode</p>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center">Videos</h2>
    <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
  </div>

  <div id="videoModal" class="fixed inset-0 bg-black/96 flex items-center justify-center z-[9999] opacity-0 invisible transition-all duration-300">
    <button onClick="closeVideo()" class="fixed top-8 right-8 w-16 h-16 bg-white text-black rounded-full text-4xl font-bold z-50 hover:bg-gray-200">X</button>
    <video id="modalVideo" controls autoplay muted playsinline class="max-w-[95%] max-h-[90vh] rounded-2xl shadow-2xl"></video>
  </div>

 <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const supabase = createClient(
    'https://bxoqhmfnseskwqkywppg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
  );

  const stripe = Stripe('pk_test_51SKhZj2WyyY6hPDEpILctCkaS4KOIdG2HOY1FQCvH32Z4LJcDQcPYzunaQHczLu1qQM1mOMuLytHPWTyLmYDufMZ00JODfXiiW');

  const getMediaUrl = (path) => {
    if (!path) return '';
    const cleanPath = path.replace(/^\/+/, '');
    return `https://bxoqhmfnseskwqkywppg.supabase.co/storage/v1/object/public/media/${cleanPath}?t=${Date.now()}`;
  };

  function getAnonId() {
    let id = localStorage.getItem('rhythmdeck_anon_id');
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem('rhythmdeck_anon_id', id);
    }
    return id;
  }

  const urlParams = new URLSearchParams(location.search);
  let param = urlParams.get('id')?.trim().toLowerCase();

  // Fallback to subdomain from hostname if no ?id=
  if (!param) {
    param = window.location.hostname.split('.')[0];
  }

  if (!param) {
    document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Invalid Link</div>';
    throw new Error('No parameter or subdomain');
  }

  let artistId = null;
  let stripeAccountId = null;
  let plan = null;

  async function init() {
    let profile = null;

    // Try as subdomain first (covers ?id=subdomain and hostname subdomain)
    const { data: subData, error: subError } = await supabase
      .from('profiles')
      .select('id, name, bio, banner_url, logo_url, plan, stripe_account_id, subdomain')
      .eq('subdomain', param)
      .single();

    if (!subError && subData) {
      profile = subData;
    }

    // Fallback to UUID only if param looks like one
    if (!profile && param.match(/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/i)) {
      const { data: uuidData, error: uuidError } = await supabase
        .from('profiles')
        .select('id, name, bio, banner_url, logo_url, plan, stripe_account_id, subdomain')
        .eq('id', param)
        .single();

      if (!uuidError && uuidData) profile = uuidData;
    }

    if (!profile) {
      document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Artist Not Found</div>';
      return;
    }

    artistId = profile.id;
    stripeAccountId = profile.stripe_account_id;
    plan = profile.plan || 'free';

    document.title = `${profile.name || 'Artist'} • Rhythm Deck`;
    document.getElementById('artistName').textContent = profile.name || 'Unknown Artist';
    document.getElementById('artistBio').innerHTML = (profile.bio || "No bio yet.").replace(/\n/g, '<br>');

    // Load custom logo
    if (profile.logo_url) {
      document.getElementById('logo').src = getMediaUrl(profile.logo_url);
    }

    // Load custom banner
    if (profile.banner_url) {
      const bannerUrl = getMediaUrl(profile.banner_url);
      const bannerImg = document.getElementById('banner');
      bannerImg.src = bannerUrl;
      bannerImg.onload = () => {
        bannerImg.classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      };
      bannerImg.onerror = () => console.error('Banner failed to load:', bannerUrl);
    }

    // Platinum Badge
    const badgeContainer = document.getElementById('badge-container');
    if (plan === 'platinum') {
      badgeContainer.innerHTML = `<img src="platinum-pro-artist-badge-transparent-1.png" alt="Platinum Pro Artist Badge">`;
    } else {
      badgeContainer.innerHTML = '';
    }

    // Show Live Stream + Tip Bucket
    if (plan === 'pro' || plan === 'platinum') {
      document.getElementById('liveStreamSection').classList.remove('hidden');
      if (stripeAccountId) document.getElementById('tipBucketSection').classList.remove('hidden');
      checkLiveStatus();
      setInterval(checkLiveStatus, 10000);
    }

    loadVideos();

    // Set Merch button
    const merchSubdomain = profile.subdomain || param;
    if (merchSubdomain) {
      const merchUrl = `https://rhythm-deck-music.onrender.com/public-merch.html?id=${merchSubdomain}`;
      document.getElementById('merchStoreBtn').href = merchUrl;
    } else {
      document.getElementById('merchStoreBtn').style.display = 'none';
    }
  }

  // Your original functions (unchanged - keep them as is)
  async function checkLiveStatus() { /* ... your code ... */ }
  async function loadLiveChat() { /* ... your code ... */ }
  async function sendLiveMessage() { /* ... your code ... */ }
  async function loadVideos() { /* ... your code ... */ }

  window.playPreview = (url) => openVideo(url);
  window.buyVideo = (videoId, priceUSD, videoUrl) => { /* ... your code ... */ };
  window.openVideo = (url) => { /* ... your code ... */ };
  window.closeVideo = () => { /* ... your code ... */ };

  document.querySelectorAll('.tip-amount').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('customTip').value = (btn.dataset.amount / 100).toFixed(2);
    });
  });

  document.getElementById('sendTipBtn')?.addEventListener('click', () => {
    if (!stripeAccountId) {
      alert('This artist has not enabled tips yet.');
      return;
    }
    let amount = parseFloat(document.getElementById('customTip').value || '5');
    if (isNaN(amount) || amount < 1) {
      alert('Please enter a tip amount of at least $1');
      return;
    }
    alert(`Thank you! $${amount.toFixed(2)} tip sent to the artist (test mode)`);
    document.getElementById('customTip').value = '';
  });

  // Start loading
  init();
</script>
</body>
</html>
