<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@livepeer/react@3/dist/livepeer-react.min.js"></script>
  <style>
    .video-card{border-radius:1.5rem;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.15);transition:.4s;background:white;position:relative}
    .video-card::before{content:'';position:absolute;inset:-8px;border-radius:1.75rem;background:linear-gradient(45deg,#10b981,#34d399,#6ee7b7);z-index:-1;filter:blur(12px);opacity:.8}
    .video-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 30px 60px rgba(0,0,0,.3)}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:.4s}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(255,255,255,.95);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .play-button svg{width:38px;height:38px;margin-left:6px;fill:#10b981}
    #risingStarBadge{position:absolute;top:30px;right:30px;width:140px;height:140px;z-index:30;opacity:0;transform:scale(0) rotate(-20deg);transition:all .8s cubic-bezier(.175,.885,.32,1.4)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(10deg)}
    #artistName{color:#fff;text-shadow:0 4px 20px #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}
    .live-badge{position:absolute;top:12px;left:12px;background:#ef4444;color:white;font-weight:900;padding:8px 16px;border-radius:50px;animation:pulse 2s infinite;z-index:10}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 10px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
    .lp-player{border-radius:1.5rem;overflow:hidden;height:100%}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">

  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star">
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
    </div>

    <!-- LIVE STREAM SECTION — ONLY SHOWS IF THERE IS AN ACTIVE LIVE SESSION -->
    <section id="liveStreamSection" class="mb-16 bg-black rounded-3xl shadow-2xl overflow-hidden border-4 border-emerald-500 hidden">
      <div class="relative">
        <div id="liveIndicator" class="live-badge hidden">LIVE NOW</div>
        <div id="livepeerPlayer" class="w-full h-96 md:h-[600px] bg-black"></div>
        <div id="joinLiveBtn" class="absolute bottom-6 left-1/2 -translate-x-1/2 hidden">
          <button onclick="document.getElementById('livepeerPlayer').scrollIntoView({behavior:'smooth'})"
                  class="bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-700 hover:to-pink-700 text-white font-black text-2xl px-12 py-6 rounded-full shadow-2xl hover:scale-110 transition">
            JOIN LIVE NOW
          </button>
        </div>
      </div>

      <div id="liveChatSection" class="bg-gray-900 p-6 hidden">
        <h3 class="text-2xl font-black text-emerald-400 mb-4">Live Chat</h3>
        <div id="liveChatMessages" class="h-64 overflow-y-auto bg-black/50 rounded-xl p-4 space-y-3 mb-4">
          <p class="text-gray-500 text-center italic">Chat appears when artist is live</p>
        </div>
        <div class="flex gap-3">
          <input type="text" id="chatNameInput" placeholder="Your name" class="flex-1 p-3 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-emerald-500">
          <input type="text" id="chatMessageInput" placeholder="Send a message..." class="flex-1 p-3 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-emerald-500" onkeydown="if(event.key==='Enter') sendLiveMessage()">
          <button onclick="sendLiveMessage()" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-lg font-bold">Send</button>
        </div>
      </div>
    </section>

    <!-- ABOUT & VIDEOS (unchanged) -->
    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center">Videos</h2>
    <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXIyOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    )

    const params = new URLSearchParams(location.search)
    const subdomain = params.get('id')?.trim().toLowerCase()
    if (!subdomain) throw 'Invalid link'

    let artistId = null
    let currentPlaybackId = null

    async function init() {
      const { data: profile } = await supabase
        .from('profiles')
        .select('id, name, bio, banner_url, logo_url, plan')
        .eq('subdomain', subdomain)
        .single()

      if (!profile) return document.body.innerHTML = '<div class="text-center py-40 text-7xl text-red-600">Artist Not Found</div>'

      artistId = profile.id
      document.title = `${profile.name || 'Artist'} • Rhythm Deck`
      document.getElementById('artistName').textContent = profile.name || 'Artist'

      // Bio, banner, logo (same as before)
      document.getElementById('artistBio').innerHTML = (profile.bio || "No bio yet.").replace(/\n/g, '<br>')
      if (profile.banner_url) {
        const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl
        document.getElementById('banner').src = url + '?t=' + Date.now()
        document.getElementById('banner').classList.remove('hidden')
        document.getElementById('bannerPlaceholder').classList.add('hidden')
      }
      if (profile.logo_url) {
        document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl
      }

      // Rising Star for free users only
      if (profile.plan !== 'pro') {
        const { count } = await supabase.from('user_videos').select('*', { count: 'exact', head: true }).eq('user_id', artistId)
        if (count >= 3) document.getElementById('risingStarBadge').classList.add('show')
      }

      // CHECK FOR ACTIVE LIVE SESSION
      checkForLiveSession()
      setInterval(checkForLiveSession, 12000)

      loadVideos()
    }

    async function checkForLiveSession() {
      const { data: session } = await supabase
        .from('live_sessions')
        .select('playback_id, is_active')
        .eq('user_id', artistId)
        .eq('is_active', true)
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle()

      const liveSection = document.getElementById('liveStreamSection')

      if (session && session.is_active && session.playback_id) {
        currentPlaybackId = session.playback_id
        liveSection.classList.remove('hidden')
        document.getElementById('liveIndicator').classList.remove('hidden')
        document.getElementById('joinLiveBtn').classList.remove('hidden')
        document.getElementById('liveChatSection').classList.remove('hidden')
        initLivepeerPlayer()
      } else {
        liveSection.classList.add('hidden')
        if (window.hls) window.hls.destroy()
      }
    }

    function initLivepeerPlayer() {
      if (!currentPlaybackId) return
      if (document.querySelector('lp-player')) return // already loaded

      const Player = window.livepeerReact.Player
      const root = ReactDOM.createRoot(document.getElementById('livepeerPlayer'))
      root.render(
        React.createElement(Player, {
          playbackId: currentPlaybackId,
          autoPlay: true,
          muted: false,
          showTitle: false,
          className: "w-full h-full lp-player"
        })
      )
    }

    function sendLiveMessage() {
      const name = document.getElementById('chatNameInput').value.trim() || 'Fan'
      const msg = document.getElementById('chatMessageInput').value.trim()
      if (!msg) return
      const chat = document.getElementById('liveChatMessages')
      chat.innerHTML += `<div class="bg-emerald-900/50 text-white p-3 rounded-lg max-w-xs"><strong class="text-emerald-300">${name}:</strong> ${msg}</div>`
      document.getElementById('chatMessageInput').value = ''
      chat.scrollTop = chat.scrollHeight
    }

    // Your existing loadVideos(), likes, comments, etc. — unchanged
    async function loadVideos() {
      // ... copy your exact original loadVideos() function here ...
    }

    init()
  </script>
</body>
</html>
