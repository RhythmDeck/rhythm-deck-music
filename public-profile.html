<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .live-dot {display:inline-block;width:16px;height:16px;background:#ef4444;border-radius:50%;animation:pulse 1.8s infinite;box-shadow:0 0 20px #ef4444}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    .video-card {
      position: relative;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      transition: all .4s ease;
      background: white;
    }
    .video-card:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 30px 60px rgba(0,0,0,0.3); }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: #000;
    }
    .thumbnail-container img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }
    .video-card:hover .thumbnail-container img { transform: scale(1.08); }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .4s ease;
    }
    .video-card:hover .play-overlay { opacity: 1; }

    .play-button {
      width: 90px; height: 90px;
      background: rgba(255,255,255,0.95);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all .3s ease;
      backdrop-filter: blur(10px);
    }
    .video-card:hover .play-button { transform: scale(1.15); background: white; }
    .play-button svg { width: 38px; height: 38px; margin-left: 6px; fill: #10b981; }

    #risingStarBadge{position:absolute;top:30px;right:30px;width:140px;height:140px;z-index:30;opacity:0;transform:scale(0) rotate(-20deg);transition:all .8s cubic-bezier(0.175,0.885,0.32,1.4)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(10deg)}

    .like-btn.liked{ color:#ef4444; filter: drop-shadow(0 0 10px #ef4444); }
    .comment-input:focus, .name-input:focus { outline:none; border-color:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,0.2); }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star">
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <div class="text-center md:text-left">
        <h1 id="artistName" class="text-6xl md:text-8xl font-black text-gray-900 drop-shadow-lg">Loading...</h1>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <!-- LIVE SECTION – REDUCED 25% IN HEIGHT -->
    <div id="liveSection" class="mb-20 hidden">
      <div class="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-3xl shadow-2xl p-8 border-8 border-emerald-600">
        <div class="grid md:grid-cols-3 gap-8">
          <div class="md:col-span-2">
            <div id="livePlayer" class="hidden">
              <!-- Reduced from 660 → 495 (~25% shorter) -->
              <iframe id="liveIframe" width="100%" height="495" frameborder="0" allowfullscreen class="rounded-3xl shadow-2xl"></iframe>
              <div class="text-center mt-4">
                <span class="live-dot"></span>
                <span class="text-4xl font-black text-red-500 ml-4">LIVE NOW</span>
              </div>
            </div>
            <div id="offlinePlaceholder" class="bg-gradient-to-br from-slate-900 to-black rounded-3xl h-96 md:h-[495px] flex items-center justify-center text-center p-10">
              <div>
                <h2 class="text-6xl md:text-8xl font-black text-emerald-400 mb-6">LIVE STREAM</h2>
                <p class="text-3xl text-gray-300">The artist is not live right now.</p>
                <p class="text-xl text-gray-500 mt-4">Check out their videos below</p>
              </div>
            </div>
          </div>
          <div class="bg-white rounded-3xl shadow-2xl p-6 flex flex-col h-96 md:h-[495px]">
            <h3 class="text-2xl font-black text-emerald-700 mb-4">Live Chat</h3>
            <div id="liveMessages" class="flex-1 overflow-y-auto space-y-3 bg-gray-50 rounded-xl p-4 text-sm">
              <p class="text-gray-500 italic text-center">Waiting for messages...</p>
            </div>
            <div class="mt-4 flex gap-2">
              <input type="text" id="liveChatInput" placeholder="Say something..." class="flex-1 px-4 py-3 rounded-xl border border-emerald-300 focus:border-emerald-600 comment-input">
              <button id="sendLiveMessage" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition transform hover:scale-105">
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- VIDEOS -->
    <div class="mb-20">
      <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center md:text-left">Videos</h2>
      <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10 max-w-7xl mx-auto">
      </div>
    </div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const params = new URLSearchParams(location.search);
    const idParam = params.get('id')?.trim().toLowerCase();
    if (!idParam) throw new Error("No ID");

    let profile = null;
    let artistUserId = null;
    let currentFanName = localStorage.getItem('rhythmDeckFanName') || null;
    let liveChannel = null;

    async function loadProfile() {
      const { data } = await supabase.from('profiles').select('id, name, bio, banner_url, logo_url, subdomain, plan').ilike('subdomain', idParam).maybeSingle();
      if (!data) {
        document.body.innerHTML = `<div class="text-center mt-32 p-16 bg-white rounded-3xl shadow-2xl max-w-2xl mx-auto"><h1 class="text-8xl font-black text-red-600 mb-8">Artist Not Found</h1><a href="index.html" class="bg-emerald-600 text-white px-12 py-6 rounded-2xl text-3xl font-black hover:bg-emerald-700 inline-block">Go Home</a></div>`;
        return;
      }
      profile = data; artistUserId = profile.id;
      document.title = `${profile.name || 'Artist'} • Rhythm Deck`;
      document.getElementById('artistName').textContent = profile.name || 'Artist';
      document.getElementById('artistBio').textContent = profile.bio || 'No bio yet.';

      if (profile.banner_url) {
        const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl;
        document.getElementById('banner').src = url;
        document.getElementById('banner').classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      }
      if (profile.logo_url) document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl;

      if (profile.plan === 'pro') {
        document.getElementById('liveSection').classList.remove('hidden');
        checkLiveStatus(); setupRealtimeListener(); setupLiveChat();
      }
      await loadVideos();
    }

    // Live functions unchanged
    function setupRealtimeListener() {
      supabase.channel('live_streams')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'live_streams', filter: `user_id=eq.${artistUserId}` }, payload => {
          payload.new?.stream_key ? goLive(payload.new.stream_key) : goOffline();
        })
        .subscribe();
    }
    async function checkLiveStatus() {
      const { data } = await supabase.from('live_streams').select('stream_key').eq('user_id', artistUserId).single();
      data?.stream_key ? goLive(data.stream_key) : goOffline();
    }
    function goLive(k) { document.getElementById('offlinePlaceholder').style.display='none'; document.getElementById('livePlayer').classList.remove('hidden'); document.getElementById('liveIframe').src=`https://livepeervideo.com/player?stream=${k}`; }
    function goOffline() { document.getElementById('livePlayer').classList.add('hidden'); document.getElementById('offlinePlaceholder').style.display='flex'; document.getElementById('liveIframe').src=''; }
    function setupLiveChat() {
      liveChannel = supabase.channel(`live_chat_${artistUserId}`);
      liveChannel.on('broadcast', { event: 'message' }, ({ payload }) => {
        const div = document.createElement('div');
        div.className = 'bg-emerald-50 rounded-xl p-3 border border-emerald-200';
        div.innerHTML = `<p class="font-bold text-emerald-800">${payload.name}</p><p class="text-sm">${payload.message}</p>`;
        document.getElementById('liveMessages').appendChild(div);
        div.scrollIntoView({ behavior: 'smooth' });
      }).subscribe();

      document.getElementById('sendLiveMessage').onclick = () => {
        const input = document.getElementById('liveChatInput');
        const msg = input.value.trim();
        if (!msg || !currentFanName) return;
        liveChannel.send({ type: 'broadcast', event: 'message', payload: { name: currentFanName, message: msg } });
        input.value = '';
      };
      document.getElementById('liveChatInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('sendLiveMessage').click(); });
    }

    async function loadVideos() {
      const { data: videos } = await supabase.from('user_videos').select('*').eq('user_id', artistUserId).order('created_at', { ascending: false });
      const list = document.getElementById('videoList');
      list.innerHTML = '<p class="col-span-full text-center text-4xl text-gray-600 font-medium">Loading videos...</p>';

      if (!videos || videos.length === 0) {
        list.innerHTML = '<p class="col-span-full text-center text-5xl text-gray-600 font-medium">No videos yet</p>';
        return;
      }

      let html = '';
      for (const v of videos) {
        const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
        const thumbUrl = v.thumbnail_url ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'logo-placeholder.png';
        const [likesRes, commentsRes] = await Promise.all([
          supabase.from('video_likes').select('id', { count: 'exact', head: true }).eq('video_id', v.id),
          supabase.from('video_comments').select('name, comment, created_at').eq('video_id', v.id).order('created_at', { ascending: false }).limit(3)
        ]);
        const likeCount = likesRes.count || 0;
        const comments = commentsRes.data || [];

        html += `
          <div class="video-card" data-video-url="${videoUrl}" data-video-id="${v.id}">
            <div class="thumbnail-container">
              <img src="${thumbUrl}" alt="${v.title || 'Video'}" onerror="this.src='logo-placeholder.png'">
              <div class="play-overlay">
                <div class="play-button">
                  <svg viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z" fill="#10b981"/></svg>
                </div>
              </div>
            </div>
            <div class="p-6">
              <h3 class="font-black text-2xl text-emerald-900 text-center mb-4 line-clamp-2">${v.title || 'Untitled'}</h3>

              <div class="flex justify-between items-center mb-3 text-lg">
                <button class="like-btn flex items-center gap-2 font-bold ${likeCount > 0 ? 'liked' : 'text-gray-600'}">Heart ${likeCount}</button>
                <button class="share-btn text-emerald-600 font-bold">Share</button>
              </div>

              <div class="text-sm space-y-2 mb-4">
                ${comments.length === 0 ? '<p class="text-gray-500 italic">No comments yet</p>' : ''}
                ${comments.map(c => `<div class="bg-gray-50 rounded-lg p-2"><span class="font-bold text-emerald-700">${c.name}</span>: ${c.comment}</div>`).join('')}
              </div>

              <!-- TWO SEPARATE INPUTS: Name + Comment -->
              <div class="space-y-3">
                ${!currentFanName ? `
                  <input type="text" placeholder="Your name (required once)" class="name-input w-full px-4 py-3 rounded-xl border border-gray-300 text-sm focus:border-emerald-600">
                ` : ''}
                <div class="flex gap-2">
                  <input type="text" placeholder="Add a comment..." class="comment-input flex-1 px-4 py-3 rounded-xl border border-gray-300 text-sm" ${currentFanName ? '' : 'disabled'}>
                  <button class="post-comment bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition ${currentFanName ? '' : 'opacity-50 cursor-not-allowed'}" ${currentFanName ? '' : 'disabled'}>Post</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      list.innerHTML = html;

      if (profile.plan !== 'pro' && videos.length >= 3) document.getElementById('risingStarBadge').classList.add('show');

      // Handle Name Input (only once)
      document.querySelectorAll('.name-input').forEach(input => {
        const saveName = () => {
          const name = input.value.trim();
          if (name) {
            currentFanName = name;
            localStorage.setItem('rhythmDeckFanName', name);
            loadVideos(); // Refresh to remove name field
          }
        };
        input.addEventListener('keypress', e => { if (e.key === 'Enter') saveName(); });
        input.addEventListener('blur', saveName);
      });

      // Play, Like, Share, Post Comment – all working
      document.querySelectorAll('.video-card').forEach(card => { /* play modal */ });
      document.querySelectorAll('.like-btn').forEach(btn => { btn.onclick = async () => { if (!currentFanName) return alert("Enter your name first!"); /* like logic */ }; });
      document.querySelectorAll('.share-btn').forEach(btn => { btn.onclick = () => { /* share */ }; });
      document.querySelectorAll('.post-comment').forEach(btn => {
        const input = btn.previousElementSibling.querySelector('.comment-input');
        btn.onclick = async () => {
          if (!currentFanName || !input.value.trim()) return;
          await supabase.from('video_comments').insert({ video_id: btn.closest('.video-card').dataset.videoId, name: currentFanName, comment: input.value.trim() });
          input.value = '';
          loadVideos();
        };
      });
    }

    loadProfile();
  </script>
</body>
</html>
