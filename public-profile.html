<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Free Profile | Rhythm Deck</title>

  <!-- Scripts with defer to improve loading -->
  <script defer src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #10b981;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-left: 8px;
    }
    @keyframes spin { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .3s;
      cursor: pointer;
    }
    .video-overlay:hover { opacity: 1; }

    #videoModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all .3s;
    }
    #videoModal.show { opacity: 1; visibility: visible; }

    #modalVideo { max-width: 90%; max-height: 90%; border: 4px solid #10b981; border-radius: 12px; }

    #closeModal {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      color: black;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,0,0,.8);
      z-index: 10;
    }

    #badge-container { position: absolute; top: 16px; right: 16px; z-index: 30; }
    #badge-container img {
      width: 100px;
      height: 100px;
      filter: drop-shadow(0 0 20px rgba(255,255,255,.8));
      transition: all .4s ease;
    }
    #badge-container img:hover { transform: scale(1.25) rotate(15deg); }

    #successPopup {
      position: fixed; inset: 0; background: rgba(0,0,0,.8);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
      opacity: 0; visibility: hidden; pointer-events: none; transition: all .3s;
    }
    #successPopup.show { opacity: 1; visibility: visible; pointer-events: auto; }
    #successPopup .box {
      background: white; color: #10b981; padding: 2rem 3rem; border-radius: 1.5rem;
      text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,.3);
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

  <!-- Your full HTML structure - header, banner, sections, etc. -->
  <!-- I'm keeping only the critical parts here for brevity, -->
  <!-- but in your real file you should keep ALL sections -->

  <header class="bg-black text-white p-4 flex justify-between items-center shadow-lg">
    <!-- ... your header content ... -->
    <button id="logoutBtn">Logout</button>
  </header>

  <main class="flex-grow">
    <section class="relative h-[300px] bg-gradient-to-br from-purple-900 to-blue-900 overflow-hidden">
      <!-- banner content -->
      <input type="file" id="bannerInput" accept="image/*" class="hidden">
      <button id="changeBannerBtn" class="absolute bottom-4 right-4 bg-green-600 text-white px-5 py-3 rounded-lg hover:bg-green-700 font-bold shadow-lg flex items-center disabled:opacity-50" disabled>
        Upload Banner <span id="bannerSpinner" class="spinner hidden"></span>
      </button>

      <input type="file" id="logoInput" accept="image/*" class="hidden">
      <button id="changeLogoBtn" class="absolute bottom-4 left-40 bg-green-600 text-white px-5 py-3 rounded-lg hover:bg-green-700 font-bold shadow-lg text-sm flex items-center disabled:opacity-50" disabled>
        Change Logo <span id="logoSpinner" class="spinner hidden"></span>
      </button>
    </section>

    <!-- ... all other sections: upgrade, profile inputs, video upload, video list, danger zone ... -->
  </main>

  <!-- Success & Video Modal -->
  <div id="successPopup" class="fixed inset-0 ...">
    <!-- ... -->
  </div>

  <div id="videoModal" class="fixed inset-0 ...">
    <!-- ... -->
  </div>

  <script>
    // Wait for all deferred scripts to load before running
    window.addEventListener('load', async () => {
      lucide.createIcons();

      const sb = supabase.createClient(
        "https://bxoqhmfnseskwqkywppg.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
      );

      let currentUser = null;

      function showSuccess(msg) {
        document.getElementById('successMessage').textContent = msg;
        document.getElementById('successPopup').classList.add('show');
      }

      // 1. Auth check + redirect if needed
      const { data: { user }, error: authError } = await sb.auth.getUser();

      if (authError || !user) {
        console.warn("No authenticated user");
        window.location.href = "/login.html"; // ← adjust path if needed
        return;
      }

      currentUser = user;
      console.log("Logged in as:", user.email);

      // 2. Now safe to attach file input listeners
      document.getElementById('changeBannerBtn').onclick = () => {
        document.getElementById('bannerInput').click();
      };

      document.getElementById('bannerInput').onchange = async e => {
        const file = e.target.files?.[0];
        if (!file) return;

        const btn = document.getElementById('changeBannerBtn');
        btn.disabled = true;
        document.getElementById('bannerSpinner').classList.remove('hidden');

        try {
          const path = `banners/${currentUser.id}_${Date.now()}.${file.name.split('.').pop()}`;
          const { error: uploadErr } = await sb.storage.from('media').upload(path, file, { upsert: true });
          if (uploadErr) throw uploadErr;

          const { error: updateErr } = await sb.from('profiles').update({ banner_url: path }).eq('id', currentUser.id);
          if (updateErr) throw updateErr;

          const { data: { publicUrl } } = sb.storage.from('media').getPublicUrl(path);
          document.getElementById('bannerPreview').src = publicUrl + '?t=' + Date.now();
          document.getElementById('bannerPreview').classList.remove('hidden');
          document.getElementById('bannerPlaceholder').classList.add('hidden');

          showSuccess("Banner uploaded!");
        } catch (err) {
          alert("Banner upload failed:\n" + err.message);
          console.error(err);
        } finally {
          btn.disabled = false;
          document.getElementById('bannerSpinner').classList.add('hidden');
          e.target.value = '';
        }
      };

      // ── Same pattern for logo ────────────────────────────────────────
      document.getElementById('changeLogoBtn').onclick = () => {
        document.getElementById('logoInput').click();
      };

      document.getElementById('logoInput').onchange = async e => {
        const file = e.target.files?.[0];
        if (!file) return;

        const btn = document.getElementById('changeLogoBtn');
        btn.disabled = true;
        document.getElementById('logoSpinner').classList.remove('hidden');

        try {
          const path = `logos/${currentUser.id}_${Date.now()}.${file.name.split('.').pop()}`;
          const { error: uploadErr } = await sb.storage.from('media').upload(path, file, { upsert: true });
          if (uploadErr) throw uploadErr;

          const { error: updateErr } = await sb.from('profiles').update({ logo_url: path }).eq('id', currentUser.id);
          if (updateErr) throw updateErr;

          const { data: { publicUrl } } = sb.storage.from('media').getPublicUrl(path);
          document.getElementById('logoPreview').src = publicUrl + '?t=' + Date.now();

          showSuccess("Logo uploaded!");
        } catch (err) {
          alert("Logo upload failed:\n" + err.message);
          console.error(err);
        } finally {
          btn.disabled = false;
          document.getElementById('logoSpinner').classList.add('hidden');
          e.target.value = '';
        }
      };

      // Enable buttons
      document.querySelectorAll('#changeBannerBtn, #changeLogoBtn').forEach(b => b.disabled = false);

      // You can now also load profile data, videos, badge, etc.
      // loadProfile();
      // loadVideos();
      // etc...
    });
  </script>
</body>
</html>
