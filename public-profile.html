<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .live-dot {display:inline-block;width:16px;height:16px;background:#ef4444;border-radius:50%;animation:pulse 1.8s infinite;box-shadow:0 0 20px #ef4444}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .video-card{position:relative;overflow:hidden;border-radius:1.5rem;box-shadow:0 20px 40px rgba(0,0,0,0.15);transition:all .4s ease;cursor:pointer}
    .video-card:hover{transform:translateY(-12px) scale(1.03);box-shadow:0 30px 60px rgba(0,0,0,0.3)}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(16,185,129,0.95);border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
    .play-button svg{width:40px;height:40px;margin-left:6px;color:white}
    #risingStarBadge{position:absolute;top:30px;right:30px;width:140px;height:140px;z-index:30;opacity:0;transform:scale(0) rotate(-20deg);transition:all .8s cubic-bezier(0.175,0.885,0.32,1.4)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(10deg)}
    #livePlayer{border:8px solid #10b981;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(16,185,129,0.4)}
    #offlinePlaceholder{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      border:8px solid #10b981;
      border-radius:24px;
      min-height:560px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      color:white;text-align:center;padding:40px;
      box-shadow:0 20px 60px rgba(16,185,129,0.3);
    }
    .like-btn.liked{ color:#ef4444; filter: drop-shadow(0 0 10px #ef4444); }
    .comment-input:focus{ outline:none; border-color:#10b981; box-shadow:0 0 0 3px rgba(16,185,129,0.2); }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">
  <!-- Your HTML (unchanged) -->
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star">
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <div class="text-center md:text-left">
        <h1 id="artistName" class="text-6xl md:text-8xl font-black text-gray-900 drop-shadow-lg">Loading...</h1>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <div id="liveSection" class="mb-20 hidden">
      <div id="livePlayer" class="hidden">
        <iframe id="liveIframe" width="100%" height="600" frameborder="0" allowfullscreen class="rounded-3xl"></iframe>
        <div class="text-center mt-6">
          <span class="live-dot"></span>
          <span class="text-4xl font-black text-red-500 ml-4">LIVE NOW • JOIN THE STREAM</span>
        </div>
      </div>
      <div id="offlinePlaceholder">
        <h2 class="text-8xl md:text-9xl font-black mb-6 leading-tight text-emerald-400 tracking-tighter">LIVE STREAM</h2>
        <p class="text-4xl md:text-5xl text-gray-300 font-bold mb-10">The artist is not live right now.</p>
        <div class="text-8xl animate-bounce mt-16">Down Arrow</div>
        <p class="text-2xl text-gray-400 mt-8">Check out their videos below</p>
      </div>
    </div>

    <div class="mb-20">
      <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center md:text-left">Videos</h2>
      <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        <p class="col-span-full text-center text-3xl text-gray-500 font-medium">Loading videos...</p>
      </div>
    </div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const params = new URLSearchParams(location.search);
    const idParam = params.get('id')?.trim().toLowerCase();
    if (!idParam) {
      document.body.innerHTML = '<h1 class="text-center mt-32 text-8xl font-black text-red-600">Invalid Link</h1>';
      throw new Error("No ID");
    }

    let profile = null;
    let artistUserId = null;
    let currentFanName = "Fan";

    // Ask once after page loads
    setTimeout(() => {
      const name = prompt("Enter your name to like & comment (or leave blank):");
      if (name?.trim()) currentFanName = name.trim();
    }, 500);

    async function loadProfile() {
      const { data } = await supabase
        .from('profiles')
        .select('id, name, bio, banner_url, logo_url, subdomain, plan')
        .ilike('subdomain', idParam)
        .maybeSingle();

      if (!data) {
        document.body.innerHTML = `<div class="text-center mt-32 p-16 bg-white rounded-3xl shadow-2xl max-w-2xl mx-auto"><h1 class="text-8xl font-black text-red-600 mb-8">Artist Not Found</h1><a href="index.html" class="bg-emerald-600 text-white px-12 py-6 rounded-2xl text-3xl font-black hover:bg-emerald-700 inline-block">Go Home</a></div>`;
        return;
      }

      profile = data;
      artistUserId = profile.id;

      document.title = `${profile.name || 'Artist'} • Rhythm Deck`;
      document.getElementById('artistName').textContent = profile.name || 'Artist';
      document.getElementById('artistBio').textContent = profile.bio || 'No bio yet.';  // ← FIXED TYPO

      if (profile.banner_url) {
        const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl;
        document.getElementById('banner').src = url;
        document.getElementById('banner').classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      }
      if (profile.logo_url) {
        document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl;
      }

      if (profile.plan === 'pro') {
        document.getElementById('liveSection').classList.remove('hidden');
        checkLiveStatus();
        setupRealtimeListener();
      }

      await loadVideos();
    }

    function setupRealtimeListener() {
      supabase.channel('live_streams')
        .on('postgres_changes', {
          event: '*', schema: 'public', table: 'live_streams',
          filter: `user_id=eq.${artistUserId}`
        }, payload => {
          payload.new?.stream_key ? goLive(payload.new.stream_key) : goOffline();
        })
        .subscribe();
    }

    async function checkLiveStatus() {
      const { data } = await supabase.from('live_streams').select('stream_key').eq('user_id', artistUserId).single();
      data?.stream_key ? goLive(data.stream_key) : goOffline();
    }

    function goLive(streamKey) {
      document.getElementById('offlinePlaceholder').style.display = 'none';
      document.getElementById('livePlayer').classList.remove('hidden');
      document.getElementById('liveIframe').src = `https://livepeervideo.com/player?stream=${streamKey}`;
    }

    function goOffline() {
      document.getElementById('livePlayer').classList.add('hidden');
      document.getElementById('offlinePlaceholder').style.display = 'flex';
      document.getElementById('liveIframe').src = '';
    }

    async function loadVideos() {
      const { data: videos } = await supabase
        .from('user_videos')
        .select('*')
        .eq('user_id', artistUserId)
        .order('created_at', { ascending: false });

      const list = document.getElementById('videoList');
      list.innerHTML = '<p class="col-span-full text-center text-3xl text-gray-500 font-medium">Loading videos...</p>';

      if (!videos || videos.length === 0) {
        list.innerHTML = '<p class="col-span-full text-center text-4xl text-gray-600 font-medium">No videos yet</p>';
        return;
      }

      let html = '';

      // ← FIXED: Build HTML first, then do all DB calls in parallel
      for (const v of videos) {
        const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
        const thumbUrl = v.thumbnail_url
          ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl
          : 'logo-placeholder.png';

        const [likesRes, commentsRes] = await Promise.all([
          supabase.from('video_likes').select('id', { count: 'exact', head: true }).eq('video_id', v.id),
          supabase.from('video_comments').select('name, comment, created_at').eq('video_id', v.id).order('created_at', { ascending: false })
        ]);

        const likeCount = likesRes.count || 0;
        const comments = commentsRes.data || [];

        html += `
          <div class="video-card bg-white rounded-3xl overflow-hidden shadow-2xl" data-video-url="${videoUrl}" data-video-id="${v.id}">
            <div class="relative">
              <img src="${thumbUrl}" class="w-full h-80 object-cover" onerror="this.src='logo-placeholder.png'">
              <div class="play-overlay">
                <div class="play-button">
                  <svg fill="currentColor" viewBox="0 0 20 20"><path d="M8 5v10l7-5-7-5z"/></svg>
                </div>
              </div>
            </div>
            <div class="p-6">
              <p class="font-black text-3xl text-emerald-900 text-center mb-6">${v.title || 'Untitled'}</p>

              <div class="flex justify-between items-center border-b border-gray-200 pb-4 mb-4">
                <button class="like-btn flex items-center gap-2 text-2xl font-bold ${likeCount > 0 ? 'liked' : 'text-gray-600'}">
                  Heart ${likeCount}
                </button>
                <button class="share-btn text-emerald-600 font-bold text-xl flex items-center gap-2">
                  Share Share
                </button>
              </div>

              <div class="space-y-3 max-h-60 overflow-y-auto mb-4">
                ${comments.length === 0 ? '<p class="text-gray-500 italic">No comments yet. Be the first!</p>' : ''}
                ${comments.map(c => `
                  <div class="bg-gray-50 rounded-xl p-3">
                    <p class="font-bold text-emerald-700">${c.name}</p>
                    <p class="text-sm text-gray-600">${new Date(c.created_at).toLocaleString()}</p>
                    <p class="mt-1">${c.comment}</p>
                  </div>
                `).join('')}
              </div>

              <div class="flex gap-2">
                <input type="text" placeholder="Add a comment..." class="comment-input flex-1 px-4 py-3 rounded-xl border border-gray-300 text-sm">
                <button class="post-comment bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition transform hover:scale-105">
                  Post
                </button>
              </div>
            </div>
          </div>`;
      }

      list.innerHTML = html;

      // Rising Star Badge
      if (profile.plan !== 'pro' && videos.length >= 3) {
        document.getElementById('risingStarBadge').classList.add('show');
      }

      // === EVENT LISTENERS (safe now) ===
      document.querySelectorAll('.video-card .play-overlay, .video-card img').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const card = el.closest('.video-card');
          const videoUrl = card.dataset.videoUrl;
          const modal = document.createElement('div');
          modal.className = 'fixed inset-0 bg-black bg-opacity-95 z-50 flex items-center justify-center p-8';
          modal.innerHTML = `
            <video controls autoplay class="max-w-full max-h-full rounded-3xl shadow-2xl border-8 border-emerald-500">
              <source src="${videoUrl}" type="video/mp4">
            </video>
            <button class="absolute top-8 right-8 text-white text-8xl hover:text-gray-400 font-thin">×</button>
          `;
          modal.querySelector('button').onclick = () => modal.remove();
          document.body.appendChild(modal);
        };
      });

      document.querySelectorAll('.like-btn').forEach(btn => {
        btn.onclick = async () => {
          const videoId = btn.closest('.video-card').dataset.videoId;
          await supabase.from('video_likes').insert({ video_id: videoId, fan_name: currentFanName });
          const count = parseInt(btn.textContent.match(/\d+/)?.[0] || 0) + 1;
          btn.innerHTML = `Heart ${count}`;
          btn.classList.add('liked');
        };
      });

      document.querySelectorAll('.share-btn').forEach(btn => {
        btn.onclick = () => {
          const videoId = btn.closest('.video-card').dataset.videoId;
          const url = location.href.split('#')[0] + `#video-${videoId}`;
          navigator.clipboard.writeText(url);
          alert("Link copied to clipboard!");
        };
      });

      document.querySelectorAll('.post-comment').forEach(btn => {
        const input = btn.previousElementSibling;
        btn.onclick = async () => {
          const comment = input.value.trim();
          if (!comment) return;
          const videoId = btn.closest('.video-card').dataset.videoId;
          await supabase.from('video_comments').insert({
            video_id: videoId,
            name: currentFanName,
            comment: comment
          });
          input.value = '';
          loadVideos(); // Refresh with new comment
        };
      });
    }

    loadProfile();
  </script>
</body>
</html>
