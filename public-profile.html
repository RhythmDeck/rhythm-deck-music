<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .video-card{border-radius:1.5rem;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.15);transition:.4s;background:white;position:relative}
    .video-card::before{content:'';position:absolute;inset:-8px;border-radius:1.75rem;background:linear-gradient(45deg,#10b981,#34d399,#6ee7b7);z-index:-1;filter:blur(12px);opacity:.8}
    .video-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 30px 60px rgba(0,0,0,.3)}
    .thumbnail-container{position:relative;padding-top:56.25%;background:#000;cursor:pointer;overflow:hidden}
    .thumbnail-container img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:.4s}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(255,255,255,.95);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .play-button svg{width:38px;height:38px;margin-left:6px;fill:#10b981}
    .like-btn{display:flex;align-items:center;gap:8px;font-weight:bold;color:#666;cursor:pointer;transition:all .3s}
    .like-btn.liked{color:#ef4444;filter:drop-shadow(0 0 12px #ef4444)}
    .like-btn.liked svg{fill:#ef4444;stroke:#ef4444}
    #risingStarBadge{position:absolute;top:30px;right:30px;width:140px;height:140px;z-index:30;opacity:0;transform:scale(0) rotate(-20deg);transition:all .8s cubic-bezier(.175,.885,.32,1.4)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(10deg)}
    #artistName{color:#fff;text-shadow:0 4px 20px #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}
    #videoModal{position:fixed;inset:0;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;visibility:hidden;transition:.4s}
    #videoModal.show{opacity:1;visibility:visible}
    #modalVideo{max-width:90%;max-height:85vh;border-radius:16px;box-shadow:0 0 60px rgba(16,185,129,.6);border:8px solid #10b981}
    .comment-input{border:2px solid #10b981;border-radius:12px;padding:10px;background:#f9fafb;width:100%}
    .comment-input:focus{border-color:#059669;outline:none}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star">
  </div>
  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
    </div>
    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>
    <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center">Videos</h2>
    <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
  </div>
  <div id="videoModal">
    <div onclick="closeVideo()" class="fixed top-8 right-8 w-16 h-16 bg-white text-black rounded-full text-4xl font-bold flex items-center justify-center cursor-pointer z-50">X</div>
    <video id="modalVideo" controls autoplay class="max-w-[95%] max-h-[90vh] rounded-2xl shadow-2xl"></video>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    )

    const params = new URLSearchParams(location.search)
    const subdomain = params.get('id')?.trim().toLowerCase()
    if (!subdomain) {
      document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Invalid Link</div>'
      throw ''
    }

    let artistId = null
    let isFreePlan = false

    async function init() {
      const { data: profile, error } = await supabase
        .from('profiles')
        .select('id, name, bio, banner_url, logo_url, plan')
        .eq('subdomain', subdomain)
        .single()

      if (error || !profile) {
        document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Artist Not Found</div>'
        return
      }

      artistId = profile.id
      isFreePlan = (profile.plan || 'free') === 'free'

      document.title = `${profile.name || 'Artist'} • Rhythm Deck`
      document.getElementById('artistName').textContent = profile.name || 'Artist'

      // FIXED BIO — works for empty, null, line breaks, Free & Pro
      const bioElement = document.getElementById('artistBio')
      const bioText = profile.bio?.trim()
      bioElement.textContent = bioText || "This artist hasn't written a bio yet."
      if (bioText) {
        bioElement.innerHTML = bioElement.innerHTML.replace(/\n/g, '<br>')
      }

      // Banner
      if (profile.banner_url) {
        const { data } = supabase.storage.from('media').getPublicUrl(profile.banner_url)
        const banner = document.getElementById('banner')
        banner.src = data.publicUrl + '?t=' + Date.now()
        banner.classList.remove('hidden')
        document.getElementById('bannerPlaceholder').classList.add('hidden')
      }

      // Logo
      if (profile.logo_url) {
        document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl + '?t=' + Date.now()
      }

      // Rising Star Badge (Free plan only, 3+ videos)
      if (isFreePlan) {
        const { count } = await supabase.from('user_videos').select('*', { count: 'exact', head: true }).eq('user_id', profile.id)
        if (count >= 3) {
          document.getElementById('risingStarBadge').classList.add('show')
        }
      }

      loadVideos()
    }

    async function loadVideos() {
      const { data: videos } = await supabase.from('user_videos').select('*').eq('user_id', artistId).order('created_at', { ascending: false })
      const list = document.getElementById('videoList')
      list.innerHTML = videos?.length ? '' : '<p class="col-span-full text-center text-5xl text-gray-500 py-20">No videos yet</p>'

      for (const v of (videos || [])) {
        const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl
        const thumb = v.thumbnail_url ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'https://via.placeholder.com/600x338/10b981/ffffff?text=No+Thumb'
        const { count: likes = 0 } = await supabase.from('video_likes').select('*', { count: 'exact', head: true }).eq('video_id', v.id)
        const { data: comments = [] } = await supabase.from('video_comments').select('name, comment').eq('video_id', v.id).order('created_at', { ascending: false })

        const commentsHTML = comments.length === 0
          ? '<p class="text-gray-500 italic text-center">Be the first to comment!</p>'
          : comments.map(c => `<div><strong class="text-emerald-600">${c.name}:</strong> ${c.comment}</div>`).join('')

        list.innerHTML += `
          <div class="video-card">
            <div class="thumbnail-container" onclick="openVideo('${videoUrl}')">
              <img src="${thumb}" alt="thumb" onerror="this.src='https://via.placeholder.com/600x338/10b981/ffffff?text=No+Thumb'">
              <div class="play-overlay"><div class="play-button"><svg viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z" fill="#10b981"/></svg></div></div>
            </div>
            <div class="p-6">
              <h3 class="font-black text-2xl text-emerald-900 text-center mb-4">${v.title || 'Untitled Video'}</h3>
              <div class="flex justify-between items-center mb-4">
                <button class="like-btn ${likes > 0 ? 'liked' : ''}" data-video-id="${v.id}">
                  Heart <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                  <span class="font-bold">${likes}</span>
                </button>
                <button class="text-emerald-600 font-bold" onclick="navigator.clipboard.writeText('${videoUrl}'); alert('Copied!')">Share</button>
              </div>
              <div class="border-t pt-4 space-y-2 text-sm max-h-48 overflow-y-auto">${commentsHTML}</div>
              <div class="mt-4">
                <input type="text" placeholder="Your name" class="comment-input mb-2 w-full" id="name-${v.id}">
                <div class="flex gap-2">
                  <input type="text" placeholder="Write a comment..." class="comment-input flex-1" id="comment-${v.id}" onkeydown="if(event.key==='Enter') postComment(${v.id})">
                  <button data-video-id="${v.id}" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-lg">Post</button>
                </div>
              </div>
            </div>
          </div>`
      }

      // Like & Comment handlers
      document.querySelectorAll('.like-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.classList.contains('liked')) return
          const id = btn.dataset.videoId
          supabase.from('video_likes').insert({ video_id: id }).then(() => {
            btn.classList.add('liked')
            const span = btn.querySelector('span')
            span.textContent = Number(span.textContent) + 1
          })
        })
      })

      document.querySelectorAll('button[data-video-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.videoId
          const name = document.getElementById('name-' + id).value.trim()
          const comment = document.getElementById('comment-' + id).value.trim()
          if (!name || !comment) return alert('Name and comment required')
          supabase.from('video_comments').insert({ video_id: id, name, comment }).then(() => {
            document.getElementById('name-' + id).value = ''
            document.getElementById('comment-' + id).value = ''
            loadVideos()
          })
        })
      })
    }

    function openVideo(url) {
      document.getElementById('modalVideo').src = url
      document.getElementById('videoModal').classList.add('show')
    }

    function closeVideo() {
      document.getElementById('videoModal').classList.remove('show')
      document.getElementById('modalVideo').src = ''
    }

    window.openVideo = openVideo
    window.closeVideo = closeVideo
    document.getElementById('videoModal').addEventListener('click', e => e.target.id === 'videoModal' && closeVideo())
    document.addEventListener('keydown', e => e.key === 'Escape' && closeVideo())

    init()
  </script>
</body>
</html>
