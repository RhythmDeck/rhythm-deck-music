<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Public Profile | Rhythm Deck</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: system-ui, sans-serif; }

    #videoModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }

    #videoModal.show { display: flex; }

    #modalVideo {
      max-width: 95vw;
      max-height: 80vh;
      background: black;
      border-radius: 12px;
    }

    #closeModal {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10000;
    }
  </style>
</head>

<body class="bg-gray-50">

<!-- HEADER -->
<section class="relative h-72 bg-gradient-to-br from-purple-900 to-blue-900">
  <img id="banner" class="absolute inset-0 w-full h-full object-cover hidden">
  <div class="absolute bottom-6 left-6 w-32 h-32 bg-white rounded-full overflow-hidden border-8 border-white">
    <img id="logo" class="w-full h-full object-cover">
  </div>
</section>

<!-- PROFILE -->
<div class="max-w-4xl mx-auto text-center mt-20 px-6">
  <h1 id="name" class="text-5xl font-black text-emerald-600">Loading…</h1>
  <p id="bio" class="mt-4 text-gray-700 text-lg"></p>
</div>

<!-- LIVE STREAM / CHAT / TIPS -->
<section id="proFeaturesSection" class="hidden max-w-5xl mx-auto mt-16 px-6">
  <h2 class="text-3xl font-bold text-center mb-6">Live Stream</h2>

  <div class="bg-black rounded-xl overflow-hidden shadow-lg aspect-video flex items-center justify-center text-white">
    <span class="opacity-70">Live stream will appear here</span>
  </div>

  <div class="grid md:grid-cols-2 gap-6 mt-8">
    <div class="bg-white rounded-xl shadow p-4">
      <h3 class="font-bold mb-2">Live Chat</h3>
      <div class="h-48 bg-gray-100 rounded flex items-center justify-center text-gray-500">
        Chat coming soon
      </div>
    </div>

    <div id="tipBucketSection" class="hidden bg-white rounded-xl shadow p-4">
      <h3 class="font-bold mb-2">Tip the Artist ❤️</h3>
      <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg">
        Send a Tip
      </button>
    </div>
  </div>
</section>

<!-- VIDEOS -->
<section class="max-w-6xl mx-auto mt-20 px-6">
  <h2 class="text-4xl font-bold text-center mb-10">Videos</h2>
  <div id="videoList" class="grid md:grid-cols-3 gap-8"></div>
</section>

<!-- VIDEO MODAL -->
<div id="videoModal">
  <div id="closeModal">✕</div>
  <video id="modalVideo" controls></video>
</div>

<script>
/* ===============================
   SUPABASE CLIENT (SAFE)
================================ */
const sb = supabase.createClient(
  "https://bxoqhmfnseskwqkywppg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
);

/* ===============================
   URL PARAM
================================ */
const profileSlug = new URLSearchParams(window.location.search).get('id');

/* ===============================
   LOAD PROFILE
================================ */
async function loadProfile() {
  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .or(`id.eq.${profileSlug},subdomain.eq.${profileSlug}`)
    .single();

  if (error || !profile) {
    document.getElementById('name').innerText = 'Profile not found';
    return null;
  }

  document.getElementById('name').innerText = profile.name || 'Artist';
  document.getElementById('bio').innerText = profile.bio || '';

  if (profile.banner_url) {
    banner.src = sb.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl;
    banner.classList.remove('hidden');
  }

  if (profile.logo_url) {
    logo.src = sb.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl;
  }

  if (profile.plan === 'pro' || profile.plan === 'platinum') {
    document.getElementById('proFeaturesSection').classList.remove('hidden');
    if (profile.stripe_account_id) {
      document.getElementById('tipBucketSection').classList.remove('hidden');
    }
  }

  return profile.id;
}

/* ===============================
   LOAD VIDEOS
================================ */
async function loadVideos(userId) {
  const { data } = await sb
    .from('user_videos')
    .select('*')
    .eq('user_id', userId)
    .order('created_at', { ascending: false });

  const container = document.getElementById('videoList');
  container.innerHTML = '';

  if (!data || !data.length) {
    container.innerHTML = `<p class="col-span-full text-center text-gray-500">No videos yet.</p>`;
    return;
  }

  data.forEach(v => {
    const url = sb.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
    container.innerHTML += `
      <div class="bg-white rounded-xl shadow-lg overflow-hidden cursor-pointer" onclick="openVideo('${url}')">
        <img src="https://via.placeholder.com/400x225?text=Video" class="w-full h-56 object-cover">
        <div class="p-4 font-bold">${v.title || 'Untitled'}</div>
      </div>
    `;
  });
}

/* ===============================
   VIDEO MODAL
================================ */
function openVideo(url) {
  modalVideo.src = url;
  videoModal.classList.add('show');
}

closeModal.onclick = () => {
  modalVideo.pause();
  modalVideo.src = '';
  videoModal.classList.remove('show');
};

/* ===============================
   INIT
================================ */
(async () => {
  const userId = await loadProfile();
  if (userId) loadVideos(userId);
})();
</script>

</body>
</html>
