<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Public Profile | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;display:inline-block;}
    @keyframes spin {0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .video-overlay {position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;cursor:pointer}
    .video-overlay:hover {opacity:1}
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <div class="max-w-6xl mx-auto">
    <!-- Banner + Logo (exact same as profile-admin) -->
    <section class="relative h-[300px] bg-gradient-to-br from-purple-900 to-blue-900 overflow-hidden">
      <img id="banner" src="" alt="Banner" class="absolute inset-0 w-full h-full object-cover hidden">
      <div id="bannerPlaceholder" class="absolute inset-0 flex items-center justify-center text-white text-4xl font-bold opacity-70">
        Loading Banner...
      </div>
      <!-- Logo badge bottom-left -->
      <div class="absolute bottom-4 left-4 w-32 h-32 rounded-full border-8 border-white shadow-2xl overflow-hidden bg-white">
        <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-full h-full object-cover">
      </div>
    </section>

    <!-- Name (large) + Bio underneath -->
    <div class="max-w-4xl mx-auto px-4 py-12 text-center">
      <h1 id="name" class="text-5xl md:text-6xl font-black text-gray-900 mb-6">Loading...</h1>
      <p id="bio" class="text-xl text-gray-700 max-w-3xl mx-auto">Loading bio...</p>
    </div>

    <!-- Videos -->
    <section class="max-w-6xl mx-auto px-4 pb-20">
      <h2 class="text-4xl font-bold text-center mb-10">Videos</h2>
      <div id="videoList" class="grid md:grid-cols-3 gap-8">
        <p class="col-span-full text-center text-gray-600 py-12 text-xl">Loading videos...</p>
      </div>
    </section>
  </div>

  <script>
    const sb = supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadProfile() {
      if (!id) {
        document.getElementById('name').textContent = 'Profile not found';
        return;
      }

      // Try subdomain first, fallback to ID
      let { data: profile } = await sb
        .from('profiles')
        .select('name, bio, banner_url, logo_url')
        .eq('subdomain', id)
        .single();

      if (!profile) {
        const { data } = await sb
          .from('profiles')
          .select('name, bio, banner_url, logo_url')
          .eq('id', id)
          .single();
        profile = data;
      }

      if (!profile) {
        document.getElementById('name').textContent = 'Profile not found';
        return;
      }

      document.getElementById('name').textContent = profile.name || 'Artist';
      document.getElementById('bio').textContent = profile.bio || 'No bio yet';

      if (profile.banner_url) {
        const { data } = sb.storage.from('media').getPublicUrl(profile.banner_url);
        document.getElementById('banner').src = data.publicUrl + '?t=' + Date.now();
        document.getElementById('banner').classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      }

      if (profile.logo_url) {
        const { data } = sb.storage.from('media').getPublicUrl(profile.logo_url);

        document.getElementById('logo').src = data.publicUrl + '?t=' + Date.now();
      }
    }

    async function loadVideos() {
      const container = document.getElementById('videoList');
      container.innerHTML = '<p class="col-span-full text-center py-12 text-xl text-gray-600">Loading videos...</p>';

      let { data: profile } = await sb
        .from('profiles')
        .select('id')
        .eq('subdomain', id)
        .single();

      if (!profile) {
        const { data } = await sb.from('profiles').select('id').eq('id', id).single();
        profile = data;
      }

      if (!profile) return container.innerHTML = '<p class="col-span-full text-center text-red-600 text-xl py-12">No videos available</p>';

      const { data: videos } = await sb
        .from('user_videos')
        .select('*')
        .eq('user_id', profile.id)
        .order('created_at', { ascending: false });

      if (!videos?.length) {
        container.innerHTML = '<p class="col-span-full text-center italic py-12 text-xl text-gray-600">No videos yet</p>';
        return;
      }

      container.innerHTML = '';
      for (const v of videos) {
        const videoUrl = sb.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
        const thumbUrl = v.thumbnail_url ? sb.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'https://via.placeholder.com/400x225?text=Video';

        const { count: likes } = await sb
          .from('video_likes')
          .select('*', { count: 'exact', head: true })
          .eq('video_id', v.id);

        const { data: comments } = await sb
          .from('video_comments')
          .select('name, comment, created_at')
          .eq('video_id', v.id)
          .order('created_at', { ascending: false });

        container.innerHTML += `
          <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="relative">
              <img src="${thumbUrl}" class="w-full h-64 object-cover">
              <div class="video-overlay" onclick="window.open('${videoUrl}', '_blank')">
                <svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z"/></svg>
              </div>
            </div>
            <div class="p-5">
              <h4 class="font-bold text-xl truncate">${v.title || 'Untitled'}</h4>
              <div class="flex justify-between items-center mt-4">
                <button class="flex items-center gap-3 text-2xl font-bold hover:text-red-600 transition" onclick="likeVideo('${v.id}', this)">
                  ❤️ ${likes || 0}
                </button>
                <button onclick="navigator.clipboard.writeText('${videoUrl}'); alert('Link copied!')" class="text-green-600 font-bold hover:text-green-700 text-lg">
                  Share
                </button>
              </div>

              <!-- Comments -->
              <div class="mt-6 border-t pt-4">
                <h5 class="font-bold mb-3">Comments</h5>
                ${comments.length === 0 ? '<p class="text-gray-500 italic">No comments yet</p>' : ''}
                ${comments.map(c => `<div class="mb-3"><strong>${c.name}:</strong> ${c.comment}</div>`).join('')}
              </div>

              <!-- Comment form -->
              <div class="mt-4">
                <input type="text" id="commentName-${v.id}" placeholder="Your name" class="w-full p-2 border rounded mb-2">
                <textarea id="commentText-${v.id}" placeholder="Add a comment..." class="w-full p-2 border rounded mb-2" rows="2"></textarea>
                <button onclick="addComment('${v.id}')" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                  Post Comment
                </button>
              </div>
            </div>
          </div>`;
      }
    }

    async function likeVideo(videoId, button) {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return alert("Log in to like");

      const { data: existing } = await sb
        .from('video_likes')
        .select('id')
        .eq('video_id', videoId)
        .eq('user_id', user.id)
        .single();

      if (existing) {
        await sb.from('video_likes').delete().eq('id', existing.id);
      } else {
        await sb.from('video_likes').insert({ video_id: videoId, user_id: user.id });
      }

      loadVideos(); // refresh count
    }

    async function addComment(videoId) {
      const name = document.getElementById(`commentName-${videoId}`).value.trim();
      const comment = document.getElementById(`commentText-${videoId}`).value.trim();
      if (!name || !comment) return alert("Name and comment required");

      await sb.from('video_comments').insert({
        video_id: videoId,
        name,
        comment
      });

      document.getElementById(`commentName-${videoId}`).value = '';
      document.getElementById(`commentText-${videoId}`).value = '';
      loadVideos(); // refresh comments
    }

    window.addEventListener('load', () => {
      loadProfile();
      loadVideos();
    });
  </script>
</body>
</html>
