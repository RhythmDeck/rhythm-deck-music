<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .live-dot{display:inline-block;width:16px;height:16px;background:#ef4444;border-radius:50%;animation:pulse 1.8s infinite;box-shadow:0 0 20px #ef4444}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .video-card{
      border-radius:1.5rem;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.15);
      transition:all .4s;background:white;position:relative;
      border:4px solid transparent;background-clip:padding-box;
    }
    .video-card::before{
      content:'';position:absolute;inset:-8px;border-radius:1.75rem;
      background:linear-gradient(45deg,#10b981,#34d399,#6ee7b7);z-index:-1;
      filter:blur(12px);opacity:0.8;animation:glow 4s infinite alternate;
    }
    @keyframes glow{0%{opacity:0.7;transform:scale(1)}100%{opacity:1;transform:scale(1.02)}}
    .video-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 30px 60px rgba(0,0,0,0.3)}
    .thumbnail-container{position:relative;width:100%;padding-top:56.25%;overflow:hidden;background:#000;cursor:pointer}
    .thumbnail-container img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
    .video-card:hover .thumbnail-container img{transform:scale(1.08)}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(255,255,255,0.95);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition:all .3s;backdrop-filter:blur(10px)}
    .video-card:hover .play-button{transform:scale(1.15);background:white}
    .play-button svg{width:38px;height:38px;margin-left:6px;fill:#10b981}
    #risingStarBadge{position:absolute;top:30px;right:30px;width:140px;height:140px;z-index:30;opacity:0;transform:scale(0) rotate(-20deg);transition:all .8s cubic-bezier(0.175,0.885,0.32,1.4)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(10deg)}
    .like-btn{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:1.15rem;color:#666;transition:all .3s;cursor:pointer}
    .like-btn:hover{color:#ef4444}
    .like-btn.liked{color:#ef4444}
    .like-btn.liked svg{fill:#ef4444;stroke:#ef4444;filter:drop-shadow(0 0 12px #ef4444)}
    .like-btn svg{width:28px;height:28px;transition:all .3s}
    .like-count{font-weight:bold;min-width:20px}
    .comment-bubble{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:1rem;padding:.75rem 1rem;margin-bottom:.5rem;transition:all .3s}
    .comment-name{font-weight:700;color:#10b981;text-shadow:0 0 8px rgba(16,185,129,0.4)}
    .comment-text{color:#1f2937;margin-left:.5rem;font-weight:500}
    #artistName{color:#ffffff !important;text-shadow:0 4px 20px rgba(0,0,0,0.8);-webkit-text-stroke:2px black;paint-order:stroke fill}

    /* MODAL STYLES — CLEAN & FULL SCREEN */
    #videoModal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }
    #videoModal.show {
      opacity: 1;
      visibility: visible;
    }
    #modalVideo {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.6);
      border: 8px solid #10b981;
    }
    #closeModalBtn {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 70px;
      height: 70px;
      background: white;
      color: black;
      border-radius: 50%;
      font-size: 42px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 10000;
      transition: all 0.3s;
    }
    #closeModalBtn:hover {
      transform: scale(1.15);
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">
  <!-- [Your existing header/banner code — unchanged] -->
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star">
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <div class="text-center md:text-left">
        <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <!-- LIVE STREAM SECTION (unchanged) -->
    <div id="liveStreamSection" class="hidden mb-20">...</div>

    <!-- Videos -->
    <div class="mb-20">
      <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center md:text-left">Videos</h2>
      <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
    </div>
  </div>

  <!-- CUSTOM VIDEO MODAL -->
  <div id="videoModal">
    <div id="closeModalBtn" onclick="closeVideo()">X</div>
    <video id="modalVideo" controls autoplay controlsList="nodownload noplaybackrate"></video>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const params = new URLSearchParams(location.search);
    const idParam = params.get('id')?.trim().toLowerCase();
    if (!idParam) {
      document.body.innerHTML = `<div class="text-center mt-32"><h1 class="text-8xl font-black text-red-600">Invalid Link</h1><a href="/" class="mt-8 inline-block bg-emerald-600 text-white px-12 py-6 rounded-2xl text-3xl font-black">Go Home</a></div>`;
      throw new Error();
    }

    let profile = null;
    let artistUserId = null;
    let currentFanName = localStorage.getItem('rhythmDeckFanName') || '';

    async function loadProfile() {
      const { data, error } = await supabase
        .from('profiles')
        .select('id, name, bio, banner_url, logo_url, subdomain, plan, is_live, live_stream_url')
        .ilike('subdomain', idParam)
        .single();

      if (error || !data) {
        document.body.innerHTML = `<div class="text-center mt-32 p-16 bg-white rounded-3xl shadow-2xl max-w-2xl mx-auto"><h1 class="text-8xl font-black text-red-600 mb-8">Artist Not Found</h1><a href="/" class="bg-emerald-600 text-white px-12 py-6 rounded-2xl text-3xl font-black hover:bg-emerald-700">Go Home</a></div>`;
        return;
      }

      profile = data;
      artistUserId = profile.id;
      document.title = `${profile.name || 'Artist'} • Rhythm Deck`;
      document.getElementById('artistName').textContent = profile.name || 'Artist';
      document.getElementById('artistBio').textContent = profile.bio || 'No bio yet.';

      if (profile.banner_url) {
        const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl + '?t=' + Date.now();
        document.getElementById('banner').src = url;
        document.getElementById('banner').classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      }
      if (profile.logo_url) {
        document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl + '?t=' + Date.now();
      }

      if (profile.plan === 'pro') {
        document.getElementById('liveStreamSection').classList.remove('hidden');
        if (profile.is_live && profile.live_stream_url) {
          document.getElementById('livePlayer').classList.remove('hidden');
          document.getElementById('offlinePlaceholder').classList.add('hidden');
          let url = profile.live_stream_url.trim();
          if (url.includes('youtube.com') || url.includes('youtu.be')) url = url.replace('watch?v=', 'embed/').split('&')[0] + '?autoplay=1&mute=0';
          else if (url.includes('twitch.tv')) { const ch = url.split('/').pop(); url = `https://player.twitch.tv/?channel=${ch}&parent=${location.hostname}&autoplay=true`; }
          document.getElementById('liveIframe').src = url;
          loadLiveChat();
          setInterval(loadLiveChat, 4000);
        }
      }

      await loadVideos();
    }

    // Your existing loadLiveChat, sendLiveMessage, etc. — unchanged

    async function loadVideos() {
      if (!artistUserId) return;
      const { data: videos } = await supabase.from('user_videos').select('*').eq('user_id', artistUserId).order('created_at', { ascending: false });
      const list = document.getElementById('videoList');
      list.innerHTML = '';

      if (!videos || !videos.length) {
        list.innerHTML = '<p class="col-span-full text-center text-5xl text-gray-600 py-20">No videos yet</p>';
        return;
      }

      for (const v of videos) {
        const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl + '?t=' + Date.now();
        const thumbUrl = v.thumbnail_url ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl + '?t=' + Date.now() : 'https://via.placeholder.com/600x338/10b981/ffffff?text=No+Thumbnail';

        const card = document.createElement('div');
        card.className = 'video-card';
        card.dataset.videoUrl = videoUrl;
        card.dataset.videoId = v.id;
        card.innerHTML = `
          <div class="thumbnail-container" onclick="openVideo('${videoUrl}')">
            <img src="${thumbUrl}" alt="${v.title || 'Video'}" onerror="this.src='https://via.placeholder.com/600x338/10b981/ffffff?text=No+Thumbnail'">
            <div class="play-overlay"><div class="play-button"><svg viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z" fill="#10b981"/></svg></div></div>
          </div>
          <div class="p-6">
            <h3 class="font-black text-2xl text-emerald-900 text-center mb-4">${v.title || 'Untitled Video'}</h3>
            <!-- Your Heart button, comments, etc. — unchanged -->
          </div>
        `;
        list.appendChild(card);
      }

      // Like, comment, share logic — unchanged
    }

    // NEW CLEAN VIDEO MODAL
    function openVideo(url) {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('modalVideo');
      video.src = url;
      modal.classList.add('show');
      video.play();
    }

    function closeVideo() {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('modalVideo');
      modal.classList.remove('show');
      video.pause();
      video.src = '';
    }

    // Close on background click or Escape
    document.getElementById('videoModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('videoModal')) closeVideo();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeVideo();
    });

    loadProfile();
  </script>
</body>
</html>
