<!DOCTYPE html>
<html lang="en" class="transition-all duration-500">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .live-dot {display:inline-block;width:16px;height:16px;background:#ef4444;border-radius:50%;animation:pulse 1.8s infinite;box-shadow:0 0 20px #ef4444}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
   
    .video-card {
      border-radius: 1.5rem; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      transition: all .4s ease; background: white;
    }
    .video-card:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 30px 60px rgba(0,0,0,0.3); }
    .thumbnail-container { position: relative; width: 100%; padding-top: 56.25%; overflow: hidden; background: #000; }
    .thumbnail-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
    .video-card:hover .thumbnail-container img { transform: scale(1.08); }
    .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .4s ease; }
    .video-card:hover .play-overlay { opacity: 1; }
    .play-button { width: 90px; height: 90px; background: rgba(255,255,255,0.95); border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all .3s ease; backdrop-filter: blur(10px); }
    .video-card:hover .play-button { transform: scale(1.15); background: white; }
    .play-button svg { width: 38px; height: 38px; margin-left: 6px; fill: #10b981; }
    #risingStarBadge{position:absolute;top:30px;right:30px;width:140px;height:140px;z-index:30;opacity:0;transform:scale(0) rotate(-20deg);transition:all .8s cubic-bezier(0.175,0.885,0.32,1.4)}
    #risingStarBadge.show{opacity:1;transform:scale(1) rotate(10deg)}
    .like-btn.liked{ color:#ef4444; filter: drop-shadow(0 0 10px #ef4444); }

    /* PERFECT DARK MODE */
    .dark-mode {
      background: #0f172a !important;
      color: #e2e8f0;
    }
    .dark-mode .video-card,
    .dark-mode .bg-white { background: #1e293b !important; }
    .dark-mode .bg-gray-50 { background: #334155 !important; }
    .dark-mode .border-gray-300 { border-color: #475569 !important; }
    .dark-mode .border-emerald-300 { border-color: #10b981 !important; }

    /* Band name - always visible */
    #artistName {
      color: #ffffff !important;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      -webkit-text-stroke: 2px black;
      paint-order: stroke fill;
    }
    .dark-mode #artistName {
      text-shadow: 0 0 30px rgba(16,185,129,0.8);
    }

    /* Inputs perfect in dark mode */
    .dark-mode input,
    .dark-mode textarea {
      background: #1e293b !important;
      color: #e2e8f0 !important;
      border-color: #475569 !important;
    }
    .dark-mode input::placeholder { color: #94a3b8 !important; }
    .dark-mode input:focus {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.3) !important;
    }

    /* Text colors */
    .dark-mode .text-gray-900 { color: #f1f5f9 !important; }
    .dark-mode .text-gray-800 { color: #cbd5e1 !important; }
    .dark-mode .text-gray-600 { color: #94a3b8 !important; }
    .dark-mode .text-gray-500 { color: #64748b !important; }
    .dark-mode .text-emerald-900,
    .dark-mode .text-emerald-800,
    .dark-mode .text-emerald-700 { color: #6ee7b7 !important; }
    .dark-mode .bg-emerald-50 { background: #064e3b !important; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">

  <!-- Dark Mode Toggle -->
  <button id="darkModeToggle" class="fixed top-6 right-6 z-50 bg-white/90 backdrop-blur p-4 rounded-full shadow-2xl hover:scale-110 transition z-50">
    <svg id="sunIcon" class="w-8 h-8 hidden text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-3.05-.293l-.707-.707a1 1 0 00-1.414 1.414l.707.707a1 1 0 001.414-1.414zM5 11a1 1 0 100-2H4a1 1 0 100 2h1z"/></svg>
    <svg id="moonIcon" class="w-8 h-8 text-slate-300" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
  </button>

  <!-- Banner -->
  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star">
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="logo-placeholder.png" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <div class="text-center md:text-left">
        <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100 dark:border-emerald-900">
      <h2 class="text-4xl font-black text-emerald-800 dark:text-emerald-400 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 dark:text-gray-200 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <!-- LIVE SECTION -->
    <div id="liveSection" class="mb-20 hidden">
      <div class="bg-gradient-to-r from-emerald-50 to-teal-50 dark:from-emerald-950 dark:to-teal-950 rounded-3xl shadow-2xl p-8 border-8 border-emerald-600">
        <div class="grid md:grid-cols-3 gap-8">
          <div class="md:col-span-2">
            <div id="livePlayer" class="hidden">
              <iframe id="liveIframe" width="100%" height="495" frameborder="0" allowfullscreen class="rounded-3xl shadow-2xl"></iframe>
              <div class="text-center mt-4">
                <span class="live-dot"></span>
                <span class="text-4xl font-black text-red-500 ml-4">LIVE NOW</span>
              </div>
            </div>
            <div id="offlinePlaceholder" class="bg-gray-900 rounded-3xl h-96 md:h-[495px] flex items-center justify-center text-center p-10">
              <div>
                <h2 class="text-6xl md:text-8xl font-black text-emerald-400 mb-6">LIVE STREAM</h2>
                <p class="text-3xl text-gray-300">The artist is not live right now.</p>
                <p class="text-xl text-gray-500 mt-4">Check out their videos below</p>
              </div>
            </div>
          </div>
          <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-6 flex flex-col h-96 md:h-[495px]">
            <h3 class="text-2xl font-black text-emerald-700 dark:text-emerald-400 mb-4">Live Chat</h3>
            <div id="liveMessages" class="flex-1 overflow-y-auto space-y-3 bg-gray-50 dark:bg-slate-700 rounded-xl p-4 text-sm">
              <p class="text-gray-500 dark:text-gray-400 italic text-center">Waiting for messages...</p>
            </div>
            <div class="mt-4 flex gap-2">
              <input type="text" id="liveChatInput" placeholder="Say something..." class="flex-1 px-4 py-3 rounded-xl border border-emerald-300 dark:border-emerald-700 focus:border-emerald-500 bg-white dark:bg-slate-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
              <button id="sendLiveMessage" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition transform hover:scale-105">
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- VIDEOS -->
    <div class="mb-20">
      <h2 class="text-5xl font-black text-emerald-900 dark:text-emerald-400 mb-12 text-center md:text-left">Videos</h2>
      <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
    </div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      "https://bxoqhmfnseskwqkywppg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc"
    );

    const params = new URLSearchParams(location.search);
    const idParam = params.get('id')?.trim().toLowerCase();
    if (!idParam) throw new Error("No ID");

    let profile = null;
    let artistUserId = null;
    let currentFanName = localStorage.getItem('rhythmDeckFanName') || '';
    let liveChannel = null;

    // DARK MODE TOGGLE — FIXED THE BUG HERE
    const darkModeToggle = document.getElementById('darkModeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    if (localStorage.getItem('darkMode') === 'enabled') {
      document.documentElement.classList.add('dark-mode');
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    }

    darkModeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark-mode');
      const isDark = document.documentElement.classList.contains('dark-mode');
      localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');  // ← FIXED THIS LINE
      sunIcon.classList.toggle('hidden', !isDark);
      moonIcon.classList.toggle('hidden', isDark);
    });

    async function loadProfile() {
      const { data } = await supabase.from('profiles')
        .select('id, name, bio, banner_url, logo_url, subdomain, plan')
        .ilike('subdomain', idParam)
        .maybeSingle();

      if (!data) {
        document.body.innerHTML = `<div class="text-center mt-32 p-16 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl max-w-2xl mx-auto"><h1 class="text-8xl font-black text-red-600 mb-8">Artist Not Found</h1><a href="index.html" class="bg-emerald-600 text-white px-12 py-6 rounded-2xl text-3xl font-black hover:bg-emerald-700">Go Home</a></div>`;
        return;
      }

      profile = data;
      artistUserId = profile.id;

      document.title = `${profile.name || 'Artist'} • Rhythm Deck`;
      document.getElementById('artistName').textContent = profile.name || 'Artist';
      document.getElementById('artistBio').textContent = profile.bio || 'No bio yet.';

      if (profile.banner_url) {
        const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl;
        document.getElementById('banner').src = url;
        document.getElementById('banner').classList.remove('hidden');
        document.getElementById('bannerPlaceholder').classList.add('hidden');
      }
      if (profile.logo_url) {
        document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl;
      }

      if (profile.plan === 'pro') {
        document.getElementById('liveSection').classList.remove('hidden');
        checkLiveStatus();
        setupRealtimeListener();
        setupLiveChat();
      }

      await loadVideos();
    }

    function setupLiveChat() {
      liveChannel = supabase.channel(`live_chat_${artistUserId}`);
      liveChannel.on('broadcast', { event: 'message' }, ({ payload }) => {
        const div = document.createElement('div');
        div.className = 'bg-emerald-100 dark:bg-emerald-900/50 rounded-xl p-3 border border-emerald-300 dark:border-emerald-700';
        div.innerHTML = `<p class="font-bold text-emerald-800 dark:text-emerald-300">${payload.name}:</p><p class="text-sm">${payload.message}</p>`;
        document.getElementById('liveMessages').appendChild(div);
        div.scrollIntoView({ behavior: 'smooth' });
      }).subscribe();

      document.getElementById('sendLiveMessage').onclick = () => {
        const msg = document.getElementById('liveChatInput').value.trim();
        if (!msg || !currentFanName.trim()) return;
        liveChannel.send({
          type: 'broadcast',
          event: 'message',
          payload: { name: currentFanName, message: msg }
        });
        document.getElementById('liveChatInput').value = '';
      };

      document.getElementById('liveChatInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') document.getElementById('sendLiveMessage').click();
      });
    }

    async function loadVideos() {
      const { data: videos } = await supabase.from('user_videos')
        .select('*')
        .eq('user_id', artistUserId)
        .order('created_at', { ascending: false });

      const list = document.getElementById('videoList');
      list.innerHTML = '<p class="col-span-full text-center text-4xl text-gray-600 dark:text-gray-400">Loading videos...</p>';

      if (!videos || videos.length === 0) {
        list.innerHTML = '<p class="col-span-full text-center text-5xl text-gray-600 dark:text-gray-400">No videos yet</p>';
        return;
      }

      let html = '';
      for (const v of videos) {
        const videoUrl = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl;
        const thumbUrl = v.thumbnail_url ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'logo-placeholder.png';

        const [likesRes, commentsRes] = await Promise.all([
          supabase.from('video_likes').select('id', { count: 'exact', head: true }).eq('video_id', v.id),
          supabase.from('video_comments').select('name, comment, created_at').eq('video_id', v.id).order('created_at', { ascending: false }).limit(3)
        ]);

        const likeCount = likesRes.count || 0;
        const comments = commentsRes.data || [];

        html += `
          <div class="video-card" data-video-url="${videoUrl}" data-video-id="${v.id}">
            <div class="thumbnail-container">
              <img src="${thumbUrl}" alt="${v.title || 'Video'}" onerror="this.src='logo-placeholder.png'">
              <div class="play-overlay">
                <div class="play-button">
                  <svg viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z" fill="#10b981"/></svg>
                </div>
              </div>
            </div>
            <div class="p-6">
              <h3 class="font-black text-2xl text-emerald-900 dark:text-emerald-400 text-center mb-4">${v.title || 'Untitled'}</h3>
              <div class="flex justify-between items-center mb-3 text-lg">
                <button class="like-btn flex items-center gap-2 font-bold ${likeCount > 0 ? 'liked' : 'text-gray-600 dark:text-gray-400'}">Heart ${likeCount}</button>
                <button class="share-btn text-emerald-600 dark:text-emerald-400 font-bold">Share</button>
              </div>
              <div class="text-sm space-y-2 mb-4">
                ${comments.length === 0 ? '<p class="text-gray-500 dark:text-gray-400 italic">No comments yet</p>' : ''}
                ${comments.map(c => `<div class="bg-gray-100 dark:bg-slate-700 rounded-lg p-2"><span class="font-bold text-emerald-700 dark:text-emerald-400">${c.name}:</span> <span class="text-gray-800 dark:text-gray-200">${c.comment}</span></div>`).join('')}
              </div>
              <div class="space-y-3">
                <input type="text" value="${currentFanName}" placeholder="Your name" class="name-input w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
                <div class="flex gap-2">
                  <input type="text" placeholder="Add a comment..." class="comment-input flex-1 px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-slate-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400">
                  <button class="post-comment bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg">Post</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      list.innerHTML = html;

      if (profile.plan !== 'pro' && videos.length >= 3) {
        document.getElementById('risingStarBadge').classList.add('show');
      }

      // Name saving
      document.querySelectorAll('.name-input').forEach(input => {
        input.addEventListener('change', () => {
          const name = input.value.trim();
          if (name && name !== currentFanName) {
            currentFanName = name;
            localStorage.setItem('rhythmDeckFanName', name);
          }
        });
      });

      // Post comment
      document.querySelectorAll('.post-comment').forEach(btn => {
        btn.onclick = async () => {
          const card = btn.closest('.video-card');
          const name = card.querySelector('.name-input').value.trim();
          const comment = card.querySelector('.comment-input').value.trim();
          if (!name) return alert("Please enter your name!");
          if (!comment) return;
          await supabase.from('video_comments').insert({ video_id: card.dataset.videoId, name, comment });
          if (name !== currentFanName) {
            currentFanName = name;
            localStorage.setItem('rhythmDeckFanName', name);
          }
          card.querySelector('.comment-input').value = '';
          loadVideos();
        };
      });

      // Likes & Share & Play
      document.querySelectorAll('.like-btn').forEach(btn => {
        btn.onclick = async () => {
          const name = btn.closest('.video-card').querySelector('.name-input').value.trim();
          if (!name) return alert("Enter your name to like!");
          await supabase.from('video_likes').insert({ video_id: btn.closest('.video-card').dataset.videoId, fan_name: name });
          const count = (parseInt(btn.textContent.match(/\d+/)?.[0] || 0) || 0) + 1;
          btn.innerHTML = `Heart ${count}`;
          btn.classList.add('liked');
        };
      });

      document.querySelectorAll('.share-btn').forEach(btn => {
        btn.onclick = () => {
          navigator.clipboard.writeText(location.href);
          alert("Link copied to clipboard!");
        };
      });

      document.querySelectorAll('.video-card').forEach(card => {
        card.onclick = e => {
          if (e.target.closest('button') || e.target.closest('input')) return;
          const modal = document.createElement('div');
          modal.className = 'fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-8';
          modal.innerHTML = `<video controls autoplay class="max-w-full max-h-full rounded-3xl shadow-2xl border-8 border-emerald-500"><source src="${card.dataset.videoUrl}" type="video/mp4"></video>
            <button class="absolute top-8 right-8 text-white text-8xl hover:text-gray-400 font-thin">×</button>`;
          modal.querySelector('button').onclick = () => modal.remove();
          document.body.appendChild(modal);
        };
      });
    }

    async function checkLiveStatus() {
      const { data } = await supabase.from('live_streams').select('stream_key').eq('user_id', artistUserId).single();
      if (data?.stream_key) goLive(data.stream_key); else goOffline();
    }

    function goLive(k) {
      document.getElementById('offlinePlaceholder').style.display = 'none';
      document.getElementById('livePlayer').classList.remove('hidden');
      document.getElementById('liveIframe').src = `https://livepeervideo.com/player?stream=${k}`;
    }

    function goOffline() {
      document.getElementById('livePlayer').classList.add('hidden');
      document.getElementById('offlinePlaceholder').style.display = 'flex';
      document.getElementById('liveIframe').src = '';
    }

    function setupRealtimeListener() {
      supabase.channel('live_streams')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'live_streams', filter: `user_id=eq.${artistUserId}` }, payload => {
          payload.new?.stream_key ? goLive(payload.new.stream_key) : goOffline();
        })
        .subscribe();
    }

    loadProfile();
  </script>
</body>
</html>
