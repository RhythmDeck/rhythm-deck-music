<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Rhythm Deck</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .video-card{border-radius:1.5rem;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.15);transition:.4s;background:white;position:relative}
    .video-card::before{content:'';position:absolute;inset:-8px;border-radius:1.75rem;background:linear-gradient(45deg,#10b981,#34d399,#6ee7b7);z-index:-1;filter:blur(12px);opacity:.8}
    .video-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 30px 60px rgba(0,0,0,.3)}
    .thumbnail-container{position:relative;padding-top:56.25%;background:#000;cursor:pointer;overflow:hidden}
    .thumbnail-container img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:.4s}
    .video-card:hover .play-overlay{opacity:1}
    .play-button{width:90px;height:90px;background:rgba(255,255,255,.95);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .play-button svg{width:38px;height:38px;margin-left:6px;fill:#10b981}
    #artistName{color:#fff;text-shadow:0 4px 20px #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}
    .live-badge{position:absolute;top:16px;left:16px;background:#ef4444;color:white;font-weight:900;padding:10px 24px;border-radius:50px;animation:pulse 2s infinite;z-index:10;font-size:1.2rem}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.8)}70%{box-shadow:0 0 0 16px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
    .offline-placeholder{background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:white;text-align:center;padding:3rem}
    .liked svg{fill:#ef4444;stroke:none}
    #badge-container{position:absolute;top:20px;right:20px;z-index:30}
    #badge-container img{width:110px;height:110px;filter:drop-shadow(0 0 25px rgba(255,215,0,0.8));transition:all .4s}
    #badge-container img:hover{transform:scale(1.2) rotate(12deg)}
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen">

  <div class="relative h-64 md:h-96 bg-gray-900 overflow-hidden">
    <img id="banner" src="" alt="Banner" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="flex items-center justify-center h-full text-white text-6xl font-black bg-gradient-to-br from-emerald-900 to-teal-900">
      Artist Banner
    </div>
    <div id="badge-container"></div>
  </div>

  <div class="max-w-7xl mx-auto p-6 -mt-mt-20 relative z-10">
    <div class="flex flex-col md:flex-row gap-8 items-center md:items-end mb-12">
      <img id="logo" src="https://placehold.co/400x400/emerald/white?text=Artist&font=roboto" alt="Logo" class="w-48 h-48 rounded-full border-8 border-white shadow-2xl object-cover">
      <h1 id="artistName" class="text-6xl md:text-8xl font-black drop-shadow-2xl">Loading...</h1>
    </div>

    <section class="mb-20">
      <div class="bg-black rounded-3xl shadow-2xl overflow-hidden border-4 border-emerald-500">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-0">
          <div class="lg:col-span-2 relative">
            <div id="liveIndicator" class="live-badge hidden">LIVE NOW</div>
            <div id="livepeerPlayer" class="w-full aspect-video bg-black">
              <div class="offline-placeholder">
                <svg class="w-24 h-24 mx-auto mb-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
                <p class="text-5xl font-black mb-4">Stream Offline</p>
                <p class="text-xl text-gray-400">The artist will appear here when live</p>
              </div>
            </div>
          </div>
          <div class="bg-gray-900 p-6 flex flex-col">
            <h3 class="text-2xl font-black text-emerald-400 mb-4">Live Chat</h3>
            <div id="liveChatMessages" class="flex-1 overflow-y-auto bg-black/50 rounded-xl p-4 space-y-3 mb-4 min-h-64">
              <p class="text-gray-500 text-center italic">Chat appears when the artist is live</p>
            </div>
            <div class="flex gap-3">
              <input type="text" id="chatNameInput" placeholder="Your name" class="flex-1 p-3 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-emerald-500">
              <input type="text" id="chatMessageInput" placeholder="Send a message..." class="flex-1 p-3 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-emerald-500" onkeydown="if(event.key==='Enter') sendLiveMessage()">
              <button onclick="sendLiveMessage()" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-lg font-bold">Send</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="bg-white rounded-3xl shadow-2xl p-10 mb-16 border-2 border-emerald-100">
      <h2 class="text-4xl font-black text-emerald-800 mb-6">About</h2>
      <p id="artistBio" class="text-xl text-gray-800 leading-relaxed whitespace-pre-line">Loading bio...</p>
    </div>

    <h2 class="text-5xl font-black text-emerald-900 mb-12 text-center">Videos</h2>
    <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
  </div>

  <div id="videoModal" class="fixed inset-0 bg-black/96 flex items-center justify-center z-[9999] opacity-0 invisible transition-all duration-300">
    <button onclick="closeVideo()" class="fixed top-8 right-8 w-16 h-16 bg-white text-black rounded-full text-4xl font-bold z-50 hover:bg-gray-200">X</button>
    <video id="modalVideo" controls autoplay class="max-w-[95%] max-h-[90vh] rounded-2xl shadow-2xl"></video>
  </div>

  <script type="module">
    // NEW WORKING CDN URL — Dec 2025 (this fixes the wrapper.mjs error)
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/module/index.js'

    const supabase = createClient(
      'https://bxoqhmfnseskwqkywppg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
    )

    // ONE-LINE FIX FOR ALL IMAGES & VIDEOS (works even with RLS Unrestricted)
    const getMediaUrl = (path) => `https://bxoqhmfnseskwqkywppg.supabase.co/storage/v1/object/public/media/${path.replace(/^\/+/g,'')}`

    const params = new URLSearchParams(location.search)
    const id = params.get('id')?.trim()
    if (!id) { document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Invalid Link</div>'; throw '' }

    let artistId = null

    async function init() {
      let profile = null
      const { data: exact } = await supabase.from('profiles').select('id,name,bio,banner_url,logo_url,plan').eq('subdomain', id).maybeSingle()
      if (exact) profile = exact
      if (!profile) {
        const { data: fuzzy } = await supabase.from('profiles').select('id,name,bio,banner_url,logo_url,plan').ilike('subdomain', id).maybeSingle()
        if (fuzzy) profile = fuzzy
      }
      if (!profile && /^[0-9a-fA-F-]{36}$/.test(id)) {
        const { data: byId } = await supabase.from('profiles').select('id,name,bio,banner_url,logo_url,plan').eq('id', id).maybeSingle()
        if (byId) profile = byId
      }
      if (!profile) {
        document.body.innerHTML = '<div class="text-center py-40 text-7xl font-black text-red-600">Artist Not Found</div>'
        return
      }

      artistId = profile.id
      document.title = `${profile.name} • Rhythm Deck`
      document.getElementById('artistName').textContent = profile.name
      document.getElementById('artistBio').innerHTML = (profile.bio || 'No bio yet.').replace(/\n/g, '<br>')

      // BANNER
      if (profile.banner_url) {
        const banner = document.getElementById('banner')
        banner.src = getMediaUrl(profile.banner_url)
        banner.onload = () => {
          banner.classList.remove('hidden')
          document.getElementById('bannerPlaceholder').classList.add('hidden')
        }
      }

      // LOGO
      if (profile.logo_url) {
        document.getElementById('logo').src = getMediaUrl(profile.logo_url)
      }

      // BADGE
      const badge = document.getElementById('badge-container')
      if (profile.plan === 'pro') {
        badge.innerHTML = `<img src="https://raw.githubusercontent.com/RhythmDeck/rhythm-deck-music/main/pro-artist-badge.png" alt="Pro">`
      } else {
        const { count } = await supabase.from('user_videos').select('*', { count: 'exact', head: true }).eq('user_id', artistId)
        if (count >= 3) badge.innerHTML = `<img src="https://raw.githubusercontent.com/RhythmDeck/rhythm-deck-music/main/rising-star.png" alt="Rising Star">`
      }

      loadVideos()
      checkLiveStatus()
      setInterval(checkLiveStatus, 7000)
    }

    async function loadVideos() {
      const { data: videos } = await supabase.from('user_videos').select('*').eq('user_id', artistId).order('created_at', { ascending: false })
      const list = document.getElementById('videoList')
      if (!videos?.length) {
        list.innerHTML = '<p class="col-span-full text-center text-5xl text-gray-500 py-20">No videos yet</p>'
        return
      }
      list.innerHTML = ''
      for (const v of videos) {
        const videoUrl = getMediaUrl(v.video_url)
        const thumb = v.thumbnail_url ? getMediaUrl(v.thumbnail_url) : 'https://placehold.co/600x338/emerald/white?text=No+Thumb'

        const { count: likes = 0 } = await supabase.from('video_likes').select('*', { count: 'exact', head: true }).eq('video_id', v.id)
        const { data: comments = [] } = await supabase.from('video_comments').select('name, comment').eq('video_id', v.id).order('created_at', { ascending: false })

        const commentsHTML = comments.length === 0
          ? '<p class="text-gray-500 italic text-center py-4">Be the first to comment!</p>'
          : comments.map(c => `<div class="text-sm"><strong class="text-emerald-600">${c.name}:</strong> ${c.comment}</div>`).join('')

        list.innerHTML += `
          <div class="video-card">
            <div class="thumbnail-container" onclick="openVideo('${videoUrl}')">
              <img src="${thumb}" alt="thumb" onerror="this.src='https://placehold.co/600x338/emerald/white?text=No+Thumb'">
              <div class="play-overlay"><div class="play-button"><svg viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z" fill="#10b981"/></svg></div></div>
            </div>
            <div class="p-6">
              <h3 class="font-black text-2xl text-emerald-900 text-center mb-4">${v.title || 'Untitled'}</h3>
              <div class="flex justify-between items-center mb-4">
                <button class="like-btn flex items-center gap-2 font-bold text-lg ${likes > 0 ? 'liked' : ''}" data-id="${v.id}">
                  Heart<svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                  <span>${likes}</span>
                </button>
                <button class="text-emerald-600 font-bold" onclick="navigator.clipboard.writeText('${videoUrl}'); alert('Link copied!')">Share</button>
              </div>
              <div class="border-t pt-4 space-y-2 text-sm max-h-48 overflow-y-auto">${commentsHTML}</div>
              <div class="mt-6">
                <input type="text" placeholder="Your name" class="border-2 border-emerald-500 rounded-lg p-2 w-full mb-2" id="name-${v.id}">
                <div class="flex gap-2">
                  <input type="text" placeholder="Write a comment..." class="border-2 border-emerald-500 rounded-lg p-2 flex-1" id="comment-${v.id}">
                  <button data-id="${v.id}" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-lg post-comment">Post</button>
                </div>
              </div>
            </div>
          </div>`
      }

      document.querySelectorAll('.like-btn').forEach(btn => {
        btn.onclick = async () => {
          if (btn.classList.contains('liked')) return
          await supabase.from('video_likes').insert({ video_id: btn.dataset.id })
          btn.classList.add('liked')
          btn.querySelector('span').textContent = Number(btn.querySelector('span').textContent) + 1
        }
      })

      document.querySelectorAll('.post-comment').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id
          const name = document.getElementById(`name-${id}`).value.trim() || 'Fan'
          const comment = document.getElementById(`comment-${id}`).value.trim()
          if (!comment) return
          await supabase.from('video_comments').insert({ video_id: id, name, comment })
          document.getElementById(`comment-${id}`).value = ''
          loadVideos()
        }
      })
    }

    async function checkLiveStatus() {
      if (!artistId) return
      const { data: session } = await supabase
        .from('live_sessions')
        .select('playback_id')
        .eq('user_id', artistId)
        .eq('is_active', true)
        .maybeSingle()

      if (session?.playback_id) {
        document.getElementById('liveIndicator').classList.remove('hidden')
        document.getElementById('livepeerPlayer').innerHTML = `<iframe src="https://lvpr.tv?v=${session.playback_id}" frameborder="0" allowfullscreen allow="autoplay; encrypted-media" class="w-full h-full"></iframe>`
      } else {
        document.getElementById('liveIndicator').classList.add('hidden')
        document.getElementById('livepeerPlayer').innerHTML = document.querySelector('.offline-placeholder').outerHTML
      }
    }

    function sendLiveMessage() {
      const name = document.getElementById('chatNameInput').value.trim() || 'Fan'
      const msg = document.getElementById('chatMessageInput').value.trim()
      if (!msg) return
      document.getElementById('liveChatMessages').insertAdjacentHTML('beforeend', `<div class="bg-emerald-900/60 text-white p-3 rounded-lg max-w-xs"><strong class="text-emerald-300">${name}:</strong> ${msg}</div>`)
      document.getElementById('chatMessageInput').value = ''
      document.getElementById('liveChatMessages').scrollTop = document.getElementById('liveChatMessages').scrollHeight
    }

    function openVideo(url) {
      document.getElementById('modalVideo').src = url
      document.getElementById('videoModal').classList.remove('invisible','opacity-0')
      document.getElementById('videoModal').classList.add('opacity-100')
    }
    window.openVideo = openVideo
    window.closeVideo = () => {
      document.getElementById('videoModal').classList.add('invisible','opacity-0')
      document.getElementById('videoModal').classList.remove('opacity-100')
      document.getElementById('modalVideo').src = ''
    }

    init()
  </script>
</body>
</html>
