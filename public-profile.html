<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@livepeer/react@3/dist/livepeer-react.min.js"></script>
  <style>
    body { background: linear-gradient(to bottom, #0f172a, #1e293b); color: white; min-height: 100vh; }
    #risingStarBadge { position: absolute; top: 20px; right: 20px; width: 140px; opacity: 0; transition: all 1s; }
    #risingStarBadge.show { opacity: 1; transform: rotate(15deg) scale(1.1); }
    #artistName { font-weight: 900; font-size: 5rem; text-shadow: 0 0 30px rgba(0,0,0,0.8); -webkit-text-stroke: 2px black; }
    .live-container { border: 5px solid #10b981; border-radius: 2rem; overflow: hidden; box-shadow: 0 0 50px rgba(16, 185, 129, 0.4); }
    .live-badge { position: absolute; top: 1rem; left: 1rem; background: #ef4444; padding: 0.75rem 1.5rem; border-radius: 999px; font-weight: 900; animation: pulse 2s infinite; z-index: 20; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.8); } 70% { box-shadow: 0 0 0 15px rgba(239,68,68,0); } }
    .join-screen { background: linear-gradient(135deg, #10b981, #059669); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; cursor: pointer; transition: all 0.3s; }
    .join-screen:hover { transform: scale(1.02); }
    .join-screen svg { width: 120px; height: 120px; margin-bottom: 2rem; }
    .chat-box { background: #0f172a; border-left: 5px solid #10b981; }
    .msg { padding: 0.75rem 1rem; border-radius: 1rem; margin-bottom: 0.75rem; max-width: 80%; word-wrap: break-word; }
    .msg.user { background: #10b981; align-self: flex-end; }
    .msg.other { background: #1e293b; align-self: flex-start; }
  </style>
</head>
<body>

  <!-- BANNER -->
  <div class="relative h-96 overflow-hidden">
    <img id="banner" src="" class="w-full h-full object-cover hidden">
    <div id="bannerPlaceholder" class="w-full h-full bg-gradient-to-br from-emerald-800 to-teal-900 flex items-center justify-center text-8xl font-black">BANNER</div>
    <img id="risingStarBadge" src="rising-artist-badge-transparent.png" alt="Rising Star">
  </div>

  <div class="max-w-7xl mx-auto px-6 -mt-32 relative z-10">
    <div class="flex flex-col md:flex-row items-center gap-10 mb-16">
      <img id="logo" src="logo-placeholder.png" class="w-64 h-64 rounded-full border-8 border-white shadow-2xl object-cover">
      <h1 id="artistName" class="text-center md:text-left">Loading...</h1>
    </div>

    <!-- LIVE STREAM + CHAT - PRO ONLY -->
    <section id="liveStreamSection" class="mb-20 live-container hidden">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-0">
        <!-- PLAYER -->
        <div class="lg:col-span-3 relative bg-black">
          <div id="liveBadge" class="live-badge hidden">LIVE NOW</div>
          <div id="playerContainer" class="aspect-video">
            <!-- Default: Big Join Button -->
            <div id="joinScreen" class="join-screen">
              <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
              <div class="text-6xl font-black mb-4">JOIN LIVE STREAM</div>
              <div class="text-2xl opacity-90">Exclusive for Pro supporters</div>
            </div>
          </div>
        </div>

        <!-- CHAT -->
        <div class="chat-box p-6 flex flex-col">
          <h3 class="text-3xl font-black text-emerald-400 mb-4">LIVE CHAT</h3>
          <div id="liveChatMessages" class="flex-1 overflow-y-auto space-y-3 mb-4 min-h-96">
            <p class="text-gray-500 text-center italic">Chat will appear when live</p>
          </div>
          <div class="flex gap-3">
            <input type="text" id="chatName" placeholder="Name" class="flex-1 bg-white/10 border border-emerald-600 rounded-lg px-4 py-3">
            <input type="text" id="chatInput" placeholder="Type message..." class="flex-1 bg-white/10 border border-emerald-600 rounded-lg px-4 py-3" onkeydown="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-lg font-bold">SEND</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <div class="bg-white/10 backdrop-blur-lg rounded-3xl p-10 mb-16">
      <h2 class="text-4xl font-black text-emerald-400 mb-6">About</h2>
      <p id="bio" class="text-xl leading-relaxed whitespace-pre-line">Loading...</p>
    </div>

    <!-- VIDEOS -->
    <h2 class="text-6xl font-black text-emerald-400 text-center mb-12">VIDEOS</h2>
    <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient('https://bxoqhmfnseskwqkywppg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc')

    const params = new URLSearchParams(location.search)
    const subdomain = params.get('id')?.trim().toLowerCase()
    if (!subdomain) { document.body.innerHTML = '<h1 class="text-9xl text-red-600 text-center mt-40">INVALID LINK</h1>'; throw '' }

    let artistId, isPro = false, playbackId = null

    async function init() {
      const { data: profile, error } = await supabase.from('profiles').select('id,name,bio,banner_url,logo_url,plan').eq('subdomain', subdomain).single()
      if (error || !profile) { document.body.innerHTML = '<h1 class="text-9xl text-red-600 text-center mt-40">ARTIST NOT FOUND</h1>'; return }

      artistId = profile.id
      isPro = profile.plan === 'pro'

      document.title = `${profile.name} • Rhythm Deck`
      document.getElementById('artistName').textContent = profile.name
      document.getElementById('bio').textContent = profile.bio || 'No bio yet.'

      if (profile.banner_url) {
        const url = supabase.storage.from('media').getPublicUrl(profile.banner_url).data.publicUrl
        const banner = document.getElementById('banner')
        banner.src = url
        banner.classList.remove('hidden')
        document.getElementById('bannerPlaceholder').remove()
      }
      if (profile.logo_url) document.getElementById('logo').src = supabase.storage.from('media').getPublicUrl(profile.logo_url).data.publicUrl

      if (!isPro && await has3Videos()) document.getElementById('risingStarBadge').classList.add('show')

      if (isPro) {
        document.getElementById('liveStreamSection').classList.remove('hidden')
        checkLive()
        setInterval(checkLive, 8000)
      }

      loadVideos()
    }

    async function has3Videos() {
      const { count } = await supabase.from('user_videos').select('*', { count: 'exact', head: true }).eq('user_id', artistId)
      return count >= 3
    }

    async function checkLive() {
      const { data: session } = await supabase.from('live_sessions').select('playback_id').eq('user_id', artistId).eq('is_active', true).maybeSingle()
      if (session?.playback_id && session.playback_id !== playbackId) {
        playbackId = session.playback_id
        document.getElementById('liveBadge').classList.remove('hidden')
        document.getElementById('joinScreen').remove()
        loadPlayer()
      }
    }

    function loadPlayer() {
      if (document.querySelector('lp-player')) return
      const Player = window.livepeerReact.Player
      ReactDOM.createRoot(document.getElementById('playerContainer')).render(
        React.createElement(Player, { playbackId, autoPlay: true, muted: false, showTitle: false, className: "w-full h-full" })
      )
    }

    window.sendChat = () => {
      const name = document.getElementById('chatName').value.trim() || 'Fan'
      const msg = document.getElementById('chatInput').value.trim()
      if (!msg) return
      const chat = document.getElementById('liveChatMessages')
      chat.innerHTML += `<div class="msg user"><strong>${name}:</strong> ${msg}</div>`
      document.getElementById('chatInput').value = ''
      chat.scrollTop = chat.scrollHeight
    }

    async function loadVideos() {
      const { data: videos } = await supabase.from('user_videos').select('*').eq('user_id', artistId).order('created_at', { ascending: false })
      const grid = document.getElementById('videoGrid')
      if (!videos?.length) { grid.innerHTML = '<p class="col-span-full text-center text-6xl text-gray-500">No videos yet</p>'; return }

      for (const v of videos) {
        const url = supabase.storage.from('media').getPublicUrl(v.video_url).data.publicUrl
        const thumb = v.thumbnail_url ? supabase.storage.from('media').getPublicUrl(v.thumbnail_url).data.publicUrl : 'https://via.placeholder.com/600x338/10b981/ffffff?text=No+Thumb'
        const { count: likes = 0 } = await supabase.from('video_likes').select('*', { count: 'exact', head: true }).eq('video_id', v.id)
        const { data: comments = [] } = await supabase.from('video_comments').select('name,comment').eq('video_id', v.id).order('created_at', { ascending: false })

        grid.innerHTML += `
          <div class="bg-white/10 rounded-3xl overflow-hidden shadow-2xl hover:scale-105 transition-transform">
            <div class="aspect-video cursor-pointer bg-black" onclick="document.getElementById('modalVideo').src='${url}'; document.getElementById('modal').classList.remove('hidden')">
              <img src="${thumb}" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100 transition"><div class="w-24 h-24 bg-white rounded-full flex items-center justify-center"><svg class="w-12 h-12 ml-2" fill="#10b981" viewBox="0 0 68 68"><path d="M14 18 L14 50 L50 34 Z"/></svg></div></div>
            </div>
            <div class="p-6">
              <h3 class="text-2xl font-black text-emerald-400 mb-4">${v.title || 'Untitled'}</h3>
              <div class="flex justify-between items-center mb-4">
                <button class="flex items-center gap-2 text-2xl ${likes?'text-red-500':''}" onclick="event.stopPropagation(); likeVideo(${v.id}, this)">
                  Heart <span>${likes}</span>
                </button>
                <button class="text-emerald-400 font-bold" onclick="event.stopPropagation(); navigator.clipboard.writeText('${url}'); alert('Copied!')">Share</button>
              </div>
              <div class="space-y-2 text-sm max-h-32 overflow-y-auto">
                ${comments.length ? comments.map(c => `<div><strong class="text-emerald-400">${c.name}:</strong> ${c.comment}</div>`).join('') : '<p class="text-gray-500 italic">No comments yet</p>'}
              </div>
              <div class="mt-4 flex gap-2">
                <input placeholder="Name" class="flex-1 bg-white/10 rounded-lg px-4 py-2" id="n${v.id}">
                <input placeholder="Comment..." class="flex-1 bg-white/10 rounded-lg px-4 py-2" id="c${v.id}" onkeydown="if(event.key==='Enter')comment(${v.id})">
                <button onclick="comment(${v.id})" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-lg font-bold">Post</button>
              </div>
            </div>
          </div>`
      }
    }

    window.likeVideo = async (id, btn) => {
      if (btn.classList.contains('liked')) return
      await supabase.from('video_likes').insert({ video_id: id })
      btn.classList.add('liked', 'text-red-500')
      btn.querySelector('span').textContent = Number(btn.querySelector('span').textContent) + 1
    }

    window.comment = async (id) => {
      const name = document.getElementById('n'+id).value.trim() || 'Fan'
      const text = document.getElementById('c'+id).value.trim()
      if (!text) return
      await supabase.from('video_comments').insert({ video_id: id, name, comment: text })
      document.getElementById('c'+id).value = ''
      loadVideos()
    }

    // Video modal
    const modal = document.createElement('div')
    modal.id = 'modal'
    modal.className = 'fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center'
    modal.innerHTML = `<button onclick="this.parentElement.classList.add('hidden'); document.getElementById('modalVideo').src=''" class="absolute top-8 right-8 text-6xl">X</button><video id="modalVideo" controls autoplay class="max-w-full max-h-full rounded-3xl"></video>`
    document.body.appendChild(modal)

    init()
  </script>
</body>
</html>
