<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Deck • Rhythm Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom, #0f172a, #1e1b4b); color: #e2e8f0; min-height: 100vh; }
    .spinner { border: 4px solid #334155; border-top: 4px solid #5eead4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header with Logo and Title -->
  <header class="bg-black/90 backdrop-blur border-b border-yellow-600 py-6">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <img src="logo-1-sm.jpg" alt="Rhythm Vision Logo" class="w-16 h-16 rounded-full shadow-2xl">
        <div>
          <h1 class="text-4xl font-black text-teal-400">Rhythm Vision</h1>
          <p class="text-xl text-yellow-400 font-bold">Rhythm Deck</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Banner (under logo and name) -->
  <div class="relative w-full h-64 overflow-hidden">
    <img src="rhythm-vision-banner.png" alt="Rhythm Vision Banner" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
    <div class="absolute bottom-0 left-0 right-0 p-8 text-center">
      <h2 class="text-5xl md:text-7xl font-black text-teal-400 drop-shadow-2xl">RHYTHM VISION</h2>
    </div>
  </div>

  <main class="flex-1 container max-w-4xl mx-auto p-8">
    <div class="bg-gray-900/90 backdrop-blur rounded-3xl shadow-2xl p-10 border border-yellow-600">

      <div class="text-center mb-12">
        <h3 class="text-4xl font-black text-teal-400 mb-4">Generate Professional Lyrics</h3>
        <p class="text-xl text-gray-300">Just describe your song — get radio-ready lyrics in seconds.</p>
      </div>

      <div class="space-y-8">

        <div>
          <label class="block text-lg font-bold text-teal-300 mb-3">Song Concept / Idea</label>
          <textarea id="songConcept" rows="4" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg placeholder-gray-500 focus:border-teal-500 focus:ring focus:ring-teal-500/50 transition" placeholder="e.g. A heartbroken country song about leaving home and never looking back..."></textarea>
        </div>

        <div class="grid md:grid-cols-3 gap-6">
          <div>
            <label class="block text-lg font-bold text-teal-300 mb-3">Genre</label>
            <input type="text" id="musicGenre" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" placeholder="pop, country, trap, rock..." value="">
          </div>
          <div>
            <label class="block text-lg font-bold text-teal-300 mb-3">Number of Verses</label>
            <input type="number" id="numVerses" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" placeholder="3" min="1" max="6" value="3">
          </div>
          <div class="flex flex-col justify-end space-y-4">
            <label class="flex items-center text-lg"><input type="checkbox" id="hasChorus" checked class="mr-3 w-6 h-6 text-teal-500"> <span class="text-teal-300 font-bold">Include Chorus</span></label>
            <label class="flex items-center text-lg"><input type="checkbox" id="hasBridge" checked class="mr-3 w-6 h-6 text-teal-500"> <span class="text-teal-300 font-bold">Include Bridge</span></label>
            <label class="flex items-center text-lg"><input type="checkbox" id="hasOutro" class="mr-3 w-6 h-6 text-teal-500"> <span class="text-teal-300 font-bold">Include Outro</span></label>
          </div>
        </div>

        <div class="text-center">
          <button onclick="generateLyrics()" class="bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-600 hover:to-cyan-700 text-black font-black text-2xl px-20 py-7 rounded-2xl shadow-2xl transform hover:scale-105 transition">
            Generate Professional Lyrics
          </button>
        </div>

        <div class="mt-12">
          <label class="block text-2xl font-bold text-teal-400 mb-4">Your Lyrics</label>
          <textarea id="lyrics" rows="18" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-6 text-lg font-mono leading-relaxed placeholder-gray-600" placeholder="Your professional lyrics will appear here..."></textarea>
          <div class="mt-6 flex justify-center gap-6">
            <button onclick="copyLyrics()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-black px-12 py-5 rounded-xl shadow-xl transition">
              Copy Lyrics
            </button>
            <button onclick="clearLyrics()" class="bg-gray-700 hover:bg-gray-600 text-white font-black px-12 py-5 rounded-xl shadow-xl transition">
              Clear Lyrics
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Message Modal -->
  <div id="messageBox" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-900 rounded-3xl p-12 text-center max-w-lg border border-yellow-600">
      <div id="loading" class="hidden"><div class="spinner"></div><p class="mt-6 text-2xl text-teal-400">Generating your lyrics...</p></div>
      <p id="messageText" class="text-3xl font-bold text-white"></p>
      <button onclick="document.getElementById('messageBox').classList.add('hidden')" class="mt-8 bg-teal-600 hover:bg-teal-700 text-black font-black px-14 py-5 rounded-xl text-2xl">OK</button>
    </div>
  </div>

  <script>
    function showMessage(text, loading = false) {
      document.getElementById('messageText').textContent = text;
      document.getElementById('loading').classList.toggle('hidden', !loading);
      document.getElementById('messageBox').classList.remove('hidden');
    }

    async function generateLyrics() {
      const concept = document.getElementById('songConcept').value.trim();
      if (!concept) return showMessage('Please enter a song concept first!');

      showMessage('Creating your professional lyrics...', true);

      const genre = document.getElementById('musicGenre').value.trim() || 'pop';
      const verses = parseInt(document.getElementById('numVerses').value) || 3;
      const hasChorus = document.getElementById('hasChorus').checked;
      const hasBridge = document.getElementById('hasBridge').checked;
      const hasOutro = document.getElementById('hasOutro').checked;

      const prompt = `Write a complete, professional ${genre} song about: "${concept}"
      
      Structure:
      - Exactly ${verses} verses
      ${hasChorus ? '- Catchy chorus after each verse' : ''}
      ${hasBridge ? '- Include a powerful bridge' : ''}
      ${hasOutro ? '- End with a memorable outro' : ''}
      
      Make it emotional, poetic, and radio-ready. Use vivid imagery and real songwriting craft.
      Format exactly with: [Verse 1], [Chorus], [Verse 2], etc.`;

      try {
        // Using MakeSong free API - no key required, works instantly for lyrics
        const res = await fetch('https://api.makesong.com/v1/generate-lyrics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            genre: genre,
            verses: verses,
            chorus: hasChorus,
            bridge: hasBridge,
            outro: hasOutro
          })
        });

        if (!res.ok) throw new Error();

        const data = await res.json();
        let lyrics = data.lyrics || "Beautiful lyrics created for you!";

        lyrics = lyrics.replace(/```[\s\S]*?```/g, '').trim();
        document.getElementById('lyrics').value = lyrics;
        showMessage('Professional lyrics ready!');
      } catch (e) {
        showMessage('Generation failed. Please try again in a moment.');
      }
    }

    function copyLyrics() {
      const lyrics = document.getElementById('lyrics').value;
      if (!lyrics) return showMessage('No lyrics to copy!');
      navigator.clipboard.writeText(lyrics);
      showMessage('Lyrics copied to clipboard!');
    }

    function clearLyrics() {
      document.getElementById('lyrics').value = '';
      showMessage('Lyrics cleared!');
    }
  </script>
</body>
</html>
