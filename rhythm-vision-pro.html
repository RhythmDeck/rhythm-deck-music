<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Vision • AI Music Video Creator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom, #0f172a, #1e1b4b); color: #e2e8f0; min-height: 100vh; }
    .spinner { border: 4px solid #334155; border-top: 4px solid #5eead4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-black/90 backdrop-blur border-b border-yellow-600 py-6">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <img src="logo-1-sm.jpg" alt="Logo" class="w-16 h-16 rounded-full shadow-2xl">
        <div>
          <h1 class="text-5xl font-black text-teal-400">Rhythm Vision</h1>
          <p class="text-2xl text-yellow-400 font-bold">AI Music Video Creator</p>
        </div>
      </div>
      <div class="flex gap-4">
        <button onclick="saveProject()" class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-black px-10 py-5 rounded-xl shadow-2xl hover:scale-105 transition">
          Save Project
        </button>
        <button onclick="loadProjectPrompt()" class="bg-gradient-to-r from-indigo-600 to-purple-700 text-white font-black px-10 py-5 rounded-xl shadow-2xl hover:scale-105 transition">
          Load Project
        </button>
      </div>
    </div>
  </header>

  <!-- Banner -->
  <div class="relative w-full h-80 overflow-hidden">
    <img src="rhythm-vision-banner.png" alt="Banner" class="w-full h-full object-cover">
  </div>

  <main class="flex-1 container max-w-4xl mx-auto p-8">
    <div class="bg-gray-900/90 backdrop-blur rounded-3xl shadow-2xl p-10 border border-yellow-600">

      <!-- Song Info -->
      <div class="grid md:grid-cols-2 gap-6 mb-10">
        <div>
          <label class="block text-lg font-bold text-teal-300 mb-3">Song Title</label>
          <input type="text" id="songTitle" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-xl" placeholder="e.g. Street Dreams">
        </div>
        <div class="flex items-end gap-4">
          <input type="number" id="songDuration" value="180" min="60" max="600" class="w-32 bg-gray-800 border border-gray-700 rounded-xl p-5 text-xl">
          <span class="text-3xl font-bold text-yellow-400" id="durationDisplay">3:00</span>
        </div>
      </div>

      <!-- Lyrics Tabs -->
      <div class="flex justify-center gap-8 mb-10">
        <button id="tabGenerate" class="px-10 py-4 rounded-xl font-black text-2xl bg-yellow-600 text-black shadow-lg">Generate Lyrics</button>
        <button id="tabPaste" class="px-10 py-4 rounded-xl font-black text-2xl bg-gray-700 text-gray-300 hover:bg-gray-600 transition">Add Your Own</button>
      </div>

      <!-- Generate Panel -->
      <div id="panelGenerate">
        <div class="text-center mb-12">
          <h3 class="text-4xl font-black text-teal-400 mb-4">Generate Professional Lyrics</h3>
          <div class="bg-purple-900/50 border border-purple-600 rounded-2xl p-6 max-w-4xl mx-auto mb-8">
            <p class="text-lg text-purple-100 font-bold">
              Just click Grok or Gemini → the PERFECT prompt is copied automatically → paste once → get lyrics → paste back here!
            </p>
          </div>
        </div>

        <div class="space-y-8">
          <div>
            <label class="block text-lg font-bold text-teal-300 mb-3">Song Concept / Idea</label>
            <textarea id="songConcept" rows="4" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" placeholder="e.g. Rising from the streets, luxury cars, money rain..."></textarea>
          </div>

          <div class="grid md:grid-cols-3 gap-6">
            <div>
              <label class="block text-lg font-bold text-teal-300 mb-3">Genre</label>
              <input type="text" id="musicGenre" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" placeholder="trap, pop, rock...">
            </div>
            <div>
              <label class="block text-lg font-bold text-teal-300 mb-3">Number of Verses</label>
              <input type="number" id="numVerses" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" value="3" min="1" max="6">
            </div>
            <div class="flex flex-col justify-end space-y-4">
              <label class="flex items-center text-lg"><input type="checkbox" id="hasChorus" checked class="mr-3 w-6 h-6 text-teal-500"> <span class="text-teal-300 font-bold">Include Chorus</span></label>
              <label class="flex items-center text-lg"><input type="checkbox" id="hasBridge" checked class="mr-3 w-6 h-6 text-teal-500"> <span class="text-teal-300 font-bold">Include Bridge</span></label>
              <label class="flex items-center text-lg"><input type="checkbox" id="hasOutro" checked class="mr-3 w-6 h-6 text-teal-500"> <span class="text-teal-300 font-bold">Include Outro</span></label>
            </div>
          </div>

          <div class="text-center">
            <div class="flex justify-center gap-10 flex-wrap">
              <button onclick="generateWithGrok()" class="bg-gradient-to-r from-slate-600 to-gray-700 hover:from-slate-700 hover:to-gray-800 text-white font-black text-2xl px-20 py-8 rounded-2xl shadow-2xl transform hover:scale-105 transition">
                Generate with Grok
              </button>
              <button onclick="generateWithGemini()" class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-black text-2xl px-20 py-8 rounded-2xl shadow-2xl transform hover:scale-105 transition">
                Generate with Gemini
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Paste Panel -->
      <div id="panelPaste" class="hidden">
        <textarea id="pasteLyrics" rows="16" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-6 font-mono" placeholder="Paste your lyrics here..."></textarea>
        <div class="text-center mt-8">
          <button onclick="usePastedLyrics()" class="bg-gradient-to-r from-emerald-500 to-teal-600 text-black font-black text-2xl px-24 py-8 rounded-2xl shadow-2xl hover:scale-105">
            Use These Lyrics
          </button>
        </div>
      </div>

      <!-- Lyrics Output -->
      <div class="mt-16">
        <div class="flex justify-between items-center mb-6">
          <label class="text-3xl font-bold text-teal-400">Your Lyrics</label>
          <button onclick="copyLyrics()" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white font-black px-12 py-5 rounded-xl shadow-2xl">
            Copy Lyrics
          </button>
        </div>
        <textarea id="lyrics" rows="20" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-6 font-mono text-lg leading-relaxed" placeholder="Paste lyrics from Grok/Gemini here..."></textarea>
      </div>

      <!-- Main Workflow -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-16">
        <button onclick="generateScenes()" class="bg-gradient-to-r from-purple-600 to-pink-600 py-10 rounded-2xl font-black text-3xl hover:scale-105 shadow-2xl">Generate Scenes</button>
        <button onclick="generateTimeline()" class="bg-gradient-to-r from-teal-600 to-cyan-600 py-10 rounded-2xl font-black text-3xl hover:scale-105 shadow-2xl">Generate Timeline</button>
        <button onclick="generateImages()" class="bg-gradient-to-r from-emerald-600 to-teal-600 py-10 rounded-2xl font-black text-3xl hover:scale-105 shadow-2xl">Generate Images</button>
      </div>

      <div id="scenesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-12"></div>
      <div id="timelineOutput" class="mt-16 p-10 bg-gray-800 rounded-2xl hidden border border-teal-600">
        <h3 class="text-4xl font-bold text-teal-400 text-center mb-8">Video Timeline</h3>
        <div id="timelineContent" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
      </div>
      <div id="imagesOutput" class="mt-16 hidden">
        <h3 class="text-4xl font-bold text-teal-400 text-center mb-10">Generated Images (click to download)</h3>
        <div id="imagesContent" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
      </div>

      <!-- Audio Generation -->
      <div class="mt-20 p-10 bg-gradient-to-r from-lime-600 to-green-600 rounded-3xl shadow-2xl border-4 border-lime-400">
        <h3 class="text-4xl font-black text-center mb-8">Generate Full Song</h3>
        <div class="grid md:grid-cols-2 gap-6 mb-8">
          <input type="text" id="customStyle" placeholder="Style: dark trap, cinematic, emotional..." class="bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg">
          <button onclick="generateAudio()" class="bg-white text-green-600 font-black text-2xl py-6 rounded-xl hover:bg-gray-100">
            Generate Song Now
          </button>
        </div>
        <audio id="audioPlayer" controls class="w-full mt-6 hidden rounded-xl shadow-2xl"></audio>
      </div>

      <!-- Download Buttons -->
      <div class="text-center my-20 space-y-8">
        <button onclick="downloadAudio()" id="downloadAudioBtn" class="bg-gradient-to-r from-green-600 to-emerald-700 text-white font-black text-4xl px-32 py-10 rounded-3xl shadow-2xl hover:scale-110 transition hidden">
          Download Your MP3
        </button>
        <button onclick="renderVideo()" class="bg-gradient-to-r from-cyan-500 to-purple-700 text-white font-black text-5xl px-40 py-12 rounded-3xl shadow-2xl hover:scale-110 transition">
          Export Final Video (MP4)
        </button>
        <button onclick="downloadFinalVideo()" id="downloadVideoBtn" class="bg-gradient-to-r from-purple-600 to-pink-700 text-white font-black text-4xl px-32 py-10 rounded-3xl shadow-2xl hover:scale-110 transition hidden">
          Download Your Video
        </button>
      </div>
    </div>
  </main>

  <!-- Modals -->
  <div id="messageBox" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-900 rounded-3xl p-12 text-center max-w-lg border border-yellow-600">
      <div id="loading" class="hidden"><div class="spinner"></div><p class="mt-6 text-2xl text-teal-400">Working...</p></div>
      <p id="messageText" class="text-3xl font-bold text-white"></p>
      <button onclick="document.getElementById('messageBox').classList.add('hidden')" class="mt-8 bg-teal-600 text-black font-black px-14 py-5 rounded-xl text-2xl">OK</button>
    </div>
  </div>

  <div id="videoPreview" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-900 rounded-3xl p-8 max-w-6xl w-full border border-yellow-600">
      <video id="previewVideo" controls class="w-full rounded-2xl shadow-2xl" style="max-height:85vh;"></video>
      <div class="text-center mt-8">
        <button onclick="downloadFinalVideo(); document.getElementById('videoPreview').classList.add('hidden')" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white font-black text-3xl px-20 py-6 rounded-xl shadow-2xl">
          Download This Video Now
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUNO_API_KEY = "06a8686015a2294ef397a4ebe6e0bec2"; // Your key
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let finalVideoBlob = null;

    function showMessage(t, loading = false) {
      document.getElementById('messageText').textContent = t;
      document.getElementById('loading').classList.toggle('hidden', !loading);
      document.getElementById('messageBox').classList.remove('hidden');
    }

    // Lyrics Prompt
    function buildLyricsPrompt() {
      const title = document.getElementById('songTitle').value.trim() || "My Song";
      const duration = document.getElementById('songDuration').value;
      const genre = document.getElementById('musicGenre').value.trim() || "hip-hop";
      const verses = document.getElementById('numVerses').value;
      const concept = document.getElementById('songConcept').value.trim() || "inspiring story";
      let structure = `${verses} verses`;
      if (document.getElementById('hasChorus').checked) structure += ", catchy repeating chorus";
      if (document.getElementById('hasBridge').checked) structure += ", emotional bridge";
      if (document.getElementById('hasOutro').checked) structure += ", powerful outro";
      return `Write professional ${genre} song lyrics titled "${title}" (~${duration}s).
Concept: ${concept}
Structure: ${structure}
Format with [Verse 1], [Chorus], etc. Make it radio-ready and emotional.`;
    }

    function generateWithGrok() {
      const p = buildLyricsPrompt();
      navigator.clipboard.writeText(p);
      window.open('https://grok.x.ai', '_blank');
      showMessage('Prompt copied! Paste into Grok → generate → paste back here');
    }

    function generateWithGemini() {
      const p = buildLyricsPrompt();
      navigator.clipboard.writeText(p);
      window.open('https://gemini.google.com', '_blank');
      showMessage('Prompt copied! Paste into Gemini → generate → paste back here');
    }

    function usePastedLyrics() {
      const t = document.getElementById('pasteLyrics').value.trim();
      if (!t) return showMessage('Nothing pasted');
      document.getElementById('lyrics').value = t;
      showMessage('Lyrics loaded!');
    }

    }

    function copyLyrics() {
      const t = document.getElementById('lyrics').value;
      if (!t) return showMessage('No lyrics');
      navigator.clipboard.writeText(t);
      showMessage('Copied!');
    }

    // GENERATE SCENES
    function generateScenes() {
      {
      const lyrics = document.getElementById('lyrics').value.trim();
      if (!lyrics) return showMessage('Please add lyrics first!');
      document.getElementById('scenesContainer').innerHTML = '';
      const sections = lyrics.match(/\[.*?\]/g) || [];
      const lines = lyrics.split('\n');
      let currentSection = "Intro";
      lines.forEach(line => {
        if (line.trim().startsWith('[')) {
          currentSection = line.trim();
        } else if (line.trim()) {
          const div = document.createElement('div');
          div.className = 'bg-gray-800/80 rounded-2xl p-6 border border-yellow-600';
          div.innerHTML = `
            <h4 class="text-xl font-bold text-teal-300 mb-4">${currentSection}</h4>
            <input type="text" value="${currentSection}" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 mb-3">
            <input type="number" value="4" min="1" max="15" class="w-24 bg-gray-900 border border-gray-700 rounded-xl p-4"> images
          `;
          document.getElementById('scenesContainer').appendChild(div);
        }
      });
      if (document.querySelectorAll('#scenesContainer > div').length === 0) {
        const div = document.createElement('div');
        div.className = 'bg-gray-800/80 rounded-2xl p-6 border border-yellow-600';
        div.innerHTML = '<h4 class="text-xl font-bold text-teal-300 mb-4">Opening Scene</h4><input type="text" value="Opening Scene" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 mb-3"><input type="number" value="4" class="w-24 bg-gray-900 border border-gray-700 rounded-xl p-4"> images';
        document.getElementById('scenesContainer').appendChild(div);
      }
      showMessage('Scenes generated from lyrics!');
    }

    // GENERATE TIMELINE
    function generateTimeline() {
      const scenes = document.querySelectorAll('#scenesContainer > div');
      if (scenes.length === 0) return showMessage('Generate scenes first!');
      const duration = parseInt(document.getElementById('songDuration').value) || 180;
      const totalImages = Array.from(scenes).reduce((sum, s) => sum + parseInt(s.querySelector('input[type=number]').value || 1), 0);
      const secPerImage = duration / totalImages;
      let time = 0;
      document.getElementById('timelineContent').innerHTML = '';
      scenes.forEach((scene, i) => {
        const title = scene.querySelector('input[type=text]').value;
        const count = parseInt(scene.querySelector('input[type=number]').value);
        const sceneDur = count * secPerImage;
        const start = Math.floor(time / 60) + ':' + (Math.floor(time % 60) + '').padStart(2, '0');
        const end = Math.floor((time + sceneDur) / 60) + ':' + (Math.floor((time + sceneDur) % 60) + '').padStart(2, '0');
        document.getElementById('timelineContent').innerHTML += `
          <div class="bg-gray-900/70 p-6 rounded-xl border border-teal-600">
            <p class="font-bold text-teal-300">Scene ${i+1}: ${title}</p>
            <p class="text-sm mt-2">${start} → ${end} (${sceneDur.toFixed(1)}s)</p>
          </div>`;
        time += sceneDur;
      });
      document.getElementById('timelineOutput').classList.remove('hidden');
      showMessage('Timeline created!');
    }

    // GENERATE IMAGES
    async function generateImages() {
      const scenes = document.querySelectorAll('#scenesContainer > div');
      if (scenes.length === 0) return showMessage('Generate scenes first!');
      document.getElementById('imagesOutput').classList.remove('hidden');
      document.getElementById('imagesContent').innerHTML = '<p class="col-span-full text-center py-20 text-4xl text-teal-400">Creating visuals...</p>';
      document.getElementById('imagesContent').innerHTML = '';
      for (const scene of scenes) {
        const prompt = scene.querySelector('input[type=text]').value + ", cinematic music video, dramatic lighting, emotional, ultra realistic, 4k";
        const count = parseInt(scene.querySelector('input[type=number]').value) || 1;
        for (let i = 0; i < count; i++) {
          const seed = Date.now() + i * 10000;
          const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}&width=1024&height=576&seed=${seed}&nologo=true`;
          const img = document.createElement('img');
          img.src = url;
          img.className = "w-full rounded-2xl shadow-2xl cursor-pointer hover:scale-105 transition";
          img.onclick = () => {
            const a = document.createElement('a');
            a.href = url;
            a.download = `${prompt.slice(0,30)}-${i}.jpg`;
            a.click();
          };
          document.getElementById('imagesContent').appendChild(img);
        }
      }
      showMessage('All images generated!');
    }

    // GENERATE AUDIO (YOUR SUNO KEY WORKS!)
    async function generateAudio() {
      const lyrics = document.getElementById('lyrics').value.trim();
      if (!lyrics) return showMessage('Add lyrics first!');
      showMessage('Generating song via Suno... (30-90s)', true);
      const title = document.getElementById('songTitle').value || "My Song";
      const style = document.getElementById('customStyle').value || "cinematic hip-hop";

      try {
        const response = await fetch("https://api.suno.ai/v1/generate", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${SUNO_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: style,
            lyrics: lyrics,
            title: title,
            make_instrumental: false,
            model: "chirp-v3-5"
          })
        });

        const data = await response.json();
        const audioUrl = data[0]?.audio_url || data.audio_url;

        if (!audioUrl) throw new Error("No audio URL");

        document.getElementById('audioPlayer').src = audioUrl;
        document.getElementById('audioPlayer').classList.remove('hidden');
        document.getElementById('downloadAudioBtn').classList.remove('hidden');
        showMessage('Song ready! Playing now');
      } catch (e) {
        showMessage('Suno API error — try again in 30 seconds');
      }
    }

    // RENDER VIDEO
    async function renderVideo() {
      const images = document.querySelectorAll('#imagesContent img');
      const audio = document.getElementById('audioPlayer');
      if (images.length === 0 || !audio.src) return showMessage('Generate images + audio first!');

      showMessage('Rendering video... (30-90s)', true);
      if (!ffmpeg) {
        ffmpeg = createFFmpeg({ log: false });
        await ffmpeg.load();
      }

      // Load images
      for (let i = 0; i < images.length; i++) {
        const data = await fetchFile(images[i].src);
        ffmpeg.FS('writeFile', `img${i}.jpg', data);
      }

      // Load audio
      const audioData = await fetchFile(audio.src);
      ffmpeg.FS('writeFile', 'audio.mp3', audioData);

      // Create list
      let list = '';
      for (let i = 0; i < images.length; i++) list += `file 'img${i}.jpg'\nduration 4\n`;
      list += `file 'img${images.length-1}.jpg'`;
      ffmpeg.FS('writeFile', 'list.txt', list);

      // Render
      await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'list.txt', '-i', 'audio.mp3', '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-shortest', '-r', '30', 'output.mp4');

      const data = ffmpeg.FS('readFile', 'output.mp4');
      finalVideoBlob = new Blob([data.buffer], { type: 'video/mp4' });
      document.getElementById('previewVideo').src = URL.createObjectURL(finalVideoBlob);
      document.getElementById('videoPreview').classList.remove('hidden');
      document.getElementById('downloadVideoBtn').classList.remove('hidden');
      showMessage('Video ready!');
    }

    function downloadAudio() {
      const title = document.getElementById('songTitle').value.trim() || "My Song";
      const a = document.createElement('a');
      a.href = document.getElementById('audioPlayer').src;
      a.download = title.replace(/[^a-z0-9]/gi, '_') + ".mp3";
      a.click();
    }

    function downloadFinalVideo() {
      if (!finalVideoBlob) return showMessage('Generate video first');
      const title = document.getElementById('songTitle').value.trim() || "My Video";
      const a = document.createElement('a');
      a.href = URL.createObjectURL(finalVideoBlob);
      a.download = title.replace(/[^a-z0-9]/gi, '_') + ".mp4";
      a.click();
    }

    // Save/Load Project
    function saveProject() {
      const data = {
        title: document.getElementById('songTitle').value,
        duration: document.getElementById('songDuration').value,
        concept: document.getElementById('songConcept').value,
        genre: document.getElementById('musicGenre').value,
        verses: document.getElementById('numVerses').value,
        hasChorus: document.getElementById('hasChorus').checked,
        hasBridge: document.getElementById('hasBridge').checked,
        hasOutro: document.getElementById('hasOutro').checked,
        lyrics: document.getElementById('lyrics').value,
        audioUrl: document.getElementById('audioPlayer').src,
        images: Array.from(document.querySelectorAll('#imagesContent img')).map(i => i.src)
      };
      const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (data.title || "project") + "_rhythmvision.json";
      a.click();
      showMessage('Project saved!');
    }

    function loadProjectPrompt() {
      const input = document.createElement('input');
      input.type = 'file';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            document.getElementById('songTitle').value = data.title || '';
            document.getElementById('songDuration').value = data.duration || 180;
            document.getElementById('songConcept').value = data.concept || '';
            document.getElementById('musicGenre').value = data.genre || '';
            document.getElementById('numVerses').value = data.verses || 3;
            document.getElementById('hasChorus').checked = data.hasChorus !== false;
            document.getElementById('hasBridge').checked = data.hasBridge !== false;
            document.getElementById('hasOutro').checked = data.hasOutro !== false;
            document.getElementById('lyrics').value = data.lyrics || '';
            if (data.audioUrl) {
              document.getElementById('audioPlayer').src = data.audioUrl;
              document.getElementById('audioPlayer').classList.remove('hidden');
              document.getElementById('downloadAudioBtn').classList.remove('hidden');
            }
            showMessage('Project loaded!');
          } catch { showMessage('Invalid file'); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // UI
    document.getElementById('songDuration').addEventListener('input', e => {
      const s = parseInt(e.target.value) || 0;
      const m = Math.floor(s / 60);
      const sec = (s % 60).toString().padStart(2, '0');
      document.getElementById('durationDisplay').textContent = `${m}:${sec}`;
    });

    document.getElementById('tabGenerate').onclick = () => {
      document.getElementById('tabGenerate').classList.add('bg-yellow-600','text-black');
