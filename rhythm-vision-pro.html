<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Vision Pro • Full Access | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom, #0f172a, #1e1b4b); color: #e2e8f0; min-height: 100vh; }
    .spinner { border: 4px solid #334155; border-top: 4px solid #5eead4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-black/90 backdrop-blur border-b border-yellow-600">
    <div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="logo-1-sm.jpg" alt="Rhythm Deck" class="w-12 h-12 rounded-full">
        <div>
          <h1 class="text-4xl font-black text-teal-400">Rhythm Vision Pro</h1>
          <p class="text-xl text-yellow-400 font-bold">Full Access • Copy • Download • Export</p>
        </div>
      </div>
      <a href="profile-admin-pro.html" class="bg-yellow-600 hover:bg-yellow-700 px-8 py-4 rounded-xl font-bold text-xl text-black transition">
        Back to Pro Dashboard
      </a>
    </div>
  </header>

  <main class="flex-1 container max-w-5xl mx-auto p-6 mt-12">
    <div class="text-center mb-12 p-10 bg-gradient-to-r from-yellow-600 to-orange-600 rounded-3xl shadow-2xl border-4 border-yellow-400">
      <h2 class="text-5xl font-black mb-4">RHYTHM VISION PRO</h2>
      <p class="text-2xl">Full AI Music Video Creator — No Limits</p>
    </div>

    <!-- FULLY UNLOCKED — SAME LAYOUT AS FREE BUT NO BLOCKS -->
    <div class="bg-gray-900/90 backdrop-blur rounded-3xl shadow-2xl p-10 border border-yellow-600">
      <!-- All your inputs, tabs, lyrics, scenes, timeline, images — EXACT same code as free version -->
      <!-- BUT remove ALL .pro-overlay and .blocked classes -->
      <!-- Allow copy, right-click, download, edit -->

      <!-- Example: Lyrics textarea — FULLY EDITABLE -->
      <textarea id="lyrics" rows="14" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-6 text-lg"></textarea>

      <!-- Example: Image — DOWNLOADABLE -->
      <img src="generated-image.jpg" class="w-full rounded-2xl shadow-2xl cursor-pointer" onclick="downloadImage(this.src, 'scene1.jpg')">

      <!-- Add download buttons, copy buttons, export JSON, etc. -->
      <button onclick="copyToClipboard(document.getElementById('lyrics').value)" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-8 rounded-xl">
        Copy Lyrics
      </button>
      <button onclick="exportProject()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-8 rounded-xl">
        Export Project (.json)
      </button>
    </div>
  </main>

  <script>
    // SAME AI CODE (Hugging Face or your final choice)
    // But now allow full copy/download/export

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      alert("Copied to clipboard!");
    }

    function downloadImage(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
    }

    function exportProject() {
      const data = {
        title: document.getElementById('videoTitle').value,
        lyrics: document.getElementById('lyrics').value,
        scenes: Array.from(document.querySelectorAll('#scenesContainer > div')).map(d => ({
          title: d.querySelector('input').value,
          images: parseInt(d.querySelector('input[type=number]').value)
        }))
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'rhythm-vision-project.json';
      a.click();
    }
  </script>
</body>
</html>
