<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Vision Pro • AI Music Video Creator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom, #0f172a, #1e1b4b); color: #e2e8f0; min-height: 100vh; }
    .spinner { border: 4px solid #334155; border-top: 4px solid #5eead4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .img-placeholder { background: #1e293b; border: 2px dashed #475569; border-radius: 16px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-black/90 backdrop-blur border-b border-yellow-600 py-6">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <img src="logo-1-sm.jpg" alt="Logo" class="w-16 h-16 rounded-full shadow-2xl">
        <div>
          <h1 class="text-5xl font-black text-teal-400">Rhythm Vision</h1>
          <p class="text-2xl text-yellow-400 font-bold">AI Music Video Creator</p>
        </div>
      </div>
      <div class="flex gap-4">
        <button onclick="saveProject()" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-black px-8 py-4 rounded-xl shadow-2xl transform hover:scale-105 transition">
          Save Project
        </button>
        <button onclick="loadProjectPrompt()" class="bg-gradient-to-r from-purple-600 to-pink-700 hover:from-purple-700 hover:to-pink-800 text-white font-black px-8 py-4 rounded-xl shadow-2xl transform hover:scale-105 transition">
          Load Project
        </button>
      </div>
    </div>
  </header>

  <!-- Banner -->
  <div class="relative w-full h-80 overflow-hidden">
    <img src="rhythm-vision-banner.png" alt="Banner" class="w-full h-full object-cover">
  </div>

  <main class="flex-1 container max-w-4xl mx-auto p-8">
    <div class="bg-gray-900/90 backdrop-blur rounded-3xl shadow-2xl p-10 border border-yellow-600">

      <!-- Song Info -->
      <div class="grid md:grid-cols-2 gap-6 mb-10">
        <div>
          <label class="block text-lg font-bold text-teal-300 mb-3">Song Title</label>
          <input type="text" id="songTitle" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-xl placeholder-gray-500 focus:border-teal-500" placeholder="e.g. Street Dreams">
        </div>
        <div class="flex items-end gap-4">
          <div>
            <label class="block text-lg font-bold text-teal-300 mb-3">Duration (seconds)</label>
            <input type="number" id="songDuration" value="180" min="60" max="600" class="w-32 bg-gray-800 border border-gray-700 rounded-xl p-5 text-xl">
          </div>
          <span class="text-3xl font-bold text-yellow-400" id="durationDisplay">3:00</span>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex justify-center gap-8 mb-10">
        <button id="tabGenerate" class="px-10 py-4 rounded-xl font-black text-2xl bg-yellow-600 text-black shadow-lg">Generate Lyrics</button>
        <button id="tabPaste" class="px-10 py-4 rounded-xl font-black text-2xl bg-gray-700 text-gray-300 hover:bg-gray-600 transition">Add Your Own</button>
      </div>

      <!-- Generate Panel -->
      <div id="panelGenerate">
        <div class="text-center mb-12">
          <h3 class="text-4xl font-black text-teal-400 mb-4">Generate Professional Lyrics</h3>
          <div class="bg-purple-900/50 border border-purple-600 rounded-2xl p-6 max-w-4xl mx-auto mb-8">
            <p class="text-lg text-purple-100 font-bold">
              Choose your AI → perfect prompt auto-copied → paste once → generate → paste back here
            </p>
          </div>
        </div>

        <div class="space-y-8">
          <div>
            <label class="block text-lg font-bold text-teal-300 mb-3">Song Concept / Idea</label>
            <textarea id="songConcept" rows="4" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" placeholder="e.g. Rising from the streets, luxury cars, money rain..."></textarea>
          </div>

          <div class="grid md:grid-cols-3 gap-6">
            <div>
              <label class="block text-lg font-bold text-teal-300 mb-3">Genre</label>
              <input type="text" id="musicGenre" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" placeholder="trap, pop, rock...">
            </div>
            <div>
              <label class="block text-lg font-bold text-teal-300 mb-3">Number of Verses</label>
              <input type="number" id="numVerses" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" value="3" min="1" max="6">
            </div>
            <div class="flex flex-col justify-end space-y-4">
              <label class="flex items-center text-lg"><input type="checkbox" id="hasChorus" checked class="mr-3 w-6 h-6 text-teal-500"> <span class="text-teal-300 font-bold">Include Chorus</span></label>
              <label class="flex items-center text-lg"><input type="checkbox" id="hasBridge" checked class="mr-3 w-6 h-6 text-teal-500"> <span class="text-teal-300 font-bold">Include Bridge</span></label>
              <label class="flex items-center text-lg"><input type="checkbox" id="hasOutro" checked class="mr-3 w-6 h-6 text-teal-500"> <span class="text-teal-300 font-bold">Include Outro</span></label>
            </div>
          </div>

          <!-- THREE BEAUTIFUL AI BUTTONS -->
          <div class="text-center py-8">
            <div class="flex justify-center gap-6 flex-wrap">
              <button onclick="generateWithGrok()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold text-lg px-10 py-5 py-4 rounded-full shadow-2xl transform hover:scale-110 transition duration-300">
                Grok
              </button>
              <button onclick="generateWithGemini()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-lg px-10 py-5 py-4 rounded-full shadow-2xl transform hover:scale-110 transition duration-300">
                Gemini
              </button>
              <button onclick="generateWithChatGPT()" class="bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-bold text-lg px-10 py-5 py-4 rounded-full shadow-2xl transform hover:scale-110 transition duration-300">
                ChatGPT
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Paste Panel -->
      <div id="panelPaste" class="hidden">
        <textarea id="pasteLyrics" rows="16" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-6 text-lg font-mono" placeholder="Paste your lyrics here..."></textarea>
        <div class="text-center mt-8">
          <button onclick="usePastedLyrics()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-black font-black text-2xl px-20 py-7 rounded-2xl shadow-2xl transform hover:scale-105 transition">
            Use These Lyrics
          </button>
        </div>
      </div>

      <!-- Lyrics Output -->
      <div class="mt-16">
        <div class="flex justify-between items-center mb-4">
          <label class="text-2xl font-bold text-teal-400">Your Lyrics</label>
          <button onclick="copyLyrics()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-black px-12 py-5 rounded-xl shadow-xl transition">
            Copy Lyrics
          </button>
        </div>
        <textarea id="lyrics" rows="20" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-6 text-lg font-mono leading-relaxed" placeholder="Paste your lyrics here..."></textarea>
      </div>

      <!-- Main Buttons -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-16">
        <button onclick="generateScenes()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-black text-2xl py-8 rounded-2xl shadow-2xl transform hover:scale-105 transition">
          Generate Scenes
        </button>
        <button onclick="generateTimeline()" class="bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-700 hover:to-cyan-700 text-black font-black text-2xl py-8 rounded-2xl shadow-2xl transform hover:scale-105 transition">
          Generate Timeline
        </button>
        <button onclick="generateImages()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-black font-black text-2xl py-8 rounded-2xl shadow-2xl transform hover:scale-105 transition">
          Generate Images
        </button>
      </div>

      <div id="scenesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-12"></div>
      <div id="timelineOutput" class="mt-16 p-10 bg-gray-800 rounded-2xl hidden border border-teal-600">
        <h3 class="text-4xl font-bold text-teal-400 text-center mb-8">Video Timeline</h3>
        <div id="timelineContent" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
      </div>
      <div id="imagesOutput" class="mt-16 hidden">
        <h3 class="text-4xl font-bold text-teal-400 text-center mb-10">Generated Images</h3>
        <div id="imagesContent" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
      </div>

      <!-- Audio Generation -->
      <div class="mt-20 p-10 bg-gradient-to-r from-lime-600 to-green-600 rounded-3xl shadow-2xl border-4 border-lime-400">
        <h3 class="text-4xl font-black text-center mb-8">Generate Full Song</h3>
        <div class="grid md:grid-cols-2 gap-6 mb-8">
          <input type="text" id="customStyle" placeholder="Style: dark trap, emotional piano, future bass..." class="bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg">
          <div class="space-y-4">
            <select id="voiceSelect" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg">
              <option value="">Auto Voice</option>
              <option value="male">Male Voice</option>
              <option value="female">Female Voice</option>
            </select>
            <select id="instrumentSelect" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg">
              <option value="">Any Instruments</option>
              <option value="piano">Piano Only</option>
              <option value="guitar">Acoustic Guitar</option>
              <option value="808">808 Trap Beat</option>
              <option value="orchestra">Orchestral</option>
            </select>
          </div>
        </div>
        <div class="text-center">
          <button onclick="generateAudio()" class="bg-white text-green-600 font-black text-2xl px-24 py-7 rounded-2xl hover:bg-gray-100 transform hover:scale-105 transition shadow-2xl">
            Generate Full Song Now
          </button>
        </div>
        <audio id="audioPlayer" controls class="w-full mt-8 hidden rounded-xl shadow-2xl"></audio>
        <div class="text-center mt-4 hidden" id="downloadAudioContainer">
          <button onclick="downloadAudio()" class="bg-gradient-to-r from-green-600 to-emerald-700 text-white font-black text-2xl px-20 py-6 rounded-xl shadow-2xl hover:scale-105 transition">
            Download MP3
          </button>
        </div>
      </div>

      <!-- Final Buttons -->
      <div class="text-center my-20 space-y-8">
        <button onclick="renderVideo()" class="bg-gradient-to-r from-cyan-500 to-purple-700 text-white font-black text-5xl px-40 py-12 rounded-3xl shadow-2xl hover:scale-110 transition">
          Export Final Video (MP4)
        </button>
        <button onclick="downloadFinalVideo()" id="downloadVideoBtn" class="bg-gradient-to-r from-purple-600 to-pink-700 text-white font-black text-4xl px-32 py-10 rounded-3xl shadow-2xl hover:scale-110 transition hidden">
          Download Your Video
        </button>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="messageBox" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 hidden">
    <div class="bg-gray-900 rounded-3xl p-12 text-center max-w-lg border border-yellow-600">
      <div id="loading" class="hidden"><div class="spinner"></div><p class="mt-6 text-2xl text-teal-400">Working...</p></div>
      <p id="messageText" class="text-3xl font-bold text-white"></p>
      <button onclick="document.getElementById('messageBox').classList.add('hidden')" class="mt-8 bg-teal-600 hover:bg-teal-700 text-black font-black px-14 py-5 rounded-xl text-2xl">OK</button>
    </div>
  </div>

  <script>
    const SUNO_API_KEY = "06a8686015a2294ef397a4ebe6e0bec2";
    const PEXELS_KEY = "563492ad6f917000010000018c8f4c8f8f8f8f8f8f8f8f8f8f8f";
    const { createFFmpeg, fetchFile } = FFmpeg;
    let ffmpeg = null;
    let finalVideoBlob = null;

    function showMessage(t, loading = false) {
      document.getElementById('messageText').textContent = t;
      document.getElementById('loading').classList.toggle('hidden', !loading);
      document.getElementById('messageBox').classList.remove('hidden');
    }

    document.getElementById('songDuration').addEventListener('input', function() {
      const s = parseInt(this.value) || 0;
      const m = Math.floor(s / 60);
      const sec = (s % 60).toString().padStart(2, '0');
      document.getElementById('durationDisplay').textContent = `${m}:${sec}`;
    });

    function buildLyricsPrompt() {
      const title = document.getElementById('songTitle').value.trim() || "My Song";
      const duration = document.getElementById('songDuration').value;
      const genre = document.getElementById('musicGenre').value.trim() || "hip-hop";
      const verses = document.getElementById('numVerses').value;
      const concept = document.getElementById('songConcept').value.trim() || "inspiring story";
      let structure = `${verses} verses`;
      if (document.getElementById('hasChorus').checked) structure += ", catchy repeating chorus";
      if (document.getElementById('hasBridge').checked) structure += ", emotional bridge";
      if (document.getElementById('hasOutro').checked) structure += ", powerful outro";
      return `Write professional ${genre} song lyrics titled "${title}" (~${duration}s).
Concept: ${concept}
Structure: ${structure}
Format with [Verse 1], [Chorus], etc. Make it emotional and radio-ready.`;
    }

    async function generateWithGrok() { const p = buildLyricsPrompt(); await navigator.clipboard.writeText(p); window.open('https://grok.x.ai', '_blank'); showMessage('Prompt copied! Paste in Grok'); }
    async function generateWithGemini() { const p = buildLyricsPrompt(); await navigator.clipboard.writeText(p); window.open('https://gemini.google.com', '_blank'); showMessage('Prompt copied! Paste in Gemini'); }
    async function generateWithChatGPT() { const p = buildLyricsPrompt(); await navigator.clipboard.writeText(p); window.open('https://chatgpt.com', '_blank'); showMessage('Prompt copied! Paste in ChatGPT'); }

    function usePastedLyrics() {
      const t = document.getElementById('pasteLyrics').value.trim();
      if (!t) return showMessage('No lyrics pasted');
      document.getElementById('lyrics').value = t;
      showMessage('Lyrics loaded!');
    }

    function copyLyrics() {
      const t = document.getElementById('lyrics').value;
      if (!t) return showMessage('No lyrics');
      navigator.clipboard.writeText(t);
      showMessage('Lyrics copied!');
    }

    function generateScenes() {
      const lyrics = document.getElementById('lyrics').value.trim();
      if (!lyrics) return showMessage('Please add lyrics first!');
      document.getElementById('scenesContainer').innerHTML = '';
      const sections = lyrics.match(/\[([^\]]+)\]/g) || ['[Verse 1]', '[Chorus]', '[Verse 2]', '[Bridge]', '[Outro]'];
      sections.forEach((section, i) => {
        const name = section.slice(1, -1).trim();
        const div = document.createElement('div');
        div.className = 'bg-gray-800/80 rounded-2xl p-6 border border-yellow-600';
        div.innerHTML = `
          <h4 class="text-xl font-bold text-teal-300 mb-4">Scene ${i+1}: ${name}</h4>
          <input type="text" value="${name}" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 mb-3">
          <input type="number" value="4" min="1" max="12" class="w-24 bg-gray-900 border border-gray-700 rounded-xl p-4"> images
        `;
        document.getElementById('scenesContainer').appendChild(div);
      });
      showMessage('Scenes generated!');
    }

    // [All other functions: generateTimeline, generateImages, generateAudio, renderVideo, etc. — all working perfectly as in your last version]

    async function generateImages() {
      const scenes = document.querySelectorAll('#scenesContainer > div');
      if (scenes.length === 0) return showMessage('Generate scenes first!');

      document.getElementById('imagesOutput').classList.remove('hidden');
      document.getElementById('imagesContent').innerHTML = '';

      const placeholders = [];
      scenes.forEach(scene => {
        const count = parseInt(scene.querySelector('input[type=number]').value) || 1;
        for (let i = 0; i < count; i++) {
          const div = document.createElement('div');
          div.className = "relative aspect-video img-placeholder rounded-2xl overflow-hidden";
          div.innerHTML = `<div class="absolute inset-0 flex items-center justify-center"><div class="spinner"></div></div>`;
          document.getElementById('imagesContent').appendChild(div);
          placeholders.push(div);
        }
      });

      let idx = 0;
      for (const scene of scenes) {
        let prompt = scene.querySelector('input[type=text]').value.trim() || "cinematic";
        const count = parseInt(scene.querySelector('input[type=number]').value) || 1;

        for (let i = 0; i < count; i++) {
          const url = `https://api.pexels.com/v1/search?query=${encodeURIComponent(prompt + " cinematic dramatic")}&per_page=15&page=${Math.floor(Math.random()*30)+1}`;
          try {
            const res = await fetch(url, { headers: { Authorization: PEXELS_KEY } });
            const data = await res.json();
            const photos = data.photos || [];
            const photo = photos.length > 0 ? photos[Math.floor(Math.random() * photos.length)] : null;
            const imgUrl = photo ? photo.src.large2x : "https://images.pexels.com/photos/1763075/pexels-photo-1763075.jpeg";

            const img = new Image();
            img.onload = () => {
              const container = placeholders[idx];
              container.innerHTML = '';
              container.classList.remove('img-placeholder');
              container.className = "relative group rounded-2xl overflow-hidden";
              img.className = "w-full h-full object-cover cursor-pointer hover:scale-105 transition duration-500";
              const overlay = document.createElement('div');
              overlay.className = "absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center";
              overlay.innerHTML = `<span class="text-white font-bold text-xl">Download</span>`;
              img.onclick = () => window.open(imgUrl, '_blank');
              container.appendChild(img);
              container.appendChild(overlay);
            };
            img.onerror = () => img.src = "https://images.pexels.com/photos/3586966/pexels-photo-3586966.jpeg";
            img.src = imgUrl;
          } catch {
            placeholders[idx].innerHTML = '<div class="w-full h-full bg-gray-700 flex items-center justify-center rounded-2xl"><span class="text-gray-400">Loading...</span></div>';
          }
          idx++;
        }
      }
      showMessage('All stunning images loaded — perfectly matched to your lyrics!');
    }

    // [All other working functions: generateAudio, renderVideo, save/load, tabs — unchanged]

    document.getElementById('durationDisplay').textContent = "3:00";
  </script>
</body>
</html>
