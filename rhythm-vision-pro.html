<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Vision • AI Music Video Creator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(to bottom, #0f172a, #1e1b4b); color: #e2e8f0; min-height: 100vh; }
    .spinner { border: 4px solid #334155; border-top: 4px solid #5eead4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    audio { width: 100%; margin-top: 20px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- YOUR ORIGINAL HEADER + LOGO -->
  <header class="bg-black/90 backdrop-blur border-b border-yellow-600 py-6">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <img src="logo-1-sm.jpg" alt="Logo" class="w-16 h-16 rounded-full shadow-2xl">
        <div>
          <h1 class="text-5xl font-black text-teal-400">Rhythm Vision</h1>
          <p class="text-2xl text-yellow-400 font-bold">AI Music Video Creator</p>
        </div>
      </div>
      <div class="flex gap-4">
        <button onclick="saveProject()" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-black px-8 py-4 rounded-xl shadow-2xl transform hover:scale-105 transition">
          Save Project
        </button>
        <button onclick="loadProjectPrompt()" class="bg-gradient-to-r from-purple-600 to-pink-700 hover:from-purple-700 hover:to-pink-800 text-white font-black px-8 py-4 rounded-xl shadow-2xl transform hover:scale-105 transition">
          Load Project
        </button>
      </div>
    </div>
  </header>

  <!-- YOUR ORIGINAL BANNER -->
  <div class="relative w-full h-80 overflow-hidden">
    <img src="rhythm-vision-banner.png" alt="Banner" class="w-full h-full object-cover">
  </div>

  <main class="flex-1 container max-w-4xl mx-auto p-8">
    <div class="bg-gray-900/90 backdrop-blur rounded-3xl shadow-2xl p-10 border border-yellow-600">

      <!-- Song Title & Duration (seconds only – NO minutes display) -->
      <div class="grid md:grid-cols-2 gap-6 mb-10">
        <div>
          <label class="block text-lg font-bold text-teal-300 mb-3">Song Title</label>
          <input type="text" id="songTitle" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-xl placeholder-gray-500 focus:border-teal-500" placeholder="e.g. Street Dreams">
        </div>
        <div>
          <label class="block text-lg font-bold text-teal-300 mb-3">Duration (seconds)</label>
          <input type="number" id="songDuration" value="180" min="60" max="600" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-5 text-xl">
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex justify-center gap-8 mb-10">
        <button id="tabGenerate" class="px-12 py-4 rounded-xl font-black text-2xl bg-yellow-600 text-black shadow-lg">Generate Lyrics</button>
        <button id="tabPaste" class="px-12 py-4 rounded-xl font-black text-2xl bg-gray-700 text-gray-300 hover:bg-gray-600 transition">Paste Lyrics</button>
      </div>

      <!-- Generate Lyrics Panel -->
      <div id="panelGenerate" class="space-y-8">
        <textarea id="songConcept" rows="4" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-6 text-lg" placeholder="Song idea: Rising from the streets, luxury cars, money rain..."></textarea>
        <div class="grid md:grid-cols-3 gap-6">
          <input type="text" id="musicGenre" class="bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" placeholder="Genre (trap, pop, rock...)" value="trap">
          <input type="number" id="numVerses" class="bg-gray-800 border border-gray-700 rounded-xl p-5 text-lg" value="3" min="1" max="6">
          <div class="flex gap-6 items-end">
            <label><input type="checkbox" id="hasChorus" checked> Chorus</label>
            <label><input type="checkbox" id="hasBridge" checked> Bridge</label>
            <label><input type="checkbox" id="hasOutro" checked> Outro</label>
          </div>
        </div>
        <div class="text-center space-x-6">
          <button onclick="copyPrompt('grok')" class="bg-cyan-600 hover:bg-cyan-700 px-10 py-5 rounded-full text-xl font-bold">Grok</button>
          <button onclick="copyPrompt('gemini')" class="bg-emerald-600 hover:bg-emerald-700 px-10 py-5 rounded-full text-xl font-bold">Gemini</button>
          <button onclick="copyPrompt('chatgpt')" class="bg-purple-600 hover:bg-purple-700 px-10 py-5 rounded-full text-xl font-bold">ChatGPT</button>
        </div>
      </div>

      <!-- Paste Lyrics Panel -->
      <div id="panelPaste" class="hidden">
        <textarea id="pasteLyrics" rows="16" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-6 font-mono text-lg" placeholder="Paste your lyrics here with [Verse 1], [Chorus], etc."></textarea>
        <div class="text-center mt-8">
          <button onclick="usePastedLyrics()" class="bg-emerald-600 hover:bg-emerald-700 px-20 py-6 rounded-2xl text-black font-black text-2xl">Use These Lyrics</button>
        </div>
      </div>

      <!-- Lyrics -->
      <div class="mt-16">
        <textarea id="lyrics" rows="20" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-6 font-mono text-lg leading-relaxed" placeholder="Your lyrics will appear here..."></textarea>
      </div>

      <!-- Main Buttons -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-8 my-16">
        <button onclick="generateScenes()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-black text-2xl py-8 rounded-2xl shadow-2xl transform hover:scale-105 transition">Generate Scenes</button>
        <button onclick="generateMusic()" class="bg-gradient-to-r from-pink-500 to-orange-500 hover:from-pink-600 hover:to-orange-600 text-white font-black text-2xl py-8 rounded-2xl shadow-2xl transform hover:scale-105 transition">Generate Music (Suno)</button>
        <button onclick="generateImages()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-black font-black text-2xl py-8 rounded-2xl shadow-2xl transform hover:scale-105 transition">Generate Images</button>
        <button onclick="renderVideo()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-black text-2xl py-8 rounded-2xl shadow-2xl transform hover:scale-110 transition">Render Video</button>
      </div>

      <!-- Audio Player -->
      <div id="audioSection" class="hidden text-center my-12">
        <audio id="audioPlayer" controls class="w-full max-w-3xl mx-auto"></audio>
        <button onclick="downloadAudio()" class="mt-6 bg-green-600 hover:bg-green-700 px-12 py-4 rounded-xl text-xl font-bold">Download MP3</button>
      </div>

      <!-- Scenes -->
      <div id="scenesContainer" class="grid md:grid-cols-2 gap-6 my-12"></div>

      <!-- Images -->
      <div id="imagesOutput" class="hidden my-16">
        <h3 class="text-4xl font-bold text-teal-400 text-center mb-10">Generated Images</h3>
        <div id="imagesContent" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
      </div>

      <!-- Download Video -->
      <div id="downloadVideoSection" class="text-center my-20 hidden">
        <a id="videoDownloadLink" class="inline-block bg-gradient-to-r from-green-500 to-emerald-600 text-white font-black text-5xl px-32 py-12 rounded-3xl shadow-2xl hover:scale-110 transition transform">
          DOWNLOAD YOUR MUSIC VIDEO
        </a>
      </div>

    </div>
  </main>

  <!-- Loading Modal -->
  <div id="loadingModal" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50 hidden">
    <div class="text-center">
      <div class="spinner mb-8"></div>
      <p class="text-4xl font-bold text-teal-400" id="loadingText">Working...</p>
    </div>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: false });
    let audioUrl = '';
    let videoBlob = null;

    function showLoading(t) {
      document.getElementById('loadingText').textContent = t;
      document.getElementById('loadingModal').classList.remove('hidden');
    }
    function hideLoading() {
      document.getElementById('loadingModal').classList.add('hidden');
    }

    // Copy lyrics prompt
    function copyPrompt(ai) {
      const title = document.getElementById('songTitle').value || "My Song";
      const concept = document.getElementById('songConcept').value || "epic story";
      const genre = document.getElementById('musicGenre').value || "hip-hop";
      const verses = document.getElementById('numVerses').value;
      const duration = document.getElementById('songDuration').value || "180";
      let structure = `${verses} verses`;
      if (document.getElementById('hasChorus').checked) structure += ", catchy chorus";
      if (document.getElementById('hasBridge').checked) structure += ", bridge";
      if (document.getElementById('hasOutro').checked) structure += ", outro";

      const prompt = `Write professional ${genre} lyrics for a song titled "${title}" (~${duration} seconds).
Concept: ${concept}
Structure: ${structure}
Make it emotional and radio-ready. Use [Verse 1], [Chorus], etc.`;

      navigator.clipboard.writeText(prompt);
      alert("Prompt copied to clipboard! Paste in " + (ai === 'grok' ? 'Grok' : ai === 'gemini' ? 'Gemini' : 'ChatGPT'));
    }

    function usePastedLyrics() {
      const t = document.getElementById('pasteLyrics').value.trim();
      if (t) document.getElementById('lyrics').value = t;
    }

    // Tab switching
    document.getElementById('tabGenerate').onclick = () => {
      document.getElementById('panelGenerate').classList.remove('hidden');
      document.getElementById('panelPaste').classList.add('hidden');
      document.getElementById('tabGenerate').classList.add('bg-yellow-600', 'text-black');
      document.getElementById('tabPaste').classList.remove('bg-yellow-600', 'text-black');
    };
    document.getElementById('tabPaste').onclick = () => {
      document.getElementById('panelPaste').classList.remove('hidden');
      document.getElementById('panelGenerate').classList.add('hidden');
      document.getElementById('tabPaste').classList.add('bg-yellow-600', 'text-black');
      document.getElementById('tabGenerate').classList.remove('bg-yellow-600', 'text-black');
    };

    // Generate Scenes
    function generateScenes() {
      const lyrics = document.getElementById('lyrics').value.trim();
      if (!lyrics) return alert("Add lyrics first!");
      document.getElementById('scenesContainer').innerHTML = '';
      const sections = lyrics.match(/\[([^\]]+)\][\s\S]*?(?=\[|$)/g) || [lyrics];

      sections.forEach((section, i) => {
        const header = section.match(/\[([^\]]+)\]/)?.[1]?.trim() || `Scene ${i+1}`;
        const content = section.replace(/\[([^\]]+)\]/, '').trim().toLowerCase();

        let desc = 'cinematic dramatic music video';
        if (content.includes('street') || content.includes('city')) desc = 'urban street night city lights cars luxury';
        if (content.includes('love') || content.includes('heart')) desc = 'romantic couple love emotional';
        if (content.includes('money') || content.includes('cash')) desc = 'money rain luxury cars gold jewelry';
        if (content.includes('party') || content.includes('club')) desc = 'party dancing club lights crowd';
        if (content.includes('dream')) desc = 'surreal dream fantasy floating';

        const div = document.createElement('div');
        div.className = 'bg-gray-800/80 rounded-2xl p-6 border border-yellow-600';
        div.innerHTML = `
          <h4 class="text-xl font-bold text-teal-300 mb-3">Scene ${i+1}: ${header}</h4>
          <textarea class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-sm" rows="2" data-prompt>${desc}</textarea>
        `;
        document.getElementById('scenesContainer').appendChild(div);
      });
    }

    // Generate Music (Suno API)
    async function generateMusic() {
      const lyrics = document.getElementById('lyrics').value.trim();
      if (!lyrics) return alert("Add lyrics first!");

      showLoading("Generating music... (30–90 sec)");

      const style = prompt("Music style?", "dark trap, future bass, emotional piano") || "dark trap";
      const title = document.getElementById('songTitle').value || "My Song";

      try {
        const res = await fetch("https://api.suno.ai/v1/generate", {
          method: "POST",
          headers: { "Authorization": "Bearer 06a8686015a2294ef397a4ebe6e0bec2", "Content-Type": "application/json" },
          body: JSON.stringify({ model: "chirp-v3-5", prompt: style, lyrics, title, make_instrumental: false })
        });
        const data = await res.json();
        const url = data[0]?.audio_url || data.audio_url;
        if (!url) throw "";
        document.getElementById('audioPlayer').src = url;
        document.getElementById('audioSection').classList.remove('hidden');
        audioUrl = url;
        hideLoading();
        alert("Music ready! Play it below");
      } catch { hideLoading(); alert("Suno busy — try again in 30s"); }
    }

    function downloadAudio() {
      if (!audioUrl) return;
      const a = document.createElement('a');
      a.href = audioUrl;
      a.download = (document.getElementById('songTitle').value || "song") + ".mp3";
      a.click();
    }

    // Generate Images (Unsplash – instant & perfect)
    async function generateImages() {
      const scenes = document.querySelectorAll('#scenesContainer > div');
      if (scenes.length === 0) return alert("Generate scenes first!");

      document.getElementById('imagesOutput').classList.remove('hidden');
      document.getElementById('imagesContent').innerHTML = '';

      scenes.forEach((scene, i) => {
        const prompt = scene.querySelector('textarea').value.trim().replace(/[^a-z0-9\s]/gi, '').replace(/\s+/g, '+');
        for (let j = 0; j < 6; j++) {
          const div = document.createElement('div');
          div.className = "aspect-video rounded-2xl overflow-hidden bg-gray-800";
          div.innerHTML = `<div class="w-full h-full flex items-center justify-center"><div class="spinner"></div></div>`;
          document.getElementById('imagesContent').appendChild(div);

          const img = new Image();
          img.onload = () => div.innerHTML = `<img src="${img.src}" class="w-full h-full object-cover">`;
          img.src = `https://source.unsplash.com/featured/1200x675/?${prompt}&sig=${Date.now()+i+j}`;
        }
      });
    }

    // Render Video with Audio
    async function renderVideo() {
      const imgs = document.querySelectorAll('#imagesContent img');
      const audio = document.getElementById('audioPlayer');
      if (imgs.length === 0 || !audio.src) return alert("Generate images + music first!");

      showLoading("Rendering video... (30–90 sec)");

      if (!ffmpeg.isLoaded()) await ffmpeg.load();

      for (let i = 0; i < imgs.length; i++) {
        const data = await fetchFile(imgs[i].src);
        ffmpeg.FS('writeFile', `img${i}.jpg`, data);
      }

      const audioData = await fetchFile(audio.src);
      ffmpeg.FS('writeFile', 'audio.mp3', audioData);

      let list = '';
      for (let i = 0; i < imgs.length; i++) list += `file 'img${i}.jpg'\nduration 4\n`;
      list += `file 'img${imgs.length-1}.jpg'`;
      ffmpeg.FS('writeFile', 'list.txt', list);

      await ffmpeg.run(
        '-f', 'concat', '-safe', '0', '-i', 'list.txt',
        '-i', 'audio.mp3',
        '-c:v', 'libx264', '-c:a', 'aac', '-pix_fmt', 'yuv420p', '-r', '30', '-shortest',
        'output.mp4'
      );

      const data = ffmpeg.FS('readFile', 'output.mp4');
      videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
      const url = URL.createObjectURL(videoBlob);

      document.getElementById('videoDownloadLink').href = url;
      document.getElementById('videoDownloadLink').download = (document.getElementById('songTitle').value || "MyVideo") + ".mp4";
      document.getElementById('downloadVideoSection').classList.remove('hidden');

      hideLoading();
      alert("VIDEO READY! Click the green button");
    }

    // Save / Load
    function saveProject() {
      const data = {
        title: document.getElementById('songTitle').value,
        duration: document.getElementById('songDuration').value,
        lyrics: document.getElementById('lyrics').value,
        audioUrl: audioUrl
      };
      const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "rhythmvision_project.json";
      a.click();
    }

    function loadProjectPrompt() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = ev => {
          const d = JSON.parse(ev.target.result);
          document.getElementById('songTitle').value = d.title || '';
          document.getElementById('songDuration').value = d.duration || 180;
          document.getElementById('lyrics').value = d.lyrics || '';
          if (d.audioUrl) {
            audioUrl = d.audioUrl;
            document.getElementById('audioPlayer').src = audioUrl;
            document.getElementById('audioSection').classList.remove('hidden');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }
  </script>
</body>
</html>
