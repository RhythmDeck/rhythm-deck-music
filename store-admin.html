<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merch Admin | Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .spinner {border:4px solid #f3f3f3;border-top:4px solid #10b981;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite;margin-left:8px;display:inline-block;}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .menu-btn { padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 0.95rem; }
    .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
    .home-btn { background: linear-gradient(to right, #22c55e, #16a34a); color: white; }
    .about-btn { background: linear-gradient(to right, #3b82f6, #2563eb); color: white; }
    .benefits-btn { background: linear-gradient(to right, #f59e0b, #d97706); color: white; }
    .pricing-btn { background: linear-gradient(to right, #ec4899, #db2777); color: white; }
    .contact-btn { background: linear-gradient(to right, #8b5cf6, #7c3aed); color: white; }
    .merch-btn { background: linear-gradient(to right, #f97316, #ea580c); color: white; }
    .featured-btn { background: linear-gradient(to right, #8b5cf6, #6366f1); color: white; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">
  <!-- HEADER -->
  <header class="bg-black text-white p-4 flex flex-col sm:flex-row justify-between items-center shadow-lg gap-4">
    <div class="flex items-center space-x-3">
      <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo" class="w-10 h-10 rounded-full">
      <div>
        <h1 class="text-2xl font-bold tracking-wide">RHYTHM DECK</h1>
        <p class="text-sm text-gray-300">Merch Admin</p>
      </div>
    </div>
    <nav class="flex flex-col items-end gap-4 sm:gap-3">
      <div class="flex flex-wrap justify-end items-center gap-2 sm:gap-3">
        <a href="index.html" class="menu-btn home-btn">Home</a>
        <a href="featured-artists.html" class="menu-btn featured-btn">Featured Artists</a>
        <a href="about.html" class="menu-btn about-btn">About</a>
        <a href="benefits.html" class="menu-btn benefits-btn">Benefits</a>
        <a href="contact.html" class="menu-btn contact-btn">Contact</a>
        <a href="store.html" class="menu-btn merch-btn">Rhythm Deck Merch</a>
        <a href="login.html" class="bg-white text-black px-5 py-2 rounded-lg hover:bg-gray-200 text-base font-medium">Login</a>
        <a href="early-signup.html" class="bg-green-500 text-white px-5 py-2 rounded-lg hover:bg-green-400 text-base font-medium">Sign Up</a>
      </div>
    </nav>
  </header>

  <!-- BANNER -->
  <section class="relative bg-black overflow-hidden" style="aspect-ratio: 16 / 9; max-height: 700px;">
    <div id="userBannerSection" class="w-full h-full bg-cover bg-center bg-no-repeat" style="background-image: url('merch-banner.jpg'); background-size: contain; background-position: center;"></div>
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
      <p class="text-white text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black text-center drop-shadow-[0_6px_12px_rgba(0,0,0,0.9)] px-4">Your Merch Store Admin</p>
    </div>
    <div class="absolute bottom-8 left-6 sm:left-8 z-10">
      <img id="currentLogoPreview" src="logo-1-sm.jpg" alt="Your Store Logo" class="w-28 h-28 sm:w-36 sm:h-36 md:w-44 md:h-44 rounded-full object-cover border-8 border-white shadow-2xl">
    </div>
    <div class="absolute bottom-8 left-44 sm:left-56 z-20">
      <label class="bg-white bg-opacity-90 hover:bg-opacity-100 text-black font-bold py-2 px-4 text-sm rounded-lg cursor-pointer transition shadow-lg flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        Upload Logo
        <input type="file" id="logoUpload" accept="image/*" class="hidden">
      </label>
      <p id="logoStatus" class="text-white font-bold mt-1 text-sm hidden">Updated!</p>
    </div>
    <div class="absolute bottom-8 right-6 z-20">
      <label class="bg-white bg-opacity-90 hover:bg-opacity-100 text-black font-bold py-2 px-4 text-sm rounded-lg cursor-pointer transition shadow-lg flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        Upload Banner
        <input type="file" id="bannerUpload" accept="image/*" class="hidden">
      </label>
      <p id="bannerStatus" class="text-white font-bold mt-1 text-sm hidden">Updated!</p>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="flex-grow max-w-6xl mx-auto py-12 px-6">
    <div class="mb-8 flex justify-end">
      <a href="store.html" target="_blank" class="inline-flex items-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold px-8 py-3 rounded-xl shadow-lg transition">
        👁 View Public Store
      </a>
    </div>

    <!-- ADD/EDIT FORM -->
    <section class="bg-white rounded-2xl shadow-2xl p-10 mb-12">
      <h2 class="text-4xl font-black text-orange-800 mb-6" id="formTitle">Add New Product</h2>
      <form id="addProductForm" class="space-y-6">
        <input type="hidden" id="editProductId">

        <div>
          <label class="block text-gray-700 font-bold mb-2">Product Name</label>
          <input type="text" id="productName" required class="w-full border border-gray-300 rounded-lg p-3">
        </div>

        <div>
          <label class="block text-gray-700 font-bold mb-2">Category</label>
          <select id="productCategory" required class="w-full border border-gray-300 rounded-lg p-3">
            <option value="apparel">👕 Apparel</option>
            <option value="accessories">🕶️ Accessories</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-700 font-bold mb-2">Description</label>
          <textarea id="productDescription" required class="w-full border border-gray-300 rounded-lg p-3 h-32"></textarea>
        </div>

        <div>
          <label class="block text-gray-700 font-bold mb-2">Main Product Image</label>
          <input type="file" id="productImage" accept="image/*" class="w-full">
        </div>

        <div class="space-y-6">
          <h3 class="text-2xl font-bold text-orange-700">Sizes / Colors & Prices</h3>
          <div id="variantsContainer" class="space-y-4"></div>
          <button type="button" id="addVariantBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg">+ Add Variant</button>
        </div>

        <button type="submit" class="w-full bg-orange-600 text-white font-black py-4 rounded-lg hover:bg-orange-700 flex items-center justify-center">
          <span id="submitText">Add Product</span>
          <div id="uploadSpinner" class="spinner hidden"></div>
        </button>
      </form>
    </section>

    <!-- PRODUCT LIST -->
    <section class="bg-white rounded-2xl shadow-2xl p-10">
      <h2 class="text-4xl font-black text-orange-800 mb-6">Your Products</h2>
      <div id="productList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <footer class="bg-black text-white mt-auto p-6 text-center">
    <p class="text-sm">© 2026 Rhythm Deck Music. All rights reserved.</p>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://bxoqhmfnseskwqkywppg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc');

    let currentUser = null;
    let editingProductId = null;

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert("Please log in first");
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      loadProducts();
      addVariant();
    }

    function createVariantHTML(variant = {}) {
      return `
        <div class="variant-item border p-4 rounded-lg">
          <div class="grid grid-cols-3 gap-4">
            <input type="text" class="variant-option border p-2 rounded" placeholder="Size/Color" value="${variant.option || ''}" required>
            <input type="number" step="0.01" class="variant-price border p-2 rounded" placeholder="Price" value="${variant.price || ''}" required>
            <input type="number" class="variant-stock border p-2 rounded" placeholder="Stock" value="${variant.stock || ''}">
          </div>
          <button type="button" class="remove-variant text-red-600 mt-2">Remove</button>
        </div>
      `;
    }

    function addVariant(variant = {}) {
      const container = document.getElementById('variantsContainer');
      container.insertAdjacentHTML('beforeend', createVariantHTML(variant));
      container.lastElementChild.querySelector('.remove-variant').addEventListener('click', function() {
        this.parentElement.remove();
      });
    }

    function collectVariants() {
      const variants = [];
      document.querySelectorAll('.variant-item').forEach(item => {
        const option = item.querySelector('.variant-option').value.trim();
        const price = parseFloat(item.querySelector('.variant-price').value);
        if (option && !isNaN(price)) {
          variants.push({ option, price });
        }
      });
      return variants;
    }

    document.getElementById('addProductForm').onsubmit = async (e) => {
      e.preventDefault();

      const name = document.getElementById('productName').value.trim();
      const description = document.getElementById('productDescription').value.trim();
      const category = document.getElementById('productCategory').value;
      const file = document.getElementById('productImage').files[0];
      const variants = collectVariants();

      if (!name || !description || variants.length === 0) {
        alert("Please fill all fields and add at least one variant.");
        return;
      }

      const spinner = document.getElementById('uploadSpinner');
      spinner.classList.remove('hidden');

      try {
        let imagePath = null;
        if (file) {
          imagePath = `merch/${currentUser.id}/${Date.now()}_${file.name}`;
          const { error } = await supabase.storage.from('merch_images').upload(imagePath, file);
          if (error) throw error;
        }

        const productData = {
          name,
          description,
          category,
          image_url: imagePath,
          variants,
          user_id: currentUser.id
        };

        const { error } = await supabase.from('merch_products').insert(productData);
        if (error) throw error;

        alert("✅ Product added successfully!");
        document.getElementById('addProductForm').reset();
        document.getElementById('variantsContainer').innerHTML = '';
        addVariant();
        loadProducts();
      } catch (err) {
        console.error(err);
        alert("Error: " + err.message);
      } finally {
        spinner.classList.add('hidden');
      }
    };

    async function loadProducts() {
      const { data: products } = await supabase
        .from('merch_products')
        .select('*')
        .eq('user_id', currentUser.id);

      const container = document.getElementById('productList');
      container.innerHTML = '';

      products.forEach(p => {
        container.innerHTML += `
          <div class="border p-4 rounded-lg">
            <h3 class="font-bold">${p.name}</h3>
            <p class="text-sm">${p.category}</p>
            <p>${p.description}</p>
          </div>
        `;
      });
    }

    document.getElementById('addVariantBtn').onclick = () => addVariant();
    window.onload = init;
  </script>
</body>
</html>
