<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry Dashboard - Rhythm Deck</title>
  <link rel="icon" href="logo-favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background: linear-gradient(to bottom, #000000, #0f172a); color: white; }
    .artist-box {
      background: linear-gradient(to bottom right, #1f2937, #111827);
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: inset 4px 0 0 #10b981;
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }
    .artist-box:hover { transform: translateY(-3px); }
    .logo-img {
      width: 50px; height: 50px; border-radius: 50%;
      border: 2px solid #10b981; object-fit: cover;
    }
  </style>
</head>

<body class="min-h-screen font-sans">

<!-- HEADER -->
<header class="sticky top-0 z-10 bg-black/90 border-b border-gray-800">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <img src="logo-1-sm.jpg" class="w-12 h-12 rounded-full border-2 border-emerald-500">
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">Rhythm Deck</h1>
        <p class="text-sm text-gray-300">Industry Dashboard</p>
      </div>
    </div>
    <div class="flex gap-4">
      <a href="industry-message-dashboard.html"
         class="bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-full font-bold">
        Go to Inbox
      </a>
      <button onclick="logout()"
        class="bg-yellow-400 hover:bg-yellow-500 text-black font-bold px-6 py-3 rounded-full">
        Logout
      </button>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="max-w-7xl mx-auto px-6 py-16">
  <h2 class="text-4xl font-black text-emerald-400 text-center mb-6">
    Discover Pro & Platinum Artists
  </h2>

  <div id="artistGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>

<!-- CONTACT MODAL -->
<div id="messageModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl p-8 max-w-md w-full">
    <h3 class="text-2xl font-black text-emerald-400 mb-4">
      Message <span id="artistName"></span>
    </h3>
    <input id="msgSubject" class="w-full p-3 mb-3 bg-gray-800 rounded-lg" placeholder="Subject">
    <textarea id="msgBody" class="w-full p-3 bg-gray-800 rounded-lg" rows="5"></textarea>
    <button onclick="sendMessage()"
      class="mt-4 w-full bg-emerald-600 py-3 rounded-xl font-bold">
      Send Message
    </button>
    <button onclick="closeModal()" class="mt-3 text-gray-400 w-full">Cancel</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'YOUR_PUBLIC_ANON_KEY'
);

let userId;
let targetArtist = null;

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return location.href = 'index.html';
  userId = session.user.id;
  loadArtists();
}

async function loadArtists() {
  const { data } = await supabase
    .from('profiles')
    .select('*')
    .in('plan', ['pro','platinum']);

  document.getElementById('artistGrid').innerHTML = data.map(a => `
    <div class="artist-box">
      <div class="flex gap-3 mb-2">
        <img src="${a.logo_url || 'logo-placeholder.jpg'}" class="logo-img">
        <div>
          <h3 class="font-bold">${a.name}</h3>
          <p class="text-xs text-gray-400">${a.plan.toUpperCase()}</p>
        </div>
      </div>
      <p class="text-sm text-gray-300 mb-3">${a.bio || ''}</p>
      <button onclick="openModal('${a.id}','${a.name.replace(/'/g,"")}')"
        class="bg-emerald-600 py-2 rounded-lg font-bold">
        Connect
      </button>
    </div>
  `).join('');
}

window.openModal = (id,name)=>{
  targetArtist=id;
  artistName.textContent=name;
  messageModal.classList.remove('hidden');
}
window.closeModal=()=>messageModal.classList.add('hidden');

async function sendMessage(){
  if(!msgBody.value.trim()) return alert('Message required');
  await supabase.from('messages').insert({
    sender_id:userId,
    receiver_id:targetArtist,
    subject:msgSubject.value||'(No subject)',
    body:msgBody.value
  });
  closeModal();
  alert('Message sent');
}

window.logout=()=>{
  supabase.auth.signOut().then(()=>location.href='index.html');
};

init();
</script>
</body>
</html>
