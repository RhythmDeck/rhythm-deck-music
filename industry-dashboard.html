<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Industry Dashboard | Rhythm Deck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="logo-favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(to bottom, #020617, #3b0764, #000000);
      color: white;
    }
    .msg-item:hover { background: rgba(255,255,255,0.06); }
    .msg-selected { background: rgba(255,255,255,0.1); }
    .badge {
      background: #8b5cf6;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.75rem;
    }
  </style>
</head>

<body class="min-h-screen font-sans">

<!-- HEADER -->
<header class="bg-black/80 border-b border-purple-700/40 px-6 py-5 flex justify-between items-center sticky top-0 z-50">
  <div class="flex items-center gap-4">
    <img src="logo-1-sm.jpg" class="h-12 w-12 rounded-full border-2 border-emerald-500">
    <div>
      <h1 class="text-2xl font-black text-emerald-400">RHYTHM DECK</h1>
      <p class="text-sm text-purple-300">Industry Dashboard</p>
    </div>
  </div>

  <div class="flex items-center gap-6">
    <a href="message-dashboard.html"
       class="relative bg-gradient-to-r from-emerald-400 to-purple-500 text-black font-black px-6 py-3 rounded-full">
      Inbox
      <span id="inboxBadge" class="absolute -top-2 -right-2 badge hidden">0</span>
    </a>
    <button onclick="logout()" class="text-red-400 font-bold">Logout</button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-10">

<!-- ================= ARTISTS SECTION ================= -->
<section>
  <h2 class="text-4xl font-black mb-6 bg-gradient-to-r from-emerald-400 to-purple-500 bg-clip-text text-transparent">
    Pro & Platinum Artists
  </h2>

  <div id="artistGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</section>

<!-- ================= MESSAGE CENTER ================= -->
<section class="mt-20 bg-black/40 border border-purple-700/30 rounded-3xl p-8">

  <h2 class="text-3xl font-black text-emerald-400 mb-6 text-center">
    My Messages
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 h-[70vh]">

    <!-- LEFT -->
    <div class="bg-black/30 rounded-2xl overflow-hidden border border-purple-700/30">
      <div class="p-5 border-b border-purple-600 font-black text-xl text-emerald-400">
        Folders
      </div>

      <button onclick="loadFolder('inbox')" class="w-full text-left px-5 py-4 flex justify-between font-bold">
        Inbox <span id="inboxCount" class="badge hidden">0</span>
      </button>

      <button onclick="loadFolder('sent')" class="w-full text-left px-5 py-4 font-bold">
        Sent
      </button>

      <div id="conversationList" class="overflow-y-auto"></div>
    </div>

    <!-- RIGHT -->
    <div id="messageView" class="md:col-span-3 bg-black/30 rounded-2xl p-8 overflow-y-auto border border-purple-700/30">
      <p class="text-gray-400 text-center mt-20 text-xl">
        Select a conversation
      </p>
    </div>

  </div>
</section>

</main>

<!-- MESSAGE MODAL -->
<div id="messageModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl p-8 w-full max-w-lg relative">
    <button onclick="closeMessageModal()" class="absolute top-4 right-4 text-3xl font-black text-red-500">×</button>
    <h3 class="text-2xl font-black text-emerald-400 mb-4">Send Message</h3>
    <input id="msgSubject" class="w-full mb-4 p-3 bg-black/40 border border-emerald-500 rounded-lg">
    <textarea id="msgBody" rows="6" class="w-full p-4 bg-black/40 border border-emerald-500 rounded-lg"></textarea>
    <button onclick="sendMessage()" class="mt-6 w-full bg-emerald-600 py-3 rounded-xl font-black">Send</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

let userId, messages = [], activeRoot = null, receiverId = null;

/* INIT */
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) location.href = 'login.html';
  userId = session.user.id;
  loadArtists();
  loadFolder('inbox');
})();

/* ARTISTS */
async function loadArtists() {
  const { data } = await supabase
    .from('profiles')
    .select('id,name,plan')
    .in('plan', ['pro','platinum']);

  document.getElementById('artistGrid').innerHTML = data.map(a => `
    <div class="bg-black/40 border border-purple-700/30 rounded-2xl p-6">
      <p class="text-xl font-black text-emerald-400">${a.name}</p>
      <p class="text-sm text-gray-400">${a.plan.toUpperCase()} Artist</p>
      <button onclick="openMessageModal('${a.id}')"
        class="mt-4 bg-emerald-600 w-full py-2 rounded-lg font-bold">
        Contact
      </button>
    </div>
  `).join('');
}

/* INBOX COUNT */
async function updateInboxCount() {
  const { count } = await supabase
    .from('messages')
    .select('*', { count: 'exact', head: true })
    .eq('owner_id', userId)
    .eq('folder', 'inbox')
    .is('read_at', null);

  const badge = document.getElementById('inboxCount');
  const topBadge = document.getElementById('inboxBadge');

  if (count > 0) {
    badge.textContent = count;
    topBadge.textContent = count;
    badge.classList.remove('hidden');
    topBadge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
    topBadge.classList.add('hidden');
  }
}

/* LOAD FOLDER */
async function loadFolder(folder) {
  const { data } = await supabase
    .from('messages')
    .select('*')
    .eq('owner_id', userId)
    .eq('folder', folder)
    .order('created_at', { ascending: false });

  messages = data;
  renderConversationList();
  updateInboxCount();
}

/* CONVERSATIONS */
function renderConversationList() {
  const list = document.getElementById('conversationList');
  list.innerHTML = '';

  const threads = {};
  messages.forEach(m => {
    const root = m.parent_id || m.id;
    if (!threads[root]) threads[root] = [];
    threads[root].push(m);
  });

  Object.entries(threads).forEach(([root, msgs]) => {
    const latest = msgs[0];
    const div = document.createElement('div');
    div.className = `msg-item p-4 cursor-pointer ${activeRoot === root ? 'msg-selected' : ''}`;
    div.onclick = () => openConversation(root);
    div.innerHTML = `<p class="font-bold">${latest.subject || '(No subject)'}</p>`;
    list.appendChild(div);
  });
}

/* OPEN CONVO */
async function openConversation(rootId) {
  activeRoot = rootId;
  const convo = messages.filter(m => m.id === rootId || m.parent_id === rootId);

  for (const m of convo) {
    if (!m.read_at && m.receiver_id === userId) {
      await supabase.from('messages').update({ read_at: new Date() }).eq('id', m.id);
    }
  }

  document.getElementById('messageView').innerHTML = convo.map(m => `
    <div class="mb-4 p-4 bg-black/40 rounded-xl">
      <p class="text-xs text-gray-400">${new Date(m.created_at).toLocaleString()}</p>
      <p>${m.body}</p>
    </div>
  `).join('');

  updateInboxCount();
}

/* SEND */
function openMessageModal(id){ receiverId=id; document.getElementById('messageModal').classList.remove('hidden'); }
function closeMessageModal(){ document.getElementById('messageModal').classList.add('hidden'); }

async function sendMessage() {
  const subject = document.getElementById('msgSubject').value;
  const body = document.getElementById('msgBody').value;
  const root = crypto.randomUUID();

  await supabase.from('messages').insert([
    { id: root, sender_id: userId, receiver_id: receiverId, owner_id: userId, folder:'sent', subject, body },
    { parent_id: root, sender_id: userId, receiver_id: receiverId, owner_id: receiverId, folder:'inbox', subject, body }
  ]);

  closeMessageModal();
  loadFolder('sent');
}

/* LOGOUT */
function logout(){ supabase.auth.signOut().then(()=>location.href='login.html'); }

window.logout = logout;
window.openMessageModal = openMessageModal;
window.sendMessage = sendMessage;
</script>

</body>
</html>
