<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Industry Dashboard - Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(to bottom, #000000, #0f172a); color: white; }
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .selected { background: rgba(255,255,255,0.12) !important; }
    .reply-indent { margin-left: 2.5rem; border-left: 3px solid #10b981; padding-left: 1.25rem; }
    .status-pending { background:#f59e0b;color:white }
    .status-read { background:#6b7280;color:white }
    .status-new-reply { background:#8b5cf6;color:white;font-weight:bold }
  </style>
</head>

<body class="min-h-screen font-sans antialiased">

<header class="sticky top-0 z-10 bg-black/90 border-b border-gray-800">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <img src="logo-1-sm.jpg" class="w-12 h-12 rounded-full border-2 border-emerald-500"/>
      <div>
        <h1 class="text-2xl font-bold text-emerald-400">Rhythm Deck</h1>
        <p class="text-sm text-gray-300">Unleash Your Beat</p>
      </div>
    </div>
    <a href="profile-admin-pro.html" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2 rounded-lg font-bold">
      Back to Dashboard
    </a>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-16">

<section class="bg-black/40 rounded-2xl p-8">
  <h2 class="text-3xl font-bold text-center text-emerald-400 mb-6">My Messages</h2>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[75vh]">
    <div class="bg-black/30 rounded-xl overflow-y-auto" id="conversationList"></div>
    <div id="messageView" class="lg:col-span-2 bg-black/30 rounded-xl p-6 overflow-y-auto">
      <p class="text-gray-400 text-center mt-24">Select a conversation</p>
    </div>
  </div>
</section>
</main>

<div id="replyModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-2xl p-8 max-w-lg w-full relative">
    <button onclick="closeReply()" class="absolute top-4 right-4 text-3xl text-red-400">&times;</button>
    <h3 class="text-2xl font-bold text-emerald-400 mb-4">Reply</h3>
    <textarea id="replyText" rows="5" class="w-full p-4 bg-gray-800 rounded-lg"></textarea>
    <button onclick="sendReply()" class="mt-4 w-full bg-emerald-600 py-3 rounded-lg font-bold">
      Send Reply
    </button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'
);

let currentUser;
let conversations = [];
let activeThread = null;

/* ✅ SAFE AUTH CHECK */
const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  window.location.href = 'industry-login.html';
}
currentUser = session.user.id;

async function loadMessages() {
  const { data, error } = await supabase
    .from('collab_requests')
    .select(`
      id,
      parent_id,
      sender_id,
      receiver_id,
      message,
      created_at,
      status,
      sender:sender_id(name),
      receiver:receiver_id(name)
    `)
    .or(`sender_id.eq.${currentUser},receiver_id.eq.${currentUser}`)
    .order('created_at',{ascending:true});

  if (error) return alert(error.message);

  const threads = {};
  data.forEach(m=>{
    const root = m.parent_id || m.id;
    if(!threads[root]) threads[root]={root:null,replies:[]};
    if(!m.parent_id) threads[root].root=m;
    else threads[root].replies.push(m);
  });

  conversations = Object.values(threads).filter(t=>t.root);
  renderConversationList();
}

function renderConversationList(){
  const list = document.getElementById('conversationList');
  list.innerHTML = conversations.map(t=>{
    const other = t.root.sender_id===currentUser ? t.root.receiver : t.root.sender;
    return `
      <div class="msg-item p-4 border-b border-gray-800 cursor-pointer"
           onclick="openThread('${t.root.id}')">
        <p class="font-bold">${other?.name || 'User'}</p>
        <p class="text-sm text-gray-400">${t.root.message.slice(0,80)}</p>
      </div>
    `;
  }).join('');
}

window.openThread = function(id){
  activeThread = conversations.find(t=>t.root.id===id);
  const other = activeThread.root.sender_id===currentUser
    ? activeThread.root.receiver
    : activeThread.root.sender;

  document.getElementById('messageView').innerHTML = `
    <h3 class="text-xl font-bold text-emerald-400 mb-4">${other?.name}</h3>
    <div class="space-y-4">
      <div class="bg-black/50 p-4 rounded-lg">${activeThread.root.message}</div>
      ${activeThread.replies.map(r=>`
        <div class="reply-indent bg-black/30 p-3 rounded-lg">${r.message}</div>
      `).join('')}
    </div>
    <button onclick="openReply()" class="mt-6 bg-emerald-600 px-6 py-3 rounded-lg font-bold">
      Reply
    </button>
  `;
};

window.openReply = ()=> document.getElementById('replyModal').classList.remove('hidden');
window.closeReply = ()=> document.getElementById('replyModal').classList.add('hidden');

window.sendReply = async function(){
  const text = document.getElementById('replyText').value.trim();
  if(!text) return;

  const root = activeThread.root;
  const receiver = root.sender_id===currentUser ? root.receiver_id : root.sender_id;

  await supabase.from('collab_requests').insert({
    parent_id: root.id,
    sender_id: currentUser,
    receiver_id: receiver,
    message: text,
    status: 'pending'
  });

  closeReply();
  loadMessages();
};

loadMessages();
</script>

</body>
</html>
