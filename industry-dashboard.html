<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry Dashboard - Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background: linear-gradient(to bottom, #000000, #0f172a); color: white; }
    .artist-box { background: linear-gradient(to bottom right, #1f2937, #111827); border-radius: 1rem; padding: 1rem; box-shadow: inset 4px 0 0 #10b981; }
    .logo-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #10b981; }
    .media-item { padding: .4rem; background: #374151; border-radius: .5rem; margin-bottom: .3rem; cursor: pointer; }
    .media-item:hover { background: #4b5563; }
    .msg-item:hover { background: rgba(255,255,255,0.08); }
    .selected { background: rgba(255,255,255,0.12) !important; }
    .reply-indent { margin-left: 2.5rem; border-left: 3px solid #10b981; padding-left: 1.25rem; }
    #replyModal.hidden { display: none; }
    .status-pending { background:#f59e0b }
    .status-accepted { background:#10b981 }
    .status-declined { background:#ef4444 }
    .status-read { background:#6b7280 }
    .status-new-reply { background:#8b5cf6; font-weight:bold }
  </style>
</head>

<body class="min-h-screen">

<header class="bg-black border-b border-gray-800 p-4 flex items-center gap-4">
  <img src="logo-1-sm.jpg" class="logo-img">
  <div>
    <h1 class="text-xl font-bold text-emerald-400">Rhythm Deck</h1>
    <p class="text-sm text-gray-400">Unleash Your Beat</p>
  </div>
</header>

<main class="max-w-7xl mx-auto p-6">

<section class="mt-16 bg-black/40 rounded-2xl p-8">
<h2 class="text-3xl font-bold mb-6 text-center text-emerald-400">My Messages</h2>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[80vh]">
  <div class="bg-black/30 rounded-2xl overflow-y-auto" id="conversationList"></div>
  <div id="messageView" class="lg:col-span-2 bg-black/30 rounded-2xl p-8 overflow-y-auto">
    <p class="text-gray-400 text-center mt-20">Select a conversation</p>
  </div>
</div>
</section>

</main>

<!-- Reply Modal -->
<div id="replyModal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50">
  <div class="bg-gray-900 rounded-xl p-8 max-w-lg w-full relative">
    <button id="closeReplyBtn" class="absolute top-3 right-4 text-3xl text-red-500">×</button>
    <h2 class="text-2xl font-bold text-emerald-400 mb-4">
      Reply to <span id="replyTargetName"></span>
    </h2>
    <textarea id="replyMessage" rows="6" class="w-full p-4 bg-gray-800 rounded-lg"></textarea>
    <button id="sendReplyBtn" class="w-full mt-6 bg-emerald-600 py-3 rounded-lg font-bold">
      Send Reply
    </button>
  </div>
</div>

<footer class="text-center text-sm text-gray-400 mt-12 border-t border-gray-800 p-6">
  © 2026 Rhythm Deck
</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://bxoqhmfnseskwqkywppg.supabase.co',
  'YOUR_PUBLIC_ANON_KEY'
);

let currentUserId = null;
let currentMessages = [];
let currentConversationId = null;
let currentReplyTargetId = null;

async function init() {
  const { data:{ user } } = await supabase.auth.getUser();
  if (!user) location.href = 'login.html';
  currentUserId = user.id;
  loadMessages();
}

async function loadMessages() {
  const { data } = await supabase
    .from('collab_requests')
    .select('*, sender:sender_id(name)')
    .or(`sender_id.eq.${currentUserId},receiver_id.eq.${currentUserId}`)
    .order('created_at',{ascending:false});

  currentMessages = data || [];
  renderConversations();
}

function renderConversations() {
  const roots = currentMessages.filter(m=>!m.parent_id);
  document.getElementById('conversationList').innerHTML = roots.map(m=>`
    <div class="msg-item p-4 cursor-pointer" data-id="${m.id}">
      <p class="font-bold">${m.sender?.name||'User'}</p>
      <p class="text-sm text-gray-400">${new Date(m.created_at).toLocaleString()}</p>
      <p class="text-gray-300 truncate">${m.message}</p>
    </div>
  `).join('');

  document.querySelectorAll('.msg-item').forEach(el=>{
    el.onclick=()=>openThread(el.dataset.id);
  });
}

function openThread(id){
  currentConversationId=id;
  const root=currentMessages.find(m=>m.id===id);
  const replies=currentMessages.filter(m=>m.parent_id===id);

  currentReplyTargetId = root.sender_id === currentUserId ? root.receiver_id : root.sender_id;

  document.getElementById('messageView').innerHTML=`
    <h2 class="text-xl font-bold text-emerald-400 mb-4">${root.sender?.name}</h2>
    <p>${root.message}</p>
    <hr class="my-6 border-gray-700">
    ${replies.map(r=>`<div class="reply-indent">${r.message}</div>`).join('')}
    <button id="replyThreadBtn" class="mt-6 bg-emerald-600 px-6 py-3 rounded-lg font-bold">
      Reply
    </button>
  `;

  document.getElementById('replyThreadBtn').onclick=()=>{
    document.getElementById('replyTargetName').textContent=root.sender?.name;
    document.getElementById('replyModal').classList.remove('hidden');
  };
}

document.getElementById('closeReplyBtn').onclick=()=>replyModal.classList.add('hidden');

document.getElementById('sendReplyBtn').onclick=async()=>{
  const msg=replyMessage.value.trim();
  if(!msg) return;
  await supabase.from('collab_requests').insert({
    parent_id:currentConversationId,
    sender_id:currentUserId,
    receiver_id:currentReplyTargetId,
    message:msg
  });
  replyMessage.value='';
  replyModal.classList.add('hidden');
  loadMessages();
};

init();
</script>

</body>
</html>
