<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Deck | Video Compressor Signup</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-10 rounded-xl shadow-xl max-w-lg w-full">
  <h2 class="text-3xl font-bold text-center mb-6">Video Compressor</h2>

  <p class="text-center mb-6">
    High-quality video compression for releases, albums, and promos.
  </p>

  <form id="form" class="space-y-4">

    <input id="name" required placeholder="Name / Artist Name"
      class="w-full border p-3 rounded">

    <input id="email" type="email" required placeholder="Email"
      class="w-full border p-3 rounded">

    <select id="plan" required class="w-full border p-3 rounded">
      <option value="" disabled selected>Select Plan</option>
      <option value="monthly">Monthly — $9.95</option>
      <option value="yearly">Yearly — Save 15%</option>
    </select>

    <button id="btn"
      class="w-full bg-green-600 text-white py-3 rounded font-bold">
      Continue to Checkout
    </button>
  </form>
</div>

<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();

  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Redirecting…';

  const plan = document.getElementById('plan').value;
  const email = document.getElementById('email').value.trim();
  const name = document.getElementById('name').value.trim();

  const user = await fetch('/auth/user').then(r => r.json());

  await fetch('/ensure-profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId: user.id, email, name })
  });

  const res = await fetch('/create-compressor-checkout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ plan, email, userId: user.id })
  });

  const data = await res.json();
  window.location.href = data.url;
});
</script>

</body>
</html>
