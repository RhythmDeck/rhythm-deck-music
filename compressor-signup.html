<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up – Rhythm Deck Compressor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #151515;
      padding: 40px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      opacity: 0.85;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #ff0080, #7928ca);
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Video Compressor</h1>

    <p>
      Compress full album videos locally in your browser.<br>
      No uploads. No limits. Studio-grade results.
    </p>

    <button id="checkoutBtn">
      Continue to Secure Checkout
    </button>
  </div>

  <script>
    document.getElementById('checkoutBtn').addEventListener('click', async () => {
      try {
        const res = await fetch('/create-compressor-checkout', {
          method: 'POST'
        });

        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          alert('Checkout failed');
        }
      } catch (err) {
        alert('Network error');
      }
    });
  </script>

</body>
</html>
