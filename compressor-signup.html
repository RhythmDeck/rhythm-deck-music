<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Deck | Video Compressor Signup</title>

<base href="/" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://js.stripe.com/v3/?advancedFraudSignals=false"></script>

<style>
  .input-focus:focus {
    box-shadow: 0 0 0 3px rgba(16,185,129,0.4);
  }
</style>
</head>

<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen font-sans">

<header class="bg-black text-white p-4 flex justify-between items-center shadow-lg">
  <div class="flex items-center space-x-3">
    <img src="logo-1-sm.jpg" class="w-10 h-10 rounded-full" alt="Rhythm Deck">
    <div>
      <h1 class="text-xl font-bold tracking-wide">RHYTHM DECK</h1>
      <p class="text-xs text-gray-300">Unleash Your Beat</p>
    </div>
  </div>
  <nav class="space-x-3 text-sm">
    <a href="index.html" target="_blank" class="hover:text-green-400">Home</a>
    <a href="contact.html" target="_blank" class="hover:text-green-400">Contact</a>
  </nav>
</header>

<main class="flex-grow flex items-center justify-center py-12 px-4">
  <div class="bg-white shadow-2xl rounded-xl max-w-5xl w-full flex overflow-hidden">

    <div class="w-1/2 hidden md:block">
      <img src="contact.png" alt="Album Compression" class="w-full h-full object-cover">
    </div>

    <div class="w-full md:w-1/2 p-8 md:p-10">
      <h2 class="text-3xl font-bold text-center mb-6">
        Video Compressor Access
      </h2>

      <p class="text-center text-gray-600 mb-8">
        Compress single videos and full album videos<br>
        Studio-grade results with same high quality.
      </p>

      <form id="compressorForm" class="space-y-4">

        <div>
          <label class="block font-semibold mb-1">Name / Artist Name</label>
          <input id="name" required
            class="w-full border rounded-lg p-3 input-focus">
        </div>

        <div>
          <label class="block font-semibold mb-1">Email</label>
          <input id="email" type="email" required
            class="w-full border rounded-lg p-3 input-focus">
        </div>

        <div>
          <label class="block font-semibold mb-1">Choose Plan</label>
          <select id="plan" required
            class="w-full border rounded-lg p-3">
            <option value="" disabled selected>Select a plan</option>
            <option value="monthly">Monthly — $9.95 / month</option>
            <option value="yearly">Yearly — Save 15%</option>
          </select>
        </div>

        <div class="flex items-start gap-2">
          <input type="checkbox" id="terms" required
            class="mt-1 h-4 w-4 text-green-500">
          <label for="terms" class="text-sm text-gray-700">
            I agree to the
            <a href="terms.html" target="_blank" class="text-green-600 hover:underline">Terms</a>
            and
            <a href="privacy.html" target="_blank" class="text-green-600 hover:underline">Privacy Policy</a>
          </label>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-lg text-lg transition">
          Continue to Secure Checkout
        </button>

      </form>
    </div>
  </div>
</main>

<footer class="bg-black text-white p-5 text-center text-sm">
  <p>© 2025 Rhythm Deck Music</p>
</footer>

<script>
const stripe = Stripe('YOUR_STRIPE_PUBLISHABLE_KEY');

document.getElementById('compressorForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Redirecting to secure checkout…';

  const duration = document.getElementById('plan').value;
  const email    = document.getElementById('email').value.trim();

  try {
    const res = await fetch(
      'https://bxoqhmfnseskwqkywppg.supabase.co/functions/v1/create-checkout-session',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          planType: 'compressor',
          duration,
          email
        })
      }
    );

    if (!res.ok) {
      throw new Error('Failed to create checkout session');
    }

    const { sessionId } = await res.json();

    const result = await stripe.redirectToCheckout({ sessionId });

    if (result.error) {
      throw new Error(result.error.message);
    }

  } catch (err) {
    alert(err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Continue to Secure Checkout';
  }
});
</script>

</body>
</html>
