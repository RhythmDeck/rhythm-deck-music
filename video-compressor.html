<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rhythm Deck – Video Compressor</title>
<style>
body { background:#050505; font-family:Arial, sans-serif; color:#e5e7eb; margin:0; padding:0; }
.container { max-width:1200px; margin:40px auto; padding:30px; border:2px solid #10b981; border-radius:22px; background:linear-gradient(180deg,#0b0b0b,#060606); box-shadow:0 30px 70px rgba(0,0,0,.85); }
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
.logo-wrap { display:flex; align-items:center; gap:12px; }
.logo-wrap img { height:48px; }
.logo-text { font-size:1.5rem; font-weight:bold; color:#10b981; }
.tagline { font-size:0.9rem; color:#9ca3af; }
.hero { display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-bottom:40px; }
.instructions { border:2px solid #10b981; border-radius:18px; padding:26px; font-size:18px; line-height:1.75; background:#0a0a0a; }
.image-box img { width:100%; height:100%; object-fit:cover; border-radius:18px; }
.section { margin-top:26px; }
label { font-weight:bold; display:block; margin-bottom:6px; }
input, select, button { width:100%; padding:12px; border-radius:12px; border:none; background:#1f2937; color:#e5e7eb; }
button { background:#10b981; font-weight:bold; cursor:pointer; font-size:1.1rem; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.progress-bar { background:#111; border-radius:12px; overflow:hidden; height:22px; margin:8px 0; border:1px solid #10b981; }
.progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#10b981,#34d399); transition:width 0.3s ease; }
#status { white-space:pre-line; background:#111; padding:15px; border-radius:12px; min-height:160px; font-size:15px; }
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo-wrap">
    <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo">
    <div>
      <div class="logo-text">RHYTHM DECK</div>
      <div class="tagline">Unleash Your Beat</div>
    </div>
  </div>
  <nav>
    <a href="index.html" class="home" target="_blank">Home</a>
    <a href="contact.html" class="contact" target="_blank">Contact</a>
  </nav>
</header>

<div class="hero">
  <div class="instructions">
    <strong>Video Compressor</strong><br><br>
    • Upload any video<br>
    • Real-time progress shown below<br>
    • Processed on server<br>
    • Best final size: 50–200 MB for Rhythm Deck
  </div>
  <div class="image-box">
    <img src="compressor.png" alt="Video Compressor">
  </div>
</div>

<div class="section">
  <label>Upload Video</label>
  <input type="file" id="file" accept="video/*">
</div>

<div class="section">
  <label>Compression Quality (CRF)</label>
  <input type="range" min="18" max="35" value="23" id="crf" step="1">
  <div class="small" id="crfText">CRF 23 → Recommended balance</div>
</div>

<div class="section">
  <button id="start">Start Compression</button>
</div>

<div id="status">Ready — Select a video and click Start Compression</div>

<!-- Progress Bars -->
<div id="progressContainer" style="display:none; margin-top:20px;">
  <div class="progress-label">Uploading <span id="uploadPercent">0%</span></div>
  <div class="progress-bar"><div id="uploadBar" class="progress-fill"></div></div>

  <div class="progress-label" style="margin-top:15px;">Compressing <span id="compressPercent">0%</span></div>
  <div class="progress-bar"><div id="compressBar" class="progress-fill"></div></div>
</div>
</div>

<script>
const fileInput = document.getElementById('file');
const startBtn = document.getElementById('start');
const statusEl = document.getElementById('status');
const crfSlider = document.getElementById('crf');
const crfText = document.getElementById('crfText');
const progressContainer = document.getElementById('progressContainer');
const uploadBar = document.getElementById('uploadBar');
const uploadPercent = document.getElementById('uploadPercent');
const compressBar = document.getElementById('compressBar');
const compressPercent = document.getElementById('compressPercent');

crfSlider.oninput = () => {
  crfText.textContent = `CRF ${crfSlider.value} → ${crfSlider.value <= 20 ? 'Near lossless' : crfSlider.value <= 25 ? 'Recommended' : 'Strong compression'}`;
};

startBtn.onclick = async () => {
  const file = fileInput.files[0];
  if (!file) return alert("Please select a video file");

  startBtn.disabled = true;
  progressContainer.style.display = 'block';
  statusEl.textContent = "Starting upload...\n";

  const formData = new FormData();
  formData.append('video', file);
  formData.append('crf', crfSlider.value);

  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/compress-video');

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        uploadBar.style.width = percent + '%';
        uploadPercent.textContent = percent + '%';
        statusEl.textContent = `Uploading... ${percent}%\n`;
      }
    };

    xhr.onload = async () => {
      if (xhr.status === 200) {
        uploadBar.style.width = '100%';
        uploadPercent.textContent = '100%';
        statusEl.textContent += "Upload complete. Compressing on server...\n";

        const blob = new Blob([xhr.response]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'compressed-' + file.name;
        a.click();

        compressBar.style.width = '100%';
        compressPercent.textContent = '100%';
        statusEl.textContent += "\n✅ Compression complete! File downloaded.";
      } else {
        statusEl.textContent += "\nError: Server returned " + xhr.status;
      }
      startBtn.disabled = false;
    };

    xhr.onerror = () => {
      statusEl.textContent += "\nNetwork error. Please try again.";
      startBtn.disabled = false;
    };

    xhr.send(formData);

  } catch (err) {
    statusEl.textContent += "\nError: " + err.message;
    startBtn.disabled = false;
  }
};
</script>
</body>
</html>
