<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rhythm Deck – Video Compressor</title>
<style>
body { background:#050505; font-family:Arial, sans-serif; color:#e5e7eb; margin:0; padding:0; }
.container { max-width:1200px; margin:40px auto; padding:30px; border:2px solid #10b981; border-radius:22px; background:linear-gradient(180deg,#0b0b0b,#060606); box-shadow:0 30px 70px rgba(0,0,0,.85); }
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
.logo-wrap { display:flex; align-items:center; gap:12px; }
.logo-wrap img { height:48px; }
.logo-text { font-size:1.5rem; font-weight:bold; color:#10b981; }
.tagline { font-size:0.9rem; color:#9ca3af; }
.hero { display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-bottom:40px; }
.instructions { border:2px solid #10b981; border-radius:18px; padding:26px; font-size:18px; line-height:1.75; background:#0a0a0a; }
.image-box img { width:100%; height:100%; object-fit:cover; border-radius:18px; }
.section { margin-top:26px; }
label { font-weight:bold; display:block; margin-bottom:6px; }
input, button { width:100%; padding:12px; border-radius:12px; border:none; }
button { background:#10b981; font-weight:bold; cursor:pointer; font-size:1.1rem; }
button:disabled { opacity:0.5; cursor:not-allowed; }
#status { white-space:pre-line; background:#111; padding:15px; border-radius:12px; min-height:200px; }
.progress-bar { background:#111; height:22px; border-radius:12px; overflow:hidden; margin:8px 0; border:1px solid #10b981; }
.progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#10b981,#34d399); transition:width 0.4s; }
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo-wrap">
    <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo">
    <div>
      <div class="logo-text">RHYTHM DECK</div>
      <div class="tagline">Unleash Your Beat</div>
    </div>
  </div>
  <nav>
    <a href="index.html" class="home" target="_blank">Home</a>
    <a href="contact.html" class="contact" target="_blank">Contact</a>
  </nav>
</header>

<div class="hero">
  <div class="instructions">
    <strong>Video Compressor</strong><br><br>
    • Upload → Supabase Storage<br>
    • Compress on Vercel<br>
    • Real-time progress shown below
  </div>
  <div class="image-box">
    <img src="compressor.png" alt="Video Compressor">
  </div>
</div>

<div class="section">
  <label>Upload Video</label>
  <input type="file" id="file" accept="video/*">
</div>

<div class="section">
  <button id="start">Start Compression</button>
</div>

<div id="status">Ready — Select a video and click Start Compression</div>

<div id="progressContainer" style="display:none; margin-top:20px;">
  <div>Uploading <span id="uploadPercent">0%</span></div>
  <div class="progress-bar"><div id="uploadBar" class="progress-fill"></div></div>
  
  <div style="margin-top:15px;">Compressing <span id="compressPercent">0%</span></div>
  <div class="progress-bar"><div id="compressBar" class="progress-fill"></div></div>
</div>
</div>

<script>
// === CHANGE THESE TWO LINES WITH YOUR SUPABASE DETAILS ===
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY-HERE';
// ========================================================

const fileInput = document.getElementById('file');
const startBtn = document.getElementById('start');
const statusEl = document.getElementById('status');
const progressContainer = document.getElementById('progressContainer');
const uploadBar = document.getElementById('uploadBar');
const uploadPercent = document.getElementById('uploadPercent');
const compressBar = document.getElementById('compressBar');
const compressPercent = document.getElementById('compressPercent');

startBtn.onclick = async () => {
  const file = fileInput.files[0];
  if (!file) return alert("Please select a video");

  startBtn.disabled = true;
  progressContainer.style.display = 'block';
  statusEl.textContent = "Uploading to Supabase...\n";

  const formData = new FormData();
  formData.append('file', file);

  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${https://bxoqhmfnseskwqkywppg.supabase.co}/storage/v1/object/video-uploads/${Date.now()}-${file.name}`);

    xhr.setRequestHeader('Authorization', `Bearer ${eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc}`);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        uploadBar.style.width = percent + '%';
        uploadPercent.textContent = percent + '%';
      }
    };

    xhr.onload = async () => {
      if (xhr.status === 200) {
        uploadBar.style.width = '100%';
        uploadPercent.textContent = '100%';
        statusEl.textContent += "Upload complete. Starting server compression...\n";

        // Call Vercel to compress (only sends small URL, no 413 error)
        const compressRes = await fetch('/api/compress-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filePath: `${Date.now()}-${file.name}` })
        });

        if (compressRes.ok) {
          const blob = await compressRes.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'compressed-' + file.name;
          a.click();

          compressBar.style.width = '100%';
          compressPercent.textContent = '100%';
          statusEl.textContent += "\n✅ Compression complete! File downloaded.";
        } else {
          statusEl.textContent += "\nCompression failed on server.";
        }
      } else {
        statusEl.textContent += "\nUpload failed.";
      }
      startBtn.disabled = false;
    };

    xhr.send(formData);

  } catch (err) {
    statusEl.textContent += "\nError: " + err.message;
    startBtn.disabled = false;
  }
};
</script>
</body>
</html>
