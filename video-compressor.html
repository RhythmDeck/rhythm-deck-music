<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rhythm Deck – Video Compressor</title>
<style>
body { background:#050505; font-family:Arial, sans-serif; color:#e5e7eb; margin:0; padding:0; }
.container { max-width:1200px; margin:40px auto; padding:30px; border:2px solid #10b981; border-radius:22px; background:linear-gradient(180deg,#0b0b0b,#060606); box-shadow:0 30px 70px rgba(0,0,0,.85); }
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
.logo-wrap { display:flex; align-items:center; gap:12px; }
.logo-wrap img { height:48px; }
.logo-text { font-size:1.5rem; font-weight:bold; color:#10b981; }
.tagline { font-size:0.9rem; color:#9ca3af; }
.hero { display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-bottom:40px; }
.instructions { border:2px solid #10b981; border-radius:18px; padding:26px; font-size:18px; line-height:1.75; background:#0a0a0a; }
.image-box img { width:100%; height:100%; object-fit:cover; border-radius:18px; }
.section { margin-top:26px; }
label { font-weight:bold; display:block; margin-bottom:6px; }
input, select { width:100%; padding:12px; border-radius:12px; border:none; background:#1f2937; color:#e5e7eb; }
button { padding:16px 26px; background:#10b981; border:none; border-radius:16px; font-weight:bold; cursor:pointer; width:100%; font-size:1.1rem; }
button:disabled { opacity:.5; cursor:not-allowed; }
#status { white-space:pre-line; background:#111; padding:15px; border-radius:12px; min-height:180px; font-size:15px; }
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo-wrap">
    <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo">
    <div>
      <div class="logo-text">RHYTHM DECK</div>
      <div class="tagline">Unleash Your Beat</div>
    </div>
  </div>
  <nav>
    <a href="index.html" class="home" target="_blank">Home</a>
    <a href="contact.html" class="contact" target="_blank">Contact</a>
  </nav>
</header>

<div class="hero">
  <div class="instructions">
    <strong>Server-Side Video Compressor</strong><br><br>
    • Upload any video<br>
    • Processed on Vercel servers<br>
    • Choose quality level<br>
    • Download compressed MP4 ready for Rhythm Deck
  </div>
  <div class="image-box">
    <img src="compressor.png" alt="Video Compressor">
  </div>
</div>

<div class="section">
  <label>Upload Video</label>
  <input type="file" id="file" accept="video/*">
</div>

<div class="section">
  <label>Compression Quality (CRF)</label>
  <input type="range" min="18" max="35" value="23" id="crf" step="1">
  <div class="small" id="crfText">CRF 23 → Excellent balance</div>
</div>

<div class="section">
  <button id="start">Compress Video</button>
</div>

<div id="status">Ready – Click Compress Video</div>
</div>

<script>
const fileInput = document.getElementById('file');
const startBtn = document.getElementById('start');
const statusEl = document.getElementById('status');
const crfSlider = document.getElementById('crf');
const crfText = document.getElementById('crfText');

crfSlider.oninput = () => {
  const v = crfSlider.value;
  crfText.textContent = `CRF ${v} → ${v <= 20 ? 'Near lossless' : v <= 25 ? 'Recommended' : 'Strong compression'}`;
};
crfSlider.oninput();

startBtn.onclick = async () => {
  const file = fileInput.files[0];
  if (!file) return alert("Please select a video file");

  startBtn.disabled = true;
  startBtn.textContent = "Uploading & compressing...";
  statusEl.textContent = "Uploading video...\n";

  const formData = new FormData();
  formData.append('video', file);
  formData.append('crf', crfSlider.value);

  try {
    const res = await fetch('/api/compress-video', {
      method: 'POST',
      body: formData
    });

    if (!res.ok) throw new Error("Server error");

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'compressed-' + file.name;
    a.click();

    statusEl.textContent += "\n✅ Compression complete! File downloaded.";
  } catch (err) {
    console.error(err);
    statusEl.textContent += "\nError: " + err.message;
  }

  startBtn.disabled = false;
  startBtn.textContent = "Compress Another Video";
};
</script>
</body>
</html>
