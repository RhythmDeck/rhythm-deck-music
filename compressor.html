<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rhythm Deck – Video Compressor</title>
<style>
body { background:#050505; font-family:Arial, sans-serif; color:#e5e7eb; margin:0; padding:0; }
.container { max-width:1200px; margin:40px auto; padding:30px; border:2px solid #10b981; border-radius:22px; background:linear-gradient(180deg,#0b0b0b,#060606); box-shadow:0 30px 70px rgba(0,0,0,.85); }
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
.logo-wrap { display:flex; align-items:center; gap:12px; }
.logo-wrap img { height:48px; }
.logo-text { font-size:1.5rem; font-weight:bold; color:#10b981; line-height:1.1; }
.tagline { font-size:0.9rem; color:#9ca3af; }
nav a { display:inline-block; padding:10px 20px; margin-left:12px; border-radius:999px; font-weight:bold; text-decoration:none; transition:all 0.2s; }
nav a.home { background:linear-gradient(90deg,#22c55e,#16a34a); color:white; }
nav a.contact { background:linear-gradient(90deg,#8b5cf6,#7c3aed); color:white; }
nav a:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.5); }
.hero { display:grid; grid-template-columns:1fr 1.5fr; gap:30px; }
.instructions { border:2px solid #10b981; border-radius:18px; padding:26px; font-size:18px; line-height:1.75; }
.image-box img { width:100%; height:100%; object-fit:cover; border-radius:18px; }
.section { margin-top:26px; }
label { font-weight:bold; display:block; margin-bottom:6px; }
input, select { width:100%; padding:12px; border-radius:12px; border:none; }
button { padding:16px 26px; background:#10b981; border:none; border-radius:16px; font-weight:bold; cursor:pointer; }
button:disabled { opacity:.5; cursor:not-allowed; }
#statusWrap { display:grid; grid-template-columns:1fr 300px; gap:20px; margin-top:18px; }
#status { white-space:pre-line; font-size:15px; }
#uploadProgressOuter, #compressProgressOuter { background:#111; border-radius:12px; overflow:hidden; border:1px solid #10b981; height:22px; margin-top:10px; }
#uploadProgressInner, #compressProgressInner { height:100%; width:0%; background:linear-gradient(90deg,#10b981,#34d399); transition:width 0.4s ease; }
.progress-label { margin-top:6px; font-size:13px; color:#9ca3af; text-align:left; font-weight:bold; }
.timer { float:right; color:#10b981; }
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo-wrap">
    <img src="logo-1-sm.jpg" alt="Rhythm Deck Logo">
    <div>
      <div class="logo-text">RHYTHM DECK</div>
      <div class="tagline">Unleash Your Beat</div>
    </div>
  </div>
  <nav>
    <a href="index.html" class="home" target="_blank">Home</a>
    <a href="contact.html" class="contact" target="_blank">Contact</a>
  </nav>
</header>

<div class="hero">
  <div class="instructions">
    <strong>Video Compressor</strong><br><br>
    • Uploads in safe 40MB chunks<br>
    • Merges and compresses on server<br>
    • Works with large files (900MB+)
  </div>
  <div class="image-box">
    <img src="compressor.png" alt="Compressor">
  </div>
</div>

<div class="section">
<label>Upload Video</label>
<input type="file" id="file">
</div>

<div class="section">
<label>Compression Quality (CRF)</label>
<input type="range" min="18" max="30" value="23" id="crf">
<div class="small" id="crfText"></div>
</div>

<div class="section">
<button id="start">Compress Video</button>
</div>

<div id="statusWrap">
  <div id="status">Ready — Select a video and click Compress Video</div>
  <div>
    <div class="progress-label">Uploading <span id="uploadTimer" class="timer">00:00</span></div>
    <div id="uploadProgressOuter"><div id="uploadProgressInner"></div></div>
    <div id="uploadProgressText" class="progress-label">0%</div>
    <div class="progress-label" style="margin-top:20px;">Compressing <span id="compressTimer" class="timer">00:00</span></div>
    <div id="compressProgressOuter"><div id="compressProgressInner"></div></div>
    <div id="compressProgressText" class="progress-label">Waiting…</div>
  </div>
</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://bxoqhmfnseskwqkywppg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4b3FobWZuc2Vza3dxa3l3cHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5Mjk4MzgsImV4cCI6MjA3NjUwNTgzOH0.vnzlMkgkA0bOpFSw2JN_b3GjrxWK3S85yC1WGeoOUZc'; // rotate if this key was exposed publicly
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const BUCKET = 'video-uploads';

const fileInput = document.getElementById('file');
const startBtn = document.getElementById('start');
const status = document.getElementById('status');
const crf = document.getElementById('crf');
const crfText = document.getElementById('crfText');
const uploadInner = document.getElementById('uploadProgressInner');
const uploadText = document.getElementById('uploadProgressText');
const compressInner = document.getElementById('compressProgressInner');
const compressText = document.getElementById('compressProgressText');
const uploadTimerEl = document.getElementById('uploadTimer');
const compressTimerEl = document.getElementById('compressTimer');

let uploadStartTime, compressStartTime, uploadTimerInterval, compressTimerInterval;

function formatTime(seconds) {
  const min = Math.floor(seconds / 60).toString().padStart(2, '0');
  const sec = (seconds % 60).toString().padStart(2, '0');
  return `${min}:${sec}`;
}
function startTimer(type) {
  const now = Date.now();
  if (type === 'upload') {
    uploadStartTime = now;
    uploadTimerInterval = setInterval(() => {
      uploadTimerEl.textContent = formatTime(Math.floor((Date.now() - uploadStartTime) / 1000));
    }, 1000);
  } else {
    compressStartTime = now;
    compressTimerInterval = setInterval(() => {
      compressTimerEl.textContent = formatTime(Math.floor((Date.now() - compressStartTime) / 1000));
    }, 1000);
  }
}
function stopTimer(type) {
  if (type === 'upload' && uploadTimerInterval) clearInterval(uploadTimerInterval);
  if (type === 'compress' && compressTimerInterval) clearInterval(compressTimerInterval);
}
function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}
function chunkPath(fileId, index) {
  return `uploads/${fileId}/chunks/${String(index).padStart(6, '0')}.part`;
}
async function uploadChunkWithRetry(path, blob, maxRetries = 3) {
  for (let attempt = 1; attempt <= maxRetries; attempt++) {
    const { error } = await supabase.storage.from(BUCKET).upload(path, blob, {
      upsert: true,
      contentType: 'application/octet-stream',
      cacheControl: '3600'
    });
    if (!error) return;
    if (attempt === maxRetries) throw error;
    await sleep(500 * attempt);
  }
}

crf.oninput = () => crfText.textContent = `CRF ${crf.value} → ~${(30 - crf.value) * 4}% size reduction`;
crf.oninput();

startBtn.onclick = async () => {
  const file = fileInput.files?.[0];
  if (!file) return alert('Select a video');

  startBtn.disabled = true;
  startBtn.textContent = 'Processing...';
  status.textContent = 'Uploading chunks to Supabase Storage...\n';

  try {
    const fileId = crypto.randomUUID();
    const chunkSize = 40 * 1024 * 1024; // your app-level chunk size
    const totalChunks = Math.ceil(file.size / chunkSize);
    let uploadedBytes = 0;

    startTimer('upload');

    for (let index = 0; index < totalChunks; index++) {
      const start = index * chunkSize;
      const end = Math.min(start + chunkSize, file.size);
      const slice = file.slice(start, end);
      const path = chunkPath(fileId, index);

      await uploadChunkWithRetry(path, slice, 3);

      uploadedBytes += slice.size;
      const percent = Math.round((uploadedBytes / file.size) * 100);
      uploadInner.style.width = `${percent}%`;
      uploadText.textContent = `${percent}%`;
      status.textContent += `Uploaded chunk ${index + 1}/${totalChunks}\n`;
    }

    stopTimer('upload');
    uploadInner.style.width = '100%';
    uploadText.textContent = '100%';
    status.textContent += '\nAll chunks uploaded. Merging and compressing...\n';

    startTimer('compress');
    compressText.textContent = 'Compressing… 0%';

    // NOTE: removed missing hevc checkbox reference
    const res = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fileId,
        crf: Number(crf.value),
        totalChunks,
        originalName: file.name
      })
    });

    if (!res.ok) {
      throw new Error(await res.text());
    }

    const progressInterval = setInterval(async () => {
      const progRes = await fetch(`/api/progress?fileId=${fileId}`);
      const progData = await progRes.json();

      if (progData.progress !== undefined) {
        const p = Math.min(100, Math.round(progData.progress));
        compressInner.style.width = `${p}%`;
        compressText.textContent = `Compressing… ${p}%`;

        if (p >= 100) {
          clearInterval(progressInterval);
          stopTimer('compress');
          status.textContent += '\nCompression complete.\nDownloading…';
          window.location = `/api/download?fileId=${fileId}`;
        }
      }
    }, 2000);

  } catch (err) {
    stopTimer('upload');
    stopTimer('compress');
    status.textContent += `\nFailed: ${err.message || err}`;
  } finally {
    startBtn.disabled = false;
    startBtn.textContent = 'Compress Video';
  }
};
</script>
</body>
</html>
