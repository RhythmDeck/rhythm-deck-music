<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Compressor - Rhythm Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-2xl w-full bg-gray-800 p-8 rounded-2xl shadow-2xl">
    <h1 class="text-3xl font-bold text-green-400 mb-6 text-center">Video Compressor</h1>
    <p class="text-gray-300 mb-8 text-center">Drag & drop or click to upload a video. It will be compressed and ready to download.</p>

    <div id="dropArea" class="border-4 border-dashed border-green-500 p-12 text-center rounded-xl cursor-pointer hover:border-green-400 transition">
      <p class="text-xl mb-4">Drag your video here or click to select</p>
      <p class="text-gray-400">MP4, MOV, AVI – max 500 MB</p>
      <input type="file" id="fileInput" accept="video/*" class="hidden">
    </div>

    <div id="progressSection" class="mt-8 hidden">
      <p class="text-center mb-3">Compressing... Please wait</p>
      <div class="w-full bg-gray-700 rounded-full h-3">
        <div id="progressBar" class="bg-green-500 h-3 rounded-full w-0 transition-all duration-300"></div>
      </div>
      <p id="progressText" class="text-center mt-2 text-sm text-gray-400">0%</p>
    </div>

    <div id="resultSection" class="mt-8 hidden text-center">
      <p class="text-xl text-green-400 mb-4">Compression complete!</p>
      <a id="downloadLink" class="inline-block bg-green-600 hover:bg-green-500 text-white font-bold py-4 px-10 rounded-full transition shadow-lg">
        Download Compressed Video
      </a>
    </div>

    <p id="errorMsg" class="text-red-400 mt-6 text-center hidden"></p>
  </div>

  <script>
    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('fileInput');
    const progressSection = document.getElementById('progressSection');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const resultSection = document.getElementById('resultSection');
    const downloadLink = document.getElementById('downloadLink');
    const errorMsg = document.getElementById('errorMsg');

    dropArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', handleFile);

    dropArea.addEventListener('dragover', e => {
      e.preventDefault();
      dropArea.classList.add('border-green-400', 'bg-green-900/30');
    });
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('border-green-400', 'bg-green-900/30'));
    dropArea.addEventListener('drop', e => {
      e.preventDefault();
      dropArea.classList.remove('border-green-400', 'bg-green-900/30');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('video/')) handleFile({ target: { files: [file] } });
    });

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      errorMsg.classList.add('hidden');
      progressSection.classList.remove('hidden');
      progressBar.style.width = '0%';
      progressText.textContent = '0%';
      resultSection.classList.add('hidden');

      const formData = new FormData();
      formData.append('video', file);

      fetch('/compress', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) throw new Error(data.error);

        let percent = 0;
        const interval = setInterval(() => {
          percent += 8;
          progressBar.style.width = percent + '%';
          progressText.textContent = percent + '%';
          if (percent >= 100) {
            clearInterval(interval);
            progressSection.classList.add('hidden');
            downloadLink.href = data.downloadUrl;
            downloadLink.download = file.name.replace(/\.[^/.]+$/, "") + "-compressed.mp4";
            resultSection.classList.remove('hidden');
          }
        }, 400);
      })
      .catch(err => {
        progressSection.classList.add('hidden');
        errorMsg.textContent = 'Error: ' + err.message;
        errorMsg.classList.remove('hidden');
      });
    }
  </script>
</body>
</html>
