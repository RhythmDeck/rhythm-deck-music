<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rhythm Deck – Video Compressor</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: #000;
      padding: 18px 30px;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: center;
    }

    header img {
      height: 34px;
    }

    main {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 6px;
    }

    p.subtitle {
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .card {
      background: #151515;
      border-radius: 12px;
      padding: 26px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.9;
    }

    input, select, button {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }

    input, select {
      background: #222;
      color: #fff;
    }

    button {
      background: #ff3b3b;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 26px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress {
      margin-top: 20px;
      height: 10px;
      background: #222;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #ff3b3b;
      transition: width 0.2s linear;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      opacity: 0.85;
      min-height: 18px;
    }

    footer {
      text-align: center;
      opacity: 0.5;
      font-size: 12px;
      padding: 40px 20px;
    }
  </style>
</head>

<body>

<header>
  <!-- Replace with your actual logo path -->
  <img src="/logo-white.png" alt="Rhythm Deck" />
</header>

<main>

  <h1>Video Compressor</h1>
  <p class="subtitle">
    Compress large videos locally in your browser — no uploads, no limits.
  </p>

  <div class="card">

    <label>Select Video</label>
    <input type="file" id="videoInput" accept="video/*" />

    <label>Resolution</label>
    <select id="resolution">
      <option value="1280">720p (Recommended)</option>
      <option value="1920">1080p (High Quality)</option>
      <option value="854">480p (Smallest File)</option>
    </select>

    <label>Compression Quality</label>
    <select id="crf">
      <option value="23">Balanced</option>
      <option value="28">Smaller File</option>
      <option value="18">Higher Quality</option>
    </select>

    <button id="compressBtn">Compress & Download</button>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="statusText">Waiting for video…</div>

  </div>

</main>

<footer>
  © Rhythm Deck • Client-Side Video Compression
</footer>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/util.min.js"></script>

<script>
  const { FFmpeg } = FFmpegWASM;
  const { fetchFile } = FFmpegUtil;

  const ffmpeg = new FFmpeg();

  const videoInput = document.getElementById("videoInput");
  const compressBtn = document.getElementById("compressBtn");
  const progressBar = document.getElementById("progressBar");
  const statusText = document.getElementById("statusText");

  let loaded = false;

  async function loadFFmpeg() {
    if (loaded) return;

    statusText.textContent = "Loading compression engine…";

    await ffmpeg.load({
      coreURL: "https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js",
      wasmURL: "https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.wasm"
    });

    ffmpeg.on("progress", ({ progress }) => {
      const percent = Math.round(progress * 100);
      progressBar.style.width = percent + "%";
      statusText.textContent = "Compressing… " + percent + "%";
    });

    loaded = true;
  }

  compressBtn.addEventListener("click", async () => {
    const file = videoInput.files[0];
    if (!file) {
      alert("Please select a video.");
      return;
    }

    compressBtn.disabled = true;
    progressBar.style.width = "0%";

    await loadFFmpeg();

    const resolution = document.getElementById("resolution").value;
    const crf = document.getElementById("crf").value;

    statusText.textContent = "Preparing video…";

    await ffmpeg.writeFile("input.mp4", await fetchFile(file));

    await ffmpeg.exec([
      "-i", "input.mp4",
      "-vf", `scale=${resolution}:-2`,
      "-vcodec", "libx264",
      "-preset", "fast",
      "-crf", crf,
      "-movflags", "faststart",
      "output.mp4"
    ]);

    const data = await ffmpeg.readFile("output.mp4");
    const blob = new Blob([data.buffer], { type: "video/mp4" });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "rhythm-deck-compressed.mp4";
    a.click();

    statusText.textContent = "Compression complete. Download started.";
    compressBtn.disabled = false;
  });
</script>

</body>
</html>
