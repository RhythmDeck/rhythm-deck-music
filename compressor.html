<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rhythm Deck – Video Compressor</title>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.6/dist/ffmpeg-util.js"></script>

<style>
body {
  background:#050505;
  font-family: Arial, sans-serif;
  color:#e5e7eb;
}

.container {
  max-width:900px;
  margin:40px auto;
  padding:28px;
  border:2px solid #10b981;
  border-radius:18px;
  box-shadow:
    0 0 0 2px rgba(16,185,129,0.35),
    0 18px 45px rgba(0,0,0,0.75);
  background:linear-gradient(180deg,#0b0b0b,#060606);
}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:26px;
}

.logo {
  display:flex;
  align-items:center;
  gap:14px;
}

.logo img {
  width:48px;
  height:48px;
}

.logo-text strong {
  color:#10b981;
  font-size:18px;
}

.logo-text span {
  font-size:12px;
  color:#9ca3af;
}

.nav a {
  color:#10b981;
  text-decoration:none;
  font-weight:bold;
  margin-left:14px;
}

/* ===== HERO GRID ===== */
.hero-grid {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:24px;
  margin-bottom:28px;
}

/* LEFT */
.instructions {
  border:2px solid rgba(16,185,129,0.55);
  border-radius:14px;
  padding:16px;
  font-size:13px;
  box-shadow:
    inset 0 0 0 1px rgba(16,185,129,0.25),
    0 14px 30px rgba(0,0,0,0.7);
}

/* RIGHT */
.image-box {
  border:2px dashed rgba(16,185,129,0.35);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  color:#6b7280;
  box-shadow:0 12px 28px rgba(0,0,0,0.6);
}

.section {
  margin-top:22px;
}

label {
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

input, select {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-bottom:10px;
}

button {
  padding:10px 16px;
  background:#10b981;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

button.secondary {
  background:#1f2933;
  color:#e5e7eb;
}

.slider {
  width:100%;
}

.badge {
  display:inline-block;
  padding:4px 10px;
  background:#10b981;
  color:#000;
  font-size:12px;
  border-radius:999px;
  margin-left:8px;
}

.hidden { display:none; }

.progress-bar {
  height:10px;
  background:#1f2933;
  border-radius:999px;
  overflow:hidden;
}

.progress-inner {
  height:100%;
  background:#10b981;
}

#status {
  margin-top:14px;
  font-size:13px;
  color:#9ca3af;
}

/* Mobile fallback */
@media (max-width: 760px) {
  .hero-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">
    <img src="logo-1-sm.jpg" alt="Rhythm Deck">
    <div class="logo-text">
      <strong>Rhythm Deck</strong><br>
      <span>Tools for Modern Musicians</span>
    </div>
  </div>
  <div class="nav">
    <a href="index.html" target=_blank">Home</a>
    <a href="contact.html" "target=_blank>Contact</a>
  </div>
</header>

<!-- LEFT = Instructions | RIGHT = Image -->
<div class="hero-grid">
  <div class="instructions">
    <strong>How it works</strong><br><br>
    1. Upload your video<br>
    2. Choose target file size<br>
    3. Select compression quality<br>
    4. Optional HEVC for smaller files<br>
    5. Compress & download<br><br>
    🔒 Runs 100% locally in your browser
  </div>

  <div class="image-box">
    Image / Promo Placeholder
  </div>
</div>

<div class="section">
<label>Upload Video</label>
<input type="file" id="videoInput" accept="video/*">
</div>

<div class="section">
<label>Preset</label>
<button onclick="setPreset('album')">Album</button>
<button onclick="setPreset('single')" class="secondary">Single</button>
</div>

<div class="section">
<label>Target Size (MB): <span id="mbLabel">800</span></label>
<input type="range" min="100" max="8000" value="800" id="mbSlider" class="slider">
</div>

<div class="section">
<label>Compression Quality</label>
<select id="crfSelect">
  <option value="18">Higher Quality</option>
  <option value="23" selected>Balanced (Recommended)</option>
  <option value="28">Smaller File</option>
</select>
</div>

<div class="section">
<label>
<input type="checkbox" id="hevcToggle">
 Use HEVC (H.265)
 <span id="albumBadge" class="badge hidden">Recommended for Albums</span>
</label>
</div>

<div class="section">
<label>Estimated Size</label>
<div class="progress-bar"><div class="progress-inner" style="width:100%"></div></div>
<div style="margin-top:6px" class="progress-bar"><div class="progress-inner" style="width:55%"></div></div>
</div>

<div class="section">
<button onclick="compressVideo()">Compress & Download</button>
</div>

<div id="status"></div>

</div>

<script>
const FREE_KEY = 'rd_compressor_free_used';
const ACCESS_KEY = 'rd_compressor_paid';

async function verifyStripe() {
  const id = new URLSearchParams(window.location.search).get('session_id');
  if (!id) return;
  const r = await fetch(`/verify-stripe?session_id=${id}`);
  const d = await r.json();
  if (d.ok && d.access === 'compressor') {
    localStorage.setItem(ACCESS_KEY, 'true');
  }
}

function hasAccess() {
  return localStorage.getItem(ACCESS_KEY) === 'true';
}

function canUse() {
  return hasAccess() || !localStorage.getItem(FREE_KEY);
}

const { FFmpeg } = FFmpegWASM;
const { fetchFile } = FFmpegUtil;
const ffmpeg = new FFmpeg();
let loaded = false;

async function loadFFmpeg() {
  if (loaded) return;
  await ffmpeg.load({
    coreURL:"https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js",
    wasmURL:"https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.wasm"
  });
  loaded = true;
}

mbSlider.oninput = () => mbLabel.textContent = mbSlider.value;
hevcToggle.onchange = () => albumBadge.classList.toggle('hidden', !hevcToggle.checked);

function setPreset(p) {
  if (p === 'album') {
    mbSlider.value = 2500;
    hevcToggle.checked = true;
  } else {
    mbSlider.value = 300;
    hevcToggle.checked = false;
  }
  mbLabel.textContent = mbSlider.value;
  albumBadge.classList.toggle('hidden', !hevcToggle.checked);
}

async function compressVideo() {
  if (!canUse()) return alert("Free use already used. Purchase required.");

  const file = videoInput.files[0];
  if (!file) return alert("Upload a video");

  status.textContent = "Loading engine…";
  await loadFFmpeg();

  await ffmpeg.writeFile("input.mp4", await fetchFile(file));

  const codec = hevcToggle.checked ? "libx265" : "libx264";
  status.textContent = "Compressing…";

  await ffmpeg.exec(["-i","input.mp4","-vcodec",codec,"-crf",crfSelect.value,"output.mp4"]);

  const data = await ffmpeg.readFile("output.mp4");
  const url = URL.createObjectURL(new Blob([data.buffer], {type:"video/mp4"}));

  const a = document.createElement("a");
  a.href = url;
  a.download = "rhythm-deck-compressed.mp4";
  a.click();

  status.textContent = "Done ✔";
  if (!hasAccess()) localStorage.setItem(FREE_KEY,'true');
}

verifyStripe();
</script>
</body>
</html>
